site_name: Mozaiks
site_description: Open-source AI app factory for AG2 workflows, generated app workspaces, and production-ready UI/runtime contracts
site_url: https://docs.mozaiks.ai
repo_url: https://github.com/BlocUnited-LLC/mozaiks
repo_name: BlocUnited-LLC/mozaiks
edit_uri: ""

docs_dir: docs

# Internal planning, roadmap, and migration notes stay in the repo but are not
# published to docs.mozaiks.ai.
exclude_docs: |
  architecture/old/**
  reviews/**
  operations/**
  prism/**
  enterprise-readiness-report.md
  yc-alignment.md
  mozaiks-framework-analysis.md
  architecture/mozaiksai/cash-to-token-loop-0-1-10.md

extra:
  generator: false

theme:
  name: material
  logo: assets/mozaik_logo.svg
  favicon: assets/mozaik_logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: cyan
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: cyan
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - autorefs
  - minify:
      minify_html: true

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - toc:
      permalink: true

validation:
  omitted_files: ignore

