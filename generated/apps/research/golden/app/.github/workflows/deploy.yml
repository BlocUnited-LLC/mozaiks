name: deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deployment_id:
        description: "Deployment correlation identifier supplied by an external host or adapter."
        required: true
        type: string
      build_result_id:
        description: "Build result correlation identifier supplied by an external host or adapter."
        required: true
        type: string
      build_callback_url:
        description: "Optional callback URL for hosts that collect build completion events."
        required: false
        type: string
      app_url:
        description: "Live application base URL used by the deploy job for the post-deploy health check."
        required: false
        type: string
jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    environment: staging
    env:
      REGISTRY_PUSH_TOKEN: ${{ secrets.REGISTRY_PUSH_TOKEN }}
      BUILD_CALLBACK_SECRET: ${{ secrets.BUILD_CALLBACK_SECRET }}
      DEPLOYMENT_ID: ${{ inputs.deployment_id }}
      BUILD_RESULT_ID: ${{ inputs.build_result_id }}
      BUILD_CALLBACK_URL: ${{ inputs.build_callback_url }}
      APP_URL: ${{ inputs.app_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate CI secret contract
        shell: bash
        env:
          REGISTRY_PUSH_TOKEN: ${{ secrets.REGISTRY_PUSH_TOKEN }}
        run: |
          if [ -z "$REGISTRY_PUSH_TOKEN" ]; then
            echo "Missing required CI requirement: REGISTRY_PUSH_TOKEN" >&2
            exit 1
          fi
      - name: Show workflow contract inputs
        shell: bash
        run: |
          echo "deployment_id=${DEPLOYMENT_ID:-}"
          echo "build_result_id=${BUILD_RESULT_ID:-}"
          echo "build_callback_url=${BUILD_CALLBACK_URL:-}"
          echo "app_url=${APP_URL:-}"
      - name: Build container
        run: docker build -t generated-app:ci .
      - name: Smoke check
        run: docker run --rm -e PORT=8000 generated-app:ci python -c "print('smoke ok')"

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-smoke
    environment: production
    env:
      APP_URL: ${{ inputs.app_url }}
      HEALTH_PATH: /api/health
    steps:
      - name: Post-deploy health check
        shell: bash
        run: |
          if [ -z "${APP_URL}" ]; then
            echo "APP_URL not set — skipping live health check."
            exit 0
          fi
          echo "Checking live instance at ${APP_URL}${HEALTH_PATH} ..."
          for i in $(seq 1 10); do
            status=$(curl -s -o /dev/null -w "%{http_code}" "${APP_URL}${HEALTH_PATH}")
            if [ "$status" = "200" ]; then
              echo "Health check passed (HTTP $status)."
              exit 0
            fi
            echo "Attempt $i: HTTP $status — retrying in 10s ..."
            sleep 10
          done
          echo "Health check failed after 10 attempts." >&2
          exit 1
