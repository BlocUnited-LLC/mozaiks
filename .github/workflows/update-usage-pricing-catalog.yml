name: Update usage pricing catalog

on:
  workflow_dispatch:
  schedule:
    # Provider catalogs can change without a framework release. Refresh daily;
    # the stable automation branch is updated in place if its PR is still open.
    - cron: "17 9 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-usage-pricing-catalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: pip install -e ".[dev]" --quiet

      - name: Refresh generated catalog
        run: python scripts/update_usage_pricing_catalog.py

      - name: Validate generated catalog
        run: python scripts/update_usage_pricing_catalog.py --check

      - name: Verify mirrored catalogs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          paths = (
              Path("ai-pricing/catalogs/usage-pricing.generated.json"),
              Path("mozaiksai/core/usage/catalogs/usage-pricing.generated.json"),
          )
          payloads = [json.loads(path.read_text(encoding="utf-8")) for path in paths]
          if payloads[0] != payloads[1]:
              raise SystemExit("generated usage-pricing catalogs differ")
          if payloads[0].get("schema_version") != "mozaiks.usage_pricing.v1":
              raise SystemExit("generated catalog has an unsupported schema version")
          if not isinstance(payloads[0].get("models"), dict) or not payloads[0]["models"]:
              raise SystemExit("generated catalog has no model rows")
          print(f"verified {len(payloads[0]['models'])} mirrored model rows")
          PY

      - name: Run pricing regression tests
        run: python -m pytest -q --no-cov tests/test_usage_pricing_catalog.py tests/test_usage_pricing.py

      - name: Open pricing catalog PR
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/update-usage-pricing-catalog
          commit-message: "Update generated usage pricing catalog"
          title: "Update generated usage pricing catalog"
          body: |
            Refreshes `ai-pricing/catalogs/usage-pricing.generated.json` from LiteLLM's model price reference.

            This catalog is provider cost-basis data only. App/customer markups remain in `app/config/subscriptions.yaml`.
          labels: dependencies
