name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        env:
          MONGO_URI: mongodb://localhost:27017/test_mozaiks
          ENV: test
          AUTH_ENABLED: "false"
          OPENAI_API_KEY: "sk-test-placeholder"
        run: |
          pytest tests/ -v --cov=mozaiksai --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install linters
        run: pip install ruff

      - name: Run ruff
        run: ruff check mozaiksai/ --select E9,F821 --output-format=github

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web_shell
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web_shell/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        env:
          PLAYWRIGHT_SKIP_BROWSER_GC: "1"

      - name: Responsive smoke
        run: npm run test:responsive-smoke
        env:
          VITE_MOCK_MODE: "true"
          MOZAIKS_FACTORY_APP_PATH: ${{ github.workspace }}/factory_app
          MOZAIKS_CHAT_UI_PATH: ${{ github.workspace }}/chat-ui

      - name: Build
        run: npm run build
        env:
          VITE_MOCK_MODE: "true"
          MOZAIKS_FACTORY_APP_PATH: ${{ github.workspace }}/factory_app
          MOZAIKS_CHAT_UI_PATH: ${{ github.workspace }}/chat-ui

  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install wheel in clean venv
        run: |
          python -m venv .pkg-venv
          . .pkg-venv/bin/activate
          pip install dist/*.whl

      - name: Smoke installed CLI
        run: |
          . .pkg-venv/bin/activate
          mozaiks --version
          mozaiks quickstart --help

      - name: Verify packaged resources
        run: |
          . .pkg-venv/bin/activate
          mkdir -p /tmp/mozaiks-package-smoke
          cd /tmp/mozaiks-package-smoke
          python - <<'PY'
          from pathlib import Path
          from mozaiksai.resources import (
              resolve_chat_ui_src_root,
              resolve_factory_brand_root,
              resolve_factory_workflows_root,
              resolve_web_shell_root,
          )

          resources = {
              "factory_workflows": resolve_factory_workflows_root(),
              "factory_brand": resolve_factory_brand_root(),
              "web_shell": resolve_web_shell_root(),
              "chat_ui_src": resolve_chat_ui_src_root(),
          }

          for name, path in resources.items():
              assert path is not None, f"{name} did not resolve"
              resolved = Path(path)
              assert resolved.exists(), f"{name} path missing: {resolved}"
              assert "site-packages" in str(resolved), f"{name} resolved to non-installed path: {resolved}"

          print("Packaged resources resolved from site-packages")
          PY

      - name: Smoke packaged scaffold init
        run: |
          . .pkg-venv/bin/activate
          mkdir -p /tmp/mozaiks-package-init
          mozaiks init chat --name "CI Package Smoke" --dir /tmp/mozaiks-package-init
          test -f /tmp/mozaiks-package-init/app/brand/theme_config.json
