name: CI

on:
  push:
    branches: [main, codex/f042b-linux-20261026]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The full pytest suite, split into 8 deterministic shards that run in
  # parallel jobs. scripts/ci/split_tests.py partitions the top-level
  # collection units of tests/ exhaustively, and each shard preserves the
  # relative alphabetical file order of the previous single-job run (the suite
  # has latent inter-file ordering hazards, so order preservation is load-
  # bearing — see the script docstring). Coverage is measured per shard,
  # combined and gated at the same 70% threshold in the fan-in `test` job
  # below, which keeps the required-check name `test` unchanged.
  test-shard:
    if: github.ref != 'refs/heads/codex/f042b-linux-20261026'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Start MongoDB from public mirror
        run: bash scripts/ci/mongo_service.sh start

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        env:
          MONGO_URI: mongodb://localhost:27017/test_mozaiks
          ENV: test
          AUTH_ENABLED: "false"
          OPENAI_API_KEY: "sk-test-placeholder"
        # --cov-fail-under=0 defers the coverage gate to the fan-in job: one
        # shard only runs a quarter of the suite, so a per-shard threshold
        # would be meaningless. --durations=20 records the slowest tests so
        # suite-time regressions stay attributable.
        run: |
          pytest $(python scripts/ci/split_tests.py --shard "${{ matrix.shard }}" --num-shards 8) \
            -v --durations=20 --cov=mozaiksai --cov-report=term --cov-fail-under=0
          mv .coverage "coverage-data-shard-${{ matrix.shard }}"

      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: coverage-data-shard-${{ matrix.shard }}
          retention-days: 1
          if-no-files-found: error

  acp-isolation-proof:
    # The real Docker cases are opt-in in normal pytest collection. Build the
    # credential-free proof and preview images and run them on every PR and push.
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/codex/f042b-linux-20261026' && 'f042b-live-openai-20261026' || '' }}
    timeout-minutes: ${{ github.ref == 'refs/heads/codex/f042b-linux-20261026' && 60 || 30 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false


      # One frozen, inspected public campaign. Not ordinary required CI.
      - name: Setup qualification Python
        if: github.ref == 'refs/heads/codex/f042b-linux-20261026'
        uses: actions/setup-python@v7
        with:
          python-version: '3.13.7'

      - name: Install pinned task evidence encryption utility
        if: github.ref == 'refs/heads/codex/f042b-linux-20261026'
        run: |
          mkdir "$RUNNER_TEMP/f042bl-age"
          curl --fail --silent --show-error --location https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz -o "$RUNNER_TEMP/f042bl-age/age.tar.gz"
          echo 'cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  '"$RUNNER_TEMP/f042bl-age/age.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/f042bl-age/age.tar.gz" -C "$RUNNER_TEMP/f042bl-age" age/age
          test "$("$RUNNER_TEMP/f042bl-age/age/age" --version)" = v1.3.2

      - name: Verify frozen qualification inputs
        if: github.ref == 'refs/heads/codex/f042b-linux-20261026'
        env:
          EXPECTED_MANIFEST: aa16eed11d10b9ab6e437ae716b5ac1d9b27498418036faf92273065f239828a
        run: |
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir "$RUNNER_TEMP/f042b-source" "$RUNNER_TEMP/f042b-receipts"
          python - <<'PY'
          import hashlib, json, os, re, tarfile
          from pathlib import Path, PurePosixPath
          root = Path("qualification")
          data = (root / "manifest.json").read_bytes()
          assert hashlib.sha256(data).hexdigest() == os.environ["EXPECTED_MANIFEST"]
          manifest = json.loads(data)
          assert manifest["branch"] == "codex/f042b-linux-20261026"
          assert manifest["campaign"] == "f042b-live-20261026"
          assert "live-inputs.json" in manifest["inputs"]
          assert manifest["attempt"] in (1, 2, 3)
          assert all(re.fullmatch("[0-9a-f]{40}", manifest[key]) for key in ("source_sha", "source_tree", "package_source_sha"))
          source = Path(os.environ["RUNNER_TEMP"]) / "f042b-source"
          for name, digest in manifest["inputs"].items():
              assert PurePosixPath(name).name == name
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == digest
          with tarfile.open(root / "source.tar.gz") as archive:
              members = archive.getmembers()
              assert len({m.name for m in members}) == len(members)
              assert {m.name for m in members} == set(manifest["files"])
              for member in members:
                  path = PurePosixPath(member.name)
                  assert member.isfile() and not path.is_absolute() and ".." not in path.parts
                  assert not set(path.parts) & {".git", ".local", ".claude", ".codex", "node_modules"}
                  data = archive.extractfile(member).read()
                  assert hashlib.sha256(data).hexdigest() == manifest["files"][member.name]
                  target = source / member.name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
          (source / "mozaiksai/_build_revision.json").write_text(json.dumps(
              {"schema_version": "mozaiks.source_revision.v1", "commit": manifest["package_source_sha"]}))
          receipt = {key: manifest[key] for key in ("source_sha", "source_tree", "package_source_sha", "attempt", "inputs")}
          receipt.update(controller_sha=os.environ["GITHUB_SHA"], run_id=os.environ["GITHUB_RUN_ID"],
                         manifest_sha256=hashlib.sha256((root / "manifest.json").read_bytes()).hexdigest())
          (Path(os.environ["RUNNER_TEMP"]) / "f042b-receipts/identities.json").write_text(json.dumps(receipt, indent=2))
          PY

      - name: Inspect and install the single frozen qualification distribution
        if: github.ref == 'refs/heads/codex/f042b-linux-20261026'
        env:
          PIP_NO_CACHE_DIR: '1'
          PYTHON_DOTENV_DISABLED: '1'
        run: |
          cd "$RUNNER_TEMP/f042b-source"
          mkdir dist
          cp "$GITHUB_WORKSPACE"/qualification/mozaiks-*.whl "$GITHUB_WORKSPACE"/qualification/mozaiks-*.tar.gz dist/
          python scripts/package_content_guard.py dist/*.whl dist/*.tar.gz
          python -m venv "$RUNNER_TEMP/f042b-consumer"
          "$RUNNER_TEMP/f042b-consumer/bin/python" -m pip install dist/*.whl 'pytest==9.1.1' 'pytest-asyncio==1.4.0' 'httpx==0.28.1' 'openai==3.37.0' 'pydantic==2.14.1' pytest-mock pytest-cov pytest-rerunfailures ruff
          "$RUNNER_TEMP/f042b-consumer/bin/python" -m pip check
          "$RUNNER_TEMP/f042b-consumer/bin/python" -m pip freeze > "$RUNNER_TEMP/f042b-receipts/dependencies.txt"
          cp dist/* "$RUNNER_TEMP/f042b-receipts/"
          mkdir "$RUNNER_TEMP/f042b-fixtures"
          cp -r tests scripts examples "$RUNNER_TEMP/f042b-fixtures/"
          cp "$GITHUB_WORKSPACE/qualification/installed_origins.py" "$RUNNER_TEMP/f042b-fixtures/"
          cd "$RUNNER_TEMP/f042b-fixtures"
          env -i PATH="$PATH" PYTHON_DOTENV_DISABLED=1 PYTHONDONTWRITEBYTECODE=1             "$RUNNER_TEMP/f042b-consumer/bin/python" -I "$GITHUB_WORKSPACE/qualification/installed_check.py"             "$RUNNER_TEMP/f042b-source" "$RUNNER_TEMP/f042b-receipts"
          env -i PATH="$PATH" PYTHON_DOTENV_DISABLED=1 PYTHONDONTWRITEBYTECODE=1 PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 \
            "$RUNNER_TEMP/f042b-consumer/bin/python" -B -m pytest --collect-only -q -p no:cacheprovider -p pytest_asyncio.plugin -o asyncio_mode=auto -o asyncio_default_fixture_loop_scope=function -o addopts= -o log_file= \
            tests/test_run_live_workflow_smoke_runtime_host.py::test_live_genesis_campaign > "$RUNNER_TEMP/f042b-receipts/live-collection.txt"

      - name: Build clean contained candidate using the established preview recipe
        if: github.ref == 'refs/heads/codex/f042b-linux-20261026'
        run: |
          cd "$RUNNER_TEMP/f042b-source"
          cp "$GITHUB_WORKSPACE/qualification/Dockerfile" ./Dockerfile.qualification
          cp "$GITHUB_WORKSPACE/qualification/constraints.txt" ./constraints.txt
          docker build -f Dockerfile.qualification -t f042b-candidate:local . > "$RUNNER_TEMP/f042b-image-build.log" 2>&1
          docker image inspect f042b-candidate:local --format '{{.Id}}' > "$RUNNER_TEMP/f042b-receipts/image-id.txt"
          docker image inspect f042b-candidate:local --format '{{json .Config.Labels}}' > "$RUNNER_TEMP/f042b-receipts/image-labels.json"
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges=true             --entrypoint python f042b-candidate:local -m pip list --format=freeze > "$RUNNER_TEMP/f042b-receipts/image-dependencies.txt"
          docker pull quay.io/keycloak/keycloak@sha256:09a381c715ab0b111835b70f2905955274843a219c6f27efb348e4d9f4086858
          docker image inspect quay.io/keycloak/keycloak@sha256:09a381c715ab0b111835b70f2905955274843a219c6f27efb348e4d9f4086858             --format '{{.Id}}' > "$RUNNER_TEMP/f042b-receipts/identity-image-id.txt"

      - name: Qualify independent platform and secure browser once
        if: github.ref == 'refs/heads/codex/f042b-linux-20261026'
        run: |
          uname -a > "$RUNNER_TEMP/f042b-receipts/platform.txt"
          free -b >> "$RUNNER_TEMP/f042b-receipts/platform.txt"
          df -B1 "$RUNNER_TEMP" >> "$RUNNER_TEMP/f042b-receipts/platform.txt"
          python - <<'PY'
          import json, os, time
          from pathlib import Path
          rows = []
          for _ in range(1000):
              rows.append([time.time_ns(), time.monotonic_ns(), time.clock_gettime_ns(time.CLOCK_MONOTONIC_RAW)])
              time.sleep(.01)
          (Path(os.environ["RUNNER_TEMP"]) / "f042b-receipts/native-clocks.json").write_text(json.dumps(rows))
          assert all(all(b[i] >= a[i] for i in range(3)) for a, b in zip(rows, rows[1:]))
          assert all(abs((b[0]-a[0])-(b[2]-a[2])) < 50_000_000 for a, b in zip(rows, rows[1:]))
          PY
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges=true             --security-opt "seccomp=$GITHUB_WORKSPACE/qualification/observer-seccomp.json"             --tmpfs /tmp:rw,nosuid,size=256m --shm-size=64m --pids-limit=256 --memory=1g --memory-swap=1g --cpus=1             --workdir /opt/mozaiks/web_shell --env HOME=/tmp --entrypoint node f042b-candidate:local             -e "const {chromium}=require('@playwright/test');(async()=>{const b=await chromium.launch({chromiumSandbox:true});const p=await b.newPage();await p.goto('about:blank');console.log(JSON.stringify({browser:b.version(),sandbox:true,uid:process.getuid()}));await b.close()})().catch(e=>{console.error(e.name);process.exit(1)})"             > "$RUNNER_TEMP/f042b-receipts/sandbox.json"

      - name: Start run-owned transactional Mongo
        if: github.ref == 'refs/heads/codex/f042b-linux-20261026'
        env:
          CI_MONGO_NAME: f042b-ci-${{ github.run_id }}
          CI_MONGO_PORT: '52741'
          CI_MONGO_REPLICA: f042b-linux
          CI_MONGO_IMAGE: mongo@sha256:b096b4cb9269f3ebcf363be63f1c50920f786879d03a1890347a3bf33f1f0df0
        run: bash "$RUNNER_TEMP/f042b-source/scripts/ci/mongo_service.sh" start

      - name: Execute the bounded real Genesis and refinement campaign
        if: github.ref == 'refs/heads/codex/f042b-linux-20261026'
        env:
          OPENAI_API_KEY: ${{ secrets.F042BL_OPENAI_API_KEY_20261026 }}
        run: |
          cd "$RUNNER_TEMP/f042b-fixtures"
          umask 077
          python - <<'PY' > "$RUNNER_TEMP/f042bl-controller-local-only.log" 2>&1
          import os
          from pathlib import Path
          temp = Path(os.environ['RUNNER_TEMP'])
          workspace = Path(os.environ['GITHUB_WORKSPACE'])
          assert os.environ.get('OPENAI_API_KEY'), 'required task credential absent'
          # In-memory environment selection, never a secret-bearing argv/env-file.
          env = {key: os.environ[key] for key in ('PATH', 'OPENAI_API_KEY', 'RUNNER_TEMP', 'GITHUB_WORKSPACE', 'GITHUB_SHA', 'GITHUB_RUN_ID', 'GITHUB_REF', 'GITHUB_RUN_ATTEMPT')}
          env.update(CI='true', ENV='test', PYTHON_DOTENV_DISABLED='1', PYTHONDONTWRITEBYTECODE='1',
              PYTEST_DISABLE_PLUGIN_AUTOLOAD='1', DEFAULT_LLM_MODEL='gpt-4o-mini', OPENAI_BASE_URL='https://api.openai.com/v1',
              MOZAIKS_LIVE_CAMPAIGN='f042b-live-20261026', MOZAIKS_REQUIRE_REAL_MONGO='1', MONGO_URI='mongodb://127.0.0.1:52741',
              MOZAIKS_LIVE_INPUTS=str(workspace/'qualification/live-inputs.json'),
              MOZAIKS_EVIDENCE_AGE=str(temp/'f042bl-age/age/age'),
              F042B_ORIGIN_RECEIPT=str(temp/'f042b-receipts/loaded-origins.json'),
              LOGS_BASE_DIR=str(temp/'f042bl-runtime-local-only'), AG2_RUNTIME_LOG_FILE=str(temp/'f042bl-ag2-local-only.log'),
              MOZAIKS_APP_RUNTIME_IMAGE_ID=(temp/'f042b-receipts/image-id.txt').read_text().strip(),
              MOZAIKS_TEST_IDENTITY_IMAGE=(temp/'f042b-receipts/identity-image-id.txt').read_text().strip(),
              MOZAIKS_BROWSER_OBSERVER_SECCOMP=str(workspace/'qualification/observer-seccomp.json'))
          python = str(temp/'f042b-consumer/bin/python')
          args = [python, '-B', '-m', 'pytest', '-q', '--tb=no', '--show-capture=no', '-x',
              '-p', 'no:cacheprovider', '-p', 'pytest_asyncio.plugin', '-p', 'installed_origins',
              '-o', 'asyncio_mode=auto', '-o', 'asyncio_default_fixture_loop_scope=function', '-o', 'addopts=', '-o', 'log_file=',
              '--junitxml='+str(temp/'f042b-paired.xml'), '--basetemp='+str(temp/'f042bl-live'),
              'tests/test_run_live_workflow_smoke_runtime_host.py::test_live_genesis_campaign']
          os.execve(python, args, env)
          PY

      - name: Export bounded sanitized qualification evidence
        id: qualification_evidence
        if: always() && github.ref == 'refs/heads/codex/f042b-linux-20261026'
        run: |
          cd "$RUNNER_TEMP/f042b-fixtures"
          PYTHONPATH="$RUNNER_TEMP/f042b-fixtures" "$RUNNER_TEMP/f042b-consumer/bin/python" "$GITHUB_WORKSPACE/qualification/export_evidence.py" "$RUNNER_TEMP" \
            --selection "$RUNNER_TEMP/f042bl-private/selection.json" \
            --age "$RUNNER_TEMP/f042bl-age/age/age" \
            --recipient age1vvcnzq66ujctrj2cq2l9mnv4f7ce6x4t58dgnqfu3es57ns69ets6hjg7z
          test -s "$RUNNER_TEMP/f042b-receipts/private-evidence.age"
          test -s "$RUNNER_TEMP/f042b-receipts/encrypted-evidence.json"
          test "$(du -sb "$RUNNER_TEMP/f042b-receipts" | cut -f1)" -le 104857600

      - name: Remove only this runner's task containers
        if: always() && github.ref == 'refs/heads/codex/f042b-linux-20261026'
        run: |
          # This fresh GitHub VM has no shared/local task services.
          # The existing contained owner removes its own UUID app/observer/issuer.
          name="f042b-ci-$GITHUB_RUN_ID"
          if docker container inspect "$name" >/dev/null 2>&1; then docker rm -f "$name"; fi
          docker ps -a --format '{{.Names}}' > "$RUNNER_TEMP/f042b-receipts/remaining-containers.txt"
          test ! -s "$RUNNER_TEMP/f042b-receipts/remaining-containers.txt"

      - name: Upload only bounded safe receipts
        if: always() && github.ref == 'refs/heads/codex/f042b-linux-20261026' && steps.qualification_evidence.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: f042bl-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/f042b-receipts/identities.json
            ${{ runner.temp }}/f042b-receipts/paired-summary.json
            ${{ runner.temp }}/f042b-receipts/encrypted-evidence.json
            ${{ runner.temp }}/f042b-receipts/private-evidence.age
            ${{ runner.temp }}/f042b-receipts/loaded-origins.json
            ${{ runner.temp }}/f042b-receipts/sandbox.json
            ${{ runner.temp }}/f042b-receipts/native-clocks.json
            ${{ runner.temp }}/f042b-receipts/image-id.txt
            ${{ runner.temp }}/f042b-receipts/image-labels.json
            ${{ runner.temp }}/f042b-receipts/identity-image-id.txt
          retention-days: 1
          if-no-files-found: error

      - name: Setup Python
        if: github.ref != 'refs/heads/codex/f042b-linux-20261026'
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install test dependencies
        if: github.ref != 'refs/heads/codex/f042b-linux-20261026'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Pull preview base from public mirror
        if: github.ref != 'refs/heads/codex/f042b-linux-20261026'
        run: bash scripts/ci/pull_public_image.sh public.ecr.aws/docker/library/node:24-bookworm-slim node:24-bookworm-slim

      - name: Build offline ACP proof image
        if: github.ref != 'refs/heads/codex/f042b-linux-20261026'
        run: |
          docker build --build-context node:24-bookworm-slim=docker-image://public.ecr.aws/docker/library/node:24-bookworm-slim -f infra/docker/Dockerfile.preview -t mozaiks-sandbox:local .
          docker build -f infra/docker/Dockerfile.acp-proof -t mozaiks-acp-proof:local .

      - name: Capture built preview image ID
        if: github.ref != 'refs/heads/codex/f042b-linux-20261026'
        id: preview_image
        run: |
          image_id=$(docker image inspect --format '{{.Id}}' mozaiks-sandbox:local)
          if [[ ! "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo 'Preview image did not resolve to a local sha256 ID' >&2
            exit 1
          fi
          printf 'image_id=%s\n' "$image_id" >> "$GITHUB_OUTPUT"

      - name: Capture built proof image ID
        if: github.ref != 'refs/heads/codex/f042b-linux-20261026'
        id: proof_image
        run: |
          image_id=$(docker image inspect --format '{{.Id}}' mozaiks-acp-proof:local)
          if [[ ! "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo 'Offline ACP proof image did not resolve to a local sha256 ID' >&2
            exit 1
          fi
          printf 'image_id=%s\n' "$image_id" >> "$GITHUB_OUTPUT"

      - name: Run real Docker isolation proof
        if: github.ref != 'refs/heads/codex/f042b-linux-20261026'
        env:
          MOZAIKS_RUN_REPOSITORY_DOCKER_PROOF: '1'
          MOZAIKS_REPOSITORY_DOCKER_PROOF_IMAGE_ID: ${{ steps.proof_image.outputs.image_id }}
        run: |
          python -m pytest -q --no-cov --reruns 0 \
            --junitxml=/tmp/acp-isolation-proof.xml \
            tests/test_repository_docker_executor.py::test_real_offline_proof_image_uses_host_executor \
            tests/test_repository_docker_executor.py::test_real_offline_proof_image_executes_exact_operation_grant
          python - <<'PY'
          from xml.etree import ElementTree

          cases = ElementTree.parse('/tmp/acp-isolation-proof.xml').findall('.//testcase')
          if len(cases) != 3 or any(case.find('skipped') is not None for case in cases):
              raise SystemExit(f'Expected three executed Docker proof cases; found {len(cases)} cases')
          PY

      - name: Run generated Docker build acceptance proof
        if: github.ref != 'refs/heads/codex/f042b-linux-20261026'
        env:
          MOZAIKS_TEST_CONTAINED_SMOKE_IMAGE: ${{ steps.preview_image.outputs.image_id }}
        run: |
          python -m pytest -q --no-cov --reruns 0 \
            --junitxml=/tmp/generated-build-proof.xml \
            tests/test_canonical_app_build_validation.py::test_real_docker_build_includes_generated_tailwind_class \
            tests/test_app_acceptance_isolation.py::test_generated_acceptance_uses_local_docker_with_poisoned_client_settings \
            tests/test_app_acceptance_isolation.py::test_generated_gate_admits_only_pinned_contained_evidence
          python - <<'PY'
          from xml.etree import ElementTree

          cases = ElementTree.parse('/tmp/generated-build-proof.xml').findall('.//testcase')
          if len(cases) != 3 or any(case.find('skipped') is not None for case in cases):
              raise SystemExit(f'Expected three executed generated Docker cases; found {len(cases)} cases')
          PY

  test:
    # Fan-in gate for the shard matrix and real Docker proofs. Holds
    # the required-check name `test`, then enforces combined coverage.
    runs-on: ubuntu-latest
    needs: [test-shard, acp-isolation-proof]
    # always() so either dependency failing cannot leave this job skipped — a
    # skipped required check would satisfy branch protection.
    if: always() && github.ref != 'refs/heads/codex/f042b-linux-20261026'
    steps:
      - name: Fail unless every shard succeeded
        if: needs.test-shard.result != 'success'
        run: |
          echo "test-shard result: ${{ needs.test-shard.result }}" >&2
          exit 1

      - name: Fail unless the real Docker isolation proof succeeded
        if: needs.acp-isolation-proof.result != 'success'
        run: |
          echo "acp-isolation-proof result: ${{ needs.acp-isolation-proof.result }}" >&2
          exit 1

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        # Same install as the shards so the coverage data format and source
        # analysis match exactly.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Download shard coverage data
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-shard-*
          merge-multiple: true

      - name: Combine coverage and enforce threshold
        # Fails closed on incomplete coverage evidence: exactly one artifact
        # per shard must exist, and each must combine cleanly. Combining one
        # input per invocation is load-bearing — a multi-file `coverage
        # combine` skips an unreadable data file with only a warning, while a
        # single unreadable input leaves the invocation with no usable data,
        # which is a hard error.
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(coverage-data-shard-*)
          if [ "${#artifacts[@]}" -ne 8 ]; then
            echo "expected exactly 8 shard coverage artifacts, found ${#artifacts[@]}: ${artifacts[*]-none}" >&2
            exit 1
          fi
          for k in 0 1 2 3 4 5 6 7; do
            # -s: a zero-byte artifact must fail too — coverage combine
            # silently treats an empty data file as "no data yet".
            if [ ! -s "coverage-data-shard-$k" ]; then
              echo "missing or empty coverage data artifact for shard $k" >&2
              exit 1
            fi
          done
          for k in 0 1 2 3 4 5 6 7; do
            coverage combine --append "coverage-data-shard-$k"
          done
          coverage xml -o coverage.xml
          coverage report --fail-under=70

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  secret-scan:
    if: github.ref != 'refs/heads/codex/f042b-linux-20261026'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          VERSION="8.18.4"
          wget -q "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -O gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Scan for secrets
        # --redact masks found secrets in CI output.
        # --log-opts=HEAD restricts the scan to this ref's own history; without it,
        # gitleaks defaults to `--all` and flags unrelated open branches' commits
        # (e.g. other PRs' intentional fake-secret test fixtures), failing every PR.
        # To ignore a historical false positive, add its fingerprint to .gitleaksignore.
        run: gitleaks detect --source . --log-level warn --log-opts="HEAD" --redact

