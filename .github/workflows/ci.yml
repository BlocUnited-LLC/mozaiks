name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The full pytest suite, split into 4 deterministic shards that run in
  # parallel jobs. scripts/ci/split_tests.py partitions the top-level
  # collection units of tests/ exhaustively, and each shard preserves the
  # relative alphabetical file order of the previous single-job run (the suite
  # has latent inter-file ordering hazards, so order preservation is load-
  # bearing — see the script docstring). Coverage is measured per shard,
  # combined and gated at the same 70% threshold in the fan-in `test` job
  # below, which keeps the required-check name `test` unchanged.
  test-shard:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        env:
          MONGO_URI: mongodb://localhost:27017/test_mozaiks
          ENV: test
          AUTH_ENABLED: "false"
          OPENAI_API_KEY: "sk-test-placeholder"
        # --cov-fail-under=0 defers the coverage gate to the fan-in job: one
        # shard only runs a quarter of the suite, so a per-shard threshold
        # would be meaningless. --durations=20 records the slowest tests so
        # suite-time regressions stay attributable.
        run: |
          pytest $(python scripts/ci/split_tests.py --shard "${{ matrix.shard }}" --num-shards 4) \
            -v --durations=20 --cov=mozaiksai --cov-report=term --cov-fail-under=0
          mv .coverage "coverage-data-shard-${{ matrix.shard }}"

      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: coverage-data-shard-${{ matrix.shard }}
          retention-days: 1
          if-no-files-found: error

  test:
    # Fan-in gate for the shard matrix. Holds the required-check name `test`:
    # it fails unless every shard succeeded, then enforces the same combined
    # coverage threshold the previous single `test` job enforced.
    runs-on: ubuntu-latest
    needs: test-shard
    # always() so shard failures cannot leave this job skipped — a skipped
    # required check would satisfy branch protection.
    if: always()
    steps:
      - name: Fail unless every shard succeeded
        if: needs.test-shard.result != 'success'
        run: |
          echo "test-shard result: ${{ needs.test-shard.result }}" >&2
          exit 1

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        # Same install as the shards so the coverage data format and source
        # analysis match exactly.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Download shard coverage data
        uses: actions/download-artifact@v7
        with:
          pattern: coverage-shard-*
          merge-multiple: true

      - name: Combine coverage and enforce threshold
        # Fails closed on incomplete coverage evidence: exactly one artifact
        # per shard must exist, and each must combine cleanly. Combining one
        # input per invocation is load-bearing — a multi-file `coverage
        # combine` skips an unreadable data file with only a warning, while a
        # single unreadable input leaves the invocation with no usable data,
        # which is a hard error.
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(coverage-data-shard-*)
          if [ "${#artifacts[@]}" -ne 4 ]; then
            echo "expected exactly 4 shard coverage artifacts, found ${#artifacts[@]}: ${artifacts[*]-none}" >&2
            exit 1
          fi
          for k in 0 1 2 3; do
            # -s: a zero-byte artifact must fail too — coverage combine
            # silently treats an empty data file as "no data yet".
            if [ ! -s "coverage-data-shard-$k" ]; then
              echo "missing or empty coverage data artifact for shard $k" >&2
              exit 1
            fi
          done
          for k in 0 1 2 3; do
            coverage combine --append "coverage-data-shard-$k"
          done
          coverage xml -o coverage.xml
          coverage report --fail-under=70

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          VERSION="8.18.4"
          wget -q "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -O gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Scan for secrets
        # --redact masks found secrets in CI output.
        # --log-opts=HEAD restricts the scan to this ref's own history; without it,
        # gitleaks defaults to `--all` and flags unrelated open branches' commits
        # (e.g. other PRs' intentional fake-secret test fixtures), failing every PR.
        # To ignore a historical false positive, add its fingerprint to .gitleaksignore.
        run: gitleaks detect --source . --log-level warn --log-opts="HEAD" --redact

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install package + audit tool
        run: |
          python -m pip install --upgrade pip "setuptools>=83.0.0"
          python -m pip install -e ".[dev]"
          python -m pip install --upgrade "setuptools>=83.0.0" pip-audit

      - name: Audit Python dependencies
        # Fails if any known vulnerability is found in the installed environment.
        # To ignore a specific advisory while a fix is unavailable, add:
        #   --ignore-vuln GHSA-XXXX-YYYY-ZZZZ
        run: pip-audit --progress-spinner off

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate Keycloak realm config
        run: |
          python - <<'PY'
          import json, sys
          path = "factory_app/app/brand/realm-export.json"
          try:
              with open(path) as f:
                  realm = json.load(f)
          except Exception as e:
              print(f"FAIL: {path} is not valid JSON: {e}", file=sys.stderr)
              sys.exit(1)
          required = ["realm", "enabled"]
          missing = [k for k in required if k not in realm]
          if missing:
              print(f"FAIL: {path} is missing required fields: {missing}", file=sys.stderr)
              sys.exit(1)
          if realm.get("realm") != "mozaiks":
              print(f"FAIL: expected realm='mozaiks', got '{realm.get('realm')}'", file=sys.stderr)
              sys.exit(1)
          print(f"OK: {path} is valid (realm={realm['realm']}, enabled={realm['enabled']})")
          PY

      - name: Source hygiene scan
        # Enforces the repo's clean-source terminology policy (see
        # SOURCE_HYGIENE_FORBIDDEN in scripts/production_readiness_gate.py).
        # Loaded by file path (like tests/test_production_readiness_gate.py)
        # since scripts/ is not a package.
        run: |
          python - <<'PY'
          import importlib.util
          import sys
          from pathlib import Path

          file_path = Path("scripts/production_readiness_gate.py").resolve()
          spec = importlib.util.spec_from_file_location("production_readiness_gate", file_path)
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)

          violations = module.run_source_hygiene_scan()
          if violations:
              print("Source hygiene scan failed:", file=sys.stderr)
              for violation in violations[:50]:
                  print(f"  {violation}", file=sys.stderr)
              if len(violations) > 50:
                  print(f"  ... {len(violations) - 50} more", file=sys.stderr)
              sys.exit(1)
          print("Source hygiene scan passed.")
          PY

      - name: Governance guardrails
        run: python scripts/governance_guardrails.py --all --errors-only

      - name: Run ruff
        run: ruff check . --output-format=github

      - name: Run mypy
        run: mypy mozaiksai/ factory_app/ --ignore-missing-imports --disable-error-code=import-untyped

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web_shell
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            web_shell/package-lock.json
            chat-ui/package-lock.json

      - name: Install chat UI dependencies
        working-directory: chat-ui
        run: npm ci

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        env:
          PLAYWRIGHT_SKIP_BROWSER_GC: "1"

      - name: Responsive smoke
        run: npm run test:responsive-smoke
        env:
          VITE_MOCK_MODE: "true"
          MOZAIKS_FACTORY_APP_PATH: ${{ github.workspace }}/factory_app
          MOZAIKS_CHAT_UI_PATH: ${{ github.workspace }}/chat-ui

      - name: Onboarding demo smoke
        run: npm run test:onboarding-demo -- --project desktop-chromium
        env:
          VITE_MOCK_MODE: "true"
          MOZAIKS_FACTORY_APP_PATH: ${{ github.workspace }}/factory_app
          MOZAIKS_CHAT_UI_PATH: ${{ github.workspace }}/chat-ui

      - name: Build
        run: npm run build
        env:
          VITE_MOCK_MODE: "true"
          MOZAIKS_FACTORY_APP_PATH: ${{ github.workspace }}/factory_app
          MOZAIKS_CHAT_UI_PATH: ${{ github.workspace }}/chat-ui

  visual-regression:
    # Visual regression comparison against committed Playwright screenshot baselines.
    # Baselines live in web_shell/playwright/snapshots/ and must be committed to source control.
    #
    # To create/update baselines locally:
    #   cd web_shell
    #   npx playwright test --config playwright.visual.config.js --update-snapshots
    # Then commit the updated web_shell/playwright/snapshots/ directory.
    #
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: web_shell
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            web_shell/package-lock.json
            chat-ui/package-lock.json

      - name: Install chat UI dependencies
        working-directory: chat-ui
        run: npm ci

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        env:
          PLAYWRIGHT_SKIP_BROWSER_GC: "1"

      - name: Visual regression
        run: npx playwright test --config playwright.visual.config.js
        env:
          VITE_MOCK_MODE: "true"
          MOZAIKS_FACTORY_APP_PATH: ${{ github.workspace }}/factory_app
          MOZAIKS_CHAT_UI_PATH: ${{ github.workspace }}/chat-ui

      - name: Upload visual diff artifacts
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: visual-regression-diffs
          path: web_shell/playwright-report-visual/
          retention-days: 14

  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install wheel in clean venv
        run: |
          python -m venv .pkg-venv
          . .pkg-venv/bin/activate
          pip install dist/*.whl

      - name: Smoke installed CLI
        run: |
          . .pkg-venv/bin/activate
          mozaiks --version
          mozaiks quickstart --help
          cd /tmp
          python -m mozaiks --version
          python -m mozaiks studio --help
          python -m mozaiks quickstart --help

      - name: Verify packaged resources
        run: |
          . .pkg-venv/bin/activate
          mkdir -p /tmp/mozaiks-package-smoke
          cd /tmp/mozaiks-package-smoke
          python - <<'PY'
          from pathlib import Path
          from mozaiksai.resources import (
              resolve_chat_ui_src_root,
              resolve_factory_brand_root,
              resolve_factory_workflows_root,
              resolve_web_shell_root,
          )

          resources = {
              "factory_workflows": resolve_factory_workflows_root(),
              "factory_brand": resolve_factory_brand_root(),
              "web_shell": resolve_web_shell_root(),
              "chat_ui_src": resolve_chat_ui_src_root(),
          }

          for name, path in resources.items():
              assert path is not None, f"{name} did not resolve"
              resolved = Path(path)
              assert resolved.exists(), f"{name} path missing: {resolved}"
              assert "site-packages" in str(resolved), f"{name} resolved to non-installed path: {resolved}"

          print("Packaged resources resolved from site-packages")
          PY

      - name: Smoke packaged scaffold init
        run: |
          . .pkg-venv/bin/activate
          mkdir -p /tmp/mozaiks-package-init
          mozaiks init chat --name "CI Package Smoke" --dir /tmp/mozaiks-package-init
          test -f /tmp/mozaiks-package-init/app/brand/theme_config.json

  infra-build:
    # Proves the repo-local infra/ artifacts and a representative generated-app
    # Dockerfile actually build and run, instead of only being reviewed by hand. See
    # docs/architecture/deployment/oss-infra-and-generated-app-deployment.md.
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install generated-app smoke dependencies
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install -e ".[dev]"

      - name: Build repo host image
        run: docker build -t mozaiks-repo-host:ci -f infra/docker/Dockerfile .

      - name: Smoke-run repo host image
        run: |
          docker run -d --name mozaiks-repo-host-smoke \
            --network host \
            -e AUTH_ENABLED=false \
            -e RATE_LIMIT_ENABLED=false \
            -e OPENAI_API_KEY=sk-test-placeholder \
            -e MONGO_URI=mongodb://localhost:27017/ci_mozaiks \
            mozaiks-repo-host:ci

          for i in $(seq 1 20); do
            if curl -sf http://localhost:8000/api/health > /tmp/health.json; then
              echo "Repo host image is healthy:"
              cat /tmp/health.json
              exit 0
            fi
            sleep 3
          done

          echo "Repo host image did not become healthy in time" >&2
          docker logs mozaiks-repo-host-smoke
          exit 1

      - name: Show container logs on failure
        if: failure()
        run: docker logs mozaiks-repo-host-smoke || true

      - name: Stop smoke container
        if: always()
        run: docker rm -f mozaiks-repo-host-smoke || true

      - name: Build and smoke-run representative generated app
        env:
          MOZAIKS_RUN_GENERATED_APP_DOCKER_SMOKE: '1'
        run: pytest -q --no-cov --reruns 0 tests/test_generated_app_container_smoke.py

      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.14.4

      - name: Lint Helm chart
        run: helm lint infra/helm/mozaiks

      - name: Render Helm chart
        run: helm template mozaiks infra/helm/mozaiks > /tmp/mozaiks-helm-rendered.yaml

      - name: Verify rendered health probe paths
        # Regression guard for the /api/health/liveness vs /api/health/live
        # probe-path drift fixed in infra/helm/mozaiks/values.yaml.
        run: |
          grep -q "path: /api/health/live$" /tmp/mozaiks-helm-rendered.yaml
          grep -q "path: /api/health/readiness$" /tmp/mozaiks-helm-rendered.yaml
