name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            web_shell/package-lock.json
            chat-ui/package-lock.json

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          VERSION="$(python -c 'from mozaiksai.version import __version__; print(__version__)')"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "Tag version $TAG does not match package version $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Install release dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build twine

      - name: Run Python tests
        env:
          MONGO_URI: mongodb://localhost:27017/test_mozaiks
          ENV: test
          AUTH_ENABLED: "false"
          OPENAI_API_KEY: "sk-test-placeholder"
        run: python -m pytest tests/ -q

      - name: Build frontend shell
        working-directory: web_shell
        env:
          VITE_MOCK_MODE: "true"
          MOZAIKS_FACTORY_APP_PATH: ${{ github.workspace }}/factory_app
          MOZAIKS_CHAT_UI_PATH: ${{ github.workspace }}/chat-ui
        run: |
          npm --prefix ../chat-ui ci
          npm ci
          npm run build

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Install wheel in clean venv
        shell: bash
        run: |
          python -m venv .release-venv
          . .release-venv/bin/activate
          pip install dist/*.whl
          mozaiks --version
          mozaiks quickstart --help

      - name: Verify packaged resources
        shell: bash
        run: |
          . .release-venv/bin/activate
          mkdir -p /tmp/mozaiks-release-smoke
          cd /tmp/mozaiks-release-smoke
          python - <<'PY'
          from pathlib import Path
          from mozaiksai.resources import (
              resolve_chat_ui_src_root,
              resolve_factory_brand_root,
              resolve_factory_workflows_root,
              resolve_web_shell_root,
          )

          resources = {
              "factory_workflows": resolve_factory_workflows_root(),
              "factory_brand": resolve_factory_brand_root(),
              "web_shell": resolve_web_shell_root(),
              "chat_ui_src": resolve_chat_ui_src_root(),
          }

          for name, path in resources.items():
              assert path is not None, f"{name} did not resolve"
              resolved = Path(path)
              assert resolved.exists(), f"{name} path missing: {resolved}"
              assert "site-packages" in str(resolved), f"{name} resolved to non-installed path: {resolved}"

          print("Packaged resources resolved from site-packages")
          PY

      - name: Smoke packaged scaffold init
        shell: bash
        run: |
          . .release-venv/bin/activate
          mkdir -p /tmp/mozaiks-release-init
          mozaiks init chat --name "Release Smoke" --dir /tmp/mozaiks-release-init
          test -f /tmp/mozaiks-release-init/app/brand/theme_config.json

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  github-release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist

      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: ${{ needs.build.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/*

  publish-pypi:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/mozaiks
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
