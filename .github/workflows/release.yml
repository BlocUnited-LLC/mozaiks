name: Release

# PUBLIC RELEASES REMAIN ON HOLD. See docs/releasing.md.
# A manual dispatch is reserved for an explicitly authorized, exact main
# candidate after the OSS/App Zero commit pair and live acceptance match.
# Tag-triggered publication stays disabled.

on:
  workflow_dispatch:
    inputs:
      release_target:
        description: "TestPyPI rehearsal or public PyPI release"
        required: true
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi
      candidate_sha:
        description: "Full 40-character SHA of the approved current main commit"
        required: true
        type: string
      confirm_release:
        description: >
          Type "testpypi-confirmed" for rehearsal or "release-confirmed"
          for public PyPI. The release hold and docs/releasing.md still apply.
        required: true
        type: string
  # push:
  #   tags:
  #     - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    services:
      mongodb:
        image: quay.io/mongodb/mongodb-community-server:7.0-ubi8
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout exact dispatch commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify release gate
        shell: bash
        env:
          RELEASE_TARGET: ${{ inputs.release_target }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CONFIRM_RELEASE: ${{ inputs.confirm_release }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$RELEASE_TARGET" in
            testpypi) expected_confirmation=testpypi-confirmed ;;
            pypi) expected_confirmation=release-confirmed ;;
            *) echo "::error::Unknown release target" >&2; exit 1 ;;
          esac
          if [[ "$CONFIRM_RELEASE" != "$expected_confirmation" ]]; then
            echo "::error::Confirmation does not match release target." >&2
            exit 1
          fi
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::candidate_sha must be a full lowercase commit SHA." >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::Release dispatch must run from main." >&2
            exit 1
          fi
          checked_out_sha="$(git rev-parse HEAD)"
          main_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$CANDIDATE_SHA" != "$GITHUB_SHA" || "$CANDIDATE_SHA" != "$checked_out_sha" || "$CANDIDATE_SHA" != "$main_sha" ]]; then
            echo "::error::Candidate SHA differs from dispatch, checkout, or current main." >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$CANDIDATE_SHA&branch=main&event=push&per_page=20" > "$RUNNER_TEMP/candidate-ci.json"
          python - "$CANDIDATE_SHA" "$RUNNER_TEMP/candidate-ci.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          sha, path = sys.argv[1:]
          runs = json.loads(Path(path).read_text(encoding="utf-8")).get("workflow_runs", [])
          matches = [
              run for run in runs
              if run.get("head_sha") == sha
              and run.get("head_branch") == "main"
              and run.get("event") == "push"
          ]
          if not matches:
              raise SystemExit("No CI push run found for candidate main SHA")
          latest = max(matches, key=lambda run: (run.get("created_at", ""), run.get("id", 0)))
          if latest.get("status") != "completed" or latest.get("conclusion") != "success":
              raise SystemExit(f"Candidate CI run {latest.get('id')} is not successful")
          print(f"Candidate CI run {latest['id']} succeeded for {sha}")
          PY

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            web_shell/package-lock.json
            chat-ui/package-lock.json

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          VERSION="$(python - <<'PY'
          import ast
          from pathlib import Path

          source = Path("mozaiksai/version.py").read_text(encoding="utf-8")
          tree = ast.parse(source)
          for node in tree.body:
              if not isinstance(node, ast.Assign):
                  continue
              for target in node.targets:
                  if isinstance(target, ast.Name) and target.id == "__version__":
                      print(ast.literal_eval(node.value))
                      raise SystemExit(0)
          raise SystemExit("__version__ not found in mozaiksai/version.py")
          PY
          )"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify dated release notes and tag identity
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          from datetime import date
          from pathlib import Path

          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          version = re.escape(os.environ["RELEASE_VERSION"])
          sections = list(re.finditer(r"(?m)^## (.+)$", text))
          if not sections or sections[0].group(1) != "Unreleased":
              raise SystemExit("CHANGELOG.md must begin with an Unreleased section")
          if len(sections) < 2:
              raise SystemExit("CHANGELOG.md needs a dated section for the release version")
          if text[sections[0].end():sections[1].start()].strip():
              raise SystemExit("CHANGELOG.md Unreleased section must be empty before publication")
          match = re.fullmatch(rf"{version} - (\d{{4}}-\d{{2}}-\d{{2}})", sections[1].group(1))
          if match is None:
              raise SystemExit("CHANGELOG.md needs a dated section for the release version directly below Unreleased")
          try:
              date.fromisoformat(match.group(1))
          except ValueError as exc:
              raise SystemExit("CHANGELOG.md release section has an invalid date") from exc
          release_body = text[sections[1].end():sections[2].start() if len(sections) > 2 else len(text)]
          if re.search(r"(?m)^\s*-\s+\S", release_body) is None:
              raise SystemExit("CHANGELOG.md release section needs at least one note")
          PY
          tag_lines="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")"
          if [[ -n "$tag_lines" ]]; then
            tag_sha="$(printf '%s\n' "$tag_lines" | awk '$2 ~ /\^\{\}$/ { print $1 }')"
            if [[ -z "$tag_sha" ]]; then
              tag_sha="$(printf '%s\n' "$tag_lines" | awk 'NR == 1 { print $1 }')"
            fi
            if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
              echo "::error::Existing release tag points to a different commit." >&2
              exit 1
            fi
          fi

      - name: Install release dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,docs]" build twine

      - name: Run Python tests
        env:
          MONGO_URI: mongodb://localhost:27017/test_mozaiks
          ENV: test
          AUTH_ENABLED: "false"
          OPENAI_API_KEY: "sk-test-placeholder"
        run: python -m pytest tests/ -q

      - name: Build documentation strictly
        run: python -m mkdocs build --strict

      - name: Build frontend shell
        working-directory: web_shell
        env:
          VITE_MOCK_MODE: "true"
          MOZAIKS_FACTORY_APP_PATH: ${{ github.workspace }}/factory_app
          MOZAIKS_CHAT_UI_PATH: ${{ github.workspace }}/chat-ui
        run: |
          npm --prefix ../chat-ui ci
          npm ci
          npm run build

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Package content guard
        # Inspect built artifacts for prohibited content before publication.
        # Fails on: learned-artifact directories, private keys, raw provider
        # credentials, .env files (non-example), private key file extensions.
        # Warns on: large data files and review-pattern paths.
        # See scripts/package_content_guard.py for the full policy table.
        run: python scripts/package_content_guard.py dist/*.whl dist/*.tar.gz

      - name: Install wheel in clean venv
        shell: bash
        run: |
          python -m venv .release-venv
          . .release-venv/bin/activate
          pip install dist/*.whl
          mozaiks --version
          mozaiks quickstart --help
          cd /tmp
          python -m mozaiks --version
          python -m mozaiks studio --help
          python -m mozaiks quickstart --help

      - name: Verify installed wheel runtime contracts
        shell: bash
        run: |
          . .release-venv/bin/activate
          python -I - <<'PY'
          from pathlib import Path
          import sysconfig

          import mozaiksai.core.metrics.d30_cohort as cohort_module
          from mozaiksai.core.metrics.d30_cohort import calculate_d30_action_cohort
          from mozaiksai.core.runtime import persistence
          from mozaiksai.core.runtime.app import module_loader, subscriptions_loader
          from mozaiksai.core.runtime.app.module_loader import ActionDef

          site_packages = Path(sysconfig.get_paths()["purelib"]).resolve()
          for module in (cohort_module, persistence, module_loader, subscriptions_loader):
              module_path = Path(module.__file__).resolve()
              if not module_path.is_relative_to(site_packages):
                  raise SystemExit(
                      f"Runtime contract imported outside installed wheel: {module_path}"
                  )

          required_action_fields = {"api_surface", "entitlement_gate"}
          missing_action_fields = required_action_fields.difference(ActionDef.model_fields)
          if missing_action_fields:
              raise SystemExit(f"Installed wheel ActionDef missing fields: {sorted(missing_action_fields)}")

          required_persistence_exports = {"app_data_from_context", "AppData"}
          missing_persistence_exports = [
              name for name in required_persistence_exports if not hasattr(persistence, name)
          ]
          if missing_persistence_exports:
              raise SystemExit(
                  f"Installed wheel persistence package missing exports: {missing_persistence_exports}"
              )

          if not callable(calculate_d30_action_cohort):
              raise SystemExit("Installed wheel missing D30 cohort calculator")

          print("Installed wheel runtime contracts are present")
          PY

      - name: Verify packaged resources
        shell: bash
        run: |
          . .release-venv/bin/activate
          mkdir -p /tmp/mozaiks-release-smoke
          cd /tmp/mozaiks-release-smoke
          python - <<'PY'
          from pathlib import Path
          from mozaiksai.resources import (
              resolve_chat_ui_src_root,
              resolve_factory_brand_root,
              resolve_factory_workflows_root,
              resolve_web_shell_root,
          )

          resources = {
              "factory_workflows": resolve_factory_workflows_root(),
              "factory_brand": resolve_factory_brand_root(),
              "web_shell": resolve_web_shell_root(),
              "chat_ui_src": resolve_chat_ui_src_root(),
          }

          for name, path in resources.items():
              assert path is not None, f"{name} did not resolve"
              resolved = Path(path)
              assert resolved.exists(), f"{name} path missing: {resolved}"
              assert "site-packages" in str(resolved), f"{name} resolved to non-installed path: {resolved}"

          print("Packaged resources resolved from site-packages")
          PY

      - name: Smoke packaged scaffold init
        shell: bash
        run: |
          . .release-venv/bin/activate
          mkdir -p /tmp/mozaiks-release-init
          mozaiks init chat --name "Release Smoke" --dir /tmp/mozaiks-release-init
          test -f /tmp/mozaiks-release-init/app/brand/theme_config.json

      - name: Smoke installed first run (init, serve, ready, shell-config)
        shell: bash
        env:
          MOZAIKS_FIRST_RUN_SMOKE_MONGO_URI: mongodb://localhost:27017/release_first_run_smoke
        run: |
          . .release-venv/bin/activate
          mkdir -p /tmp/mozaiks-release-first-run
          cd /tmp/mozaiks-release-first-run
          python "$GITHUB_WORKSPACE/scripts/smoke_installed_first_run.py" \
            --work-dir /tmp/mozaiks-release-first-run

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/*

  publish-testpypi:
    if: inputs.release_target == 'testpypi'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      actions: read
      id-token: write
    environment:
      name: testpypi
      url: https://test.pypi.org/p/mozaiks
    steps:
      - name: Verify TestPyPI environment protection
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/environments/testpypi"
          request = Request(url, headers={"Accept": "application/vnd.github+json", "User-Agent": "mozaiks-release"})
          with urlopen(request, timeout=15) as response:
              environment = json.load(response)
          reviewers = [
              rule for rule in environment.get("protection_rules", [])
              if rule.get("type") == "required_reviewers" and rule.get("reviewers")
          ]
          branch_policy = environment.get("deployment_branch_policy") or {}
          if (
              not reviewers
              or environment.get("can_admins_bypass") is not False
              or branch_policy.get("protected_branches") is not True
              or branch_policy.get("custom_branch_policies") is not False
          ):
              raise SystemExit("TestPyPI environment needs reviewers, no admin bypass, and protected branches only")
          print("TestPyPI environment protection is active")
          PY

      - name: Verify candidate still matches main
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          test "$main_sha" = "$CANDIDATE_SHA"

      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    if: inputs.release_target == 'pypi'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      actions: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/mozaiks
    steps:
      - name: Verify PyPI environment protection
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/environments/pypi"
          request = Request(url, headers={"Accept": "application/vnd.github+json", "User-Agent": "mozaiks-release"})
          with urlopen(request, timeout=15) as response:
              environment = json.load(response)
          reviewers = [
              rule for rule in environment.get("protection_rules", [])
              if rule.get("type") == "required_reviewers" and rule.get("reviewers")
          ]
          branch_policy = environment.get("deployment_branch_policy") or {}
          if (
              not reviewers
              or environment.get("can_admins_bypass") is not False
              or branch_policy.get("protected_branches") is not True
              or branch_policy.get("custom_branch_policies") is not False
          ):
              raise SystemExit("PyPI environment needs reviewers, no admin bypass, and protected branches only")
          print("PyPI environment protection is active")
          PY

      - name: Verify candidate still matches main
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          test "$main_sha" = "$CANDIDATE_SHA"

      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    if: inputs.release_target == 'pypi'
    runs-on: ubuntu-latest
    needs: [build, publish-pypi]
    permissions:
      contents: write
    steps:
      - name: Checkout exact published candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false

      - name: Extract dated changelog section
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          version = re.escape(os.environ["RELEASE_VERSION"])
          match = re.search(rf"(?m)^## {version} - \d{{4}}-\d{{2}}-\d{{2}}$", text)
          if match is None:
              raise SystemExit("Dated release notes disappeared from candidate")
          next_section = re.search(r"(?m)^## ", text[match.end():])
          end = match.end() + next_section.start() if next_section else len(text)
          notes = text[match.start():end].strip() + "\n"
          Path("release-notes.md").write_text(notes, encoding="utf-8")
          PY

      - name: Verify existing tag identity
        env:
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          tag_lines="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")"
          if [[ -n "$tag_lines" ]]; then
            tag_sha="$(printf '%s\n' "$tag_lines" | awk '$2 ~ /\^\{\}$/ { print $1 }')"
            if [[ -z "$tag_sha" ]]; then
              tag_sha="$(printf '%s\n' "$tag_lines" | awk 'NR == 1 { print $1 }')"
            fi
            test "$tag_sha" = "$CANDIDATE_SHA"
          fi

      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist

      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          target_commitish: ${{ inputs.candidate_sha }}
          name: ${{ needs.build.outputs.tag }}
          body_path: release-notes.md
          files: |
            dist/*
