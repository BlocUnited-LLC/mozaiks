version: 2

updates:
  # Python package dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    groups:
      # AG2 upgrades require the watchpoint audit and compatibility gate. Keep
      # the runtime pin and its ACP compatibility constraint together, but out
      # of unrelated Python dependency batches.
      ag2-runtime:
        patterns:
          - "ag2"
          - "agent-client-protocol"
      # Batch minor/patch updates from the same ecosystem to reduce PR noise.
      python-minor-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "ag2"
          - "agent-client-protocol"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions version pins
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"

  # Web shell (Node) dependencies
  - package-ecosystem: "npm"
    directory: "/web_shell"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    groups:
      frontend-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Chat UI (Node) dependencies
  - package-ecosystem: "npm"
    directory: "/chat-ui"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    groups:
      chat-ui-minor-patch:
        update-types:
          - "minor"
          - "patch"
