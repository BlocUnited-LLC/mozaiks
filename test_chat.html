<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mozaiks WebSocket Test</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            padding: 1rem 2rem;
            background: #16213e;
            border-bottom: 1px solid #0f3460;
        }
        h1 { font-size: 1.5rem; font-weight: 500; }
        .subtitle { color: #888; font-size: 0.9rem; margin-top: 0.25rem; }
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding: 1rem;
        }
        #status {
            padding: 0.5rem 1rem;
            background: #16213e;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.85rem;
        }
        #status.connected { border-left: 4px solid #4ade80; }
        #status.disconnected { border-left: 4px solid #f87171; }
        #status.connecting { border-left: 4px solid #fbbf24; }
        #messages {
            flex: 1;
            overflow-y: auto;
            background: #0f0f1a;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
            min-height: 300px;
        }
        .message {
            margin-bottom: 1rem;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            max-width: 80%;
        }
        .message.user {
            background: #6366f1;
            margin-left: auto;
        }
        .message.agent {
            background: #16213e;
        }
        .message.system {
            background: #0f3460;
            font-size: 0.85rem;
            color: #888;
            max-width: 100%;
            text-align: center;
        }
        .message-meta {
            font-size: 0.7rem;
            color: #666;
            margin-top: 0.25rem;
        }
        #input-area {
            display: flex;
            gap: 0.5rem;
        }
        #message-input {
            flex: 1;
            padding: 0.75rem 1rem;
            background: #16213e;
            border: 1px solid #0f3460;
            border-radius: 8px;
            color: #eee;
            font-size: 1rem;
        }
        #message-input:focus {
            outline: none;
            border-color: #6366f1;
        }
        button {
            padding: 0.75rem 1.5rem;
            background: #6366f1;
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-size: 1rem;
        }
        button:hover { background: #5558e3; }
        button:disabled {
            background: #444;
            cursor: not-allowed;
        }
        #connect-area {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        #connect-area input {
            flex: 1;
            padding: 0.5rem;
            background: #16213e;
            border: 1px solid #0f3460;
            border-radius: 4px;
            color: #eee;
        }
    </style>
</head>
<body>
    <header>
        <h1>Mozaiks WebSocket Test</h1>
        <div class="subtitle">Testing WebSocket connection to a workflow runtime</div>
    </header>
    <main>
        <div id="connect-area">
            <input type="text" id="ws-url" placeholder="WebSocket URL"
                   value="ws://localhost:8000/ai/ws/RuntimeSmoke/test-app/test-chat-1/user-1">
            <button id="connect-btn" onclick="connect()">Connect</button>
            <button id="disconnect-btn" onclick="disconnect()" disabled>Disconnect</button>
        </div>
        <div id="status" class="disconnected">Disconnected</div>
        <div id="messages"></div>
        <div id="input-area">
            <input type="text" id="message-input" placeholder="Type a message..." disabled
                   onkeypress="if(event.key==='Enter') sendMessage()">
            <button id="send-btn" onclick="sendMessage()" disabled>Send</button>
        </div>
    </main>

    <script>
        let ws = null;

        function setStatus(text, state) {
            const el = document.getElementById('status');
            el.textContent = text;
            el.className = state;
        }

        function addMessage(content, type = 'system', meta = '') {
            const messages = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = `message ${type}`;
            div.innerHTML = `<div>${content}</div>`;
            if (meta) {
                div.innerHTML += `<div class="message-meta">${meta}</div>`;
            }
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }

        function connect() {
            const url = document.getElementById('ws-url').value;
            setStatus('Connecting...', 'connecting');
            addMessage(`Connecting to ${url}...`);

            ws = new WebSocket(url);

            ws.onopen = () => {
                setStatus('Connected', 'connected');
                addMessage('Connected to workflow runtime');
                document.getElementById('message-input').disabled = false;
                document.getElementById('send-btn').disabled = false;
                document.getElementById('connect-btn').disabled = true;
                document.getElementById('disconnect-btn').disabled = false;
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    console.log('Received:', data);

                    if (data.type === 'message' || data.type === 'agent_message') {
                        const agent = data.agent || data.sender || 'Agent';
                        const content = data.content || data.message || JSON.stringify(data);
                        addMessage(content, 'agent', `From: ${agent}`);
                    } else if (data.type === 'system' || data.type === 'status') {
                        addMessage(data.message || data.content || JSON.stringify(data));
                    } else if (data.type === 'error') {
                        addMessage(`Error: ${data.message || data.error}`, 'system');
                    } else {
                        // Unknown type - show raw
                        addMessage(JSON.stringify(data, null, 2), 'system');
                    }
                } catch (e) {
                    // Plain text message
                    addMessage(event.data, 'agent');
                }
            };

            ws.onclose = (event) => {
                setStatus(`Disconnected (code: ${event.code})`, 'disconnected');
                addMessage(`Disconnected: ${event.reason || 'Connection closed'}`);
                document.getElementById('message-input').disabled = true;
                document.getElementById('send-btn').disabled = true;
                document.getElementById('connect-btn').disabled = false;
                document.getElementById('disconnect-btn').disabled = true;
                ws = null;
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                addMessage('WebSocket error occurred', 'system');
            };
        }

        function disconnect() {
            if (ws) {
                ws.close();
            }
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            const message = input.value.trim();
            if (!message || !ws) return;

            const payload = {
                type: 'message',
                content: message,
            };

            ws.send(JSON.stringify(payload));
            addMessage(message, 'user');
            input.value = '';
        }
    </script>
</body>
</html>
