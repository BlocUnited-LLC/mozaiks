workflow_name: SubscriptionContractDesigner
max_turns: 6
human_in_the_loop: false
workflow_startup_mode: AgentDriven
orchestration_pattern: ag2_network
initial_message: >-
  ContractDesignerAgent: read the app concept, design docs, and monetization
  context. Emit one SubscriptionContractOutput. If the app does not sell plans,
  gate paid features, or need token allowances, emit a no-op contract with
  contract_required=false.
initial_agent: ContractDesignerAgent
