definitions:
  build_mode:
    type: string
    description: Build mode for subscription contract generation.
    source:
      type: state
      default: initial
  workflow_sequence:
    type: string
    description: Active workflow sequence that launched this run.
    source:
      type: state
      default: null
  revision_scope:
    type: string
    description: Revision scope when rerun during refinement.
    source:
      type: state
      default: null
  change_request_id:
    type: string
    description: Stable lineage id for the active revision request.
    source:
      type: state
      default: null
  revision_id:
    type: string
    description: Runtime-generated revision run id.
    source:
      type: state
      default: null
  artifact_kind:
    type: string
    description: Artifact family currently being refined.
    source:
      type: state
      default: null
  artifact_version_id:
    type: string
    description: Artifact version id being refined, if any.
    source:
      type: state
      default: null
  sequence_status:
    type: string
    description: Builder sequence state before this run.
    source:
      type: state
      default: in_progress
  revision_origin_workflow:
    type: string
    description: Workflow where the revision request originated before reroute.
    source:
      type: state
      default: null
  refinement_request:
    type: string
    description: Raw refinement request text when rerun during a revision.
    source:
      type: state
      default: null
  refinement_request_meta:
    type: object
    description: Full typed RefinementRequest payload when present.
    source:
      type: state
      default: null
  screen:
    type: string
    description: Builder surface or screen identifier that launched the current refinement request.
    source:
      type: state
      default: null
  change_intent:
    type: object
    description: Control-plane refinement classification.
    source:
      type: state
      default: null
  impact_set:
    type: object
    description: Control-plane downstream impact summary.
    source:
      type: state
      default: null
  app_context_required:
    type: boolean
    description: >
      True when this run is a refinement or existing-app route that must retain
      a current AppContextVersion before downstream build work continues.
    source:
      type: state
      default: false
  current_app_context_version_id:
    type: string
    description: Durable AppContextVersion id for source-backed App Intelligence.
    source:
      type: state
      default: null
  app_context_summary:
    type: object
    description: Prompt-safe summary of the current AppContextVersion.
    source:
      type: state
      default: null
  app_type:
    type: string
    description: Entry path selected at the app_type_selector gate.
    source:
      type: state
      default: "greenfield_app"
  app_intelligence_ready:
    type: boolean
    description: True when startup loaded an App Intelligence catalog.
    source:
      type: state
      default: false
  app_intelligence_status:
    type: string
    description: Startup load status for App Intelligence context.
    source:
      type: state
      default: null
  app_intelligence_summary:
    type: string
    description: Compact human-readable summary of indexed source coverage.
    source:
      type: state
      default: null
  app_intelligence_health:
    type: object
    description: App Intelligence coverage, scan health, and startup warnings.
    source:
      type: state
      default: null
  app_intelligence_catalog:
    type: object
    description: >
      Prompt-safe App Intelligence catalog containing architecture, capability,
      ownership, integration, data, and risk summaries.
    source:
      type: state
      default: null
  source_context_catalog:
    type: object
    description: Prompt-safe source corpus catalog for indexed files, chunks, symbols, and imports.
    source:
      type: state
      default: null
  brownfield_build_path:
    type: string
    description: >
      Selected existing-app enhancement path. `light_integration` means Add AI
      Workflows; `full_migration` means Build App Features. Null for greenfield.
    source:
      type: state
      default: null
  adoption_plan:
    type: object
    description: Canonical AdoptionPlan from ExistingAppDiscovery, when present.
    source:
      type: state
      default: null
  ownership_boundary:
    type: object
    description: Canonical ownership boundary from ExistingAppDiscovery, when present.
    source:
      type: state
      default: null
  brownfield_registration:
    type: object
    description: BrownfieldRegistration provenance record from ExistingAppDiscovery, when present.
    source:
      type: state
      default: null
  monetization_enabled:
    type: boolean
    description: Flag indicating whether monetization is enabled for this build.
    source:
      type: config
      env_var: MONETIZATION_ENABLED
      default: false
  builder_options:
    type: object
    description: Optional app-agnostic builder UI options.
    source:
      type: state
      default: null
  concept_overview:
    type: string
    description: Project description and overview from ValueEngine.
    source:
      type: data_reference
      database_name: mozaiksai
      collection: BuilderConcepts
      query_template:
        app_id: '{{runtime.app_id}}'
      fields:
        - ConceptOverview
      default: null
  concept_blueprint:
    type: object
    description: Structured ConceptBlueprint from ValueEngine.
    source:
      type: data_reference
      database_name: mozaiksai
      collection: BuilderConcepts
      query_template:
        app_id: '{{runtime.app_id}}'
      fields:
        - Blueprint
      default: null
  backend_design_document:
    type: string
    description: Latest backend design document from DesignDocs.
    source:
      type: data_reference
      database_name: mozaiksai
      collection: DesignDocuments
      query_template:
        app_id: '{{runtime.app_id}}'
        kind: backend
        status: succeeded
      fields:
        - content
      default: null
  design_surface_map:
    type: object
    description: Canonical typed surface realization contract from DesignDocs.
    source:
      type: data_reference
      database_name: mozaiksai
      collection: DesignDocuments
      query_template:
        app_id: '{{runtime.app_id}}'
        kind: backend
        status: succeeded
      fields:
        - surface_map
      default: null
  experience_spec:
    type: object
    description: Typed ExperienceSpec from DesignDocs.
    source:
      type: data_reference
      database_name: mozaiksai
      collection: DesignDocuments
      query_template:
        app_id: '{{runtime.app_id}}'
        kind: ui_schema
        status: succeeded
      fields:
        - experience_spec
      default: null
  subscription_contract:
    type: object
    description: SubscriptionContractOutput persisted by this workflow for downstream generator context.
    source:
      type: computed
      default: null
  subscription_contract_files:
    type: array
    description: Code files produced by the subscription contract, usually config/subscriptions.yaml.
    source:
      type: computed
      default: []
  subscription_contract_review_status:
    type: string
    description: Review UI result for the normalized subscription contract.
    source:
      type: computed
      default: not_requested
  subscription_contract_review_response:
    type: object
    description: Last user response from the subscription contract review UI.
    source:
      type: computed
      default: null
agents:
  ContractDesignerAgent:
    variables:
      - build_mode
      - workflow_sequence
      - revision_scope
      - change_request_id
      - revision_id
      - artifact_kind
      - artifact_version_id
      - sequence_status
      - revision_origin_workflow
      - refinement_request
      - refinement_request_meta
      - screen
      - change_intent
      - impact_set
      - app_context_required
      - current_app_context_version_id
      - app_context_summary
      - app_type
      - app_intelligence_ready
      - app_intelligence_status
      - app_intelligence_summary
      - app_intelligence_health
      - app_intelligence_catalog
      - source_context_catalog
      - brownfield_build_path
      - adoption_plan
      - ownership_boundary
      - brownfield_registration
      - monetization_enabled
      - builder_options
      - concept_overview
      - concept_blueprint
      - backend_design_document
      - design_surface_map
      - experience_spec
      - subscription_contract
      - subscription_contract_review_status
      - subscription_contract_review_response
