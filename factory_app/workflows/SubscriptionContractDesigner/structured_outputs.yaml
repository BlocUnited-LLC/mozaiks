schema_version: mozaiks.structured_outputs.v1
registry:
  ContractDesignerAgent: SubscriptionContractOutput

models:
  BillingRevisionField:
    type: literal
    values: [billing_revision]

  AssignmentStore:
    type: model
    fields:
      data_alias:
        type: str
        description: App data alias containing active subscription assignments.
      app_id_field:
        type: str
        description: Field carrying app scope.
      tenant_id_field:
        type: union
        variants: [str, 'null']
        description: Field carrying tenant scope, or null.
      workspace_id_field:
        type: union
        variants: [str, 'null']
        description: Field carrying workspace scope, or null.
      user_id_field:
        type: union
        variants: [str, 'null']
        description: Field carrying user scope, or null.
      plan_id_field:
        type: str
        description: Field carrying active plan id.
      status_field:
        type: str
        description: Field carrying assignment status.
      starts_at_field:
        type: union
        variants: [str, 'null']
        description: Field carrying assignment start timestamp, or null.
      expires_at_field:
        type: union
        variants: [str, 'null']
        description: Field carrying assignment expiration timestamp, or null.
      capabilities_field:
        type: union
        variants: [str, 'null']
        description: Field carrying granted capabilities, or null.
      plan_snapshot_field:
        type: union
        variants: [str, 'null']
        description: Field carrying the plan snapshot, or null.
      revision_field:
        type: union
        variants: [BillingRevisionField, 'null']
        description: >
          Field storing the last committed entitlement revision, which fences
          out-of-order fulfillment commands. Use "billing_revision" to enable
          fencing (the default) or null to opt out. The runtime accepts only
          those two values, so no other string may be generated. Explicit null
          is meaning-bearing and is preserved end to end.
      active_statuses:
        type: list
        items: str
        description: Status values that count as active.

  TokenWallet:
    type: model
    fields:
      wallet_id:
        type: str
        description: Stable wallet id, such as ai_tokens.
      label:
        type: union
        variants: [str, 'null']
        description: Human-readable wallet label.
      unit:
        type: literal
        values: [tokens, credits]
        description: Wallet unit.
      usage_meter_id:
        type: union
        variants: [str, 'null']
        description: Runtime usage meter id that debits this wallet.
      scope:
        type: literal
        values: [user, tenant]
        description: Wallet scope.
      auto_debit_usage:
        type: bool
        description: Whether runtime usage events auto-debit this wallet.
      allow_negative_balance:
        type: bool
        description: Whether spending may drive balance negative.
      depleted_balance:
        type: union
        variants: [TokenWalletRecovery, 'null']
        description: User-actionable recovery metadata for insufficient token balance.

  TokenWalletRecovery:
    type: model
    fields:
      recovery_action:
        type: literal
        values: [top_up, upgrade, contact_admin]
        description: Default UI recovery action when this wallet is depleted.
      billing_route:
        type: str
        description: App-local billing route surfaced with INSUFFICIENT_TOKENS.
      top_up_route:
        type: union
        variants: [str, 'null']
        description: App-local top-up route, or null when top-ups are unavailable.
      upgrade_route:
        type: union
        variants: [str, 'null']
        description: App-local plan upgrade route, or null.
      contact_route:
        type: union
        variants: [str, 'null']
        description: App-local admin/support contact route, or null.
      message:
        type: union
        variants: [str, 'null']
        description: Optional short user-facing recovery message.

  TokenAllowance:
    type: model
    fields:
      wallet_id:
        type: str
        description: Declared token wallet id.
      amount:
        type: int
        description: Allowance amount granted by this plan.
      cadence:
        type: literal
        values: [monthly, one_time, manual]
        description: Allowance materialization cadence.
      label:
        type: union
        variants: [str, 'null']
        description: Human-readable allowance label.

  TokenTopUpPrice:
    type: model
    fields:
      amount_cents:
        type: int
        description: Positive cash amount in the smallest currency unit; never a provider price id.
      currency:
        type: str
        description: Lowercase ISO 4217 currency code, such as usd.
      display:
        type: union
        variants: [str, 'null']
        description: Optional display price such as "$5"; derived from amount_cents/currency, not provider state.

  TokenTopUpProduct:
    type: model
    fields:
      product_id:
        type: str
        description: Stable app-owned top-up product id; never a provider price id.
      label:
        type: str
        description: Human-readable token pack label.
      wallet_id:
        type: str
        description: Token wallet credited when this product is fulfilled.
      token_amount:
        type: int
        description: Token amount credited by the product after verified fulfillment.
      price:
        type: TokenTopUpPrice
        description: Provider-neutral cash price used by app facades to start checkout.
      description:
        type: union
        variants: [str, 'null']
        description: Optional display description.
      active:
        type: bool
        description: Whether the token pack is available for new top-up starts.

  AddOnProductPrice:
    type: model
    fields:
      amount_cents:
        type: int
        description: Positive cash amount in the smallest currency unit; never a provider price id.
      currency:
        type: str
        description: Lowercase ISO 4217 currency code, such as usd.
      display:
        type: union
        variants: [str, 'null']
        description: Optional display price derived from amount_cents/currency, not provider state.
      interval:
        type: literal
        values: [one_time, day, week, month, year, custom]
        description: Display billing interval for this provider-neutral price.

  AddOnProduct:
    type: model
    fields:
      add_on_id:
        type: str
        description: Stable app-owned add-on id referenced by pricing_catalog.groups[].add_on_ids; never a provider price id.
      label:
        type: str
        description: Human-readable add-on label.
      description:
        type: union
        variants: [str, 'null']
        description: Optional display description.
      kind:
        type: str
        description: App-owned display kind such as service, placement, seat, feature, or credit.
      billing_mode:
        type: literal
        values: [one_time, recurring, manual]
        description: Provider-neutral purchase cadence; provider-specific checkout remains outside this file.
      price:
        type: union
        variants: [AddOnProductPrice, 'null']
        description: Optional provider-neutral cash price used by app facades to start checkout.
      required_feature:
        type: union
        variants: [str, 'null']
        description: Optional exact id from the injected approved pricing feature inventory required to request this add-on; code derives its capability id and this does not grant it.
      capability_groups:
        type: list
        items: str
        description: Semantic capability families represented by this add-on.
      duration_days:
        type: union
        variants: [int, 'null']
        description: Optional display or fulfillment duration in days.
      active:
        type: bool
        description: Whether the add-on is available for new purchase starts.

  UsageChargePolicy:
    type: model
    fields:
      meter_id:
        type: str
        description: Usage meter id this charge policy applies to, such as ai_tokens.
      label:
        type: union
        variants: [str, 'null']
        description: Human-readable customer charge label.
      source:
        type: literal
        values: [runtime_llm_usage]
        description: Runtime usage source used for customer-facing charge estimates.
      basis:
        type: literal
        values: [provider_cost_usd, tokens]
        description: Charge basis; provider_cost_usd applies markup to runtime provider-cost estimates, tokens uses unit_price_usd_per_1k.
      markup_percent:
        type: float
        description: Non-negative app-level markup percentage applied to the selected basis.
      unit_price_usd_per_1k:
        type: union
        variants: [float, 'null']
        description: Customer token price per 1K tokens; required only when basis is tokens.
      minimum_charge_usd:
        type: float
        description: Optional minimum customer charge for non-zero usage.
      rounding:
        type: literal
        values: [none, cent, micro_usd]
        description: Rounding strategy for billable usage estimates.

  UsageLimit:
    type: model
    fields:
      meter_id:
        type: str
        description: Meter id displayed or enforced for this plan.
      label:
        type: union
        variants: [str, 'null']
        description: Human-readable meter label.
      unit:
        type: literal
        values: [tokens, requests, credits]
        description: Meter unit.
      monthly_limit:
        type: union
        variants: [int, 'null']
        description: Monthly limit, or null.
      feature_id:
        type: union
        variants: [str, 'null']
        description: Optional exact approved feature id this limit corresponds to; code derives the capability id.

  SubscriptionPlan:
    type: model
    fields:
      plan_id:
        type: str
        description: Stable plan id.
      label:
        type: str
        description: Human-readable plan name.
      description:
        type: union
        variants: [str, 'null']
        description: Short plan description.
      included_features:
        type: list
        items: str
        description: Exact feature ids selected from the injected approved pricing feature inventory. Code derives runtime capability grants and gates.
      usage_limits:
        type: list
        items: UsageLimit
        description: Usage limits declared for this plan.
      token_allowances:
        type: list
        items: TokenAllowance
        description: Token allowances granted by this plan.

  PricingCatalogGroup:
    type: model
    fields:
      group_id:
        type: str
        description: Stable pricing display group id for a tab or service selector.
      label:
        type: str
        description: Human-readable group label.
      description:
        type: union
        variants: [str, 'null']
        description: Short display description, or null.
      kind:
        type: literal
        values: [subscription, service, add_on, mixed]
        description: Display category only; does not grant capabilities.
      plan_ids:
        type: list
        items: str
        description: Declared subscription plan ids shown in this group.
      capability_groups:
        type: list
        items: str
        description: Semantic capability families represented by this group.
      add_on_ids:
        type: list
        items: str
        description: App-owned add-on ids displayed in this group; when add_on_products is present, every id must reference it.

  PricingCatalog:
    type: model
    fields:
      default_group_id:
        type: union
        variants: [str, 'null']
        description: Default pricing display group id, or null.
      groups:
        type: list
        items: PricingCatalogGroup
        description: Pricing display groups for tabs or service selectors.

  SubscriptionConfigDesign:
    type: model
    fields:
      schema_version:
        type: literal
        values: [mozaiks.subscriptions.v1]
        description: Subscriptions config schema version.
      label:
        type: str
        description: Catalog label.
      default_plan_id:
        type: str
        description: Default plan id.
      assignment_store:
        type: union
        variants: [AssignmentStore, 'null']
        description: Assignment store backing EntitlementPort, or null.
      token_wallets:
        type: list
        items: TokenWallet
        description: Provider-neutral token wallets.
      top_up_products:
        type: list
        items: TokenTopUpProduct
        description: Provider-neutral app-owned token packs for top-up facades.
      add_on_products:
        type: list
        items: AddOnProduct
        description: Provider-neutral app-owned non-token add-ons referenced by pricing_catalog.groups[].add_on_ids.
      usage_charge_policies:
        type: list
        items: UsageChargePolicy
        description: Provider-neutral customer usage charge estimate policies.
      pricing_catalog:
        type: union
        variants: [PricingCatalog, 'null']
        description: Optional display metadata for grouped pricing tabs or service selectors.
      plans:
        type: list
        items: SubscriptionPlan
        description: Subscription plans with closed feature selections; code compiles runtime plans.

  MeteringDeclaration:
    type: model
    fields:
      surface_type:
        type: literal
        values: [module_action, workflow]
        description: Surface being metered.
      surface_id:
        type: str
        description: Exact approved DesignDocs module or workflow surface_id; workflow names are resolved after AgentGenerator.
      action_id:
        type: union
        variants: [str, 'null']
        description: Approved module action id, or null for a workflow surface meter.
      wallet_id:
        type: str
        description: Token wallet to charge.
      scope:
        type: literal
        values: [user, tenant]
        description: Metering scope.
      enforcement:
        type: literal
        values: [reserve_then_commit, commit_actual, display_only]
        description: Intended enforcement behavior.
      estimate:
        type: union
        variants: [int, 'null']
        description: Estimated tokens to reserve, or null.
      idempotency_key_source:
        type: str
        description: Field/source that yields a stable idempotency key.

  PageSurfaceRequirement:
    type: model
    fields:
      page_id:
        type: str
        description: Stable page id.
      route:
        type: str
        description: Exact approved route from experience_spec.pages; enrich that page without adding a new route.
      purpose:
        type: str
        description: What this page exposes.
      required_runtime_endpoints:
        type: list
        items: str
        description: Runtime endpoints the page should consume.

  AppGeneratorInstruction:
    type: model
    fields:
      target:
        type: literal
        values: [AppPlanAgent, AppSchemaAgent, ConfigMiddlewareAgent, AgentGenerator]
        description: Generator agent or workflow that should consume this instruction.
      instruction:
        type: str
        description: Concrete implementation instruction.

  PlanDesignRationale:
    type: model
    fields:
      source_context:
        type: literal
        values:
          - concept_overview
          - concept_blueprint
          - backend_design_document
          - design_surface_map
          - experience_spec
          - monetization_enabled
          - builder_options
          - refinement_request
          - change_intent
          - impact_set
        description: Upstream context variable that provided the signal.
      signal:
        type: str
        description: Concrete source signal used for a subscription design decision.
      decision:
        type: str
        description: Subscription, entitlement, quota, or pricing-catalog decision derived from the signal.
      affected_plan_ids:
        type: list
        items: str
        description: Plan ids affected by this decision.
      affected_pricing_group_ids:
        type: list
        items: str
        description: Pricing catalog group ids affected by this decision.

  SubscriptionContractOutput:
    type: model
    fields:
      agent_message:
        type: str
        description: Short status message.
      contract_required:
        type: bool
        description: True when the generated app needs app-owned subscription/token contracts.
      rationale:
        type: str
        description: Why the contract is or is not required.
      plan_design_rationale:
        type: list
        items: PlanDesignRationale
        description: Traceable semantic reasoning from upstream context variables to plan, quota, entitlement, and pricing group decisions.
      app_id:
        type: union
        variants: [str, 'null']
        description: App id if known.
      app_name:
        type: str
        description: App name.
      subscription_config_file:
        type: union
        variants: [SubscriptionConfigDesign, 'null']
        description: Provider-neutral plan design with included_features selections; code derives app/config/subscriptions.yaml, or null.
      metering_declarations:
        type: list
        items: MeteringDeclaration
        description: Metering declarations across module/workflow surfaces.
      page_surface_requirements:
        type: list
        items: PageSurfaceRequirement
        description: Usage/billing/profile page requirements.
      app_generator_instructions:
        type: list
        items: AppGeneratorInstruction
        description: Concrete generator instructions.
      validation_notes:
        type: list
        items: str
        description: Notes and assumptions for downstream review. A feature absent from the approved inventory must be removed from a plan or approved upstream in DesignDocs.
      forbidden_outputs:
        type: list
        items: str
        description: Outputs that downstream generators must not create.
