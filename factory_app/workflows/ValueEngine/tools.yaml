# ValueEngine Tools
# Simplified tools that work with mozaiks runtime

tools:
# ============================================================================
# GapAnalysisAgent Tools - Value Manifest & Decomposition
# ============================================================================
- agent: GapAnalysisAgent
  file: manifest.py
  function: save_value_manifest
  description: Persist the concept draft and collect a structured owner review before downstream generation.
  tool_type: UI_Tool
  auto_tool_call: true
  bind_to_agent: false
  outcome:
    context_key: concept_review_outcome
    attempts_key: concept_review_attempts
    result_field: outcome
    values: [approved, changes_requested, cancelled, blocked]
    error_value: blocked
    max_attempts: 3
    retry_on: [changes_requested]
  ui:
    component: ConceptBlueprint
    mode: artifact
    workflow_primitive: approval_card
    realization: workflow_wrapper
  ui_contract:
    surface_kind: agent_tool
    payload_schema:
      type: object
      required: [review_id, blueprint]
      properties:
        review_id: {type: string}
        blueprint: {type: object}
      additionalProperties: true
    actions_schema:
    - id: approve
      label: Approve Concept
      variant: primary
      approved: true
      payload_schema:
        type: object
        required: [action, approved, review_id]
        properties:
          action: {type: string, enum: [approve]}
          approved: {type: boolean, const: true}
          review_id: {type: string}
          rationale: {type: string}
        additionalProperties: false
    - id: request_changes
      label: Request Changes
      variant: secondary
      approved: false
      payload_schema:
        type: object
        required: [action, approved, review_id]
        properties:
          action: {type: string, enum: [request_changes]}
          approved: {type: boolean, const: false}
          review_id: {type: string}
          rationale: {type: string}
        additionalProperties: false
    - id: cancel
      label: Cancel
      variant: ghost
      approved: false
      payload_schema:
        type: object
        required: [action, approved, review_id]
        properties:
          action: {type: string, enum: [cancel]}
          approved: {type: boolean, const: false}
          review_id: {type: string}
          rationale: {type: string}
        additionalProperties: false

- agent: GapAnalysisAgent
  file: manifest.py
  function: get_value_manifest
  description: Retrieve the Value Manifest for an app.
  tool_type: Agent_Tool
  auto_tool_call: false

- agent: GapAnalysisAgent
  file: decompose.py
  function: get_feature_context
  description: Get context for a specific feature from the manifest.
  tool_type: Agent_Tool
  auto_tool_call: false

# ============================================================================
# LIFECYCLE TOOLS
# ============================================================================
lifecycle_tools:
  - trigger: before_chat
    agent: null
    file: create_app_record.py
    function: create_app_record
    description: Create a hosted build-registry record at pipeline start so the Apps directory shows the app as in-progress immediately.
  - trigger: on_start
    agent: null
    file: ../_shared/platform/build_lifecycle.py
    function: emit_build_started
    description: Notify platform build tracking when workflow run starts.
    tool_type: Agent_Tool
  - trigger: on_complete
    agent: null
    file: ../_shared/platform/build_lifecycle.py
    function: emit_build_completed
    description: Notify platform build tracking when workflow run completes.
    tool_type: Agent_Tool
  - trigger: on_fail
    agent: null
    file: ../_shared/platform/build_lifecycle.py
    function: emit_build_failed
    description: Notify platform build tracking when workflow run fails.
    tool_type: Agent_Tool
