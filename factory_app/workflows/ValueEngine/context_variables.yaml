# ValueEngine Context Variables
# Follows AgentGenerator pattern: definitions[] + agents[]

definitions:
# ============================================================================
# CONFIG - Deployment settings (env vars)
# ============================================================================
  platform_user_email:
    type: string
    description: >
      Email of the authenticated platform user running this session.
      Injected from the platform at session start. Null in OSS/unauthenticated contexts.
      When non-null, agents know who they are talking to and can personalize the experience.
    source:
      type: config
      env_var: PLATFORM_USER_EMAIL
      default: null

  app_type:
    type: string
    description: App path for ValueEngine. Greenfield app generation defaults to "greenfield_app".
    source:
      type: state
      default: "greenfield_app"

  context_aware:
    type: boolean
    description: Flag indicating if the application is opensource (LLM asks for context) or part of an existing product with seeded context.
    source:
      type: config
      env_var: CONTEXT_AWARE
      default: true
  monetization_enabled:
    type: boolean
    description: Flag indicating if monetization features are enabled for this workflow.
    source:
      type: config
      env_var: MONETIZATION_ENABLED
      default: false
  builder_options:
    type: object
    description: Optional app-agnostic builder UI option payload carried through workflow sequences.
    source:
      type: state
      default: null

# ============================================================================
# STATE - Workflow orchestration triggers
# ============================================================================
  build_mode:
    type: string
    description: >
      Build mode for ValueEngine. `initial` means fresh ideation; `revision`
      means the workflow was reopened by the refinement engine and should revise
      persisted concept state instead of acting like a blank-slate interview.
    source:
      type: state
      default: initial
  workflow_sequence:
    type: string
    description: >
      Active workflow sequence that launched this run, such as conceptual_replan
      or full_rebuild. Injected by the refinement engine so agents can distinguish
      reroute intent from a plain workflow id.
    source:
      type: state
      default: null
  revision_scope:
    type: string
    description: >
      Revision scope: patch | design | feature | core. When present,
      it describes why the refinement engine re-entered ValueEngine.
    source:
      type: state
      default: null
  change_request_id:
    type: string
    description: Stable lineage id for the active revision request.
    source:
      type: state
      default: null
  revision_id:
    type: string
    description: Runtime-generated revision run id for the current builder revision.
    source:
      type: state
      default: null
  artifact_kind:
    type: string
    description: >
      Artifact family that triggered the current reroute, such as app_bundle or
      workflow_bundle. Useful for understanding whether the revision originated
      from app, workflow, or design refinement.
    source:
      type: state
      default: null
  artifact_version_id:
    type: string
    description: >
      Version id of the downstream artifact that triggered the reroute. Null
      for fresh greenfield starts.
    source:
      type: state
      default: null
  sequence_status:
    type: string
    description: >
      Builder sequence state before the revision launch: in_progress |
      completed | stale | revising.
    source:
      type: state
      default: in_progress
  revision_origin_workflow:
    type: string
    description: Workflow where the revision request originated before reroute.
    source:
      type: state
      default: null
  refinement_request:
    type: string
    description: >
      Raw user-supplied refinement request text passed through from the
      canonical RefinementRequest. When present, this is the concept revision
      request ValueInterviewAgent should anchor to first.
    source:
      type: state
      default: null
  refinement_request_meta:
    type: object
    description: >
      Full typed RefinementRequest payload persisted by the refinement engine.
      Useful when agents need artifact ids, source surface, or other request
      metadata beyond the raw refinement text.
    source:
      type: state
      default: null
  screen:
    type: string
    description: >
      Builder surface or screen identifier that launched the current refinement
      request, such as studio-create. Preserved for analytics and future
      surface-aware prompt shaping.
    source:
      type: state
      default: null
  change_intent:
    type: object
    description: >
      Typed refinement classification emitted by the refinement engine. Contains the
      final `revision_scope`, rationale, and layer-touch information so
      ValueEngine can treat reroutes as deliberate concept revisions.
    source:
      type: state
      default: null
  impact_set:
    type: object
    description: >
      Typed downstream impact summary emitted by the refinement engine. Contains
      affected workflows, affected declarative families, restart_from, and
      rebuild/replanning flags for the current refinement request.
    source:
      type: state
      default: null
  pivot_description:
    type: string
    description: >
      User's original change request text, injected by the refinement engine when
      the active workflow_sequence is conceptual_replan. Describes the nature
      of the concept-level pivot (e.g., "make this a marketplace, not a CRM")
      so ValueEngine can anchor the new concept to explicit pivot intent rather
      than treating it as a blank-slate interview.
    source:
      type: state
      default: null
  existing_concept_ref:
    type: string
    description: >
      Artifact version id of the current/latest concept artifact at the time
      the conceptual_replan was triggered. Null when not available. Future work
      will use this to carry forward generic modules; today it is advisory context.
    source:
      type: state
      default: null
  preserve_families:
    type: array
    description: >
      Artifact families that the conceptual_replan should preserve rather than
      regenerate from scratch. Default is ["brand"] — ThemeCapture runs but
      should use the existing brand as a starting point. Carry-forward behavior
      is future work; this variable is context plumbing only.
    source:
      type: state
      default: []
  previous_brand_ref:
    type: string
    description: >
      Artifact version id of the current brand/theme_config artifact at the
      time the conceptual_replan was triggered. Null when not available.
    source:
      type: state
      default: null
  llm_profile:
    type: string
    description: >
      Advisory LLM profile name injected by the refinement engine when the
      active workflow_sequence requires stronger reasoning (conceptual_replan
      or full_rebuild). Maps to a named profile in ai.json llm_profiles.
      Null for patch, design, and feature routes. Advisory only — the
      workflow runner consumes this when a consumer is wired up.
    source:
      type: state
      default: null
  interview_complete:
    type: boolean
    description: True when ValueInterviewAgent signals completion (NEXT).
    source:
      type: state
      default: false
      triggers:
      - type: agent_text
        agent: ValueInterviewAgent
        ui_hidden: true
        match:
          equals: NEXT
  concept_presented:
    type: boolean
    description: True once GapAnalysisAgent has persisted and surfaced the ConceptBlueprint artifact.
    source:
      type: state
      default: false

# ============================================================================
# COMPUTED - Values set by tools/agents
# ============================================================================
  concept_blueprint:
    type: object
    description: The structured Concept Blueprint created by GapAnalysisAgent and saved via save_value_manifest.
    source:
      type: computed
      default: null
  feature_decomposition:
    type: object
    description: Semantic feature decomposition produced by GapAnalysisAgent for downstream build planning context.
    source:
      type: computed
      default: null
  concept_overview:
    type: string
    description: The 6-12 sentence concept overview usable by downstream workflows (AgentGenerator, AppGenerator).
    source:
      type: computed
      default: null
  api_endpoints:
    type: array
    description: List of API endpoints extracted from the concept blueprint.
    source:
      type: computed
      default: []
  generation_status:
    type: object
    description: Status of multi-pass feature generation (features_total, features_completed, current_feature, errors).
    source:
      type: computed
      default: null
  build_plan:
    type: object
    description: Capability-pack-aware build decomposition derived from the approved concept.
    source:
      type: computed
      default: null
  capability_packs:
    type: array
    description: Canonical capability packs currently selected for the concept.
    source:
      type: computed
      default: []
  surface_candidate_hints:
    type: array
    description: Coarse realization hints carried from the approved concept into downstream planning.
    source:
      type: computed
      default: []
  build_registry_id:
    type: string
    description: ID of the hosted product build or app registry record created at pipeline start.
    source:
      type: computed
      default: null
  chat_app_id:
    type: string
    description: >
      Runtime app id under which the active workflow chat was created. Preserved
      separately from the generated build app_id so the Apps directory can route
      back to the correct persisted workflow chat.
    source:
      type: computed
      default: null

# ============================================================================
# AGENT VARIABLE INJECTION
# ============================================================================
agents:
  ValueInterviewAgent:
    variables:
    - platform_user_email
    - app_type
    - context_aware
    - monetization_enabled
    - build_mode
    - workflow_sequence
    - revision_scope
    - change_request_id
    - revision_id
    - artifact_kind
    - artifact_version_id
    - sequence_status
    - revision_origin_workflow
    - refinement_request
    - refinement_request_meta
    - screen
    - change_intent
    - impact_set
    - pivot_description
    - existing_concept_ref
    - preserve_families
    - previous_brand_ref
    - llm_profile
    - interview_complete
  ResearchAgent:
    variables:
    - build_mode
    - workflow_sequence
    - revision_scope
    - change_request_id
    - revision_id
    - artifact_kind
    - artifact_version_id
    - sequence_status
    - revision_origin_workflow
    - refinement_request
    - refinement_request_meta
    - change_intent
    - impact_set
    - pivot_description
    - existing_concept_ref
    - preserve_families
    - previous_brand_ref
    - llm_profile
    - interview_complete
    - concept_presented
    - app_type
  GapAnalysisAgent:
    variables:
    - build_mode
    - workflow_sequence
    - revision_scope
    - change_request_id
    - revision_id
    - artifact_kind
    - artifact_version_id
    - sequence_status
    - revision_origin_workflow
    - refinement_request
    - refinement_request_meta
    - change_intent
    - impact_set
    - pivot_description
    - existing_concept_ref
    - preserve_families
    - previous_brand_ref
    - llm_profile
    - concept_presented
    - concept_blueprint
    - concept_overview
    - api_endpoints
    - feature_decomposition
    - generation_status
    - app_type
