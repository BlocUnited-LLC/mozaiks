prompt_middleware:
- agent: all
  filename: ../_shared/brownfield_adoption_context.py
  function: inject_brownfield_adoption_context
# The interview cannot recommend what it does not know exists. This puts the
# real buildable catalog (packs, archetypes, domain priors, revenue models) in
# scope on every turn so proposals name things the generator actually builds.
- agent: ValueInterviewAgent
  filename: tools/hook_buildable_menu_context.py
  function: inject_buildable_menu_context
