# ExistingAppDiscovery Context Variables
#
# before_chat deterministic preload populates evidence first.
# Then the conversational stages confirm:
# 1. product identity + existing experience
# 2. current capabilities + service/route surfaces
# 3. Mozaiks adoption plan + migration_complexity
# 4. module decomposition (ecosystem/native_migration only)
# 5. canonical artifact assembly

definitions:
  app_type:
    type: string
    description: Always "brownfield_app" for this workflow unless explicitly overridden by a trigger.
    source:
      type: state
      default: "brownfield_app"

  host_app_source:
    type: string
    description: >
      Workflow-owned source selector derived from explicit discovery inputs or
      trigger_meta.option_id.
      `workspace_app` means preload the current workspace's known local app repo;
      `external_app` means bring-your-own app discovery.
    source:
      type: state
      default: "external_app"

  discovery_inputs:
    type: object
    description: >
      Optional seeded discovery inputs. Supported keys: repo_path, github_repo,
      github_ref, frontend_repo_path, backend_repo_path, frontend_github_repo,
      backend_github_repo, backend_base_url, openapi_url, uploaded_openapi_path,
      discovery_mode, host_app_source.
    source:
      type: state
      default: {}

  discovery_mode:
    type: string
    description: Guided or advanced discovery mode.
    source:
      type: state
      default: "guided"

  repo_path:
    type: string
    description: Optional absolute local repo path for deterministic scan.
    source:
      type: state
      default: null

  frontend_repo_path:
    type: string
    description: Optional absolute local frontend repo path for deterministic scan.
    source:
      type: state
      default: null

  backend_repo_path:
    type: string
    description: Optional absolute local backend repo path for deterministic scan.
    source:
      type: state
      default: null

  github_repo:
    type: string
    description: Optional GitHub repo in owner/repo format.
    source:
      type: state
      default: null

  frontend_github_repo:
    type: string
    description: Optional frontend GitHub repo in owner/repo format.
    source:
      type: state
      default: null

  backend_github_repo:
    type: string
    description: Optional backend GitHub repo in owner/repo format.
    source:
      type: state
      default: null

  github_ref:
    type: string
    description: Optional GitHub branch, tag, or commit for repo scan.
    source:
      type: state
      default: null

  backend_base_url:
    type: string
    description: Optional backend base URL used for health and OpenAPI probes.
    source:
      type: state
      default: null

  openapi_url:
    type: string
    description: Optional explicit OpenAPI or Swagger URL.
    source:
      type: state
      default: null

  uploaded_openapi_path:
    type: string
    description: Optional local file path to an uploaded OpenAPI spec.
    source:
      type: state
      default: null

  preloaded_context_ready:
    type: boolean
    description: True when before_chat loaded any deterministic evidence.
    source:
      type: state
      default: false

  preload_status:
    type: string
    description: "before_chat preload result: none, partial, or ready."
    source:
      type: state
      default: "none"

  preload_summary:
    type: string
    description: Human-readable summary of evidence preloaded before agents start.
    source:
      type: state
      default: null

  theme_capture_ready:
    type: boolean
    description: True when deterministic theme evidence was captured for the host frontend.
    source:
      type: state
      default: false

  theme_capture_status:
    type: string
    description: "Theme evidence status: none, partial, or ready."
    source:
      type: state
      default: "none"

  theme_capture_summary:
    type: string
    description: Human-readable summary of captured host brand tokens and layout cues.
    source:
      type: state
      default: null

  theme_capture_evidence:
    type: object
    description: Structured host-brand evidence captured for Mozaiks-owned surfaces.
    source:
      type: state
      default: {}

  evidence_sources:
    type: object
    description: Deterministic evidence sources used before chat.
    source:
      type: state
      default: []

  repo_summary:
    type: object
    description: Combined high-level repo scan summary across the discovered source repos.
    source:
      type: state
      default: {}

  frontend_repo_summary:
    type: object
    description: Structured frontend repo scan summary.
    source:
      type: state
      default: {}

  backend_repo_summary:
    type: object
    description: Structured backend repo scan summary.
    source:
      type: state
      default: {}

  api_inventory:
    type: object
    description: Structured API inventory loaded from OpenAPI or swagger discovery.
    source:
      type: state
      default: {}

  runtime_observations:
    type: object
    description: Health probe and runtime reachability observations.
    source:
      type: state
      default: {}

  auth_hypothesis:
    type: object
    description: Auth model inferred from deterministic evidence.
    source:
      type: state
      default: {}

  unresolved_questions:
    type: object
    description: Gaps the collector could not determine.
    source:
      type: state
      default: []

  # ---------------------------------------------------------------------------
  # Storage and connector detection signals (set by before_chat preload)
  # ---------------------------------------------------------------------------

  storage_pattern:
    type: string
    description: >
      Detected storage mechanism: mongodb, sql, file_store, redis, or unknown.
      Set by before_chat from package manifests and source patterns.
    source:
      type: state
      default: "unknown"

  storage_migration_required:
    type: boolean
    description: >
      True when the detected storage pattern (file_store, unknown) would require
      migration to MongoDB for a native Mozaiks module to own the data.
    source:
      type: state
      default: false

  detected_connectors:
    type: object
    description: >
      List of ConnectorSpec objects detected from package manifests and source imports.
      Each item has: provider_id, package_or_import, category, confidence,
      source_files, likely_secret_envs, mozaiks_adapter_exists.
    source:
      type: state
      default: []

  mozaiks_vocabulary_detected:
    type: boolean
    description: >
      True when Mozaiks-specific vocabulary (contractKind, module-action,
      workflow-preparation) is found in the repo source — indicating the app
      was built with awareness of Mozaiks patterns.
    source:
      type: state
      default: false

  mozaiks_authored_app:
    type: boolean
    description: >
      True when strong structural signals confirm the app was built using
      Mozaiks authoring patterns (module.yaml, contracts/, backend/ layout).
      Implies native_migration or ecosystem is the natural adoption path.
    source:
      type: state
      default: false

  # ---------------------------------------------------------------------------
  # Identity stage
  # ---------------------------------------------------------------------------

  app_name:
    type: string
    description: Name of the existing application.
    source:
      type: state
      default: null

  app_description:
    type: string
    description: One or two sentence description of what the app does.
    source:
      type: state
      default: null

  app_url:
    type: string
    description: Primary URL or environment.
    source:
      type: state
      default: null

  tech_stack:
    type: string
    description: Main languages and frameworks the app uses.
    source:
      type: state
      default: null

  hosting_environment:
    type: string
    description: Where the app is hosted.
    source:
      type: state
      default: null

  team_context:
    type: string
    description: Who built and maintains the app.
    source:
      type: state
      default: null

  existing_experience_summary:
    type: string
    description: Current route/module/user experience summary.
    source:
      type: state
      default: null

  identity_complete:
    type: boolean
    description: True once DiscoveryHostAgent confirms identity + current experience.
    source:
      type: state
      default: false
      triggers:
        - type: agent_text
          agent: DiscoveryHostAgent
          ui_hidden: true
          match:
            equals: NEXT

  # ---------------------------------------------------------------------------
  # Capability stage
  # ---------------------------------------------------------------------------

  capabilities:
    type: object
    description: Existing product capabilities identified during discovery.
    source:
      type: state
      default: []

  api_surface:
    type: string
    description: Type and rough scope of the backend/API surface.
    source:
      type: state
      default: null

  api_docs_available:
    type: boolean
    description: Whether OpenAPI/Swagger/Postman documentation exists.
    source:
      type: state
      default: false

  auth_model:
    type: string
    description: How the host app authenticates users today.
    source:
      type: state
      default: null

  key_entities:
    type: object
    description: Main data entities already present in the host app.
    source:
      type: state
      default: []

  has_existing_integrations:
    type: boolean
    description: Whether the app already integrates with other services.
    source:
      type: state
      default: false

  service_surfaces:
    type: object
    description: Existing backend-facing surfaces such as APIs, hubs, or workers.
    source:
      type: state
      default: []

  route_surfaces:
    type: object
    description: Existing frontend routes or route modules relevant to adoption.
    source:
      type: state
      default: []

  agent_ready_capabilities:
    type: object
    description: Capability ids that are technically ready for agent access.
    source:
      type: state
      default: []

  capabilities_complete:
    type: boolean
    description: True once CapabilityMapperAgent confirms the capability map.
    source:
      type: state
      default: false
      triggers:
        - type: agent_text
          agent: CapabilityMapperAgent
          ui_hidden: true
          match:
            equals: NEXT

  # ---------------------------------------------------------------------------
  # Integration planning stage
  # ---------------------------------------------------------------------------

  adoption_level:
    type: string
    description: Recommended adoption level - embed, bridge, ecosystem, or native_migration.
    source:
      type: state
      default: null

  migration_complexity:
    type: string
    description: >
      Migration effort estimate set by IntegrationPlannerAgent.
      Values: none, low, moderate, full_rewrite, unknown.
      none: embed only, no porting. low: Python/FastAPI + MongoDB, direct port.
      moderate: partial stack difference or storage migration required.
      full_rewrite: non-Python backend must be rewritten as FastAPI modules.
    source:
      type: state
      default: null

  ui_surface_preference:
    type: string
    description: Where the Mozaiks UI should live in the host app.
    source:
      type: state
      default: null

  ai_accessible_capabilities:
    type: object
    description: Capability ids approved for initial AI access.
    source:
      type: state
      default: []

  auth_delegation_model:
    type: string
    description: How Mozaiks authenticates against the host backend.
    source:
      type: state
      default: null

  initial_workflows:
    type: object
    description: Initial workflows or agentic experiences to attach first.
    source:
      type: state
      default: []

  ecosystem_bindings:
    type: object
    description: Mozaiks ecosystem modules to connect now or next.
    source:
      type: state
      default: []

  repo_access_willingness:
    type: string
    description: Whether repo access is available now, later, or not at all.
    source:
      type: state
      default: "later"

  adoption_rationale:
    type: string
    description: Why the selected adoption level is the right first move.
    source:
      type: state
      default: null

  theme_adaptation_strategy:
    type: string
    description: How Mozaiks-owned surfaces should inherit or adopt the host brand.
    source:
      type: state
      default: null

  embed_theme_ready:
    type: boolean
    description: True when enough brand token evidence exists to style a Mozaiks embed.
    source:
      type: state
      default: false

  plan_complete:
    type: boolean
    description: True once IntegrationPlannerAgent confirms the adoption plan.
    source:
      type: state
      default: false
      triggers:
        - type: agent_text
          agent: IntegrationPlannerAgent
          ui_hidden: true
          match:
            equals: NEXT

  # ---------------------------------------------------------------------------
  # Module decomposition stage (ecosystem / native_migration only)
  # ---------------------------------------------------------------------------

  module_decomposition_plan:
    type: string
    description: >
      Serialized JSON string containing the ModuleDecompositionPlan produced by
      ModuleDecomposerAgent. Null for embed and bridge adoption levels.
      Consumed by DiscoveryArtifactAssemblerAgent and written to disk by
      save_existing_app_artifacts when adoption_level is ecosystem or native_migration.
    source:
      type: state
      default: null

  decomposition_complete:
    type: boolean
    description: True once ModuleDecomposerAgent confirms the decomposition plan.
    source:
      type: state
      default: false
      triggers:
        - type: agent_text
          agent: ModuleDecomposerAgent
          ui_hidden: true
          match:
            equals: NEXT

  # ---------------------------------------------------------------------------
  # Artifact output
  # ---------------------------------------------------------------------------

  existing_product_spec:
    type: object
    description: Canonical host product artifact persisted after discovery.
    source:
      type: state
      default: null

  capability_specs:
    type: object
    description: Canonical existing capability artifacts persisted after discovery.
    source:
      type: state
      default: []

  agent_augmentation_plan:
    type: object
    description: Canonical Mozaiks adoption/augmentation plan persisted after discovery.
    source:
      type: state
      default: null

  existing_app_discovery_artifact:
    type: object
    description: Full structured discovery artifact produced by DiscoveryArtifactAssemblerAgent.
    source:
      type: state
      default: null

agents:
  DiscoveryHostAgent:
    variables:
      - app_type
      - discovery_inputs
      - host_app_source
      - discovery_mode
      - repo_path
      - frontend_repo_path
      - backend_repo_path
      - github_repo
      - frontend_github_repo
      - backend_github_repo
      - github_ref
      - backend_base_url
      - openapi_url
      - uploaded_openapi_path
      - preloaded_context_ready
      - preload_status
      - preload_summary
      - theme_capture_ready
      - theme_capture_status
      - theme_capture_summary
      - theme_capture_evidence
      - evidence_sources
      - repo_summary
      - frontend_repo_summary
      - backend_repo_summary
      - api_inventory
      - runtime_observations
      - auth_hypothesis
      - unresolved_questions
      - storage_pattern
      - storage_migration_required
      - detected_connectors
      - mozaiks_vocabulary_detected
      - mozaiks_authored_app
      - app_name
      - app_description
      - app_url
      - tech_stack
      - hosting_environment
      - team_context
      - existing_experience_summary
      - identity_complete

  CapabilityMapperAgent:
    variables:
      - app_name
      - app_description
      - tech_stack
      - discovery_mode
      - existing_experience_summary
      - preload_status
      - preload_summary
      - evidence_sources
      - repo_summary
      - frontend_repo_summary
      - backend_repo_summary
      - api_inventory
      - runtime_observations
      - auth_hypothesis
      - unresolved_questions
      - storage_pattern
      - detected_connectors
      - mozaiks_vocabulary_detected
      - mozaiks_authored_app
      - capabilities
      - api_surface
      - api_docs_available
      - auth_model
      - key_entities
      - has_existing_integrations
      - service_surfaces
      - route_surfaces
      - agent_ready_capabilities
      - capabilities_complete

  IntegrationPlannerAgent:
    variables:
      - app_name
      - app_description
      - tech_stack
      - host_app_source
      - discovery_mode
      - theme_capture_ready
      - theme_capture_status
      - theme_capture_summary
      - theme_capture_evidence
      - storage_pattern
      - storage_migration_required
      - detected_connectors
      - mozaiks_vocabulary_detected
      - mozaiks_authored_app
      - capabilities
      - service_surfaces
      - route_surfaces
      - agent_ready_capabilities
      - api_surface
      - auth_model
      - unresolved_questions
      - adoption_level
      - migration_complexity
      - ui_surface_preference
      - ai_accessible_capabilities
      - auth_delegation_model
      - initial_workflows
      - ecosystem_bindings
      - repo_access_willingness
      - adoption_rationale
      - theme_adaptation_strategy
      - embed_theme_ready
      - plan_complete

  ModuleDecomposerAgent:
    variables:
      - app_name
      - app_description
      - tech_stack
      - hosting_environment
      - capabilities
      - service_surfaces
      - route_surfaces
      - key_entities
      - auth_model
      - api_surface
      - adoption_level
      - migration_complexity
      - storage_pattern
      - storage_migration_required
      - detected_connectors
      - mozaiks_vocabulary_detected
      - mozaiks_authored_app
      - module_decomposition_plan
      - decomposition_complete

  DiscoveryArtifactAssemblerAgent:
    variables:
      - discovery_inputs
      - host_app_source
      - discovery_mode
      - evidence_sources
      - preload_status
      - preload_summary
      - theme_capture_ready
      - theme_capture_status
      - theme_capture_summary
      - theme_capture_evidence
      - repo_summary
      - frontend_repo_summary
      - backend_repo_summary
      - api_inventory
      - runtime_observations
      - auth_hypothesis
      - unresolved_questions
      - storage_pattern
      - storage_migration_required
      - detected_connectors
      - mozaiks_vocabulary_detected
      - mozaiks_authored_app
      - app_name
      - app_description
      - app_url
      - tech_stack
      - hosting_environment
      - team_context
      - existing_experience_summary
      - capabilities
      - api_surface
      - api_docs_available
      - auth_model
      - key_entities
      - has_existing_integrations
      - service_surfaces
      - route_surfaces
      - agent_ready_capabilities
      - adoption_level
      - migration_complexity
      - ui_surface_preference
      - ai_accessible_capabilities
      - auth_delegation_model
      - initial_workflows
      - ecosystem_bindings
      - repo_access_willingness
      - adoption_rationale
      - theme_adaptation_strategy
      - embed_theme_ready
      - module_decomposition_plan
      - existing_product_spec
      - capability_specs
      - agent_augmentation_plan
      - existing_app_discovery_artifact
