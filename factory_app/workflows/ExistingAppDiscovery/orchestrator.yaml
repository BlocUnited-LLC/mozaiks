# ExistingAppDiscovery Workflow Orchestrator
# Entry point for brownfield-app adopters who already have an application
# and want to integrate it with Mozaiks.
#
# Flow: DiscoveryHostAgent → CapabilityMapperAgent → IntegrationPlannerAgent
#       → DiscoveryArtifactAssemblerAgent (structured output → auto-tool → UI artifact)
#
# Gate context: receives { app_type: "brownfield_app" } from the app_type_selector transition.

workflow_name: ExistingAppDiscovery
max_turns: 40
human_in_the_loop: true
workflow_startup_mode: AgentDriven
orchestration_pattern: DefaultPattern
initial_message_to_user: null
initial_message:
  You are part of the Mozaiks existing-app discovery process. DiscoveryHostAgent,
  welcome the user and begin gathering information about their existing application.
initial_agent: DiscoveryHostAgent
runtime_extensions:
  - kind: lifecycle_hooks
    entrypoint: workflows.AppGenerator.tools.platform.build_lifecycle:get_hooks
