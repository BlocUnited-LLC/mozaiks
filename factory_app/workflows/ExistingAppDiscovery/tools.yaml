# ExistingAppDiscovery Tools
#
# before_chat collector builds deterministic App Intelligence context.
# Indexing progress is streamed as chat activity, then ExistingAppDiscovery emits
# its workflow-owned AppIntelligenceOverviewCard in the artifact panel so users
# can review the source-backed context agents receive before the agent speaks.
# DiscoveryArtifactAssemblerAgent later persists canonical artifacts and emits
# the final DiscoveryBriefCard.

tools:
- agent: DiscoveryHostAgent
  file: source_context_retrieval.py
  function: get_preloaded_app_intelligence
  description: >
    Load the compact App Intelligence catalog for the preloaded source context,
    including architecture, capability, ownership, integration, data, risk, and
    agent-context policy summaries. Use this before requesting exact files.
  tool_type: Agent_Tool
  auto_tool_call: false
- agent: DiscoveryHostAgent
  file: source_context_retrieval.py
  function: search_preloaded_source_context
  description: >
    Search the preloaded source corpus for exact code chunks, file paths,
    symbols, and evidence relevant to a product or technical question. Use this
    when the compact preload summary is insufficient.
  tool_type: Agent_Tool
  auto_tool_call: false
- agent: DiscoveryHostAgent
  file: source_context_retrieval.py
  function: read_preloaded_source_file
  description: >
    Read one indexed source file from the preloaded source corpus. Use only
    after selecting a path from app_intelligence_catalog, source_context_catalog, context_graph_pack, or
    search_preloaded_source_context.
  tool_type: Agent_Tool
  auto_tool_call: false
- agent: CapabilityMapperAgent
  file: source_context_retrieval.py
  function: get_preloaded_app_intelligence
  description: >
    Load compact App Intelligence before mapping current capabilities to exact
    code evidence.
  tool_type: Agent_Tool
  auto_tool_call: false
- agent: CapabilityMapperAgent
  file: source_context_retrieval.py
  function: search_preloaded_source_context
  description: >
    Search the preloaded source corpus for exact code chunks, file paths,
    symbols, and evidence relevant to existing app capabilities.
  tool_type: Agent_Tool
  auto_tool_call: false
- agent: CapabilityMapperAgent
  file: source_context_retrieval.py
  function: read_preloaded_source_file
  description: >
    Read one indexed source file from the preloaded source corpus when mapping
    current capabilities to source evidence.
  tool_type: Agent_Tool
  auto_tool_call: false
- agent: IntegrationPlannerAgent
  file: source_context_retrieval.py
  function: get_preloaded_app_intelligence
  description: >
    Load compact App Intelligence before planning overlays, adapters,
    modernization, or workflow build handoffs.
  tool_type: Agent_Tool
  auto_tool_call: false
- agent: IntegrationPlannerAgent
  file: source_context_retrieval.py
  function: search_preloaded_source_context
  description: >
    Search source code evidence before recommending adoption level, bridge,
    overlay, adapter, or gradual modernization work.
  tool_type: Agent_Tool
  auto_tool_call: false
- agent: IntegrationPlannerAgent
  file: source_context_retrieval.py
  function: read_preloaded_source_file
  description: >
    Read one indexed source file when adoption planning depends on exact code
    evidence.
  tool_type: Agent_Tool
  auto_tool_call: false
- agent: ModuleDecomposerAgent
  file: source_context_retrieval.py
  function: get_preloaded_app_intelligence
  description: >
    Load compact App Intelligence before proposing module, page, adapter, or
    workflow boundaries.
  tool_type: Agent_Tool
  auto_tool_call: false
- agent: ModuleDecomposerAgent
  file: source_context_retrieval.py
  function: search_preloaded_source_context
  description: >
    Search exact source chunks before proposing candidate overlays, adapters,
    or migrated surfaces.
  tool_type: Agent_Tool
  auto_tool_call: false
- agent: ModuleDecomposerAgent
  file: source_context_retrieval.py
  function: read_preloaded_source_file
  description: >
    Read one indexed source file when decomposition depends on exact source
    boundaries.
  tool_type: Agent_Tool
  auto_tool_call: false
- agent: ModuleDecomposerAgent
  file: source_context_retrieval.py
  function: get_related_preloaded_source_files
  description: >
    List source files related to a selected path through relative imports or
    same-directory proximity.
  tool_type: Agent_Tool
  auto_tool_call: false
- agent: DiscoveryArtifactAssemblerAgent
  file: save_existing_app_artifacts.py
  function: save_existing_app_artifacts
  description: >
    Auto-invoked after DiscoveryArtifactAssemblerAgent outputs the structured
    existing-app augmentation artifact. Persists the artifact set and emits a
    UI summary for the user to review.
  tool_type: UI_Surface
  auto_tool_call: true
  ui:
    component: DiscoveryBriefCard
    mode: artifact
    workflow_primitive: document_preview
    realization: generated_component

lifecycle_tools:
- trigger: before_chat
  agent: null
  file: preload_discovery_context.py
  function: collect_prechat_discovery_context
  description: >
    Deterministically preload discovery context from explicit inputs such as
    repo_path, github_repo, backend_base_url, openapi_url, or uploaded spec paths.
- trigger: before_chat
  agent: null
  file: emit_app_intelligence_overview.py
  function: emit_repo_access_recovery_card
  description: >
    Show an inline recovery card when the supplied GitHub repository requires
    account or token access before App Intelligence can index it.
  tool_type: UI_Surface
  ui:
    component: RepoAccessRecoveryCard
    mode: inline
    workflow_primitive: document_preview
    realization: generated_component
- trigger: on_start
  agent: null
  file: ../_shared/platform/build_lifecycle.py
  function: emit_build_started
  description: Notify platform build tracking when workflow run starts.
  tool_type: Agent_Tool
- trigger: on_complete
  agent: null
  file: ../_shared/platform/build_lifecycle.py
  function: emit_build_completed
  description: Notify platform build tracking when workflow run completes.
  tool_type: Agent_Tool
- trigger: on_fail
  agent: null
  file: ../_shared/platform/build_lifecycle.py
  function: emit_build_failed
  description: Notify platform build tracking when workflow run fails.
  tool_type: Agent_Tool
