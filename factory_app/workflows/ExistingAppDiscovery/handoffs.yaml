# ExistingAppDiscovery Handoff Rules
#
# Pipeline:
#   Host → Mapper → Planner → (ecosystem/native_migration) ModuleDecomposer → Assembler → user
#                           → (embed/bridge) Assembler → user
#
# Each conversational agent reverts to user between turns,
# then advances to the next agent when their phase is complete.

handoff_rules:

# ---------------------------------------------------------------------------
# DiscoveryHostAgent
# ---------------------------------------------------------------------------
- source_agent: DiscoveryHostAgent
  target_agent: user
  handoff_type: after_work
  transition_target: RevertToUserTarget

- source_agent: DiscoveryHostAgent
  target_agent: CapabilityMapperAgent
  handoff_type: condition
  condition_type: expression
  condition: ${identity_complete} == True
  transition_target: AgentTarget

# ---------------------------------------------------------------------------
# CapabilityMapperAgent
# ---------------------------------------------------------------------------
- source_agent: CapabilityMapperAgent
  target_agent: user
  handoff_type: after_work
  transition_target: RevertToUserTarget

- source_agent: CapabilityMapperAgent
  target_agent: IntegrationPlannerAgent
  handoff_type: condition
  condition_type: expression
  condition: ${capabilities_complete} == True
  transition_target: AgentTarget

# ---------------------------------------------------------------------------
# IntegrationPlannerAgent
# ---------------------------------------------------------------------------
- source_agent: IntegrationPlannerAgent
  target_agent: user
  handoff_type: after_work
  transition_target: RevertToUserTarget

# ecosystem or native_migration → ModuleDecomposerAgent for capability decomposition
- source_agent: IntegrationPlannerAgent
  target_agent: ModuleDecomposerAgent
  handoff_type: condition
  condition_type: expression
  condition: ${plan_complete} == True and ${adoption_level} in ["ecosystem", "native_migration"]
  transition_target: AgentTarget

# embed or bridge → skip decomposition, go straight to assembler
- source_agent: IntegrationPlannerAgent
  target_agent: DiscoveryArtifactAssemblerAgent
  handoff_type: condition
  condition_type: expression
  condition: ${plan_complete} == True and ${adoption_level} in ["embed", "bridge"]
  transition_target: AgentTarget

# ---------------------------------------------------------------------------
# ModuleDecomposerAgent (ecosystem / native_migration only)
# ---------------------------------------------------------------------------
- source_agent: ModuleDecomposerAgent
  target_agent: user
  handoff_type: after_work
  transition_target: RevertToUserTarget

- source_agent: ModuleDecomposerAgent
  target_agent: DiscoveryArtifactAssemblerAgent
  handoff_type: condition
  condition_type: expression
  condition: ${decomposition_complete} == True
  transition_target: AgentTarget

# ---------------------------------------------------------------------------
# DiscoveryArtifactAssemblerAgent
# ---------------------------------------------------------------------------
- source_agent: DiscoveryArtifactAssemblerAgent
  target_agent: user
  handoff_type: after_work
  transition_target: RevertToUserTarget

# ---------------------------------------------------------------------------
# User revision routes
# ---------------------------------------------------------------------------

# Back to identity
- source_agent: user
  target_agent: DiscoveryHostAgent
  handoff_type: condition
  condition_type: string_llm
  condition: >
    When the user wants to change their app details, go back to the
    beginning, start over, or correct something about the app identity.
  transition_target: AgentTarget

# Back to capability mapping
- source_agent: user
  target_agent: CapabilityMapperAgent
  handoff_type: condition
  condition_type: string_llm
  condition: >
    When the user wants to change capability mappings, add or remove
    features, or update their API or entity information.
  transition_target: AgentTarget

# Back to integration planning
- source_agent: user
  target_agent: IntegrationPlannerAgent
  handoff_type: condition
  condition_type: string_llm
  condition: >
    When the user wants to change the integration level, update which
    capabilities are AI-accessible, or revise auth delegation settings.
  transition_target: AgentTarget

# Back to module decomposition (only relevant for ecosystem/native_migration)
- source_agent: user
  target_agent: ModuleDecomposerAgent
  handoff_type: condition
  condition_type: string_llm
  condition: >
    When the user wants to revise the module decomposition plan, adjust
    module boundaries, change proposed workflows, update adapter ownership,
    or modify the implementation phases.
  transition_target: AgentTarget

# Artifact approved → terminate
- source_agent: user
  target_agent: terminate
  handoff_type: condition
  condition_type: string_llm
  condition: >
    When the user approves the discovery artifact, says the adoption plan
    looks good, confirms they are satisfied, or thanks the team without requesting changes.
  transition_target: TerminateTarget
