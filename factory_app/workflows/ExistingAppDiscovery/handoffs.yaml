# ExistingAppDiscovery Handoff Rules
#
# Pipeline:
#   Host → Mapper → Planner → (ecosystem/gradual_modernization) ModuleDecomposer → Assembler → user
#                           → (embed/bridge) Assembler → user
#
# Each conversational agent reverts to user between turns,
# then advances to the next agent when their phase is complete.

handoff_rules:

# ---------------------------------------------------------------------------
# DiscoveryHostAgent
# ---------------------------------------------------------------------------
- source_agent: DiscoveryHostAgent
  target_agent: user
  handoff_type: after_work
  transition_target: RevertToUserTarget

- source_agent: DiscoveryHostAgent
  target_agent: CapabilityMapperAgent
  handoff_type: condition
  condition_type: expression
  condition: ${identity_complete} == True
  transition_target: AgentTarget

# ---------------------------------------------------------------------------
# CapabilityMapperAgent
# ---------------------------------------------------------------------------
- source_agent: CapabilityMapperAgent
  target_agent: user
  handoff_type: after_work
  transition_target: RevertToUserTarget

- source_agent: CapabilityMapperAgent
  target_agent: IntegrationPlannerAgent
  handoff_type: condition
  condition_type: expression
  condition: ${capabilities_complete} == True
  transition_target: AgentTarget

# ---------------------------------------------------------------------------
# IntegrationPlannerAgent
# ---------------------------------------------------------------------------
- source_agent: IntegrationPlannerAgent
  target_agent: user
  handoff_type: after_work
  transition_target: RevertToUserTarget

# ecosystem or gradual_modernization → ModuleDecomposerAgent for capability decomposition
- source_agent: IntegrationPlannerAgent
  target_agent: ModuleDecomposerAgent
  handoff_type: condition
  condition_type: expression
  condition: ${plan_complete} == True and ${adoption_level} in ["ecosystem", "gradual_modernization"]
  transition_target: AgentTarget

# embed or bridge → skip decomposition, go straight to assembler
- source_agent: IntegrationPlannerAgent
  target_agent: DiscoveryArtifactAssemblerAgent
  handoff_type: condition
  condition_type: expression
  condition: ${plan_complete} == True and ${adoption_level} in ["embed", "bridge"]
  transition_target: AgentTarget

# ---------------------------------------------------------------------------
# ModuleDecomposerAgent (ecosystem / gradual_modernization only)
# ---------------------------------------------------------------------------
- source_agent: ModuleDecomposerAgent
  target_agent: user
  handoff_type: after_work
  transition_target: RevertToUserTarget

- source_agent: ModuleDecomposerAgent
  target_agent: DiscoveryArtifactAssemblerAgent
  handoff_type: condition
  condition_type: expression
  condition: ${decomposition_complete} == True
  transition_target: AgentTarget

# ---------------------------------------------------------------------------
# DiscoveryArtifactAssemblerAgent
# ---------------------------------------------------------------------------
- source_agent: DiscoveryArtifactAssemblerAgent
  target_agent: user
  handoff_type: after_work
  transition_target: RevertToUserTarget

