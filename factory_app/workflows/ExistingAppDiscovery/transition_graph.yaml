# ExistingAppDiscovery Handoff Rules
#
# Pipeline:
#   Host -> Mapper -> Planner -> (ecosystem/gradual_modernization) ModuleDecomposer -> Assembler -> user
#                         -> (embed/bridge) Assembler -> user

transition_rules:
# ---------------------------------------------------------------------------
# DiscoveryHostAgent
# ---------------------------------------------------------------------------
- source_agent: DiscoveryHostAgent
  target_agent: user
  transition_type: after_turn
  transition_target: RevertToUserTarget

- source_agent: DiscoveryHostAgent
  target_agent: CapabilityMapperAgent
  transition_type: condition
  condition_type: context_equals
  condition_key: identity_complete
  condition_value: true
  transition_target: AgentTarget

# ---------------------------------------------------------------------------
# CapabilityMapperAgent
# ---------------------------------------------------------------------------
- source_agent: CapabilityMapperAgent
  target_agent: user
  transition_type: after_turn
  transition_target: RevertToUserTarget

- source_agent: CapabilityMapperAgent
  target_agent: IntegrationPlannerAgent
  transition_type: condition
  condition_type: context_equals
  condition_key: capabilities_complete
  condition_value: true
  transition_target: AgentTarget

# ---------------------------------------------------------------------------
# IntegrationPlannerAgent
# ---------------------------------------------------------------------------
- source_agent: IntegrationPlannerAgent
  target_agent: user
  transition_type: after_turn
  transition_target: RevertToUserTarget

- source_agent: IntegrationPlannerAgent
  target_agent: ModuleDecomposerAgent
  transition_type: condition
  condition_type: context_equals
  condition_key: adoption_level
  condition_value: ecosystem
  transition_target: AgentTarget

- source_agent: IntegrationPlannerAgent
  target_agent: ModuleDecomposerAgent
  transition_type: condition
  condition_type: context_equals
  condition_key: adoption_level
  condition_value: gradual_modernization
  transition_target: AgentTarget

- source_agent: IntegrationPlannerAgent
  target_agent: DiscoveryArtifactAssemblerAgent
  transition_type: condition
  condition_type: context_equals
  condition_key: adoption_level
  condition_value: embed
  transition_target: AgentTarget

- source_agent: IntegrationPlannerAgent
  target_agent: DiscoveryArtifactAssemblerAgent
  transition_type: condition
  condition_type: context_equals
  condition_key: adoption_level
  condition_value: bridge
  transition_target: AgentTarget

# ---------------------------------------------------------------------------
# ModuleDecomposerAgent
# ---------------------------------------------------------------------------
- source_agent: ModuleDecomposerAgent
  target_agent: user
  transition_type: after_turn
  transition_target: RevertToUserTarget

- source_agent: ModuleDecomposerAgent
  target_agent: DiscoveryArtifactAssemblerAgent
  transition_type: condition
  condition_type: context_equals
  condition_key: decomposition_complete
  condition_value: true
  transition_target: AgentTarget

# ---------------------------------------------------------------------------
# DiscoveryArtifactAssemblerAgent
# ---------------------------------------------------------------------------
- source_agent: DiscoveryArtifactAssemblerAgent
  target_agent: user
  transition_type: after_turn
  transition_target: RevertToUserTarget

# ---------------------------------------------------------------------------
# User resume routes
# ---------------------------------------------------------------------------
# Every stage above reverts to the user, but the graph declared no user-source
# rule, so a builder reply matched nothing and closed the run on the
# no_transition_matched default — now treated as failure, making this workflow
# impossible to complete. Rule order is priority, so these resume the pipeline
# at the earliest stage that has not reported complete.
- source_agent: user
  target_agent: DiscoveryHostAgent
  transition_type: condition
  condition_type: context_equals
  condition_key: identity_complete
  condition_value: false
  transition_target: AgentTarget

- source_agent: user
  target_agent: CapabilityMapperAgent
  transition_type: condition
  condition_type: context_equals
  condition_key: capabilities_complete
  condition_value: false
  transition_target: AgentTarget

- source_agent: user
  target_agent: IntegrationPlannerAgent
  transition_type: condition
  condition_type: context_equals
  condition_key: plan_complete
  condition_value: false
  transition_target: AgentTarget

# Tail fallback: planning is done, so the builder is answering the decomposer
# or the assembler. KNOWN COARSE EDGE: on the ecosystem /
# gradual_modernization paths a reply sent while ModuleDecomposerAgent is still
# working resumes at the assembler instead of the decomposer, because
# decomposition_complete is also false on the embed/bridge paths (where the
# decomposer never runs) and context_equals cannot test two keys. Routing the
# tail to the decomposer would mis-route embed/bridge instead. Resolving this
# properly needs a decomposer-specific resume signal; until then the run
# completes rather than failing outright.
- source_agent: user
  target_agent: DiscoveryArtifactAssemblerAgent
  transition_type: after_turn
  transition_target: AgentTarget
