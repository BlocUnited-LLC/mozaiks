workflow_name: AgentGenerator
max_turns: 25
human_in_the_loop: true
workflow_startup_mode: AgentDriven
orchestration_pattern: DefaultPattern
initial_message_to_user: null
initial_message: You are part of a collaborative effort to generate a multi-agent
  workflow per AG2 (formerly autogen). InterviewAgent, greet the user and ask your
  first clarifying question.
initial_agent: InterviewAgent
runtime_extensions:
  - kind: lifecycle_hooks
    entrypoint: workflows.AppGenerator.tools.platform.build_lifecycle:get_hooks
