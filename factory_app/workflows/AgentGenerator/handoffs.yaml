handoff_rules:
- source_agent: user
  target_agent: InterviewAgent
  handoff_type: condition
  condition_type: expression
  condition_scope: null
  condition: ${interview_complete} == False
  transition_target: AgentTarget

- source_agent: InterviewAgent
  target_agent: user
  handoff_type: after_work
  condition_type: null
  condition_scope: null
  condition: null
  transition_target: RevertToUserTarget

- source_agent: InterviewAgent
  target_agent: PatternAgent
  handoff_type: condition
  condition_type: expression
  condition_scope: null
  condition: ${interview_complete} == True
  transition_target: AgentTarget

- source_agent: PatternAgent
  target_agent: ProjectOverviewAgent
  handoff_type: after_work
  condition_type: null
  condition_scope: null
  condition: null
  transition_target: AgentTarget

- source_agent: ProjectOverviewAgent
  target_agent: user
  handoff_type: after_work
  condition_type: null
  condition_scope: null
  condition: null
  transition_target: RevertToUserTarget

- source_agent: user
  target_agent: PackBuildCoordinator
  handoff_type: condition
  condition_type: expression
  condition_scope: pre
  condition: ${workflow_review_approved} == True
  transition_target: AgentTarget

- source_agent: user
  target_agent: PatternAgent
  handoff_type: condition
  condition_type: expression
  condition_scope: pre
  condition: ${workflow_review_revision_requested} == True
  transition_target: AgentTarget

- source_agent: PackBuildCoordinator
  target_agent: PackMetadataAgent
  handoff_type: after_work
  condition_type: null
  condition_scope: null
  condition: null
  transition_target: AgentTarget

- source_agent: PackMetadataAgent
  target_agent: DownloadAgent
  handoff_type: after_work
  condition_type: null
  condition_scope: null
  condition: null
  transition_target: AgentTarget

- source_agent: DownloadAgent
  target_agent: user
  handoff_type: after_work
  condition_type: null
  condition_scope: null
  condition: null
  transition_target: RevertToUserTarget
