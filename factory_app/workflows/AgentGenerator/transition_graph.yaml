transition_rules:
# The runtime compiler prioritizes conditional rules before unconditional
# after_turn fallbacks while preserving YAML order within each group.
- source_agent: InterviewAgent
  target_agent: user
  transition_type: after_turn
  transition_target: RevertToUserTarget

- source_agent: PatternAgent
  target_agent: ProjectOverviewAgent
  transition_type: after_turn
  transition_target: AgentTarget

- source_agent: ProjectOverviewAgent
  target_agent: user
  transition_type: after_turn
  transition_target: RevertToUserTarget

# Conditional rules win over same-source after_turn fallbacks when their context matches.
- source_agent: InterviewAgent
  target_agent: PatternAgent
  transition_type: condition
  condition_type: context_equals
  condition_key: interview_complete
  condition_value: true
  transition_target: AgentTarget

- source_agent: user
  target_agent: InterviewAgent
  transition_type: condition
  condition_type: context_equals
  condition_key: interview_complete
  condition_value: false
  transition_target: AgentTarget

- source_agent: user
  target_agent: PackBuildCoordinator
  transition_type: condition
  condition_type: context_equals
  condition_key: workflow_review_approved
  condition_value: true
  transition_target: AgentTarget

- source_agent: user
  target_agent: PatternAgent
  transition_type: condition
  condition_type: context_equals
  condition_key: workflow_review_revision_requested
  condition_value: true
  transition_target: AgentTarget

# Fallback: a review-phase reply that matched neither the approval nor the
# revision trigger re-engages the review agent instead of falling through the
# graph (observed live: an unmatched approval reply terminated the run as
# no_transition_matched and silently skipped the entire generation stage).
- source_agent: user
  target_agent: ProjectOverviewAgent
  transition_type: after_turn
  transition_target: AgentTarget

- source_agent: PackBuildCoordinator
  target_agent: PackMetadataAgent
  transition_type: after_turn
  transition_target: AgentTarget

- source_agent: PackMetadataAgent
  target_agent: DownloadAgent
  transition_type: after_turn
  transition_target: AgentTarget

- source_agent: DownloadAgent
  target_agent: user
  transition_type: after_turn
  transition_target: RevertToUserTarget

- source_agent: DownloadAgent
  target_agent: PackBuildCoordinator
  transition_type: condition
  condition_type: context_equals
  condition_key: workflow_bundle_export_outcome
  condition_value: needs_revision
  transition_target: AgentTarget

# A ready export is the workflow's finished state: terminate so the build
# journey advances to AppGenerator. (Previously this reverted to the user and
# the only way the run ever "completed" was the no_transition_matched
# fallthrough, which the runtime now treats as failure.)
- source_agent: DownloadAgent
  target_agent: terminate
  transition_type: condition
  condition_type: context_equals
  condition_key: workflow_bundle_export_outcome
  condition_value: ready
  transition_target: TerminateTarget
  termination_reason: workflow_complete

- source_agent: DownloadAgent
  target_agent: user
  transition_type: condition
  condition_type: context_equals
  condition_key: workflow_bundle_export_outcome
  condition_value: cancelled

- source_agent: DownloadAgent
  target_agent: user
  transition_type: condition
  condition_type: context_equals
  condition_key: workflow_bundle_export_outcome
  condition_value: blocked

