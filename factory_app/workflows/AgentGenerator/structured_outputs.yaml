models:
  AgentTool:
    type: model
    fields:
      name:
        type: str
        description: Tool function name (snake_case). The actual callable that the
          agent invokes.
      integration:
        type: union
        variants:
        - str
        - 'null'
        description: 'Third-party service this tool interacts with (PascalCase).
          Examples: ''Stripe'', ''Slack'', ''OpenAI'', ''GitHub''. Use null for
          tools that don''t require external API calls.'
      purpose:
        type: str
        description: Brief explanation of what this tool does and why the agent
          needs it (<=140 chars).
      interaction_mode:
        type: literal
        values:
        - inline
        - artifact
        - none
        description: 'Interaction surface for this tool: inline (chat-embedded),
          artifact (side panel or tray), none (backend-only or silent).'
  LifecycleTool:
    type: model
    fields:
      name:
        type: str
        description: Lifecycle tool function name (snake_case). The actual callable
          that executes the lifecycle operation.
      integration:
        type: union
        variants:
        - str
        - 'null'
        description: Third-party service this lifecycle tool interacts with (PascalCase).
          Use null for internal-only operations.
      purpose:
        type: str
        description: Brief explanation of what this lifecycle operation does (<=140
          chars).
      trigger:
        type: literal
        values:
        - before_agent
        - after_agent
        description: When this lifecycle operation executes relative to the agent's
          main work.
  SystemHook:
    type: model
    fields:
      name:
        type: str
        description: Hook function name (snake_case). The actual callable that executes
          the hook logic.
      agent:
        type: union
        variants:
        - str
        - 'null'
        description: Agent name this hook applies to. Use null for global hooks.
      trigger:
        type: literal
        values:
        - process_message_before_send
        - update_agent_state
        - process_last_received_message
        - process_all_messages_before_reply
        description: The AG2 hook trigger point.
      purpose:
        type: str
        description: Brief explanation of why this hook is needed (<=140 chars).
  WorkflowAgent:
    type: model
    fields:
      agent_name:
        type: str
        description: Agent identifier (unique within the workflow)
      objective:
        type: str
        description: Short human-readable description of the agent's responsibilities
          (displayed in the UI).
      agent_tools:
        type: list
        items: AgentTool
        description: Agent-specific tools this agent can call. Each tool specifies
          name, integration, and purpose. Use [] when no agent tools are required.
      lifecycle_tools:
        type: list
        items: LifecycleTool
        description: Lifecycle operation tools this agent executes. Each tool specifies
          name, integration, purpose, and trigger timing. Use [] when no lifecycle
          tools are required.
      system_hooks:
        type: list
        items: SystemHook
        description: System hooks this agent uses for runtime behavior modification.
          Each hook specifies name, trigger, and purpose. Use [] when no system
          hooks are required.
      human_interaction:
        type: literal
        values:
        - none
        - context
        - approval
        - feedback
        - single
        description: Human involvement mode for THIS SPECIFIC AGENT. none = fully
          automated execution; context = conversational data collection or clarification;
          approval = explicit sign-off/decision gate; feedback = non-UI iterative
          refinement; single = one-shot invocation.
      generation_mode:
        type: union
        variants:
        - str
        - 'null'
        description: 'Generation mode for generator agents: allowed values text,
          image, video, audio. Use null for non-generator agents.'
  MermaidSequenceDiagram:
    type: model
    fields:
      workflow_name:
        type: str
        description: Workflow name this diagram represents
      diagram:
        type: str
        description: Complete Mermaid sequence diagram text, beginning with 'sequenceDiagram'.
          Must include required blank line after participant declarations.
      legend:
        type: list
        items: str
        description: 'Optional module legend entries (M1: Module Name). Provide
          [] when no legend is required.'
      notes:
        type: union
        variants:
        - str
        - 'null'
        description: Optional notes shown below the diagram.
      agent_message:
        type: str
        description: Concise invitation (<=140 chars) asking the user to review the diagram.
  DerivedTriggerMatch:
    type: model
    fields:
      equals:
        type: union
        variants:
        - str
        - 'null'
        description: Exact string match required for the trigger (agent_text only).
      contains:
        type: union
        variants:
        - str
        - 'null'
        description: Substring match evaluated against emitted agent text (agent_text
          only).
      regex:
        type: union
        variants:
        - str
        - 'null'
        description: Regular expression applied to emitted agent text (agent_text
          only).
  DerivedTrigger:
    type: model
    fields:
      type:
        type: literal
        values:
        - agent_text
        - user_text
        - ui_response
        description: 'Trigger mode: agent_text (passive detection), user_text
          (free-form composer reply), or ui_response (active UI tool response).'
      agent:
        type: union
        variants:
        - str
        - 'null'
        description: Agent whose output is monitored (required when type=agent_text).
      match:
        type: union
        variants:
        - DerivedTriggerMatch
        - 'null'
        description: Match conditions for agent_text and user_text triggers. Must
          be omitted for ui_response triggers.
      tool:
        type: union
        variants:
        - str
        - 'null'
        description: Snake_case tool name responsible for updating the variable
          (required when type=ui_response).
      response_key:
        type: union
        variants:
        - str
        - 'null'
        description: Key in the UI tool response payload whose value seeds the state
          variable (required when type=ui_response).
      ui_hidden:
        type: union
        variants:
        - bool
        - 'null'
        description: Whether to hide the agent's text output from the user UI (agent_text
          triggers only). True = hide token (e.g. NEXT), False = show message.
  ContextVariableSource:
    type: model
    fields:
      type:
        type: literal
        values:
        - config
        - data_reference
        - data_entity
        - computed
        - state
        - external
        description: 'Source classification: config (deployment configuration from
          env vars), data_reference (read existing MongoDB data), data_entity (create
          new MongoDB data), computed (business logic outputs), state (workflow
          orchestration state with triggers), external (third-party API data with
          caching/retry).'
      env_var:
        type: union
        variants:
        - str
        - 'null'
        description: Environment variable name (config sources only, UPPER_SNAKE_CASE).
      default:
        type: union
        variants:
        - str
        - int
        - bool
        - 'null'
        description: Fallback value when the source is unavailable (config, computed,
          state sources).
      required:
        type: union
        variants:
        - bool
        - 'null'
        description: Whether this config variable is required (config sources only).
      database_name:
        type: union
        variants:
        - str
        - 'null'
        description: Mongo database name (data_reference and data_entity sources
          only).
      collection:
        type: union
        variants:
        - str
        - 'null'
        description: Mongo collection name (data_reference and data_entity sources
          only).
      query_template:
        type: union
        variants:
        - dict
        - 'null'
        description: MongoDB query template with ${var} placeholders (data_reference
          sources only).
      fields:
        type: union
        variants:
        - list
        - 'null'
        description: List of fields to extract from query result (data_reference
          sources only).
      refresh_strategy:
        type: union
        variants:
        - str
        - 'null'
        description: 'When to refresh data: ''once'' (cache indefinitely), ''per_module''
          (refresh each module), ''on_demand'' (refresh when requested). Data_reference
          sources only.'
      entity_schema:
        type: union
        variants:
        - dict
        - 'null'
        description: JSON schema for the entity structure (data_entity sources only). The runtime writes this as `schema` in context_variables.yaml.
      indexes:
        type: union
        variants:
        - list
        - 'null'
        description: MongoDB index definitions for this entity (data_entity sources
          only).
      write_strategy:
        type: union
        variants:
        - str
        - 'null'
        description: 'When to persist entity: ''immediate'' (on creation), ''on_module_transition'',
          ''on_workflow_end''. Data_entity sources only.'
      search_by:
        type: union
        variants:
        - str
        - 'null'
        description: Field used to locate/update the entity (data_entity sources
          only).
      computation:
        type: union
        variants:
        - str
        - 'null'
        description: Description of the computation logic (computed sources only).
      inputs:
        type: union
        variants:
        - list
        - 'null'
        description: List of input variable names required for computation (computed
          sources only).
      output_type:
        type: union
        variants:
        - str
        - 'null'
        description: Expected output data type (computed sources only).
      persist_to:
        type: union
        variants:
        - dict
        - 'null'
        description: Optional MongoDB persistence config (computed sources only).
      persist:
        type: union
        variants:
        - bool
        - 'null'
        description: Whether to persist state across sessions (state sources only).
      service:
        type: union
        variants:
        - str
        - 'null'
        description: Third-party service name (external sources only, e.g., 'Stripe',
          'OpenAI').
      operation:
        type: union
        variants:
        - str
        - 'null'
        description: API operation or endpoint (external sources only).
      params:
        type: union
        variants:
        - dict
        - 'null'
        description: API request parameters with ${var} placeholders (external sources
          only).
      auth:
        type: union
        variants:
        - dict
        - 'null'
        description: Authentication configuration (external sources only).
      cache:
        type: union
        variants:
        - dict
        - 'null'
        description: Cache configuration with TTL (external sources only).
      retry:
        type: union
        variants:
        - dict
        - 'null'
        description: Retry policy for failed requests (external sources only).
      triggers:
        type: list
        items: DerivedTrigger
        description: Trigger definitions for state sources. Use agent_text for coordination
          tokens, user_text for plain composer replies, and ui_response for UI tool
          responses. Use [] for non-state types.
        default: []
  ContextVariableDefinitionEntry:
    type: model
    fields:
      name:
        type: str
        description: Unique snake_case variable name.
      type:
        type: union
        variants:
        - str
        - 'null'
        description: Canonical data type for downstream casting (string|integer|boolean
          etc.).
      description:
        type: union
        variants:
        - str
        - 'null'
        description: Human readable description explaining the variable purpose.
      source:
        type: ContextVariableSource
        description: Source metadata describing where the value originates.
  ContextVariableAgentExposure:
    type: model
    fields:
      agent:
        type: str
        description: Agent name receiving these variables.
      variables:
        type: list
        items: str
        description: Variables exposed to the agent (empty list permitted).
        default: []
  ContextVariablesPlan:
    type: model
    fields:
      definitions:
        type: list
        items: ContextVariableDefinitionEntry
        description: Ordered list of context variable definitions (each entry includes
          name, type, description, and source metadata).
      agents:
        type: list
        items: ContextVariableAgentExposure
        description: Agent exposure entries describing which variables are visible
          to each agent.
  WorkflowRenderablePrimitiveId:
    type: literal
    values:
    - approval_card
    - choice_picker
    - confirmation_summary
    - form_card
    - record_picker
    - file_upload_prompt
    - diff_review
    - action_plan_review
    - artifact_workbench
    - document_preview
    - download_center
    - comparison_board
    - diagram_viewer
    - table_review
  WorkflowUIPrimitiveId:
    type: literal
    values:
    - composer_reply
    - approval_card
    - choice_picker
    - confirmation_summary
    - form_card
    - record_picker
    - file_upload_prompt
    - diff_review
    - action_plan_review
    - artifact_workbench
    - document_preview
    - download_center
    - comparison_board
    - diagram_viewer
    - table_review
  WorkflowUIRealizationId:
    type: literal
    values:
    - shell_builtin
    - shipped_component
    - workflow_wrapper
    - generated_component
  UIConfig:
    type: model
    fields:
      component:
        type: union
        variants:
        - str
        - 'null'
        description: React component name (UI_Tool and UI_Surface only)
      mode:
        type: literal
        values:
        - inline
        - artifact
        description: Placement hint for ChatUI. Mirrors the existing tools.yaml
          schema (inline vs artifact). Optional; omit to fall back to runtime defaults.
      workflow_primitive:
        type: union
        variants:
        - WorkflowRenderablePrimitiveId
        - 'null'
        description: Canonical workflow UI primitive pattern selected upstream. Null for non-UI tools.
      realization:
        type: union
        variants:
        - WorkflowUIRealizationId
        - 'null'
        description: >
          Realization strategy for this UI surface. Use `shipped_component` when `component`
          is the canonical shared workflow component, `workflow_wrapper` when a workflow-local
          wrapper sits on top of a shipped component, `generated_component` for true workflow-local
          custom React, and `shell_builtin` only for planning-time `composer_reply`.
  UIToolAction:
    type: model
    fields:
      id:
        type: str
        description: Stable action id emitted by the UI component (e.g., approve, reject, submit).
      label:
        type: union
        variants:
        - str
        - 'null'
        description: Optional button label for shipped shared workflow components. If omitted, runtime derives a label from `id`.
      description:
        type: union
        variants:
        - str
        - 'null'
        description: Optional description of what this action represents.
      variant:
        type: union
        variants:
        - str
        - 'null'
        description: Optional button variant hint (for example primary, secondary, outline, ghost, danger).
      approved:
        type: union
        variants:
        - bool
        - 'null'
        description: Optional approval semantic used by approval-style shared primitives.
      payload_schema:
        type: dict
        description: JSON-schema-like object describing expected payload shape for this action.
  UIToolContract:
    type: model
    fields:
      surface_kind:
        type: literal
        values:
        - agent_tool
        description: UI surface family. UI_Tool entries must use agent_tool.
      payload_schema:
        type: dict
        description: JSON-schema-like object describing the payload pushed from backend tool to UI component.
      actions_schema:
        type: list
        items: UIToolAction
        description: Allowed user actions emitted from the UI component back to the runtime.
  ToolSpec:
    type: model
    fields:
      agent:
        type: str
        description: Owning agent (or primary agent)
      file:
        type: str
        description: Workflow-local Python module file name declared by the tool contract. Do not emit shared or undeclared helper paths.
      function:
        type: str
        description: Async function inside the file
      description:
        type: str
        description: Tool purpose (<=140 chars, no secrets)
      tool_type:
        type: literal
        values:
        - UI_Tool
        - UI_Surface
        - Agent_Tool
        description: Tool type. UI_Tool = interactive surface, UI_Surface = one-way surface, Agent_Tool = backend-only.
      auto_tool_call:
        type: union
        variants:
        - bool
        - 'null'
        description: 'Controls whether tool is automatically invoked when agent
          produces structured output. Default: true for UI_Tool/UI_Surface, false
          for Agent_Tool. Set true for Agent_Tools whose structured output must
          be stored in context for downstream agents to access. Omit (null) to use defaults.'
      ui:
        type: UIConfig
        description: UI metadata (component + mode). Omit or set null for Agent_Tool entries.
      ui_contract:
        type: union
        variants:
        - UIToolContract
        - 'null'
        description: Canonical interactive UI tool contract. Required for UI_Tool entries; null for UI_Surface and Agent_Tool entries. This is the bounded customization surface between Python and React.
  LifecycleToolSpec:
    type: model
    fields:
      trigger:
        type: literal
        values:
        - before_chat
        - after_chat
        - before_agent
        - after_agent
        - on_start
        - on_complete
        - on_fail
        description: |
          Lifecycle boundary where the hook executes.
          Turn-level: before_chat, after_chat (chat scope); before_agent, after_agent (agent scope).
          Run-level: on_start, on_complete, on_fail (fired once per workflow run, agent must be null).
      agent:
        type: union
        variants:
        - str
        - 'null'
        description: Agent name when the lifecycle tool is scoped to a single agent;
          null for chat-level hooks.
      file:
        type: str
        description: Python module file name
      function:
        type: str
        description: Async function inside the file
      description:
        type: str
        description: Lifecycle purpose (<=140 chars, no secrets)
      tool_type:
        type: literal
        values:
        - UI_Tool
        - UI_Surface
        - Agent_Tool
        description: Classification for parity with runtime loader.
      ui:
        type: UIConfig
        description: Optional UI metadata when lifecycle operations surface a UI_Tool
          or UI_Surface (matches tools.yaml).
  HookFile:
    type: model
    fields:
      filename:
        type: str
        description: Workflow-local hook file name (e.g., validate_budget.py, audit_decisions.py). Hooks are file-backed contract stubs, not freeform extras.
      hook_type:
        type: literal
        values:
        - before_chat
        - after_chat
        - update_agent_state
        - process_message_before_send
        - process_last_received_message
        - process_all_messages_before_reply
        description: Lifecycle or system hook type
      py_content:
        type: str
        description: Complete Python code for hook function
  PromptSection:
    type: model
    description: Content container for a single prompt section (id + heading + text)
    fields:
      id:
        type: str
        description: Section identifier (role, objective, context, instructions,
          examples, output_format)
      heading:
        type: str
        description: Section heading as displayed in system message (UPPERCASE with
          [BRACKETS])
      content:
        type: str
        description: Section text content
  AgentDefinition:
    type: model
    fields:
      name:
        type: str
        description: Agent variable name
      display_name:
        type: str
        description: Agent display name
      prompt_sections:
        type: list
        items: PromptSection
        description: Agent-specific prompt sections (ordered list). Runtime hook_universal_prompts.py
          injects universal sections (compliance, guidelines, runtime context) at
          agent instantiation.
      max_consecutive_auto_reply:
        type: int
        default: 10
      structured_outputs_required:
        type: bool
        description: True when the agent must produce structured outputs (Pydantic
          model enforced); false otherwise.
  HandoffRule:
    type: model
    fields:
      source_agent:
        type: str
        description: Source agent name
      target_agent:
        type: str
        description: Target agent name or 'user' or 'terminate'
      handoff_type:
        type: literal
        values:
        - condition
        - after_work
        description: 'Type of handoff: ''condition'' for immediate evaluation (context
          or LLM-based), ''after_work'' for post-agent-completion evaluation'
      condition:
        type: union
        variants:
        - str
        - 'null'
        description: 'Condition text: null for unconditional after_work, expression
          string with ${var} for context conditions, natural language for LLM conditions'
      condition_type:
        type: union
        variants:
        - str
        - 'null'
        description: 'Condition evaluation method: ''expression'' for context variable
          expressions (${...}), ''string_llm'' for LLM natural language evaluation,
          null to auto-detect (${} triggers expression, else LLM)'
      condition_scope:
        type: union
        variants:
        - str
        - 'null'
        description: 'Evaluation timing for context conditions: ''pre'' for pre-reply
          evaluation (re-checks every turn, ideal for UI interactions), null for
          default (Post-Reply). NEVER use ''after''.'
      transition_target:
        type: literal
        values:
        - AgentTarget
        - RevertToUserTarget
        - TerminateTarget
        description: Type of transition target
  StructuredModelField:
    type: model
    fields:
      name:
        type: str
        description: Field name
      type:
        type: str
        description: Field type (str|int|bool|list|union with variants)
      description:
        type: str
        description: What this field represents
  StructuredModelDefinition:
    type: model
    fields:
      model_name:
        type: str
        description: Name of the model
      fields:
        type: list
        items: StructuredModelField
  AgentRegistryEntry:
    type: model
    fields:
      agent:
        type: str
        description: Agent name
      agent_definition:
        type: union
        variants:
        - str
        - 'null'
        description: Model name for this agent, or null if no structured output
          applies
  WorkflowStage:
    type: model
    fields:
      stage_name:
        type: str
        description: 'Workflow stage name in format ''Stage N: Strategic Purpose'''
      stage_index:
        type: int
        description: Zero-based index of this workflow stage (0 = Stage 1, 1 = Stage 2,
          etc.)
      stage_description:
        type: str
        description: Strategic description of what happens in this workflow stage and why
      pattern_id:
        type: int
        description: AG2 pattern ID (1-9) aligned to this workflow stage.
      pattern_name:
        type: str
        description: Human-readable AG2 pattern name aligned to this workflow stage.
      agents_needed:
        type: list
        items: str
        description: Agent names this workflow stage requires (guidance list; full specs
          defined in StageAgents).
  WorkflowDecompositionContracts:
    type: model
    fields:
      input_required:
        type: list
        items: str
        description: Context fields that MUST already exist before the workflow
          can fan out child runs.
      input_optional:
        type: list
        items: str
        description: Helpful but non-blocking context fields the decomposition
          planner may read.
      output_required:
        type: list
        items: str
        description: Keys that every child result MUST expose so fan-in can resume
          deterministically.
      output_optional:
        type: list
        items: str
        description: Additional child-result keys that may be present but are not
          required by fan-in.
  WorkflowDecomposition:
    type: model
    fields:
      required:
        type: bool
        description: Whether this workflow needs workflow-local parallel decomposition.
      mode:
        type: literal
        values:
        - none
        - single_stage_mfj
        description: Decomposition topology. Use `single_stage_mfj` only when one
          planner turn can fan out bounded parallel work units that later merge
          back into the same workflow.
      reason:
        type: union
        variants:
        - str
        - 'null'
        description: Why decomposition is or is not needed for this workflow.
      work_unit:
        type: union
        variants:
        - str
        - 'null'
        description: Short label for the parallel execution unit, such as task,
          lane, document, segment, or entity batch.
      decomposition_agent:
        type: union
        variants:
        - str
        - 'null'
        description: Decomposition planner agent whose structured output should trigger the MFJ.
      child_initial_agent:
        type: union
        variants:
        - str
        - 'null'
        description: Agent that should start each child run.
      resume_entry_agent:
        type: union
        variants:
        - str
        - 'null'
        description: Router agent that receives control first when the parent resumes.
      resume_agent:
        type: union
        variants:
        - str
        - 'null'
        description: Host or presenter agent that consumes merged child output after
          the resume router hands off.
      inject_as:
        type: union
        variants:
        - str
        - 'null'
        description: Parent context key where merged child results should be injected.
          Must use the `mfj_` prefix when decomposition is enabled.
      max_children:
        type: union
        variants:
        - int
        - 'null'
        description: Safe upper bound for parallel children in one fan-out cycle.
      contracts:
        type: union
        variants:
        - WorkflowDecompositionContracts
        - 'null'
        description: Runtime-facing input/output contract for the child workflow cycle.
  WorkflowInputEvent:
    type: model
    fields:
      event_type:
        type: str
        description: Event that may start or resume this workflow. App facts must be domain.* events owned by modules.
      source:
        type: literal
        values:
        - domain
        - platform
        - hosted
        - route
        - schedule
        - chat
        description: Event source family. Generic generated apps should prefer domain, route, schedule, or chat.
      capability_id:
        type: union
        variants:
        - str
        - 'null'
        description: Capability id that resolves to this workflow/action. Required for domain-event workflow reactions when known.
      description:
        type: str
        description: Why this event should invoke or influence the workflow.
  WorkflowModuleActionUse:
    type: model
    fields:
      capability_id:
        type: str
        description: Module capability id the workflow calls to read or mutate durable app state.
      module_id:
        type: str
        description: Module that owns the action.
      action_id:
        type: str
        description: Module action id.
      purpose:
        type: str
        description: Why the workflow needs this module action.
      commits_state:
        type: bool
        description: True when the action mutates durable app state and therefore owns any resulting domain.* event.
  WorkflowEmittedEvent:
    type: model
    fields:
      event_type:
        type: str
        description: Workflow/runtime/UI event emitted by this workflow. Must not be domain.* for generic apps.
      namespace:
        type: literal
        values:
        - workflow
        - runtime
        - ui
        - artifact
        description: Event namespace owned by the workflow/runtime/UI boundary.
      description:
        type: str
        description: What this event communicates.
  WorkflowEventBoundary:
    type: model
    fields:
      input_events:
        type: list
        items: WorkflowInputEvent
        description: Events or routes that may start/resume this workflow. Use [] for pure user-started chat.
      module_actions:
        type: list
        items: WorkflowModuleActionUse
        description: Module capabilities/actions this workflow calls for durable reads or writes.
      emitted_events:
        type: list
        items: WorkflowEmittedEvent
        description: Non-domain events the workflow may emit, such as workflow checkpoints, UI reactions, and artifacts.
      domain_event_rule:
        type: str
        description: Must state that workflows do not publish domain.* directly; modules publish domain.* after state commits.
  WorkflowStrategy:
    type: model
    fields:
      workflow_name:
        type: str
        description: Human-readable workflow name in Title Case With Spaces
      workflow_description:
        type: str
        description: 'Description: When [TRIGGER], workflow [ACTIONS], resulting
          in [VALUE]'
      human_in_loop:
        type: bool
        description: 'Global flag: Does this workflow involve ANY human interaction?
          (True for chat, False for fully automated background tasks)'
      pattern:
        type: list
        items: str
        description: List of AG2 orchestration patterns
      startup_mode:
        type: literal
        values:
        - UserDriven
        - AgentDriven
        - BackendOnly
        description: 'How the workflow is initiated: UserDriven (user speaks first),
          AgentDriven (system/agent speaks first with context), BackendOnly (no
          UI interaction)'
      workflow_stages:
        type: list
        items: WorkflowStage
        description: Complete workflow-stage roadmap. Must contain ALL workflow stages implied
          by the user request (minimum 3 for complex workflows). Each stage must
          have unique numbered prefix (Stage 1:, Stage 2:, etc.) in sequential
          order.
      decomposition:
        type: WorkflowDecomposition
        description: Workflow-local decomposition decision and runtime contract.
      event_boundary:
        type: WorkflowEventBoundary
        description: Explicit boundary between workflow orchestration, module-owned domain facts, UI events, and runtime events.
  CodeFile:
    type: model
    fields:
      filename:
        type: str
        description: Relative path (using forward slashes) where this file should
          be written. Generated workflow code must be workflow-local; use tools/<name>.py
          for Python tools and ui/<workflow-local-path>.jsx for workflow UI. Keep
          workflow-local React under the workflow's own ui/ tree. Do not emit
          paths containing _shared, parent traversal, sibling workflows, or
          app.workflows._shared/workflows._shared references. Every emitted file
          must satisfy a declared tool, hook, transition, or runtime-extension contract.
      content:
        type: str
        description: Complete file contents with real newlines. Do not escape code
          fences or truncate output.
      installRequirements:
        type: list
        items: str
        description: External packages required for this file. Use [] when none
          are needed.
  RequiredContextVariable:
    type: model
    fields:
      name:
        type: str
        description: Variable name (snake_case, e.g., 'routing_started', 'current_iteration')
      type:
        type: literal
        values:
        - config
        - data_reference
        - data_entity
        - computed
        - state
        - external
        description: 'Variable type: config (deployment configuration from env vars),
          data_reference (read existing MongoDB data), data_entity (create new MongoDB
          data), computed (business logic outputs), state (workflow orchestration
          state with triggers), external (third-party API data with caching/retry)'
      trigger_hint:
        type: union
        variants:
        - str
        - 'null'
        description: Simple description of when/how this variable gets set (e.g.,
          'Set when DownloadAgent completes download', 'User provides city name').
          Use null when no natural language description is available.
      purpose:
        type: str
        description: What this variable tracks and why it's needed (1-2 sentences)
  WorkflowAsset:
    type: model
    fields:
      attachment_id:
        type: union
        variants:
        - str
        - 'null'
        description: If the asset was uploaded, the attachment_id from ChatSessions.attachments;
          otherwise null. Set only when you can uniquely match the uploaded file
          by filename (case-insensitive); otherwise leave null (no guessing).
      filename:
        type: str
        description: Original filename (no paths).
      description:
        type: union
        variants:
        - str
        - 'null'
        description: Short user-provided description of what the asset is / how
          it will be used.
      usage:
        type: literal
        values:
        - context
        - bundle
        description: Whether the asset should be used as context only, or bundled
          into the generated app as a file.
      asset_type:
        type: union
        variants:
        - str
        - 'null'
        description: Optional classification (e.g., csv, pdf, image, template).
  WorkflowUIComponent:
    type: model
    fields:
      surface_kind:
        type: literal
        values:
        - agent_tool
        - transition
        description: UI surface family for this declaration. Use agent_tool for tool-driven chat UI.
        default: agent_tool
      stage_name:
        type: str
        description: Workflow stage name or label (as surfaced in the Action Plan) where
          this UI tool appears.
      agent:
        type: str
        description: PascalCase agent expected to emit the UI tool.
      tool:
        type: str
        description: Snake_case tool function name associated with the UI surface.
      label:
        type: str
        description: User-facing label or CTA text so the architect narrative can
          reference the UI affordance verbatim.
      workflow_primitive:
        type: WorkflowUIPrimitiveId
        description: >
          Canonical workflow UI primitive selected for this interaction checkpoint.
          Use `composer_reply` for plain natural-language feedback routed through the
          shell composer. Use the other values for structured workflow-local UI surfaces.
      realization:
        type: WorkflowUIRealizationId
        description: >
          Realization strategy for this checkpoint. Use `shell_builtin` for
          `composer_reply`, `shipped_component` for direct shared workflow primitives,
          `workflow_wrapper` for workflow-local wrappers over shipped primitives,
          and `generated_component` for true workflow-local custom React.
      component:
        type: union
        variants:
        - str
        - 'null'
        description: >
          PascalCase React component name. Use null for `workflow_primitive=composer_reply`.
          For shipped workflow primitives this may be the canonical shared component
          name (for example `ApprovalCard`, `FormCard`, `DiagramViewer`). Otherwise
          it is the workflow-local component UIFileGenerator produces.
      display:
        type: literal
        values:
        - composer
        - inline
        - artifact
        description: >
          Visual placement and rendering strategy.
          "composer" — shell-owned free-text reply lane using the main chat composer.
            Use for plain natural-language answers or clarifications.
          "inline" — agent-driven output rendered conversationally in the chat flow.
            Use for status updates, single stats, short confirmations, streaming text.
          "artifact" — agent-driven output rendered in a side tray or modal panel.
            Use for complex interactive UIs: approval wizards, multi-field forms,
            data tables with actions, diagrams, streaming action plans.
      primitives_hint:
        type: optional_list
        items: str
        description: >
          Platform primitives to use as building blocks inside the generated React component.
          These are pre-built components from the live shipped `chat-ui` primitive catalog.
          UIFileGenerator imports them to avoid re-implementing common UI patterns from scratch.
          Valid values are injected at runtime via `[SHIPPED UI PRIMITIVES]`; do not invent names.
          Use [] when the workflow can rely directly on a shipped shared workflow component
          and does not need a workflow-local wrapper.
      summary:
        type: str
        description: <=200 char narrative explaining what the user sees or confirms
          at this component.
  WorkflowInPack:
    type: model
    fields:
      name:
        type: str
        description: Workflow name in PascalCase (e.g., 'ITSupportBot', 'KnowledgeBase')
      initial_agent:
        type: union
        variants:
        - str
        - 'null'
        description: 'Optional runtime hint: if this workflow is spawned as a child
          GroupChat, start at this agent (maps to AG2 pattern ''initial_agent'').
          Null to use the workflow''s default initial_agent.'
        default: null
      initial_message:
        type: union
        variants:
        - str
        - 'null'
        description: 'Optional runtime hint: seed message for a child workflow run.
          Null to rely on the child''s normal startup message flow.'
        default: null
      role:
        type: literal
        values:
        - primary
        - supporting
        description: 'Role in the pack: ''primary'' is the entry point, ''supporting''
          workflows are called by primary or other workflows'
      description:
        type: str
        description: Brief description of what this workflow does (<=100 chars)
      pattern_id:
        type: int
        description: AG2 pattern ID (1-9) for this specific workflow
      pattern_name:
        type: str
        description: Human-readable pattern name for this workflow
  PatternSelection:
    type: model
    fields:
      is_multi_workflow:
        type: bool
        description: Whether this request requires multiple workflows (pack) or
          a single workflow
      resume_agent:
        type: union
        variants:
        - str
        - 'null'
        description: 'Optional runtime hint for nested execution: when child workflows
          complete, resume the parent workflow at this agent. Null to use the parent
          workflow''s declared resume_agent.'
        default: null
      decomposition_reason:
        type: union
        variants:
        - str
        - 'null'
        description: If is_multi_workflow is true, explains why decomposition is
          needed. Null for single workflows.
      pack_name:
        type: str
        description: Name for the workflow pack (Title Case, 2-4 words). Used as
          pack_name in manifest.
      workflows:
        type: list
        items: WorkflowInPack
        description: List of workflows in this pack. Single-workflow packs have
          exactly one item with role='primary'.
  PatternSelectionOutput:
    type: model
    fields:
      PatternSelection:
        type: PatternSelection
        description: Pack-aware pattern selection with decomposition decision and
          per-workflow patterns
  WorkflowStrategyOutput:
    type: model
    fields:
      WorkflowStrategy:
        type: WorkflowStrategy
        description: High-level workflow architecture
  MermaidSequenceDiagramOutput:
    type: model
    fields:
      MermaidSequenceDiagram:
        type: MermaidSequenceDiagram
        description: Diagram payload rendered for user review before approving the plan.
  DownloadRequestOutput:
    type: model
    fields:
      agent_message:
        type: str
        description: 'Concise message (≤140 chars) shown to user in download UI.
          Example: ''Ready to download your workflow bundle?'' Keep action-oriented
          and brief.'
  ToolsManifestOutput:
    type: model
    fields:
      tools:
        type: list
        items: ToolSpec
        description: List of tool entries (mirrors tools.yaml format)
      lifecycle_tools:
        type: list
        items: LifecycleToolSpec
        description: List of lifecycle tool entries (optional, can be empty array
          or omitted). Matches the current tools.yaml structure with explicit trigger
          + agent metadata.
  RuntimeAgentsOutput:
    type: model
    fields:
      agents:
        type: list
        items: AgentDefinition
  UIToolsFilesOutput:
    type: model
    fields:
      tools:
        type: list
        items: CodeFile
        description: Ordered list of UI tool files (Python async functions + React
          components) to write to disk.
  AgentToolsFilesOutput:
    type: model
    fields:
      tools:
        type: list
        items: CodeFile
        description: Ordered list of backend agent tool implementation files to
          write to disk.
  ContextVariablesPlanOutput:
    type: model
    fields:
      ContextVariablesPlan:
        type: ContextVariablesPlan
        description: Complete plan with definitions dict (all variables) and agents
          dict (exposure mappings).
  HandoffRulesOutput:
    type: model
    fields:
      handoff_rules:
        type: list
        items: HandoffRule
  StructuredModelsOutput:
    type: model
    fields:
      models:
        type: list
        items: StructuredModelDefinition
        description: Data models to capture
      registry:
        type: list
        items: AgentRegistryEntry
  OrchestrationConfigOutput:
    type: model
    fields:
      workflow_name:
        type: str
        description: Workflow identifier
      max_turns:
        type: int
        description: Maximum conversation turns
      human_in_the_loop:
        type: bool
        description: Whether human interaction is required
      startup_mode:
        type: literal
        values:
        - AgentDriven
        - UserDriven
        - BackendOnly
      orchestration_pattern:
        type: str
        default: DefaultPattern
      initial_message_to_user:
        type: union
        variants:
        - str
        - 'null'
        description: Message shown to user (UserDriven only)
      initial_message:
        type: union
        variants:
        - str
        - 'null'
        description: Initial workflow message (AgentDriven/BackendOnly)
      initial_agent:
        type: str
        description: Name of the first agent that receives control when the workflow
          starts (matches AG2 pattern 'initial_agent' parameter).
      visual_agents:
        type: optional_list
        items: str
        description: Agents permitted to render UI/text to the user (mirrors ui_config.json
          visual_agents list). Use null for backend-only/headless workflows.
      triggers:
        type: list
        items: OrchestratorTrigger
        default: []
        description: Runtime trigger declarations. Event triggers must reference canonical event types and must not invent app facts.

  OrchestratorTrigger:
    type: model
    fields:
      type:
        type: union
        variants:
        - str
        - 'null'
        description: Trigger family such as chat, event, route, action, or schedule.
      event:
        type: union
        variants:
        - str
        - 'null'
        description: Canonical event type for event-driven triggers, e.g. domain.tasks.task_created.
      capability_id:
        type: union
        variants:
        - str
        - 'null'
        description: Capability id associated with this trigger when event-driven workflow routing is capability-based.
      endpoint:
        type: union
        variants:
        - str
        - 'null'
        description: Optional route endpoint for route/API-triggered workflows.
      method:
        type: union
        variants:
        - str
        - 'null'
        description: Optional HTTP method for route-triggered workflows.
      description:
        type: union
        variants:
        - str
        - 'null'
        description: Human-readable trigger purpose.

  HookFilesOutput:
    type: model
    fields:
      hook_files:
        type: list
        items: HookFile
        description: Array of hook file objects (can be empty [] if no custom hooks
          needed)
  LifecycleRequirements:
    type: model
    fields:
      before_chat:
        type: union
        variants:
        - str
        - 'null'
        description: Name of the lifecycle hook that must run before the chat session
          starts, or null when no initialization is required.
      after_chat:
        type: union
        variants:
        - str
        - 'null'
        description: Name of the lifecycle hook that runs after the workflow completes,
          or null when no teardown is needed.
  TenancyRequirements:
    type: model
    fields:
      tenant_id:
        type: str
        description: Canonical tenant identifier name used for scoping (typically tenant_id).
      app_id:
        type: union
        variants:
        - str
        - 'null'
        description: Canonical app identifier name used for scoping (typically app_id), or null when not applicable.
      user_id:
        type: union
        variants:
        - str
        - 'null'
        description: Canonical user identifier name used for scoping (typically user_id), or null when not applicable.
      notes:
        type: union
        variants:
        - str
        - 'null'
        description: Optional notes about scoping rules and where these identifiers must appear.
  ConsistencyRequirements:
    type: model
    fields:
      scope:
        type: literal
        values:
        - session
        - user
        - app
        - tenant
        description: The intended sharing scope for stateful artifacts and data.
      consistency_profile:
        type: literal
        values:
        - realtime
        - revalidate_on_resume
        - eventual
        description: Expected cross-session consistency behavior.
      versioning_required:
        type: bool
        description: Whether shared state must be versioned (ETag/stateVersion) to detect conflicts/stale patches.
      version_field:
        type: union
        variants:
        - str
        - 'null'
        description: Name of the version field or header (e.g., stateVersion), or null when not applicable.
      fanout_required:
        type: bool
        description: Whether cross-session fanout/notification is required for correctness.
      notes:
        type: union
        variants:
        - str
        - 'null'
        description: Optional notes about invalidation/refetch behavior and failure recovery.
  AgentRoster:
    type: model
    fields:
      agents:
        type: list
        items: WorkflowAgent
        description: Ordered list of agent specifications
  ToolPlanning:
    type: model
    fields:
      agent_tools:
        type: list
        items: PlannedAgentTool
        description: List of backend/logic tools required by agents.
      lifecycle_tools:
        type: list
        items: LifecycleTool
        description: Lifecycle operation tools
      system_hooks:
        type: list
        items: SystemHook
        description: System hooks required
      ui_requirements:
        type: list
        items: WorkflowUIComponent
        description: Per-workflow-stage UI surface decisions (inline vs artifact) derived from WorkflowStrategy workflow_stages.
  DatabaseColumn:
    type: model
    fields:
      name:
        type: str
        description: Field name.
      type:
        type: literal
        values:
        - ObjectId
        - String
        - Integer
        - Boolean
        - Float
        - Double
        - Timestamp
        - Array
        - Object
        description: MongoDB/BSON type.
      itemType:
        type: union
        variants:
        - str
        - 'null'
        description: 'For Array type: the type of items (e.g., String, ObjectId).'
      constraints:
        type: optional_list
        items: str
        description: 'Constraints like PK, Not Null, Check: IN (''val1'',''val2'').'
  DatabaseCollectionConstraints:
    type: model
    fields:
      unique:
        type: optional_list
        items: str
        description: Fields that should have unique indexes.
  DatabaseCollection:
    type: model
    fields:
      name:
        type: str
        description: Collection name (lowercase, plural).
      columns:
        type: list
        items: DatabaseColumn
        description: Field definitions.
      constraints:
        type: union
        variants:
        - DatabaseCollectionConstraints
        - 'null'
        description: Collection constraints (unique indexes, etc.).
      indices:
        type: optional_list
        items: str
        description: Fields to index (non-unique).
  DatabaseIntentDefinition:
    type: model
    fields:
      collections:
        type: list
        items: DatabaseCollection
        description: Array of collection intent definitions (fields + indexes).
      access_patterns:
        type: optional_list
        items: str
        description: Query/access patterns the app expects (read/write emphasis).
  DatabaseIntentOutput:
    type: model
    description: Output for DatabaseIntentAgent (db_intent.json).
    fields:
      DatabaseIntent:
        type: DatabaseIntentDefinition
        description: Database intent (no schema/seed enforcement).
  AgentRosterOutput:
    type: model
    fields:
      AgentRoster:
        type: AgentRoster
        description: Agent Roster
  ToolPlanningOutput:
    type: model
    fields:
      ToolPlanning:
        type: ToolPlanning
        description: Tool & Hook Planning
  PlannedAgentTool:
    type: model
    fields:
      name:
        type: str
        description: Tool function name (snake_case).
      agent:
        type: str
        description: Name of the agent that uses this tool.
      integration:
        type: union
        variants:
        - str
        - 'null'
        description: Third-party service (PascalCase) or null.
      purpose:
        type: str
        description: Brief explanation of tool functionality.
      interaction_mode:
        type: literal
        values:
        - inline
        - artifact
        - none
        description: 'Interaction surface: inline (chat), artifact (panel), none
          (backend).'
  PackWorkflowEntry:
    type: model
    fields:
      name:
        type: str
        description: Workflow name (PascalCase)
      description:
        type: str
        description: Brief description of the workflow
      role:
        type: literal
        values:
        - primary
        - supporting
        description: Role in the pack
      startup_mode:
        type: literal
        values:
        - UserDriven
        - AgentDriven
        - BackendOnly
        description: How this workflow starts
  PackManifest:
    type: model
    fields:
      pack_name:
        type: str
        description: Name of the workflow pack (Title Case)
      pack_description:
        type: str
        description: Brief description of what the pack does
      version:
        type: str
        description: Semantic version (e.g., '1.0.0')
      entry_point:
        type: str
        description: Name of the primary workflow (entry point)
      workflows:
        type: list
        items: PackWorkflowEntry
        description: List of workflows in this pack
      ui_config:
        type: PackUIConfig
        description: UI configuration for workflow transitions
  PackUIConfig:
    type: model
    fields:
      show_workflow_transitions:
        type: bool
        description: Whether to show workflow transition messages to user
      transition_style:
        type: literal
        values:
        - dropdown
        - inline
        - hidden
        description: 'How to display workflow transitions: dropdown (visual stack),
          inline (text message), hidden (seamless)'
  PackGraphWorkflow:
    type: model
    fields:
      id:
        type: str
        description: Workflow id (must match workflow folder name)
      description:
        type: union
        variants:
        - str
        - 'null'
        description: Human-readable description
      dependencies:
        type: list
        items: PackGraphDependency
        description: Explicit prerequisite workflows required before this workflow can start
  PackGraphDependency:
    type: model
    fields:
      id:
        type: str
        description: Upstream workflow id
      scope:
        type: literal
        values:
        - user
        - app
        description: Scope for the prerequisite check (user or app)
        default: app
      gating:
        type: literal
        values:
        - required
        - optional
        description: Whether this dependency blocks starts or is informational only
        default: required
      reason:
        type: union
        variants:
        - str
        - 'null'
        description: Optional user-facing reason when blocked
  PackGraphJourneyStep:
    type: model
    fields:
      workflows:
        type: optional_list
        items: str
        description: One or more workflow ids that execute in this journey phase. Omit when this phase is a transition checkpoint.
      transition:
        type: union
        variants:
        - str
        - 'null'
        description: Transition id for a surfaced checkpoint phase. Omit when this phase executes workflows.
  PackGraphJourney:
    type: model
    fields:
      id:
        type: str
        description: Journey id (stable key)
      description:
        type: union
        variants:
        - str
        - 'null'
        description: Optional journey description
      steps:
        type: list
        items: PackGraphJourneyStep
        description: Ordered workflow phases for the journey
  PackGraphEntrypoint:
    type: model
    fields:
      id:
        type: str
        description: Stable shell route id for entering a workflow journey
      path:
        type: str
        description: Browser route path, starting with /
      label:
        type: str
        description: User-facing route label
      transition:
        type: union
        variants:
        - str
        - 'null'
        description: Transition id to mount at this route. Use for entry screens.
      workflow:
        type: union
        variants:
        - str
        - 'null'
        description: Workflow id to start directly from this route. Use only when no transition is required.
      sequence:
        type: union
        variants:
        - str
        - 'null'
        description: Optional workflow_sequence id this entrypoint starts.
      requiresAuth:
        type: bool
        description: Whether the route requires authentication.
      order:
        type: int
        description: Route ordering for shell navigation composition.
      meta:
        type: optional_dict
        description: Route metadata such as title.
  PackGraphTransitionOption:
    type: model
    fields:
      id:
        type: str
        description: Stable semantic option id
      route_to:
        type: union
        variants:
        - str
        - 'null'
        description: Workflow id or transition id to route to when selected. Required for all user_choice* transitions.
      sequence:
        type: union
        variants:
        - str
        - 'null'
        description: Optional workflow sequence override to bind when this option is selected.
      context_variables:
        type: optional_dict
        description: Deterministic context variables seeded when this option is selected. Keys must be declared by the target workflow context_variables.yaml.
  PackGraphShellMode:
    type: literal
    values:
    - standard
    - workspace
    - conversation
    - focused
    - immersive
    - public
  PackGraphTransitionUI:
    type: model
    fields:
      component:
        type: str
        description: Registered shell transition component key, never a file path
      mode:
        type: literal
        values:
        - screen
        description: Transition render mode
      shell_mode:
        type: union
        variants:
        - PackGraphShellMode
        - 'null'
        default: null
        description: >
          Shell chrome mode while this transition is active. Use focused for setup,
          choice, approval, and review screens unless the transition should inherit
          normal app chrome.
      props:
        type: optional_dict
        description: Optional transition presentation props consumed by the selected shell component.
  PackGraphTransition:
    type: model
    fields:
      id:
        type: str
        description: Transition id
      transition_type:
        type: literal
        values:
        - user_choice
        - user_choice_context
        - user_choice_route
        - condition
        - confirm
        - silent
        - progress_view
        - prerequisite_redirect
        description: Router transition type. Prefer user_choice_context for same-target context seeding and user_choice_route for branch routing.
      ui:
        type: union
        variants:
        - PackGraphTransitionUI
        - 'null'
        description: Required for user_choice and confirm transitions
      route_to:
        type: union
        variants:
        - str
        - 'null'
        description: Direct route target for single-route transitions only.
      sequence:
        type: union
        variants:
        - str
        - 'null'
        description: Optional workflow sequence to keep active for single-route transitions.
      options:
        type: list
        items: PackGraphTransitionOption
        description: Options for user choice transitions. Each option declares its own route_to and may seed context_variables.
  WorkflowGraph:
    type: model
    fields:
      pack_name:
        type: str
        description: Pack name
      version:
        type: literal
        values:
        - 3
        description: Pack graph schema version
      description:
        type: union
        variants:
        - str
        - 'null'
        description: Optional pack description
      workflows:
        type: list
        items: PackGraphWorkflow
        description: Informational registry of workflows included in this pack
      entrypoints:
        type: list
        items: PackGraphEntrypoint
        description: Workflow-owned shell routes that enter a transition or workflow
      workflow_sequences:
        type: list
        items: PackGraphJourney
        description: Optional workflow sequences for runtime auto-advance; not entry UI
      transitions:
        type: list
        items: PackGraphTransition
        description: Optional router-driven transition surfaces between workflow phases
  SharedContextVariable:
    type: model
    fields:
      name:
        type: str
        description: Variable name (snake_case)
      type:
        type: literal
        values:
        - state
        - config
        - data_reference
        - data_entity
        - computed
        - external
        - content
        - collection
        description: Variable type from the 6+2 type taxonomy
      owner:
        type: str
        description: Workflow that creates/owns this variable
      consumers:
        type: list
        items: str
        description: Workflows that read this variable
      description:
        type: str
        description: What this variable represents
  SharedContext:
    type: model
    fields:
      variables:
        type: list
        items: SharedContextVariable
        description: Variables shared across workflows
      refresh_strategy:
        type: literal
        values:
        - db_watch
        - polling
        - explicit
        description: How consuming workflows detect changes
      db_collection:
        type: str
        description: MongoDB collection name for shared context
  PackMetadata:
    type: model
    fields:
      workflow_graph:
        type: WorkflowGraph
        description: Pack graph config (v3 workflows + dependencies + optional workflow sequences) for extended_orchestration/extension_registry.json
  PackMetadataOutput:
    type: model
    description: Output for pack workflow graph metadata
    fields:
      PackMetadata:
        type: PackMetadata
        description: Pack metadata wrapper
  WorkflowUIQualityReviewRequest:
    type: model
    fields:
      status:
        type: literal
        values:
        - passed
        - needs_revision
        - blocked
        description: Agent's expected status hint before review_workflow_ui_quality runs.
      warnings:
        type: optional_list
        items: str
        description: Warning snapshot from context, if visible to the agent.
      revision_count:
        type: int
        description: Current revision count snapshot.
        default: 0
      max_revision_attempts:
        type: int
        description: Maximum automated UIFileGenerator revision loops before blocking.
        default: 2
      revision_request:
        type: union
        variants:
        - str
        - 'null'
        description: Current revision request snapshot, if any.
      agent_message:
        type: str
        description: Concise quality-gate message before review_workflow_ui_quality runs.

registry:
  InterviewAgent: null
  PatternAgent: PatternSelectionOutput
  WorkflowStrategyAgent: WorkflowStrategyOutput
  DatabaseIntentAgent: DatabaseIntentOutput
  AgentRosterAgent: AgentRosterOutput
  ToolPlanningAgent: ToolPlanningOutput
  ProjectOverviewAgent: MermaidSequenceDiagramOutput
  ContextVariablesAgent: ContextVariablesPlanOutput
  ToolsManagerAgent: ToolsManifestOutput
  UIFileGenerator: UIToolsFilesOutput
  WorkflowUIQualityAgent: WorkflowUIQualityReviewRequest
  AgentToolsFileGenerator: AgentToolsFilesOutput
  HookAgent: HookFilesOutput
  AgentsAgent: RuntimeAgentsOutput
  OrchestratorAgent: OrchestrationConfigOutput
  HandoffsAgent: HandoffRulesOutput
  StructuredOutputsAgent: StructuredModelsOutput
  PackMetadataAgent: PackMetadataOutput
  DownloadAgent: DownloadRequestOutput
