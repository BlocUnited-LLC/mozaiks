definitions:
  build_mode:
    type: string
    description: >
      Build mode for AgentGenerator. `initial` means generate the workflow bundle
      from scratch; `revision` means revise an existing bundle from persisted state.
    source:
      type: state
      default: initial
  task_run_mode:
    type: boolean
    description: >
      True when AgentGenerator is running as a scoped build task inside a larger
      task batch. Agents should skip user-facing interview/review behavior and
      emit only the requested structured outputs.
    source:
      type: state
      default: false
  revision_scope:
    type: string
    description: >
      Revision scope: patch | design | feature | core. Agents use this to
      calibrate scope — patch stays inside owned files, feature may widen scope,
      core reroutes earlier in the build plan.
    source:
      type: state
      default: null
  change_request_id:
    type: string
    description: Stable lineage id for the active revision request.
    source:
      type: state
      default: null
  revision_id:
    type: string
    description: Runtime-generated revision run id for the current builder revision.
    source:
      type: state
      default: null
  artifact_kind:
    type: string
    description: >
      Artifact family currently being refined, such as workflow_bundle or
      app_bundle. Seeded by the refinement control plane so AgentGenerator can
      preserve workflow-bundle-local work and detect broader cross-artifact
      reroutes.
    source:
      type: state
      default: null
  artifact_version_id:
    type: string
    description: >
      Version id of the workflow bundle artifact being refined. Null for initial
      generation runs. Agents use this to load the correct artifact version from
      persistence when build_mode is revision.
    source:
      type: state
      default: null
  sequence_status:
    type: string
    description: >
      Builder sequence state before the revision launch: in_progress |
      completed | stale | revising.
    source:
      type: state
      default: in_progress
  revision_origin_workflow:
    type: string
    description: Workflow where the revision request originated before reroute.
    source:
      type: state
      default: null
  refinement_request:
    type: string
    description: >
      Raw user-supplied refinement request text, passed through from the
      canonical RefinementRequest. Agents read this instead of re-interviewing when
      build_mode is revision.
    source:
      type: state
      default: null
  refinement_request_meta:
    type: object
    description: >
      Full typed RefinementRequest payload persisted by the control plane.
      Useful when downstream agents need artifact ids, source surface, or other
      request metadata beyond the raw refinement text.
    source:
      type: state
      default: null
  screen:
    type: string
    description: >
      Builder surface or screen identifier that launched the current refinement
      request, such as studio-create. Preserved for analytics and future
      surface-aware prompt shaping.
    source:
      type: state
      default: null
  change_intent:
    type: object
    description: >
      Typed refinement classification emitted by the control plane. Contains the
      final `revision_scope`, rationale, and layer-touch information so agents can
      understand whether the request is local, design-scoped, feature-extending,
      or concept-revising.
    source:
      type: state
      default: null
  impact_set:
    type: object
    description: >
      Typed downstream impact summary emitted by the control plane. Contains
      affected workflows, affected declarative families, restart_from, and
      rebuild/replanning flags for the current refinement request.
    source:
      type: state
      default: null
  llm_profile:
    type: string
    description: >
      Advisory LLM profile name injected by the control plane when the
      active workflow_sequence requires stronger reasoning (conceptual_replan
      or full_rebuild). Maps to a named profile in ai.json llm_profiles.
      Null for patch, design, and feature routes. Advisory only.
    source:
      type: state
      default: null
  context_graph_pack:
    type: object
    description: >
      Compact Context Graph prompt pack loaded by the before_chat lifecycle
      tool. Contains the prompt-safe graph status, relevant paths, matched
      nodes, relationship hints, warnings, and semantic annotation targets.
      This is advisory code-context intelligence, not routing or execution
      authority.
    source:
      type: state
      default: null
  context_graph_catalog:
    type: object
    description: >
      Rich machine-readable Context Graph catalog for diagnostics and tooling.
      This is intentionally distinct from context_graph_pack. Populated by
      load_context_graph_context when a current app context graph or artifact
      workspace graph is available.
    source:
      type: state
      default: null
  context_graph_status:
    type: string
    description: >
      Startup load status for Context Graph prompt packs: loaded, unavailable,
      or null when the loader has not run.
    source:
      type: state
      default: null
  context_graph_reason:
    type: string
    description: >
      Specific Context Graph load reason such as missing_app_id,
      current_app_context_graph_unavailable, or context_refresh_prior_version.
      Null when graph prompt context loaded without a special condition.
    source:
      type: state
      default: null
  context_graph_warnings:
    type: array
    description: Warnings emitted while loading Context Graph context.
    source:
      type: state
      default: []
  context_graph_health:
    type: object
    description: >
      Deterministic Context Graph load health and coverage metadata, including
      scan limits, selected file counts, parser availability, and skipped-file
      counts when a local source scan was performed.
    source:
      type: state
      default: null
  context_aware:
    type: boolean
    description: Flag indicating if the application is opensource (in which the llm
      will ask for context) or part of an existing product in which the agent will be
      seeded with initial context
    source:
      type: config
      env_var: CONTEXT_AWARE
      default: true
  concept_overview:
    type: string
    description: Main project description and overview from the database
    source:
      type: data_reference
      database_name: mozaiksai
      collection: BuilderConcepts
      query_template:
        app_id: '{{runtime.app_id}}'
      fields:
      - ConceptOverview
  concept_api_endpoints:
    type: array
    description: Optional API endpoints blueprint from the BuilderConcepts collection (produced
      by ValueEngine).
    source:
      type: data_reference
      database_name: mozaiksai
      collection: BuilderConcepts
      query_template:
        app_id: '{{runtime.app_id}}'
      fields:
      - ApiEndpoints
      default: []
  concept_blueprint:
    type: object
    description: Optional structured blueprint from the BuilderConcepts collection (produced
      by ValueEngine).
    source:
      type: data_reference
      database_name: mozaiksai
      collection: BuilderConcepts
      query_template:
        app_id: '{{runtime.app_id}}'
      fields:
      - Blueprint
      default: null
  backend_design_document:
    type: string
    description: >
      Canonical backend design doc from DesignDocs. Human-readable reference for
      workflow/event rationale and API intent.
    source:
      type: data_reference
      database_name: mozaiksai
      collection: DesignDocuments
      query_template:
        app_id: '{{runtime.app_id}}'
        kind: backend
        status: succeeded
      fields:
      - content
      default: null
  experience_spec_document:
    type: string
    description: >
      Canonical persistent UI intent document from DesignDocs (saved as
      `ui_schema`). Human-readable reference for persistent UI ownership and
      workflow touchpoints.
    source:
      type: data_reference
      database_name: mozaiksai
      collection: DesignDocuments
      query_template:
        app_id: '{{runtime.app_id}}'
        kind: ui_schema
        status: succeeded
      fields:
      - content
      default: null
  design_surface_map:
    type: object
    description: >
      Canonical typed surface realization contract persisted by DesignDocs.
      This is the primary machine-readable source for deciding which surfaces
      are workflows versus modules, control-plane concerns, integrations, or UI-only.
    source:
      type: data_reference
      database_name: mozaiksai
      collection: DesignDocuments
      query_template:
        app_id: '{{runtime.app_id}}'
        kind: backend
        status: succeeded
      fields:
      - surface_map
      default: null
  subscription_contract:
    type: object
    description: >
      Provider-neutral SubscriptionContractOutput produced by
      SubscriptionContractDesigner in the current workflow sequence, when present.
      WorkflowBundleBuilderAgent uses it to declare workflow metering surfaces
      without implementing a custom token ledger.
    source:
      type: state
      default: null
  subscription_contract_artifact:
    type: object
    description: >
      Latest persisted subscription_contract summary artifact. Used as a fallback
      when the current sequence did not carry subscription_contract in state.
    source:
      type: data_reference
      database_name: mozaiksai
      collection: ArtifactVersions
      query_template:
        app_id: '{{runtime.app_id}}'
        artifact_kind: subscription_contract
        artifact_key: subscription_contract
        lifecycle_status: current
      fields:
      - commit_metadata
      default: null
  monetization_enabled:
    type: boolean
    description: Flag indicating if monetization features are enabled
    source:
      type: config
      env_var: MONETIZATION_ENABLED
      default: false
  builder_options:
    type: object
    description: Optional app-agnostic builder UI option payload carried through workflow sequences.
    source:
      type: state
      default: null
  context_include_schema:
    type: boolean
    description: Flag indicating if database schema access is enabled for this workflow
    source:
      type: config
      env_var: CONTEXT_INCLUDE_SCHEMA
      default: false
  context_schema_db:
    type: string
    description: Name of the database this workflow has schema access to
    source:
      type: config
      env_var: CONTEXT_SCHEMA_DB
      default: null
  interview_complete:
    type: boolean
    description: True once InterviewAgent has enough context to proceed to the next
      stage
    source:
      type: state
      default: false
      triggers:
      - type: agent_text
        agent: InterviewAgent
        ui_hidden: true
        match:
          equals: NEXT
  workflow_review_approved:
    type: boolean
    description: >
      True when the user explicitly approves the ProjectOverviewAgent review step
      and wants generation to continue without further diagram changes.
    source:
      type: state
      default: false
      triggers:
      - type: user_text
        match:
          regex: (?i)\b(approved?|looks good|sequence diagram looks good|proceed with implementation)\b
  workflow_review_revision_requested:
    type: boolean
    description: >
      True when the user asks for revisions after the ProjectOverviewAgent review
      step instead of approving the current workflow design.
    source:
      type: state
      default: false
      triggers:
      - type: user_text
        match:
          regex: (?i)((sequence diagram|workflow design|agent flow|diagram).*(revise|revision|change|changes|adjust|adjustments|modify|modification|feedback|different))|((revise|revision|change|changes|adjust|adjustments|modify|modification|feedback|different).*(sequence diagram|workflow design|agent flow|diagram))
  connector_inventory:
    type: object
    description: >
      App-scoped connector inventory derived from platform-owned connector metadata.
      Summarizes which required integrations are already ready, which are metadata-only,
      and which are still missing for this workflow run.
    source:
      type: computed
      default: null
  required_connector_services:
    type: array
    description: Normalized list of third-party services required by the approved action plan.
    source:
      type: computed
      default: []
  ready_connector_services:
    type: array
    description: >
      Normalized list of required services that already have reusable connector secrets
      available to this runtime.
    source:
      type: computed
      default: []
  missing_connector_services:
    type: array
    description: >
      Normalized list of required services that still need user input or durable
      secret storage before the workflow can use them directly.
    source:
      type: computed
      default: []
  download_complete:
    type: boolean
    description: True when user accepts workflow download and completes the session.
      Triggers workflow termination.
    source:
      type: state
      default: false
      triggers:
      - type: ui_response
        tool: generate_and_download
        response_key: download_accepted
  attachments_allow_bundling:
    type: boolean
    description: Workflow-level flag. When true, attachments tagged as bundle/deliverable
      may be included in the generated deliverable. When false, uploads remain context-only.
    source:
      type: config
      env_var: AGENTGEN_ATTACHMENTS_ALLOW_BUNDLING
      default: false
  chat_attachments:
    type: array
    description: List of uploaded attachments persisted on the current ChatSessions
      document (metadata only). Used by InterviewAgent to ask whether uploads are context-only
      vs bundled, and by downstream agents to tag intent/bundle_path.
    source:
      type: data_reference
      database_name: mozaiksai
      collection: ChatSessions
      query_template:
        app_id: '{{runtime.app_id}}'
        _id: '{{runtime.chat_id}}'
      fields:
      - attachments
  is_multi_workflow:
    type: boolean
    description: True if PatternAgent determined the solution requires multiple workflows
      (a workflow pack). Set by the pattern_selection tool after PatternAgent runs.
    source:
      type: computed
      default: false
  pack_name:
    type: string
    description: Name of the workflow pack (Title Case). Set by the pattern_selection
      tool. Used for metadata generation and folder naming.
    source:
      type: computed
      default: null
  pack_partition_reason:
    type: string
    description: PatternAgent rationale for choosing a multi-workflow pack, or null
      for single-workflow generation.
    source:
      type: computed
      default: null
  workflows_spec:
    type: array
    description: >
      Array of WorkflowInPack items from PatternAgent's PatternSelection output.
      Each item includes name, role, pattern_id, pattern_name, description,
      initial_agent, and initial_message. Consumed by the task_batches.yaml executor
      to fan out WorkflowBundleBuilderAgent workers in parallel.
    source:
      type: computed
      default: []
  macro_workflow_graph:
    type: object
    description: Cross-workflow registry loaded from workflows/extended_orchestration/extension_registry.json.
      Used by PatternAgent to align workflow partition decisions with the runtime's pack
      orchestration graph.
    source:
      type: file
      path: workflows/extended_orchestration/extension_registry.json
      format: json
      default: null
  workflow_bundle_results:
    type: object
    description: >
      Dict of completed WorkflowBundleBuilderOutput entries from the task_batches.yaml
      executor. Keyed by workflow task_id (snake_case workflow name). Each value contains
      workflow_name, pattern_id, pattern_name, files[], agent_message, and task batch
      metadata (_task_id, _worker_agent, _owned_paths). Also contains a `_meta` entry
      with batch execution summary. Consumed by PackMetadataAgent and DownloadAgent.
    source:
      type: state
      default: null
  workflow_bundle_status:
    type: string
    description: >
      Status of the workflow_generation_tasks batch set by the task_batches.yaml
      executor: pending | running | completed | failed. Consumed by PackMetadataAgent
      to confirm all bundles are ready before synthesising the pack graph.
    source:
      type: state
      default: null
  workflow_bundle_validation_status:
    type: string
    description: >
      Production quality gate status set by generate_and_download. passed means
      the bundle can be packaged; failed means repair or operator review is needed.
    source:
      type: computed
      default: null
  workflow_bundle_validation_errors:
    type: array
    description: Blocking workflow bundle quality gate errors.
    source:
      type: computed
      default: []
  workflow_bundle_validation_warnings:
    type: array
    description: Non-blocking workflow bundle quality gate warnings.
    source:
      type: computed
      default: []
  workflow_bundle_quality_gate:
    type: object
    description: Full workflow bundle quality gate result from generate_and_download.
    source:
      type: computed
      default: null
  workflow_bundle_semantic_drift:
    type: object
    description: Prompt-oriented semantic drift report for generated workflow bundles.
    source:
      type: computed
      default: null
  workflow_bundle_repair_status:
    type: string
    description: >
      Bounded repair loop status for generated workflow bundles. One of
      needs_revision | merged | passed | blocked.
    source:
      type: computed
      default: null
  workflow_bundle_repair_active:
    type: boolean
    description: True while a narrowed workflow repair task batch is in progress.
    source:
      type: computed
      default: false
  workflow_bundle_repair_count:
    type: integer
    description: Number of workflow bundle repair attempts already scheduled.
    source:
      type: computed
      default: 0
  workflow_bundle_repair_max_attempts:
    type: integer
    description: Maximum automated workflow bundle repair attempts before blocking.
    source:
      type: computed
      default: 2
  workflow_bundle_repair_failed_workflows:
    type: array
    description: Workflow names selected for the current repair pass.
    source:
      type: computed
      default: []
  workflow_bundle_repair_request:
    type: string
    description: Focused repair instruction generated from quality gate failures.
    source:
      type: computed
      default: null
  workflow_bundle_repair_result:
    type: object
    description: Full repair scheduling result.
    source:
      type: computed
      default: null
  workflow_bundle_repair_base_results:
    type: object
    description: Preserved pre-repair workflow_bundle_results for merge after the repair batch completes.
    source:
      type: computed
      default: null
  workflow_bundle_repair_original_workflows_spec:
    type: array
    description: Original full workflows_spec restored after a narrowed repair batch.
    source:
      type: computed
      default: []
  workflow_bundle_repair_merge_result:
    type: object
    description: Result from merging repaired workflow outputs back into the full bundle set.
    source:
      type: computed
      default: null
  workflow_integration_metadata:
    type: object
    description: >
      Canonical normalized handoff metadata derived from generated workflow bundle
      orchestrator.yaml files. Contains contract_version, bundle_name, workflows[],
      and primary_workflow. Persisted on workflow_bundle artifacts for AppGenerator.
    source:
      type: computed
      default: null
  generated_workflow_integrations:
    type: array
    description: >
      Normalized list of generated workflow integrations. Each item carries
      workflow_name, capability_id, startup_mode, and trigger_events.
    source:
      type: computed
      default: []
  generated_workflow_name:
    type: string
    description: >
      Canonical name of the primary generated workflow selected for downstream app
      wiring. Null until workflow bundle assembly succeeds.
    source:
      type: computed
      default: null
  generated_workflow_capability_id:
    type: string
    description: >
      Stable capability id derived from the primary generated workflow name and used
      by AppGenerator when routing module reactions to workflow capabilities.
    source:
      type: computed
      default: null
  generated_workflow_startup_mode:
    type: string
    description: >
      Startup mode declared by the primary generated workflow orchestrator.
    source:
      type: computed
      default: null
  generated_workflow_trigger_events:
    type: array
    description: >
      Trigger event contracts derived from the primary generated workflow
      orchestrator triggers block.
    source:
      type: computed
      default: []

agents:
  InterviewAgent:
    variables:
    - build_mode
    - task_run_mode
    - revision_scope
    - change_request_id
    - revision_id
    - artifact_kind
    - artifact_version_id
    - sequence_status
    - revision_origin_workflow
    - refinement_request
    - refinement_request_meta
    - screen
    - change_intent
    - impact_set
    - llm_profile
    - context_aware
    - concept_overview
    - concept_api_endpoints
    - concept_blueprint
    - monetization_enabled
  PatternAgent:
    variables:
    - concept_overview
    - concept_api_endpoints
    - concept_blueprint
    - design_surface_map
    - subscription_contract
    - subscription_contract_artifact
    - backend_design_document
    - experience_spec_document
    - monetization_enabled
    - macro_workflow_graph
    - is_multi_workflow
    - pack_name
    - pack_partition_reason
    - workflows_spec
  ProjectOverviewAgent:
    variables:
    - concept_overview
    - pack_name
    - is_multi_workflow
    - pack_partition_reason
    - workflows_spec
  PackBuildCoordinator:
    variables:
    - pack_name
    - is_multi_workflow
    - workflows_spec
    - workflow_bundle_repair_status
    - workflow_bundle_repair_request
    - workflow_bundle_repair_failed_workflows
  WorkflowBundleBuilderAgent:
    variables:
    - concept_overview
    - concept_api_endpoints
    - concept_blueprint
    - design_surface_map
    - subscription_contract
    - subscription_contract_artifact
    - backend_design_document
    - experience_spec_document
    - pack_name
    - is_multi_workflow
  PackMetadataAgent:
    variables:
    - build_mode
    - revision_scope
    - change_request_id
    - revision_id
    - artifact_kind
    - artifact_version_id
    - sequence_status
    - revision_origin_workflow
    - refinement_request
    - refinement_request_meta
    - screen
    - change_intent
    - impact_set
    - is_multi_workflow
    - pack_name
    - pack_partition_reason
    - workflows_spec
    - workflow_bundle_results
    - workflow_bundle_status
    - workflow_bundle_repair_status
    - workflow_bundle_repair_merge_result
  DownloadAgent:
    variables:
    - is_multi_workflow
    - pack_name
    - pack_partition_reason
    - workflows_spec
    - workflow_bundle_results
    - workflow_bundle_validation_status
    - workflow_bundle_validation_errors
    - workflow_bundle_quality_gate
    - workflow_bundle_semantic_drift
    - workflow_bundle_repair_status
    - workflow_bundle_repair_count
    - workflow_bundle_repair_request
    - workflow_bundle_repair_result
    - workflow_integration_metadata
    - generated_workflow_integrations
    - generated_workflow_name
    - generated_workflow_capability_id
    - generated_workflow_startup_mode
    - generated_workflow_trigger_events
