tools:
- agent: PatternAgent
  file: pattern_selection.py
  function: pattern_selection
  description: Cache AG2 Network patternbook selection (workflows_spec, pack_name, is_multi_workflow) in context variables for the task batch executor and downstream agents.
  tool_type: Agent_Tool
  auto_tool_call: true

- agent: ProjectOverviewAgent
  file: mermaid_sequence_diagram.py
  function: mermaid_sequence_diagram
  description: Render the pack plan sequence diagram artifact for user review before parallel bundle generation starts.
  tool_type: UI_Surface
  auto_tool_call: true
  ui:
    component: DiagramViewer
    mode: artifact
    workflow_primitive: diagram_viewer
    realization: shipped_component

- agent: DownloadAgent
  file: generate_and_download.py
  function: generate_and_download
  description: Assemble all workflow bundle files from workflow_bundle_results, zip them, and present the inline download UI.
  tool_type: UI_Tool
  auto_tool_call: true
  ui:
    component: DownloadCenter
    mode: inline
    workflow_primitive: download_center
    realization: shipped_component
  ui_contract:
    surface_kind: agent_tool
    payload_schema:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        files:
          type: array
      additionalProperties: true
    actions_schema:
    - id: download_complete
      label: Continue
      variant: primary
      approved: true
      payload_schema:
        type: object
        properties:
          download_accepted:
            type: boolean
        additionalProperties: true
    - id: export_to_github
      label: Export to GitHub
      variant: secondary
      payload_schema:
        type: object
        properties:
          repo_name:
            type: string
          commit_message:
            type: string
        additionalProperties: true
    - id: close
      label: Close
      variant: ghost
      payload_schema:
        type: object
        properties: {}
        additionalProperties: true

- agent: DownloadAgent
  file: export_to_github.py
  function: export_to_github
  description: Export the generated bundle to GitHub via the Mozaiks Backend repo endpoints and return repo + deployment info.
  tool_type: Agent_Tool
  auto_tool_call: false

- agent: DownloadAgent
  file: attachments_tools.py
  function: list_attachments
  description: List uploaded chat attachments (metadata only).
  tool_type: Agent_Tool
  auto_tool_call: false

- agent: DownloadAgent
  file: attachments_tools.py
  function: set_attachment_intent
  description: Update an attachment's intent/bundle_path (hybrid model; gated by attachments_allow_bundling).
  tool_type: Agent_Tool
  auto_tool_call: false

lifecycle_tools:
- trigger: before_chat
  agent: null
  file: ../_shared/context_graph/load_context_graph_context.py
  function: load_context_graph_context
  description: Load the current compact Context Graph pack into context_variables before agent prompt hooks run.
  tool_type: Agent_Tool

- trigger: on_start
  agent: null
  file: tools/platform/build_lifecycle.py
  function: emit_build_started
  policy: required
  description: Notify platform build tracking when workflow run starts.
  tool_type: Agent_Tool

- trigger: on_complete
  agent: null
  file: tools/platform/build_lifecycle.py
  function: emit_build_completed
  policy: required
  description: Notify platform build tracking when workflow run completes.
  tool_type: Agent_Tool

- trigger: on_fail
  agent: null
  file: tools/platform/build_lifecycle.py
  function: emit_build_failed
  policy: required
  description: Notify platform build tracking when workflow run fails.
  tool_type: Agent_Tool
