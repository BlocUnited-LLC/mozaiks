tools:
- agent: PatternAgent
  file: pattern_selection.py
  function: pattern_selection
  description: Cache AG2 Network patternbook selection (workflows_spec, pack_name, is_multi_workflow) in context variables for the task batch executor and downstream agents.
  tool_type: Agent_Tool
  auto_tool_call: true
  bind_to_agent: false
  outcome:
    context_key: pattern_selection_outcome
    attempts_key: pattern_selection_attempts
    result_field: outcome
    values: [selected, invalid, blocked]
    error_value: blocked
    max_attempts: 3
    retry_on: [selected, invalid]

- agent: ProjectOverviewAgent
  file: mermaid_sequence_diagram.py
  function: mermaid_sequence_diagram
  description: Review the exact workflow partition before dispatch. An approved empty partition records that no AI workflows are required.
  tool_type: UI_Tool
  auto_tool_call: true
  bind_to_agent: false
  outcome:
    context_key: workflow_review_outcome
    attempts_key: workflow_review_attempts
    result_field: outcome
    values: [approved, no_workflows, changes_requested, cancelled, blocked]
    error_value: blocked
    max_attempts: 3
    retry_on: [changes_requested]
  ui:
    component: WorkflowPlanReview
    mode: artifact
    workflow_primitive: approval_card
    realization: workflow_wrapper
  ui_contract:
    surface_kind: agent_tool
    payload_schema:
      type: object
      required: [review_id, workflow_count, checkpoints]
      properties:
        review_id: {type: string}
        workflow_count: {type: integer}
        checkpoints: {type: array, items: {type: string}}
        diagram: {type: string}
      additionalProperties: true
    actions_schema:
    - id: approve
      label: Approve
      approved: true
      variant: primary
    - id: request_changes
      label: Request Changes
      approved: false
      variant: secondary

- agent: DownloadAgent
  file: generate_and_download.py
  function: generate_and_download
  description: Assemble all workflow bundle files from workflow_bundle_results, zip them, and present the inline download UI.
  tool_type: UI_Tool
  auto_tool_call: true
  bind_to_agent: false
  outcome:
    context_key: workflow_bundle_export_outcome
    attempts_key: workflow_bundle_export_attempts
    result_field: outcome
    values: [ready, needs_revision, cancelled, blocked]
    error_value: blocked
    max_attempts: 3
    retry_on: [needs_revision]
  ui:
    component: DownloadCenter
    mode: inline
    workflow_primitive: download_center
    realization: shipped_component
  ui_contract:
    surface_kind: agent_tool
    payload_schema:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        files:
          type: array
      additionalProperties: true
    actions_schema:
    - id: download_complete
      label: Continue
      variant: primary
      approved: true
      payload_schema:
        type: object
        properties:
          download_accepted:
            type: boolean
        additionalProperties: true
    - id: export_to_github
      label: Export to GitHub
      variant: secondary
      payload_schema:
        type: object
        properties:
          repo_name:
            type: string
          commit_message:
            type: string
        additionalProperties: true
    - id: close
      label: Close
      variant: ghost
      payload_schema:
        type: object
        properties: {}
        additionalProperties: true

- agent: DownloadAgent
  file: export_to_github.py
  function: export_to_github
  description: Export the generated bundle to GitHub via the Mozaiks Backend repo endpoints and return repo + deployment info.
  tool_type: Agent_Tool
  auto_tool_call: false

- agent: DownloadAgent
  file: attachments_tools.py
  function: list_attachments
  description: List uploaded chat attachments (metadata only).
  tool_type: Agent_Tool
  auto_tool_call: false

- agent: DownloadAgent
  file: attachments_tools.py
  function: set_attachment_intent
  description: Update an attachment's intent/bundle_path (hybrid model; gated by attachments_allow_bundling).
  tool_type: Agent_Tool
  auto_tool_call: false

lifecycle_tools:
- trigger: before_chat
  agent: null
  file: ../_shared/context_graph/load_context_graph_context.py
  function: load_context_graph_context
  description: Load the current compact Context Graph pack into context_variables before agent prompt hooks run.
  tool_type: Agent_Tool

- trigger: on_start
  agent: null
  file: tools/platform/build_lifecycle.py
  function: emit_build_started
  description: Notify platform build tracking when workflow run starts.
  tool_type: Agent_Tool

- trigger: on_complete
  agent: null
  file: tools/platform/build_lifecycle.py
  function: emit_build_completed
  description: Notify platform build tracking when workflow run completes.
  tool_type: Agent_Tool

- trigger: on_fail
  agent: null
  file: tools/platform/build_lifecycle.py
  function: emit_build_failed
  description: Notify platform build tracking when workflow run fails.
  tool_type: Agent_Tool
