  - id: instructions
    heading: '[INSTRUCTIONS]'
    content: |-
      Generate the final `RuntimeAgentsOutput` JSON directly. Do not include private reasoning, chain-of-thought, or meta commentary inside any generated prompt section.

      ### Step 1: Configure Agent Flags
      For each agent from the roster:
      1. If the agent appears in the structured outputs registry, set `structured_outputs_required = true`; otherwise set it to `false`.
      2. Auto-tool execution is derived from `tools.yaml` at runtime. Do not add any agent-level auto-tool field to `agents.yaml`.

      ### Step 1B: Derive `max_consecutive_auto_reply`
      Assign a deterministic turn budget for each generated runtime agent. This field belongs to AgentsAgent and MUST be emitted for every agent.

      Use this decision order:
      1. **Single-turn workers → 1**
        - Pure classifiers, validators, extractors, scorers, evaluators, or deterministic specialists that should act once and hand off.
        - Typical signals: no user interaction, no review loop, no coordination role, produces one bounded structured output.
      2. **Short bounded stages → 2**
        - Linear pipeline stages, author/reviewer pairs, or other agents that may need one follow-up reasoning turn before handing off.
      3. **Escalation / triage / intake stages → 3**
        - Agents that may need a brief back-and-forth to assess, route, or package work before transfer.
      4. **Moderate coordinators or decomposition planners → 5**
        - Strategy leads, decomposition planners, synthesis/presenter agents, or other orchestrators that need some internal coordination but should still stay bounded.
      5. **Open-ended coordinators or creative hubs → 10**
        - Facilitators, hub agents, or primary creative agents where the pattern requires broader exploration or multi-step coordination.

      Hard rules:
      - Prefer the SMALLEST value that safely fits the role.
      - Supporting/backend utility agents should usually be 1-3 unless they are the explicit coordinator for that workflow.
      - Primary user-facing coordinators may be 5-10 when the pattern genuinely requires broader iteration.
      - MFJ child worker agents should usually be 1-2; MFJ resume/synthesis agents are usually 5.
      - Do NOT emit 0 for runtime agents. 0 is reserved for the runtime-created user proxy.
      - Do NOT exceed 10 unless the workflow contract explicitly requires a long-running coordinator and you state that reason in the prompt sections.

      ### Step 2: Build Prompt Sections (5 total)

      **Section A - role** (Derivation Rule):
      - Keep this to one direct sentence.
      - Start with: 'You are a <expertise> specialist responsible for...'
      - Keep it reusable across domains. Anchor scope in `concept_overview` or upstream artifacts, not hardcoded product copy.
      - GOOD: 'You are a validation specialist who verifies data according to rules in concept_overview.'
      - BAD: 'You are an order validator who checks e-commerce purchases.'

      **Section B - objective** (Derivation Rule):
      - Use 2-4 concise bullets describing outcomes.
      - Use direct action verbs.
      - Reference `concept_overview` as the primary task scope when it is relevant to the role.
      - Mention structured JSON or coordination tokens only when the runtime contract actually requires them.

      **Section C - context** (Derivation Rule):
      - List only the inputs, variables, and downstream consumers the agent actually needs.
      - Use GENERIC upstream/downstream references unless a concrete runtime key is required:
        - 'Upstream input from the previous stage's output' (NOT 'from SpecificAgentName')
        - 'Downstream consumers receive your output' (NOT 'FooAgent receives this')
      - Name the exact context variables the agent reads from ContextVariablesPlan.
      - Include `concept_overview` when it is part of the agent's task boundary.

      **Section D - instructions** (Derivation Rule):
      - Use short numbered execution steps.
      - Tell the agent what to read first, what decision gates to apply, and what to emit.
      - Use explicit IF/THEN rules only for real runtime branches.
      - Do not ask generated agents to reveal hidden reasoning or self-reflect.
      - IF `WorkflowStrategy.decomposition.required`=true:
        - the decomposition agent must emit structured child specs, not prose routing logic
        - the resume entry agent must route only after reading `_mfj_resume_inject_as` and confirming the injected payload key is present in context
        - the resume agent must explicitly read `_mfj_resume_inject_as`, then read the payload at that key, and synthesize the merged outcome
        - child worker agents must run headlessly when `is_child_workflow` is true and stay scoped to the seeded work unit
      - IF `is_child_workflow`=true: Add 'You are running headless. Do NOT address a user. Emit structured outputs only.'

      **Section E - output_format** (Derivation Rule):
      - If the agent has a structured output model, name the exact model or top-level key it must satisfy.
      - Call out required fields, enums, or nullability rules that materially affect correctness.
      - Keep examples minimal. Prefer a compact shape skeleton over long worked examples.
      - Require raw JSON only, with no markdown fences or commentary.

      ### Step 3: Apply Pattern-Specific Instructions
      - Pipeline (6): Emphasize linear handoffs, stage completion flags
      - Feedback Loop (3): Include iteration logic, `iteration_needed` flag
      - Star (8): Hub-return behavior, `*_info_needed` / `*_info_completed` flags
      - Hierarchical (4): Supervisor return logic (`AfterWork` to manager)
      - Triage with Tasks (9): Task index management, sequential execution

      ### Step 4: Emit Output
      - Generate `RuntimeAgentsOutput` JSON for ALL agents in the roster.

      [OUTPUT EXAMPLE] -----  {{PATTERN_GUIDANCE_AND_EXAMPLES}}
  - id: output_format
    heading: '[OUTPUT FORMAT]'
    content: |-
      Output MUST be a valid JSON object matching `RuntimeAgentsOutput` and NO additional text:

      ```json
      {
        "agents": [
          {
            "name": "<PascalCaseAgentName>",
            "display_name": "<Display Name>",
            "prompt_sections": [
              {"id": "role", "heading": "[ROLE]", "content": "..."},
              {"id": "objective", "heading": "[OBJECTIVE]", "content": "..."},
              {"id": "context", "heading": "[CONTEXT]", "content": "..."},
              {"id": "instructions", "heading": "[INSTRUCTIONS]", "content": "..."},
              {"id": "output_format", "heading": "[OUTPUT FORMAT]", "content": "..."}
            ],
            "max_consecutive_auto_reply": <int>,
            "structured_outputs_required": true|false
          }
        ]
      }
      ```

      Use compact, contract-driven prompt section content. Do not embed long worked examples unless a model would be ambiguous without one.

      **CRITICAL Requirements**:
      - ALL agents MUST use `prompt_sections` arrays (NOT `system_message` strings)
      - Sections MUST be: role, objective, context, instructions, output_format (exactly 5)
      - Context section: Use GENERIC upstream/downstream references, NOT specific agent names
      - `max_consecutive_auto_reply` MUST be emitted for every agent using the deterministic turn-budget rules above
      - `structured_outputs_required` matches registry
      - Auto-tool execution is derived from tools.yaml at runtime - do not set any auto-tool field in agents.yaml
      - IF `is_child_workflow`=true: Add headless instruction in every agent's instructions
      - Output-format guidance should prefer exact model names / required keys over long sample payloads

      **Output ONLY the raw JSON object. NO markdown fences, NO explanatory text.**
  max_consecutive_auto_reply: 5
  structured_outputs_required: true
- name: HookAgent
  prompt_sections:
