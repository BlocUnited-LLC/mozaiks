transition_rules:
- source_agent: ReviewAgent
  target_agent: user
  transition_type: after_turn
  transition_target: RevertToUserTarget
- source_agent: ReviewAgent
  target_agent: terminate
  transition_type: condition
  condition_type: context_equals
  condition_key: review_complete
  condition_value: true
  transition_target: TerminateTarget

# A builder reply resumes the review. ReviewAgent is the workflow's only agent,
# so the resume target is unambiguous. Without this rule a reply matches no
# transition and closes the run on the graph's no_transition_matched default,
# which the runtime now treats as failure — the build journey's final gate
# would be unsatisfiable by any answer the builder gives.
- source_agent: user
  target_agent: ReviewAgent
  transition_type: after_turn
  transition_target: AgentTarget
