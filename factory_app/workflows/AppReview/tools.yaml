tools:
- agent: ReviewAgent
  file: tools/present_review_summary.py
  function: present_review_summary
  description: >
    Called by ReviewAgent on its first turn. Reads build validation context
    from context_variables and emits an AppReviewSummary agentic UI artifact
    in the chat surface.
  tool_type: UI_Surface
  auto_tool_call: false
  ui:
    component: AppReviewSummary
    mode: artifact
    workflow_primitive: document_preview
    realization: generated_component

- agent: ReviewAgent
  file: tools/submit_revision_request.py
  function: submit_revision_request
  description: >
    Called by ReviewAgent after the user types a non-empty revision request
    or after a successful promotion signal. Sets review_complete=true,
    stores the canonical refinement_request metadata in context_variables,
    and emits the AppReview revision event consumed by Studio's refinement
    trigger bridge.
  tool_type: Agent_Tool
  auto_tool_call: false
