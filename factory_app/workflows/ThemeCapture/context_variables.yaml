# ThemeCapture Context Variables
#
# Uses the canonical definitions/agents contract so NEXT-triggered handoffs work
# the same way they do in the rest of the platform workflows.

definitions:
  app_url:
    type: string
    description: Optional live URL used to preload deterministic theme evidence.
    source:
      type: state
      default: null

  css_snapshot:
    type: string
    description: Optional CSS or style snapshot supplied directly or generated during before_chat preload.
    source:
      type: state
      default: null

  screenshot_description:
    type: string
    description: Optional natural-language description of the host app's look and feel.
    source:
      type: state
      default: null

  parent_theme_config:
    type: object
    description: Existing theme_config.json mapping used as strong evidence or refinement input.
    source:
      type: state
      default: null

  parent_shell_config:
    type: object
    description: Existing shell.json mapping used only as layout and density evidence.
    source:
      type: state
      default: null

  automated_workflow_run:
    type: boolean
    description: True when ThemeCapture is launched automatically with seeded upstream context.
    source:
      type: state
      default: false

  build_mode:
    type: string
    description: >
      Build mode for ThemeCapture. `initial` is the normal build-sequence theme pass;
      `revision` means ThemeCapture was reopened by the refinement engine.
    source:
      type: state
      default: initial

  workflow_sequence:
    type: string
    description: >
      Active workflow sequence that launched this run, such as theme_revision,
      app_surface_revision, conceptual_replan, or full_rebuild.
    source:
      type: state
      default: null

  revision_scope:
    type: string
    description: Revision scope supplied by the refinement control plane.
    source:
      type: state
      default: null

  change_request_id:
    type: string
    description: Stable lineage id for the active revision request.
    source:
      type: state
      default: null

  revision_id:
    type: string
    description: Runtime-generated revision run id for the current builder revision.
    source:
      type: state
      default: null

  artifact_kind:
    type: string
    description: Artifact family that triggered the current reroute.
    source:
      type: state
      default: null

  artifact_version_id:
    type: string
    description: Artifact version id that triggered the current reroute.
    source:
      type: state
      default: null

  sequence_status:
    type: string
    description: Builder sequence state before the revision launch.
    source:
      type: state
      default: in_progress

  revision_origin_workflow:
    type: string
    description: Workflow where the revision request originated before reroute.
    source:
      type: state
      default: null

  refinement_request:
    type: string
    description: Raw user-supplied refinement request text.
    source:
      type: state
      default: null

  refinement_request_meta:
    type: object
    description: Full typed RefinementRequest payload persisted by the refinement engine.
    source:
      type: state
      default: null

  screen:
    type: string
    description: Builder surface or screen identifier that launched the current refinement request.
    source:
      type: state
      default: null

  change_intent:
    type: object
    description: Typed refinement classification emitted by the refinement engine.
    source:
      type: state
      default: null

  impact_set:
    type: object
    description: Typed downstream impact summary emitted by the refinement engine.
    source:
      type: state
      default: null

  builder_options:
    type: object
    description: Optional app-agnostic builder UI option payload carried through workflow sequences.
    source:
      type: state
      default: null

  app_name:
    type: string
    description: Known app display name if available upstream.
    source:
      type: state
      default: null

  app_description:
    type: string
    description: Existing product summary if already known.
    source:
      type: state
      default: null

  tech_stack:
    type: string
    description: Optional frontend stack summary from discovery.
    source:
      type: state
      default: null

  frontend_repo_summary:
    type: object
    description: Structured frontend repo summary from ExistingAppDiscovery.
    source:
      type: state
      default: {}

  app_context_required:
    type: boolean
    description: >
      True when this run is a refinement or existing-app route that must retain
      a current AppContextVersion before downstream build work continues.
    source:
      type: state
      default: false

  current_app_context_version_id:
    type: string
    description: Durable AppContextVersion id for source-backed App Intelligence.
    source:
      type: state
      default: null

  app_context_summary:
    type: object
    description: Prompt-safe summary of the current AppContextVersion.
    source:
      type: state
      default: null

  app_type:
    type: string
    description: Entry path selected at the app_type_selector gate.
    source:
      type: state
      default: "greenfield_app"

  app_intelligence_ready:
    type: boolean
    description: True when startup loaded an App Intelligence catalog.
    source:
      type: state
      default: false

  app_intelligence_status:
    type: string
    description: Startup load status for App Intelligence context.
    source:
      type: state
      default: null

  app_intelligence_summary:
    type: string
    description: Compact human-readable summary of indexed source coverage.
    source:
      type: state
      default: null

  app_intelligence_health:
    type: object
    description: App Intelligence coverage, scan health, and startup warnings.
    source:
      type: state
      default: null

  app_intelligence_catalog:
    type: object
    description: >
      Prompt-safe App Intelligence catalog containing architecture, capability,
      ownership, integration, data, and risk summaries.
    source:
      type: state
      default: null

  source_context_catalog:
    type: object
    description: Prompt-safe source corpus catalog for indexed files, chunks, symbols, and imports.
    source:
      type: state
      default: null

  brownfield_build_path:
    type: string
    description: >
      Selected existing-app enhancement path. `light_integration` means Add AI
      Workflows; `full_migration` means Build App Features. Null for greenfield.
    source:
      type: state
      default: null

  adoption_plan:
    type: object
    description: Canonical AdoptionPlan from ExistingAppDiscovery, when present.
    source:
      type: state
      default: null

  ownership_boundary:
    type: object
    description: Canonical ownership boundary from ExistingAppDiscovery, when present.
    source:
      type: state
      default: null

  brownfield_registration:
    type: object
    description: BrownfieldRegistration provenance record from ExistingAppDiscovery, when present.
    source:
      type: state
      default: null

  preloaded_context_ready:
    type: boolean
    description: True when before_chat captured usable deterministic evidence.
    source:
      type: state
      default: false

  preload_status:
    type: string
    description: "before_chat evidence status: none, partial, or ready."
    source:
      type: state
      default: "none"

  preload_summary:
    type: string
    description: Human-readable summary of the evidence gathered before chat.
    source:
      type: state
      default: null

  theme_capture_evidence:
    type: object
    description: Structured deterministic evidence gathered from URL, theme config, screenshots, or repo hints.
    source:
      type: state
      default: {}

  interview_complete:
    type: boolean
    description: True when ThemeInterviewAgent emits NEXT.
    source:
      type: state
      default: false
      triggers:
        - type: agent_text
          agent: ThemeInterviewAgent
          ui_hidden: true
          match:
            equals: NEXT

  analysis_complete:
    type: boolean
    description: True when ThemeAnalysisAgent emits NEXT.
    source:
      type: state
      default: false
      triggers:
        - type: agent_text
          agent: ThemeAnalysisAgent
          ui_hidden: true
          match:
            equals: NEXT

  captured_theme_config:
    type: object
    description: Canonical theme_config.json persisted after ThemeConfigAssemblerAgent completes.
    source:
      type: computed
      default: null

  theme_capture_persisted:
    type: boolean
    description: True once save_captured_theme has persisted the captured theme artifact.
    source:
      type: computed
      default: false

agents:
  ThemeInterviewAgent:
    variables:
      - app_url
      - css_snapshot
      - screenshot_description
      - parent_theme_config
      - parent_shell_config
      - automated_workflow_run
      - build_mode
      - workflow_sequence
      - revision_scope
      - change_request_id
      - revision_id
      - artifact_kind
      - artifact_version_id
      - sequence_status
      - revision_origin_workflow
      - refinement_request
      - refinement_request_meta
      - screen
      - change_intent
      - impact_set
      - app_context_required
      - current_app_context_version_id
      - app_context_summary
      - app_type
      - app_intelligence_ready
      - app_intelligence_status
      - app_intelligence_summary
      - app_intelligence_health
      - app_intelligence_catalog
      - source_context_catalog
      - brownfield_build_path
      - adoption_plan
      - ownership_boundary
      - brownfield_registration
      - app_name
      - app_description
      - tech_stack
      - frontend_repo_summary
      - preloaded_context_ready
      - preload_status
      - preload_summary
      - theme_capture_evidence
      - interview_complete

  ThemeAnalysisAgent:
    variables:
      - app_name
      - app_description
      - tech_stack
      - css_snapshot
      - screenshot_description
      - parent_theme_config
      - parent_shell_config
      - workflow_sequence
      - app_context_required
      - current_app_context_version_id
      - app_context_summary
      - app_type
      - app_intelligence_ready
      - app_intelligence_status
      - app_intelligence_summary
      - app_intelligence_health
      - app_intelligence_catalog
      - source_context_catalog
      - brownfield_build_path
      - adoption_plan
      - ownership_boundary
      - brownfield_registration
      - preload_status
      - preload_summary
      - theme_capture_evidence
      - interview_complete
      - analysis_complete

  ThemeConfigAssemblerAgent:
    variables:
      - app_name
      - parent_theme_config
      - workflow_sequence
      - preload_summary
      - theme_capture_evidence
      - captured_theme_config
