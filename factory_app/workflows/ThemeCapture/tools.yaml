# ThemeCapture Tools
#
# before_chat preloads deterministic theme evidence.
# ThemeConfigAssemblerAgent then persists the canonical theme artifact and emits
# the ThemePreviewCard UI summary.

tools:
- agent: ThemeConfigAssemblerAgent
  file: save_captured_theme.py
  function: save_captured_theme
  description: >
    Auto-invoked after ThemeConfigAssemblerAgent outputs the structured
    CapturedThemeConfig. Persists the artifact set and emits a preview card.
  tool_type: UI_Surface
  auto_tool_call: true
  ui:
    component: ThemePreviewCard
    mode: artifact
    workflow_primitive: document_preview
    realization: generated_component

lifecycle_tools:
- trigger: before_chat
  agent: null
  file: preload_theme_capture_context.py
  function: collect_prechat_theme_context
  description: >
    Deterministically preload theme evidence from an app URL, parent theme config,
    screenshot description, or frontend repo summary before the interview begins.
- trigger: on_start
  agent: null
  file: tools/platform/build_lifecycle.py
  function: emit_build_started
  description: Notify platform build tracking when workflow run starts.
  tool_type: Agent_Tool
- trigger: on_complete
  agent: null
  file: tools/platform/build_lifecycle.py
  function: emit_build_completed
  description: Notify platform build tracking when workflow run completes.
  tool_type: Agent_Tool
- trigger: on_fail
  agent: null
  file: tools/platform/build_lifecycle.py
  function: emit_build_failed
  description: Notify platform build tracking when workflow run fails.
  tool_type: Agent_Tool
