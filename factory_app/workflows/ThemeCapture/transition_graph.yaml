# ThemeCapture Handoff Rules
#
# Canonical linear pipeline:
# ThemeInterviewAgent -> ThemeAnalysisAgent -> ThemeConfigAssemblerAgent -> user

transition_rules:
- source_agent: ThemeInterviewAgent
  target_agent: user
  transition_type: after_turn
  transition_target: RevertToUserTarget

- source_agent: ThemeInterviewAgent
  target_agent: ThemeAnalysisAgent
  transition_type: condition
  condition_type: context_equals
  condition_key: interview_complete
  condition_value: true
  transition_target: AgentTarget

- source_agent: ThemeAnalysisAgent
  target_agent: user
  transition_type: after_turn
  transition_target: RevertToUserTarget

- source_agent: ThemeAnalysisAgent
  target_agent: ThemeConfigAssemblerAgent
  transition_type: condition
  condition_type: context_equals
  condition_key: analysis_complete
  condition_value: true
  transition_target: AgentTarget

- source_agent: ThemeConfigAssemblerAgent
  target_agent: user
  transition_type: after_turn
  transition_target: RevertToUserTarget
