transition_rules:
- source_agent: DesignDocsAgent
  target_agent: terminate
  transition_type: condition
  condition_type: context_equals
  condition_key: design_docs_save_outcome
  condition_value: saved
  transition_target: TerminateTarget
  termination_reason: workflow_complete

# Structural repairs consume the declared attempt budget. An explicit owner
# correction remains a review turn and preserves the prior structural count.
- source_agent: DesignDocsAgent
  target_agent: DesignDocsAgent
  transition_type: condition
  condition_type: context_equals
  condition_key: design_docs_save_outcome
  condition_value: revise
  transition_target: AgentTarget

- source_agent: DesignDocsAgent
  target_agent: DesignDocsAgent
  transition_type: condition
  condition_type: context_equals
  condition_key: design_docs_save_outcome
  condition_value: review_changes
  transition_target: AgentTarget

- source_agent: DesignDocsAgent
  target_agent: terminate
  transition_type: condition
  condition_type: context_equals
  condition_key: design_docs_save_outcome
  condition_value: blocked
  transition_target: TerminateTarget
  termination_reason: workflow_failed

- source_agent: DesignDocsAgent
  target_agent: terminate
  transition_type: after_turn
  transition_target: TerminateTarget
  termination_reason: workflow_failed

