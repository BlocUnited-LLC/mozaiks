tools:
- agent: DesignDocsAgent
  file: save_design_doc.py
  function: save_design_docs_bundle
  description: Persist the validated DesignDocsBundle plus the canonical surface_map and data_contract contracts for the current app_id.
  tool_type: Agent_Tool
  auto_tool_call: true
  bind_to_agent: false
  outcome:
    context_key: design_docs_save_outcome
    attempts_key: design_docs_save_attempts
    result_field: outcome
    values: [saved, revise, blocked]
    error_value: blocked
    max_attempts: 3
    retry_on: [revise]
lifecycle_tools:
- trigger: on_start
  agent: null
  file: ../_shared/platform/build_lifecycle.py
  function: emit_build_started
  description: Notify platform build tracking when workflow run starts.
  tool_type: Agent_Tool
- trigger: on_complete
  agent: null
  file: ../_shared/platform/build_lifecycle.py
  function: emit_build_completed
  description: Notify platform build tracking when workflow run completes.
  tool_type: Agent_Tool
- trigger: on_fail
  agent: null
  file: ../_shared/platform/build_lifecycle.py
  function: emit_build_failed
  description: Notify platform build tracking when workflow run fails.
  tool_type: Agent_Tool

