tools:
- agent: DesignDocsAgent
  file: save_design_doc.py
  function: save_design_docs_bundle
  description: Validate the design, collect explicit owner approval for non-empty role grants, and persist the reviewed contracts for the bound app.
  tool_type: UI_Tool
  auto_tool_call: true
  bind_to_agent: false
  outcome:
    context_key: design_docs_save_outcome
    attempts_key: design_docs_save_attempts
    result_field: outcome
    values: [saved, revise, blocked]
    error_value: blocked
    max_attempts: 3
    retry_on: [revise]
  ui:
    component: ApprovalCard
    mode: inline
    workflow_primitive: approval_card
    realization: shipped_component
  ui_contract:
    surface_kind: agent_tool
    payload_schema:
      type: object
      required: [review_id, checkpoints]
      properties:
        review_id: {type: string}
        checkpoints: {type: array, items: {type: string}}
      additionalProperties: true
    actions_schema:
    - id: approve
      label: Approve permissions
      variant: primary
      approved: true
      payload_schema:
        type: object
        required: [action, approved, review_id]
        properties:
          action: {type: string, enum: [approve]}
          approved: {type: boolean, const: true}
          review_id: {type: string}
          rationale: {type: string, maxLength: 4000}
          status: {type: string, enum: [submitted]}
          workflow_name: {type: string, enum: [DesignDocs]}
        additionalProperties: false
    - id: request_changes
      label: Request changes
      variant: secondary
      approved: false
      payload_schema:
        type: object
        required: [action, approved, review_id]
        properties:
          action: {type: string, enum: [request_changes]}
          approved: {type: boolean, const: false}
          review_id: {type: string}
          rationale: {type: string, maxLength: 4000}
          status: {type: string, enum: [submitted]}
          workflow_name: {type: string, enum: [DesignDocs]}
        additionalProperties: false
    - id: cancel
      label: Cancel build
      variant: ghost
      approved: false
      payload_schema:
        type: object
        required: [action, status]
        properties:
          action: {type: string, enum: [cancel]}
          status: {type: string, enum: [cancelled]}
        additionalProperties: false
lifecycle_tools:
- trigger: on_start
  agent: null
  file: ../_shared/platform/build_lifecycle.py
  function: emit_build_started
  description: Notify platform build tracking when workflow run starts.
  tool_type: Agent_Tool
- trigger: on_complete
  agent: null
  file: ../_shared/platform/build_lifecycle.py
  function: emit_build_completed
  description: Notify platform build tracking when workflow run completes.
  tool_type: Agent_Tool
- trigger: on_fail
  agent: null
  file: ../_shared/platform/build_lifecycle.py
  function: emit_build_failed
  description: Notify platform build tracking when workflow run fails.
  tool_type: Agent_Tool

