schema_version: mozaiks.structured_outputs.v1
registry:
  DesignDocsAgent: DesignDocsBundle

models:
  DesignSurface:
    type: model
    fields:
      surface_id:
        type: str
        description: Stable snake_case id for the realization surface.
      label:
        type: str
        description: Human-readable label for the surface.
      surface_kind:
        type: literal
        values:
        - module
        - workflow
        - app_policy
        - refinement
        - external_integration
        - ui_only
        description: Concrete realization boundary for the surface. A workflow surface the approved concept never asked for (agentic_capabilities empty or null) is saved as module when it declares entities, mutations, custom reads, or collections (grouped or shared), and as ui_only otherwise.
      owner:
        type: literal
        values:
        - app
        - hosted
        - platform
        description: Runtime owner responsible for this surface. Platform auth/sessions use platform ownership. Selected managed pack facades use app ownership with the declared facade surface_id and own no provider state. Save-time normalization splits mixed auth fields only when one existing app module determines residual ownership; ambiguous ownership requires revision.
      source_capability_packs:
        type: optional_list
        items: str
        description: Capability-pack hints this surface realizes.
      primary_entities:
        type: optional_list
        items: str
        description: Durable entities or records owned by the surface. Managed facade modules do not own provider records or platform state; use an empty list for these facades. App-specific profiles and preferences keyed by user_id remain app-owned entities. A module's collection entity missing here is added at save unless another surface declares it or another module's collections hold it too, the module lists it under another spelling, or it is a platform identity or selected-provider entity (an Account only where its records carry a password hash).
      owned_pages:
        type: optional_list
        items: str
        description: Persistent pages primarily owned by the surface. A surface that normalizes to platform authentication owns none; its sign-in pages (auth contract routes or a credential Form) are removed at save because the auth contract serves them, a page listing its user accounts is removed because the platform administers users, and any other page filed under it is rejected with the app-owned surface it must move to.
      owned_mutations:
        type: optional_list
        items: str
        description: Deterministic mutations or actions owned by the surface. Sign-in actions (login_user, register_user) on a surface that declares or stores platform identity are the platform's and are removed at save, together with page sections bound to them. On a surface that normalizes to a managed facade, a provider action the facade serves (subscribe_user, manage_subscription) maps to that facade action and typed page bindings follow it; elsewhere these ids stay app actions.
      custom_reads:
        type: optional_list
        items: str
        description: Explicit snake_case read action ids beyond canonical entity list/get, such as summarize_tasks for dashboard KPIs. These are approved design decisions implemented by ServiceAgent; canonical list/get actions are constructed from collection entity and tenancy.
      events_emitted:
        type: optional_list
        items: str
        description: Domain, platform, or hosted events this surface may emit. Events declared on a surface that normalizes to platform or managed-provider ownership are that owner's lifecycle events and are removed at save, unless another surface's workflow_triggers consume them.
      workflow_triggers:
        type: optional_list
        items: str
        description: Workflow capability ids or trigger intents this surface may start.
      integrations:
        type: optional_list
        items: str
        description: Third-party systems directly owned by the surface.
      notes:
        type: union
        variants:
        - str
        - 'null'
        description: Null or short bounded rationale.

  DesignSurfaceMap:
    type: model
    fields:
      surfaces:
        type: list
        items: DesignSurface
        description: Realization surfaces declared for the app.

  DataContractField:
    type: model
    fields:
      name:
        type: str
        description: Stable field name stored in the collection.
      type:
        type: literal
        values:
        - string
        - boolean
        - integer
        - number
        - date
        - datetime
        - object
        - array
        description: >
          Canonical logical data type. Dates are stored as datetimes and
          travel as ISO-8601 strings; object and array fields cannot be
          canonical create/update inputs; a required one without a default
          is saved with the empty default ("[]" or "{}").
      required:
        type: bool
        description: True when the field must exist on inserted records.
      default:
        type: optional_str
        description: >
          JSON-encoded default applied when a record omits the field, or
          null for no default. It must decode to the declared type: "true"
          only for boolean, "0" for integer/number, "[]" or "{}" for
          array/object; a string field also accepts a bare string
          ("pending"). "null" is never a default: omit it and set
          required=false or nullable=true instead.
      enum:
        type: optional_list
        items: str
        description: Optional finite set of allowed string values.
      nullable:
        type: union
        variants:
        - bool
        - 'null'
        description: Null or true when the field may be set to null.

  DataContractIndexKey:
    type: model
    fields:
      field:
        type: str
        description: Document field path to index.
      order:
        type: int
        description: Sort order, 1 for ascending or -1 for descending.

  DataContractIndex:
    type: model
    fields:
      keys:
        type: list
        items: DataContractIndexKey
        description: 'Ordered index keys, for example [{"field": "app_id", "order": 1}, {"field": "campaign_id", "order": 1}].'
      unique:
        type: union
        variants:
        - bool
        - 'null'
        description: Null or true when the index must enforce uniqueness.
      sparse:
        type: union
        variants:
        - bool
        - 'null'
        description: Null or true when the index should be sparse.
      name:
        type: union
        variants:
        - str
        - 'null'
        description: Null lets code derive a deterministic name from ordered keys and options before saving; a nonempty explicit Mongo index name is preserved.

  DataContractOwnership:
    type: model
    fields:
      surface_id:
        type: str
        description: Surface id that owns the collection.
      surface_kind:
        type: literal
        values:
        - module
        - workflow
        - app_policy
        - refinement
        - external_integration
        - ui_only
        description: Surface kind that owns the collection.

  DataContractLifecycle:
    type: model
    fields:
      write_mode:
        type: literal
        values:
        - module_action
        - workflow_write
        - platform_sync
        description: Primary mechanism allowed to write durable records.
      migration_policy:
        type: literal
        values:
        - additive_only
        - review_required
        - destructive_allowed
        description: Allowed migration policy for future revisions.

  DataContractCollection:
    type: model
    fields:
      name:
        type: str
        description: Canonical Mongo collection name.
      scope:
        type: literal
        values:
        - app
        - platform
        - hosted
        description: Namespace owner of the collection. This does not specify row tenancy.
      tenancy:
        type: literal
        values:
        - per_user
        - per_workspace
        - app_wide
        description: Row ownership chosen here once. Per-user and per-workspace records require owner_field; app-wide records require explicit read access policy when writes are protected.
      owner_field:
        type: optional_str
        description: Exact declared field holding trusted user_id for per_user or workspace_id for per_workspace. Null for app_wide.
      entity:
        type: str
        description: Exact entity name from the owning surface primary_entities; each collection of an owner has its own entity. No pluralization or collection-name inference is permitted. A module's missing entity is added to its primary_entities at save, unless another surface declares it or another module's collections hold it too, the module lists it under another spelling, or it is a platform identity or selected-provider entity (an Account only where its records carry a password hash).
      ownership:
        type: DataContractOwnership
        description: Surface ownership for the collection.
      fields:
        type: list
        items: DataContractField
        description: Declared document fields for the collection.
      indexes:
        type: optional_list
        items: DataContractIndex
        description: Declared Mongo indexes for the collection.
      search_by:
        type: union
        variants:
        - str
        - 'null'
        description: >
          Null or the declared field canonical get reads look up by. It may
          be a user-entered natural key; it is never the generated record id.
          Code generates `<entity>_id` when that field is declared, otherwise
          `id`, otherwise Mongo `_id`, and clients never supply it.
      lifecycle:
        type: DataContractLifecycle
        description: Write and migration rules for this collection.

  DataContractSurface:
    type: model
    fields:
      surface_id:
        type: str
        description: Stable surface id owning the collections.
      surface_kind:
        type: literal
        values:
        - module
        - workflow
        - app_policy
        - refinement
        - external_integration
        - ui_only
        description: Surface kind mirrored from surface_map.
      collections:
        type: list
        items: DataContractCollection
        description: Collection intents owned by the surface. Platform auth/session state and selected managed-provider state cannot be declared here; managed facade surfaces have no local collections. Save-time normalization removes a collection the ownership rules identify (a reserved collection name or surface, a managed facade, or platform identity content) that holds only their state, wherever it is filed; a provider-state collection is removed whatever types it declares its fields with. A collection named for the provider only by its entity, or a reserved collection name beside an app entity its app surface declares, is a design decision; remove it, or name the app's own records for what they are. Only platform identity has a residual split -- an identity collection with app fields keeps them in a user_id-keyed collection under a uniquely determined existing app module; a provider-state collection with app fields is rejected naming them, because a managed facade owns no collections. Ambiguous ownership requires revision.

  DataContractPolicies:
    type: model
    fields:
      default_scope_field:
        type: str
        description: Field used for default app scoping across collections.
      allow_destructive_migrations:
        type: bool
        description: False unless the product explicitly permits destructive migrations.

  DataContractBundle:
    type: model
    fields:
      version:
        type: str
        description: Artifact contract version, typically "1".
      app_id:
        type: union
        variants:
        - str
        - 'null'
        description: Null or app id when already known at design time.
      artifact_version_id:
        type: union
        variants:
        - str
        - 'null'
        description: Null during greenfield design passes or the artifact version being refined.
      surfaces:
        type: list
        items: DataContractSurface
        description: Database ownership grouped by realization surface.
      shared_collections:
        type: optional_list
        items: DataContractCollection
        description: Collections intentionally shared across surfaces or modules.
      policies:
        type: DataContractPolicies
        description: Global migration and scoping policies for the app.

  UIPageSection:
    type: model
    fields:
      id:
        type: str
        description: Kebab-case section id.
      primitive:
        type: literal
        values:
        - DataTable
        - Form
        - Grid
        - Button
        - Modal
        - Alert
        - Skeleton
        - Empty
        - PageHeader
        - ResourceTable
        - SummaryStrip
        - InlineEmptyState
        - LoadingState
        - ErrorState
        - Panel
        - SurfaceCard
        - StatusPill
        - Metric
        - SegmentedBar
        - Timeline
        - CodeBlock
        - ProgressTracker
        - AlertBanner
        - ActionButton
        - FileList
        description: Primitive type from the shipped UI primitive registry.
      intent:
        type: str
        description: What this section exists to let the user do or see.
      config_hint:
        type: optional_str
        description: >
          JSON-encoded partial primitive config scaffold with required fields
          populated, or null when config is entirely context-dependent.
          Must be null or a valid JSON object string matching the primitive's
          required fields. AppPlanAgent and AppSchemaAgent decode this at
          generation time.

  UIPage:
    type: model
    fields:
      name:
        type: str
        description: Human-readable page name.
      route:
        type: str
        description: Primary route path for the page.
      ui_surface:
        type: literal
        values:
        - declarative_page
        - custom_react_page
        description: Required rendering decision preserved by app planning. Use declarative_page for shipped primitive composition; custom_react_page for required local state, event handlers, canvas, or other behavior the shipped primitives cannot express. This grants no additional routes or module actions.
      layout:
        type: literal
        values:
        - grid
        - sidebar
        - full-width
        - split
        description: Page layout mode.
      intent:
        type: str
        description: What the page exists to let the user do.
      sections:
        type: list
        items: UIPageSection
        description: Ordered primitive composition hints. A custom React page may have no sections; preserve its required interaction in intent, never invent primitive config to imitate that interaction.

  ExperienceSpec:
    type: model
    fields:
      navigation_model:
        type: str
        description: How primary destinations are navigated (e.g. "top-level routes with shell navigation").
      brand_direction:
        type: str
        description: Brief summary of the desired app feel and experience posture.
      pages:
        type: list
        items: UIPage
        description: App-owned persistent page designs. For enabled greenfield subscription concepts, the save boundary completes the approved inventory from the MozaiksPay facade page declarations and assigns billing_portal ownership, preserving designs already on those routes. Other enabled monetization requires a designed Pricing page at /pricing. Free apps do not acquire monetization pages. Sign-in pages owned by a platform authentication surface (an auth contract route, a route one nests under, or a credential Form) duplicate the auth contract and are removed from the saved inventory; typed navigation to them points at the login route. A page listing such a surface's user accounts is removed because the platform administers users; typed navigation to it is removed. Any other page owned by such a surface is rejected with the app-owned surface it must move to, never dropped. Every saved page has one primary surface_map owner.

  DesignDocsBundle:
    type: model
    fields:
      agent_message:
        type: str
        description: Short summary of the completed design pass.
      frontend_markdown:
        type: str
        description: Complete frontend design document in Markdown.
      backend_markdown:
        type: str
        description: Complete backend design document in Markdown.
      database_markdown:
        type: str
        description: Complete data design document in Markdown.
      experience_spec:
        type: ExperienceSpec
        description: Typed UI experience specification — navigation model, brand direction, and the complete declarative page structure with primitive-level section intent. This is the machine-readable contract that AppPlanAgent uses as the authoritative page source.
      surface_map:
        type: DesignSurfaceMap
        description: Canonical typed surface realization contract mirrored into the saved backend and ui_schema docs.
      data_contract:
        type: DataContractBundle
        description: Canonical typed database ownership and migration contract persisted separately and staged as data/contract.json in generated app bundles.

