schema_version: mozaiks.structured_outputs.v1
registry:
  DesignDocsAgent: DesignDocsBundle

models:
  DesignSurface:
    type: model
    fields:
      surface_id:
        type: str
        description: Stable snake_case id for the realization surface.
      label:
        type: str
        description: Human-readable label for the surface.
      surface_kind:
        type: literal
        values:
        - module
        - workflow
        - app_policy
        - refinement
        - external_integration
        - ui_only
        description: Concrete realization boundary for the surface.
      owner:
        type: literal
        values:
        - app
        - hosted
        - platform
        description: Runtime owner responsible for this surface.
      source_capability_packs:
        type: optional_list
        items: str
        description: Capability-pack hints this surface realizes.
      primary_entities:
        type: optional_list
        items: str
        description: Durable entities or records owned by the surface.
      owned_pages:
        type: optional_list
        items: str
        description: Persistent pages primarily owned by the surface.
      owned_mutations:
        type: optional_list
        items: str
        description: Deterministic mutations or actions owned by the surface.
      events_emitted:
        type: optional_list
        items: str
        description: Domain, platform, or hosted events this surface may emit.
      workflow_triggers:
        type: optional_list
        items: str
        description: Workflow capability ids or trigger intents this surface may start.
      integrations:
        type: optional_list
        items: str
        description: Third-party systems directly owned by the surface.
      notes:
        type: union
        variants:
        - str
        - 'null'
        description: Null or short bounded rationale.

  DesignSurfaceMap:
    type: model
    fields:
      surfaces:
        type: list
        items: DesignSurface
        description: Realization surfaces declared for the app.

  DataContractField:
    type: model
    fields:
      name:
        type: str
        description: Stable field name stored in the collection.
      type:
        type: str
        description: Logical data type such as string, boolean, number, object, array, or datetime.
      required:
        type: bool
        description: True when the field must exist on inserted records.
      default:
        type: optional_str
        description: >
          JSON-encoded default value applied when a record omits the field,
          or null. Scalar defaults may be encoded directly as a string
          ("true", "0", "pending"); complex defaults must be JSON-encoded.
          Must be null or a valid JSON string.
      enum:
        type: optional_list
        items: str
        description: Optional finite set of allowed string values.
      nullable:
        type: union
        variants:
        - bool
        - 'null'
        description: Null or true when the field may be set to null.

  DataContractIndex:
    type: model
    fields:
      keys:
        type: list
        items: list
        description: Ordered Mongo index key pairs, for example [["app_id", 1], ["campaign_id", 1]].
      unique:
        type: union
        variants:
        - bool
        - 'null'
        description: Null or true when the index must enforce uniqueness.
      sparse:
        type: union
        variants:
        - bool
        - 'null'
        description: Null or true when the index should be sparse.
      name:
        type: union
        variants:
        - str
        - 'null'
        description: Null or explicit Mongo index name.

  DataContractOwnership:
    type: model
    fields:
      surface_id:
        type: str
        description: Surface id that owns the collection.
      surface_kind:
        type: literal
        values:
        - module
        - workflow
        - app_policy
        - refinement
        - external_integration
        - ui_only
        description: Surface kind that owns the collection.

  DataContractLifecycle:
    type: model
    fields:
      write_mode:
        type: literal
        values:
        - module_action
        - workflow_write
        - platform_sync
        description: Primary mechanism allowed to write durable records.
      migration_policy:
        type: literal
        values:
        - additive_only
        - review_required
        - destructive_allowed
        description: Allowed migration policy for future revisions.

  DataContractCollection:
    type: model
    fields:
      name:
        type: str
        description: Canonical Mongo collection name.
      scope:
        type: literal
        values:
        - app
        - platform
        - hosted
        description: Scope of the collection namespace.
      ownership:
        type: DataContractOwnership
        description: Surface ownership for the collection.
      fields:
        type: list
        items: DataContractField
        description: Declared document fields for the collection.
      indexes:
        type: optional_list
        items: DataContractIndex
        description: Declared Mongo indexes for the collection.
      search_by:
        type: union
        variants:
        - str
        - 'null'
        description: Null or primary lookup field used for updates.
      lifecycle:
        type: DataContractLifecycle
        description: Write and migration rules for this collection.

  DataContractSurface:
    type: model
    fields:
      surface_id:
        type: str
        description: Stable surface id owning the collections.
      surface_kind:
        type: literal
        values:
        - module
        - workflow
        - app_policy
        - refinement
        - external_integration
        - ui_only
        description: Surface kind mirrored from surface_map.
      collections:
        type: list
        items: DataContractCollection
        description: Collection intents owned by the surface.

  DataContractPolicies:
    type: model
    fields:
      default_scope_field:
        type: str
        description: Field used for default app scoping across collections.
      allow_destructive_migrations:
        type: bool
        description: False unless the product explicitly permits destructive migrations.

  DataContractBundle:
    type: model
    fields:
      version:
        type: str
        description: Artifact contract version, typically "1".
      app_id:
        type: union
        variants:
        - str
        - 'null'
        description: Null or app id when already known at design time.
      artifact_version_id:
        type: union
        variants:
        - str
        - 'null'
        description: Null during greenfield design passes or the artifact version being refined.
      surfaces:
        type: list
        items: DataContractSurface
        description: Database ownership grouped by realization surface.
      shared_collections:
        type: optional_list
        items: DataContractCollection
        description: Collections intentionally shared across surfaces or modules.
      policies:
        type: DataContractPolicies
        description: Global migration and scoping policies for the app.

  UIPageSection:
    type: model
    fields:
      id:
        type: str
        description: Kebab-case section id.
      primitive:
        type: literal
        values:
        - DataTable
        - Form
        - Grid
        - Button
        - Modal
        - Alert
        - Skeleton
        - Empty
        - PageHeader
        - ResourceTable
        - SummaryStrip
        - InlineEmptyState
        - LoadingState
        - ErrorState
        - Panel
        - SurfaceCard
        - StatusPill
        - Metric
        - SegmentedBar
        - Timeline
        - CodeBlock
        - ProgressTracker
        - AlertBanner
        - ActionButton
        - FileList
        description: Primitive type from the shipped UI primitive registry.
      intent:
        type: str
        description: What this section exists to let the user do or see.
      config_hint:
        type: optional_str
        description: >
          JSON-encoded partial primitive config scaffold with required fields
          populated, or null when config is entirely context-dependent.
          Must be null or a valid JSON object string matching the primitive's
          required fields. AppPlanAgent and AppSchemaAgent decode this at
          generation time.

  UIPage:
    type: model
    fields:
      name:
        type: str
        description: Human-readable page name.
      route:
        type: str
        description: Primary route path for the page.
      layout:
        type: literal
        values:
        - grid
        - sidebar
        - full-width
        - split
        description: Page layout mode.
      intent:
        type: str
        description: What the page exists to let the user do.
      sections:
        type: list
        items: UIPageSection
        description: Ordered list of primitive sections composing the page.

  ExperienceSpec:
    type: model
    fields:
      navigation_model:
        type: str
        description: How primary destinations are navigated (e.g. "top-level routes with shell navigation").
      brand_direction:
        type: str
        description: Brief summary of the desired app feel and experience posture.
      pages:
        type: list
        items: UIPage
        description: Complete ordered list of persistent pages for the app.

  DesignDocsBundle:
    type: model
    fields:
      agent_message:
        type: str
        description: Short summary of the completed design pass.
      frontend_markdown:
        type: str
        description: Complete frontend design document in Markdown.
      backend_markdown:
        type: str
        description: Complete backend design document in Markdown.
      database_markdown:
        type: str
        description: Complete data design document in Markdown.
      experience_spec:
        type: ExperienceSpec
        description: Typed UI experience specification — navigation model, brand direction, and the complete declarative page structure with primitive-level section intent. This is the machine-readable contract that AppPlanAgent uses as the authoritative page source.
      surface_map:
        type: DesignSurfaceMap
        description: Canonical typed surface realization contract mirrored into the saved backend and ui_schema docs.
      data_contract:
        type: DataContractBundle
        description: Canonical typed database ownership and migration contract persisted separately and staged as data/contract.json in generated app bundles.

