definitions:
  build_mode:
    type: string
    description: >
      Build mode for DesignDocs. `initial` is the normal downstream design pass;
      `revision` means the workflow was reopened to revise persisted design state.
    source:
      type: state
      default: initial
  revision_scope:
    type: string
    description: >
      Revision scope: patch | design | feature | core. When present,
      it describes why the control plane re-entered DesignDocs.
    source:
      type: state
      default: null
  change_request_id:
    type: string
    description: Stable lineage id for the active revision request.
    source:
      type: state
      default: null
  revision_id:
    type: string
    description: Runtime-generated revision run id for the current builder revision.
    source:
      type: state
      default: null
  artifact_kind:
    type: string
    description: >
      Artifact family that triggered the current reroute, such as app_bundle or
      workflow_bundle.
    source:
      type: state
      default: null
  artifact_version_id:
    type: string
    description: >
      Version id of the downstream artifact that triggered the reroute. Null
      for the first-pass design path.
    source:
      type: state
      default: null
  sequence_status:
    type: string
    description: >
      Builder sequence state before the revision launch: in_progress |
      completed | stale | revising.
    source:
      type: state
      default: in_progress
  revision_origin_workflow:
    type: string
    description: Workflow where the revision request originated before reroute.
    source:
      type: state
      default: null
  refinement_request:
    type: string
    description: >
      Raw user-supplied refinement request text passed through from the
      canonical RefinementRequest. When present, this is the design revision
      request DesignDocsAgent should anchor to first.
    source:
      type: state
      default: null
  refinement_request_meta:
    type: object
    description: >
      Full typed RefinementRequest payload persisted by the control plane.
      Useful when downstream agents need artifact ids, source surface, or other
      request metadata beyond the raw refinement text.
    source:
      type: state
      default: null
  screen:
    type: string
    description: >
      Builder surface or screen identifier that launched the current refinement
      request, such as studio-create. Preserved for analytics and future
      surface-aware prompt shaping.
    source:
      type: state
      default: null
  change_intent:
    type: object
    description: >
      Typed refinement classification emitted by the control plane. Contains the
      final `revision_scope`, rationale, and layer-touch information so
      DesignDocs can understand whether the revision is local, design-scoped,
      feature-extending, or concept-revising.
    source:
      type: state
      default: null
  impact_set:
    type: object
    description: >
      Typed downstream impact summary emitted by the control plane. Contains
      affected workflows, affected declarative families, restart_from, and
      rebuild/replanning flags for the current refinement request.
    source:
      type: state
      default: null
  pivot_description:
    type: string
    description: >
      User's original change request text, injected by the control plane when
      the active workflow_sequence is conceptual_replan. Describes the nature
      of the concept-level pivot so DesignDocs can align experience_spec to the
      new concept direction rather than revising from the previous design state.
    source:
      type: state
      default: null
  existing_concept_ref:
    type: string
    description: >
      Artifact version id of the concept at the time the conceptual_replan was
      triggered. Null when not available. Advisory context only — carry-forward
      behavior is future work.
    source:
      type: state
      default: null
  preserve_families:
    type: array
    description: >
      Artifact families that the conceptual_replan should preserve. Default is
      ["brand"]. DesignDocs should treat the existing brand direction as a
      constraint rather than regenerating visual identity from scratch.
      Carry-forward behavior is future work; this variable is context plumbing only.
    source:
      type: state
      default: []
  previous_brand_ref:
    type: string
    description: >
      Artifact version id of the brand/theme_config at the time the
      conceptual_replan was triggered. Null when not available.
    source:
      type: state
      default: null
  llm_profile:
    type: string
    description: >
      Advisory LLM profile name injected by the control plane when the
      active workflow_sequence requires stronger reasoning (conceptual_replan
      or full_rebuild). Maps to a named profile in ai.json llm_profiles.
      Null for patch, design, and feature routes. Advisory only.
    source:
      type: state
      default: null
  concept_overview:
    type: string
    description: Project description and overview from the BuilderConcepts collection (produced
      by ValueEngine).
    source:
      type: data_reference
      database_name: mozaiksai
      collection: BuilderConcepts
      query_template:
        app_id: '{{runtime.app_id}}'
      fields:
      - ConceptOverview
      default: null
  concept_blueprint:
    type: object
    description: >
      Full typed ConceptBlueprint from ValueEngine — the authoritative upstream concept
      artifact. Contains surface_candidate_hints (coarse realization hints for each
      likely surface), capability_pack_hints (upstream capability signals),
      brand_intent (style and experience direction), app_ui_requirements (UI capability
      needs), core_features, and api_endpoints. DesignDocs uses this as the primary
      surface and experience signal; concept_overview prose is the fallback when null.
    source:
      type: data_reference
      database_name: mozaiksai
      collection: BuilderConcepts
      query_template:
        app_id: '{{runtime.app_id}}'
      fields:
      - Blueprint
      default: null
  captured_theme_config:
    type: object
    description: >
      Canonical theme_config captured by ThemeCapture for this app. Contains the
      fully resolved visual identity: theme.primary (color token), theme.variant
      (modern/classic/brutalist), theme.appearance (dark/light/system),
      theme.density (compact/comfortable/spacious), identity (name, tagline),
      fonts (body, heading, logo), and colors (full semantic palette). DesignDocs
      uses this to anchor experience_spec.brand_direction to the committed visual
      posture rather than re-deriving it from prose.
    source:
      type: data_reference
      database_name: mozaiksai
      collection: ThemeCaptures
      query_template:
        app_id: '{{runtime.app_id}}'
      fields:
      - theme_config
      default: null
  monetization_enabled:
    type: boolean
    description: Flag indicating if monetization features are enabled.
    source:
      type: config
      env_var: MONETIZATION_ENABLED
      default: false
  builder_options:
    type: object
    description: Optional app-agnostic builder UI option payload carried through workflow sequences.
    source:
      type: state
      default: null
  coding_participation:
    type: string
    description: Build participation mode selected at the transition checkpoint after theme capture.
    source:
      type: state
      default: autonomous
  design_docs_hitl:
    type: boolean
    description: True when the user selected a guided design-doc checkpoint before generation continues.
    source:
      type: state
      default: false
  database_provider:
    type: string
    description: >
      Database provider selected at the build transition checkpoint.
      MongoDB is the current canonical provider.
    source:
      type: state
      default: mongodb
  database_setup_mode:
    type: string
    description: >
      Database setup mode selected at the build transition checkpoint:
      local, atlas, existing_uri, or skip.
    source:
      type: state
      default: local
agents:
  DesignDocsAgent:
    variables:
    - build_mode
    - revision_scope
    - change_request_id
    - revision_id
    - artifact_kind
    - artifact_version_id
    - sequence_status
    - revision_origin_workflow
    - refinement_request
    - refinement_request_meta
    - screen
    - change_intent
    - impact_set
    - pivot_description
    - existing_concept_ref
    - preserve_families
    - previous_brand_ref
    - llm_profile
    - concept_overview
    - concept_blueprint
    - captured_theme_config
    - monetization_enabled
    - coding_participation
    - design_docs_hitl
    - database_provider
    - database_setup_mode
