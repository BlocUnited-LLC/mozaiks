schema_version: mozaiks.orchestrator.v1
workflow_name: DesignDocs
# Add 3 initial selection turns to the prior 8-turn design/review ceiling.
# Owner reselection shares this fixed workflow budget.
max_turns: 11
human_in_the_loop: true
workflow_startup_mode: AgentDriven
orchestration_pattern: ag2_network
initial_message: 'Select verified reusable packs for the supplied approved app requirements
  as DesignPackSelection. After the selector records the candidate, generate the complete
  DesignDocsBundle containing frontend, backend and database documents, experience_spec,
  surface_map, data_contract and access_policy. The existing save boundary validates the
  design and separately requests owner review of selected sources and permissions.'
initial_agent: DesignPackSelectionAgent
failure_message_key: design_docs_failure_feedback

