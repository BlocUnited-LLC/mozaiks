transition_rules:
  # The app_media_jobs batch runs inside MediaPlanAgent's turn, so its results
  # are in context before the publisher speaks.
  - source_agent: MediaPlanAgent
    target_agent: MediaPublishAgent
    transition_type: after_turn
  - source_agent: MediaPublishAgent
    target_agent: terminate
    transition_type: condition
    condition_type: context_equals
    condition_key: app_media_complete
    condition_value: true
    transition_target: TerminateTarget
