definitions:
  runtime_smoke_tasks_results:
    type: object
    description: Aggregated worker outputs from workflow-local task batch execution.
    source:
      type: computed
      default: {}
  runtime_smoke_tasks_status:
    type: string
    description: Aggregate status emitted by the task batch executor.
    source:
      type: computed
      default: pending
  task_run_mode:
    type: boolean
    description: True when a worker is executing one scoped task batch item.
    source:
      type: computed
      default: false
  current_task_batch_id:
    type: string
    description: Current task batch id for worker calls.
    source:
      type: computed
      default: null
  current_task_id:
    type: string
    description: Current task id for worker calls.
    source:
      type: computed
      default: null
  current_task:
    type: object
    description: Current task object for worker calls.
    source:
      type: computed
      default: null
  task_batch_route_ready:
    type: boolean
    description: Enables deterministic context-equals routing from the planner to synthesis.
    source:
      type: state
      default: true
  task_batch_route_mode:
    type: string
    description: Routing mode for this smoke workflow.
    source:
      type: state
      default: task_batch

agents:
  TaskPlannerAgent:
    variables:
    - task_batch_route_ready
    - task_batch_route_mode
  ModuleTaskWorkerAgent:
    variables:
    - task_run_mode
    - current_task_batch_id
    - current_task_id
    - current_task
  PageTaskWorkerAgent:
    variables:
    - task_run_mode
    - current_task_batch_id
    - current_task_id
    - current_task
  IntegrationTaskWorkerAgent:
    variables:
    - task_run_mode
    - current_task_batch_id
    - current_task_id
    - current_task
  SynthesisAgent:
    variables:
    - runtime_smoke_tasks_results
    - runtime_smoke_tasks_status
    - task_batch_route_mode
