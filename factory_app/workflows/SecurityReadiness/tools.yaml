tools:
  - agent: SecurityReadinessAgent
    file: tools/inspect_generated_app_security.py
    function: inspect_generated_app_security
    description: >
      Inspect the verified archive of the current owned build artifact for baseline
      security readiness issues. Record explicit source diagnostics in the summary.
    tool_type: Agent_Tool
    auto_tool_call: false
  - agent: SecurityReadinessAgent
    file: tools/record_security_findings.py
    function: record_security_findings
    description: >
      Persist the latest security_readiness_findings into the first-party
      security_readiness module through the live session's permissioned action
      dispatch. Keep the review summary and explicit persistence failures in
      context_variables for AppReview.
    tool_type: Agent_Tool
    auto_tool_call: false
