definitions:
  generated_app_id:
    type: string
    authority_class: mutable_workflow_state
    authorization: false
    description: >
      Registry identity of the app being generated, reserved at pipeline start
      by ValueEngine's create_app_record lifecycle tool. Scopes artifact-store
      records, generated staging paths, app-registry updates, and app-context
      registration. Distinct from the immutable executing runtime app_id.
    source:
      type: state
      default: null

  app_id:
    type: string
    description: App identifier passed from AppGenerator.
    source:
      type: state
      default: null
  build_id:
    type: string
    description: Build attempt identifier passed from AppGenerator.
    source:
      type: state
      default: null
  build_registry_id:
    type: string
    authority_class: mutable_workflow_state
    authorization: false
    description: Hosted app registry record id for this build.
    source:
      type: state
      default: null
  artifact_version_id:
    type: string
    description: App bundle artifact version id being reviewed.
    source:
      type: state
      default: null
  bundle_path:
    type: string
    description: Absolute path to the staged generated app bundle root.
    source:
      type: state
      default: null
  generated_files:
    type: object
    description: Optional generated app files map from AppGenerator context.
    source:
      type: state
      default: {}
  app_build_plan:
    type: object
    description: Optional AppBuildPlan context used to infer auth, deployment, and selected packs.
    source:
      type: state
      default: {}
  security_readiness_mode:
    type: string
    description: Advisory by default; hosted overlays may later opt into blocking gates.
    source:
      type: state
      default: advisory
  security_readiness_findings:
    type: array
    description: Findings produced by inspect_generated_app_security.
    source:
      type: computed
      default: []
  security_readiness_summary:
    type: object
    description: Summary written by SecurityReadiness and surfaced by AppReview.
    source:
      type: computed
      default: {}
  security_readiness_recorded:
    type: boolean
    description: True when record_security_findings has completed for this run.
    source:
      type: computed
      default: false
  workflow_sequence:
    type: string
    description: Active workflow sequence id for build journey continuity.
    source:
      type: state
      default: null

agents:
  SecurityReadinessAgent:
    variables:
      - app_id
      - build_id
      - build_registry_id
      - artifact_version_id
      - bundle_path
      - generated_files
      - app_build_plan
      - security_readiness_mode
      - security_readiness_findings
      - security_readiness_summary
      - security_readiness_recorded
      - workflow_sequence
