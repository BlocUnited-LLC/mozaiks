version: 1
description: 'Curated domain catalog used as upstream prompt context for dynamic app decomposition. This file now focuses on domain planning priors: likely modules and recommended module archetypes. File families and implementation defaults live in file_contracts.yaml and module_archetypes.yaml. These are examples and priors, not strict contracts.'
global_base:
  description: "Foundational modules that apply across most app domains. Include only the ones a specific app actually needs \u2014 not all apps need all of these.\n"
  modules:
    auth:
      description: "Authentication flows \u2014 sign-in, sign-up, password reset, session management."
      recommended_module_type: standard
    users:
      description: "User profile management \u2014 identity, preferences, account lifecycle."
      recommended_module_type: standard
    organizations:
      description: "Multi-tenant org/workspace management \u2014 creation, membership, billing seat."
      recommended_module_type: standard
    roles_permissions:
      description: "Role-based access control \u2014 role definitions, assignments, permission checks."
      recommended_module_type: standard
    admin:
      description: "Platform admin shell \u2014 configuration, panel registration, operator actions."
      recommended_module_type: standard
    notifications:
      description: "User-facing notification delivery \u2014 in-app, email, push."
      recommended_module_type: standard
    files_media:
      description: "File upload, storage, and retrieval \u2014 documents, images, attachments."
      recommended_module_type: standard
    audit_logs:
      description: "Immutable audit trail \u2014 who did what, when, on which resource."
      recommended_module_type: standard
    settings:
      description: App-wide and user-level settings store.
      recommended_module_type: standard
    search:
      description: "Cross-entity search \u2014 full-text and filtered discovery."
      recommended_module_type: standard
