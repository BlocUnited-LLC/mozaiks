version: 1

description: >
  Curated domain catalog used as upstream prompt context for dynamic app
  decomposition. Domains contain common modules and module-specific files.
  These are examples and priors — not mandatory file lists. Agents should
  treat this catalog as a reference for choosing realistic modules and files,
  not as a strict contract.

# ---------------------------------------------------------------------------
# GLOBAL BASE — cross-domain modules that appear in nearly every app
# ---------------------------------------------------------------------------

global_base:
  description: >
    Foundational modules that apply across most app domains. Include only the
    ones a specific app actually needs — not all apps need all of these.
  modules:
    auth:
      description: Authentication flows — sign-in, sign-up, password reset, session management.
      files:
        module.yaml: Module identity, public auth actions.
        events.yaml: user.signed_in, user.signed_out, password.reset_requested.
        handler.py: Sign-in, sign-up, token refresh, logout actions.
        service.py: Auth logic, token generation, credential validation.
        repo.py: Session and credential persistence.
        models.py: Session, credential, and token document shapes.
        policy.py: Auth-gated access checks.

    users:
      description: User profile management — identity, preferences, account lifecycle.
      files:
        module.yaml: Module identity, profile actions.
        events.yaml: user.created, user.updated, user.deactivated.
        admin.yaml: User management panels — list, detail, deactivate.
        handler.py: Profile CRUD actions.
        service.py: Profile lifecycle logic, avatar handling.
        repo.py: User document persistence.
        models.py: User profile document shapes.
        policy.py: Owner and admin scoping.

    organizations:
      description: Multi-tenant org/workspace management — creation, membership, billing seat.
      files:
        module.yaml: Module identity, org actions.
        events.yaml: org.created, org.member_added, org.member_removed.
        settings.yaml: Org-level feature flags and preferences.
        admin.yaml: Org listing, member management, billing overview.
        handler.py: Org CRUD and membership actions.
        service.py: Invitation flow, seat enforcement, org lifecycle.
        repo.py: Org and membership persistence.
        models.py: Org, membership, and invitation document shapes.
        policy.py: Org-scoped query builders.

    roles_permissions:
      description: Role-based access control — role definitions, assignments, permission checks.
      files:
        module.yaml: Module identity, role/permission actions.
        handler.py: Role assignment and permission check actions.
        service.py: Permission evaluation, role hierarchy logic.
        repo.py: Role and assignment persistence.
        models.py: Role and permission document shapes.
        policy.py: Permission guard helpers used by other modules.

    admin:
      description: Platform admin shell — configuration, panel registration, operator actions.
      files:
        module.yaml: Module identity, admin control actions.
        admin.yaml: Top-level admin panels — overview, system health, config.
        settings.yaml: Platform-level admin toggles.
        handler.py: Admin action handlers.
        service.py: Admin control logic, operator tooling.
        repo.py: Admin config and audit persistence.
        models.py: Admin config document shapes.

    notifications:
      description: User-facing notification delivery — in-app, email, push.
      files:
        module.yaml: Module identity, notification actions.
        subscriptions.yaml: Subscribes to domain events to trigger delivery.
        settings.yaml: User notification preferences per channel.
        handler.py: Notification list and mark-read actions.
        service.py: Delivery routing, template rendering, channel selection.
        repo.py: Notification record persistence.
        models.py: Notification document shapes.

    files_media:
      description: File upload, storage, and retrieval — documents, images, attachments.
      files:
        module.yaml: Module identity, file actions.
        events.yaml: file.uploaded, file.deleted.
        settings.yaml: Upload size limits, allowed types.
        handler.py: Upload, retrieve, delete actions.
        service.py: Upload orchestration, virus scan hooks, CDN URL generation.
        repo.py: File metadata persistence.
        models.py: File metadata document shapes.
        client.py: Storage provider client (S3, GCS, Azure Blob).

    audit_logs:
      description: Immutable audit trail — who did what, when, on which resource.
      files:
        module.yaml: Module identity, log query actions.
        subscriptions.yaml: Subscribes to key domain events to append log entries.
        handler.py: Log listing and export actions.
        service.py: Log append and redaction logic.
        repo.py: Append-only log entry persistence.
        models.py: Log entry document shapes.
        queries.py: Filtered log retrieval, aggregation, export.

    settings:
      description: App-wide and user-level settings store.
      files:
        module.yaml: Module identity, settings read/write actions.
        settings.yaml: Canonical settings schema for this app.
        handler.py: Settings get/set actions.
        service.py: Settings validation, defaults resolution.
        repo.py: Settings persistence.
        models.py: Settings document shapes.

    search:
      description: Cross-entity search — full-text and filtered discovery.
      files:
        module.yaml: Module identity, search actions.
        subscriptions.yaml: Subscribes to entity events to maintain index.
        handler.py: Search query action.
        service.py: Query building, result ranking, index update orchestration.
        repo.py: Search index reads and writes.
        models.py: Search result and index entry shapes.
        queries.py: Filtered, faceted, and ranked query helpers.

# ---------------------------------------------------------------------------
# DOMAINS
# ---------------------------------------------------------------------------

domains:

  ecommerce:
    description: Online retail — product catalog, cart, checkout, orders, fulfillment.
    common_app_types:
      - online store
      - DTC brand
      - multi-vendor shop
      - subscription box
    modules:
      products:
        description: Product catalog — listings, variants, pricing, availability.
        files:
          module.yaml: Module identity, product CRUD actions.
          events.yaml: product.created, product.updated, product.archived.
          admin.yaml: Product list, editor, bulk actions.
          handler.py: Product CRUD actions.
          service.py: Catalog logic, SEO slug generation.
          repo.py: Product persistence.
          models.py: Product, variant, and image document shapes.
          variants.py: Variant combination and SKU resolution logic.
          pricing.py: Price calculation, discount application, tax-adjusted totals.

      inventory:
        description: Stock levels, reservations, and low-stock alerts.
        files:
          module.yaml: Module identity, inventory actions.
          events.yaml: inventory.low_stock, inventory.out_of_stock, inventory.restocked.
          subscriptions.yaml: Reacts to order.placed to decrement stock.
          notifications.yaml: Low-stock alerts for merchants.
          admin.yaml: Inventory dashboard, adjustment tools.
          handler.py: Stock level read and adjustment actions.
          service.py: Reservation logic, restock threshold checks.
          repo.py: Inventory record persistence.
          models.py: Stock level and reservation document shapes.

      cart:
        description: Shopping cart — add/remove items, apply coupons, persist session.
        files:
          module.yaml: Module identity, cart actions.
          handler.py: Add item, remove item, apply coupon, get cart actions.
          service.py: Cart validation, coupon evaluation, line item totals.
          repo.py: Cart session persistence.
          models.py: Cart, line item, and coupon document shapes.
          pricing.py: Cart-level discount and tax calculation.

      checkout:
        description: Checkout flow — address collection, payment, order confirmation.
        files:
          module.yaml: Module identity, checkout actions.
          events.yaml: checkout.completed, checkout.abandoned.
          notifications.yaml: Order confirmation notification.
          handler.py: Checkout initiation, address save, payment submit actions.
          service.py: Order creation, payment orchestration, inventory reservation.
          repo.py: Checkout session persistence.
          models.py: Checkout session and address document shapes.
          payment_adapter.py: Payment provider abstraction (Stripe, Braintree).

      orders:
        description: Order lifecycle — creation, tracking, cancellation, refunds.
        files:
          module.yaml: Module identity, order actions.
          events.yaml: order.placed, order.shipped, order.delivered, order.cancelled, order.refunded.
          subscriptions.yaml: Reacts to fulfillment events.
          notifications.yaml: Shipping and delivery status notifications.
          admin.yaml: Order list, detail view, refund tools.
          handler.py: Order query and management actions.
          service.py: Order state transitions, refund logic.
          repo.py: Order and line item persistence.
          models.py: Order, line item, and shipment document shapes.
          state_machine.py: Order lifecycle states and allowed transitions.

      fulfillment:
        description: Packing, shipping label generation, carrier integration.
        files:
          module.yaml: Module identity, fulfillment actions.
          events.yaml: fulfillment.shipped, fulfillment.delivered.
          subscriptions.yaml: Reacts to order.placed to queue fulfillment.
          handler.py: Label creation, shipment update actions.
          service.py: Carrier selection, label generation, tracking sync.
          repo.py: Shipment record persistence.
          models.py: Shipment and carrier document shapes.
          client.py: Carrier API client (EasyPost, ShipStation).
          fulfillment.py: Pick-pack logic, fulfillment routing rules.

      discounts:
        description: Coupon codes, promotional rules, and automatic discounts.
        files:
          module.yaml: Module identity, discount management actions.
          events.yaml: discount.applied, discount.expired.
          admin.yaml: Discount creation, usage analytics.
          handler.py: Create, list, and validate discount actions.
          service.py: Discount eligibility evaluation and application.
          repo.py: Discount rule and usage persistence.
          models.py: Discount rule and redemption document shapes.

      reviews:
        description: Product reviews and ratings.
        files:
          module.yaml: Module identity, review actions.
          events.yaml: review.submitted, review.approved, review.rejected.
          subscriptions.yaml: Reacts to order.delivered to prompt review request.
          notifications.yaml: Review prompt notification.
          admin.yaml: Review moderation queue.
          handler.py: Submit, list, and moderate review actions.
          service.py: Review validation, rating aggregation.
          repo.py: Review persistence.
          models.py: Review and rating document shapes.
          moderation.py: Content moderation rules and flagging logic.

  marketplace:
    description: Multi-sided marketplace — sellers, buyers, listings, transactions, trust.
    common_app_types:
      - peer-to-peer marketplace
      - service marketplace
      - rental platform
      - B2B exchange
    modules:
      listings:
        description: Seller-owned item or service listings — creation, search, availability.
        files:
          module.yaml: Module identity, listing CRUD actions.
          events.yaml: listing.created, listing.updated, listing.deactivated.
          admin.yaml: Listing moderation queue, featured listing controls.
          handler.py: Listing CRUD and search actions.
          service.py: Listing validation, slug generation, availability resolution.
          repo.py: Listing persistence.
          models.py: Listing and media document shapes.
          availability.py: Calendar-based availability and blackout logic.

      seller_profiles:
        description: Seller identity, verification, payout setup, and reputation.
        files:
          module.yaml: Module identity, seller profile actions.
          events.yaml: seller.verified, seller.payout_account_added.
          notifications.yaml: Verification status notifications.
          admin.yaml: Seller verification queue, KYC review.
          handler.py: Profile setup and verification actions.
          service.py: KYC orchestration, payout account linking.
          repo.py: Seller profile persistence.
          models.py: Seller profile and verification document shapes.

      transactions:
        description: Buyer–seller transaction lifecycle — escrow, release, disputes.
        files:
          module.yaml: Module identity, transaction actions.
          events.yaml: transaction.initiated, transaction.completed, transaction.disputed.
          subscriptions.yaml: Reacts to booking or order events to create transactions.
          notifications.yaml: Payment and payout notifications.
          handler.py: Transaction query and dispute actions.
          service.py: Escrow logic, payout release, dispute routing.
          repo.py: Transaction record persistence.
          models.py: Transaction and escrow document shapes.
          state_machine.py: Transaction lifecycle states.
          payment_adapter.py: Stripe Connect or platform payment provider.

      reviews_trust:
        description: Buyer and seller ratings, review moderation, trust signals.
        files:
          module.yaml: Module identity, review actions.
          events.yaml: review.submitted.
          subscriptions.yaml: Reacts to transaction.completed to prompt reviews.
          notifications.yaml: Review prompt and response notifications.
          admin.yaml: Review moderation tools.
          handler.py: Submit and list review actions.
          service.py: Review validation, trust score aggregation.
          repo.py: Review and trust signal persistence.
          models.py: Review and trust score document shapes.
          moderation.py: Content policy checks and auto-flagging.

      messaging:
        description: Buyer–seller in-listing messaging and pre-transaction chat.
        files:
          module.yaml: Module identity, messaging actions.
          events.yaml: message.sent, thread.created.
          notifications.yaml: New message notification.
          channels.yaml: WebSocket channel definitions for real-time delivery.
          handler.py: Thread and message actions.
          service.py: Message validation, thread management, read state tracking.
          repo.py: Thread and message persistence.
          models.py: Thread, message, and read-state document shapes.
          policy.py: Participant-scoped access checks.

      search_discovery:
        description: Listing search, filtering, ranking, and recommendation.
        files:
          module.yaml: Module identity, search and browse actions.
          subscriptions.yaml: Reacts to listing events to update search index.
          handler.py: Search query and browse actions.
          service.py: Filter building, ranking, index refresh.
          repo.py: Search index reads.
          models.py: Search result and facet shapes.
          ranking.py: Relevance scoring and promoted listing logic.

  saas:
    description: Software-as-a-service — subscriptions, seats, billing, usage, API access.
    common_app_types:
      - B2B SaaS tool
      - developer platform
      - internal tool
      - vertical SaaS
    modules:
      subscriptions:
        description: Plan selection, billing cycle, upgrades, downgrades, cancellations.
        files:
          module.yaml: Module identity, subscription management actions.
          events.yaml: subscription.created, subscription.upgraded, subscription.cancelled, subscription.past_due.
          subscriptions.yaml: Reacts to payment events.
          notifications.yaml: Trial expiry, renewal, and cancellation notifications.
          admin.yaml: Subscription overview, manual adjustments.
          handler.py: Subscription CRUD and plan change actions.
          service.py: Plan change proration, trial management, cancellation flow.
          repo.py: Subscription record persistence.
          models.py: Subscription and plan document shapes.
          client.py: Billing provider client (Stripe Billing, Paddle).

      usage_metering:
        description: Per-unit or seat-based usage tracking for quota enforcement and billing.
        files:
          module.yaml: Module identity, usage query actions.
          events.yaml: usage.limit_approached, usage.limit_reached.
          subscriptions.yaml: Reacts to subscription events to reset meters.
          notifications.yaml: Usage limit warning notifications.
          handler.py: Usage report and quota check actions.
          service.py: Usage aggregation, quota enforcement logic.
          repo.py: Usage event and counter persistence.
          models.py: Usage event and quota document shapes.
          usage_metering.py: Meter increment, rollup, and billing export logic.

      api_keys:
        description: API key lifecycle — generation, rotation, scoping, revocation.
        files:
          module.yaml: Module identity, API key management actions.
          events.yaml: api_key.created, api_key.revoked.
          admin.yaml: Key listing and forced revocation tools.
          handler.py: Key create, list, and revoke actions.
          service.py: Key generation, hashing, and scope validation.
          repo.py: Key record persistence.
          models.py: API key document shapes.
          policy.py: Scope-based access guard helpers.

      onboarding:
        description: New user and org onboarding flows — checklist, progress, prompts.
        files:
          module.yaml: Module identity, onboarding progress actions.
          events.yaml: onboarding.step_completed, onboarding.completed.
          subscriptions.yaml: Reacts to user.created to initialize onboarding state.
          notifications.yaml: Onboarding prompt and completion notifications.
          handler.py: Step completion and progress query actions.
          service.py: Checklist state machine, completion detection.
          repo.py: Onboarding progress persistence.
          models.py: Onboarding checklist and step document shapes.

      feature_flags:
        description: Plan-gated and experiment-based feature flag evaluation.
        files:
          module.yaml: Module identity, flag evaluation actions.
          settings.yaml: Feature flag definitions and default states.
          admin.yaml: Flag override controls per org or user.
          handler.py: Flag evaluation and override actions.
          service.py: Flag resolution — plan tier, org overrides, experiment cohort.
          repo.py: Flag state and override persistence.
          models.py: Flag definition and override document shapes.
          entitlements.py: Plan entitlement resolution and gate enforcement.

      teams:
        description: Workspace team membership, invitations, and seat management.
        files:
          module.yaml: Module identity, team management actions.
          events.yaml: team.member_invited, team.member_removed.
          notifications.yaml: Invitation and removal notifications.
          handler.py: Invite, remove, list member actions.
          service.py: Invitation flow, seat count enforcement.
          repo.py: Team membership persistence.
          models.py: Team and invitation document shapes.

  fintech_payments:
    description: Financial products — payments, wallets, transfers, compliance, ledger.
    common_app_types:
      - payment platform
      - digital wallet
      - neobank
      - lending app
      - expense management
    modules:
      wallet:
        description: User or org wallet — balances, credits, ledger entries.
        files:
          module.yaml: Module identity, wallet query and action endpoints.
          events.yaml: wallet.credited, wallet.debited, wallet.payout_requested.
          notifications.yaml: Balance change and payout status notifications.
          admin.yaml: Wallet balance view, manual adjustment tools.
          handler.py: Balance query, credit, debit, payout request actions.
          service.py: Balance management, payout eligibility checks.
          repo.py: Balance and ledger entry persistence.
          models.py: Balance projection and ledger entry document shapes.
          policy.py: Owner-scoped access guards.

      payments:
        description: Payment intent creation, capture, refunds, and provider integration.
        files:
          module.yaml: Module identity, payment actions.
          events.yaml: payment.succeeded, payment.failed, payment.refunded.
          subscriptions.yaml: Reacts to payment events to update wallet.
          notifications.yaml: Payment confirmation and failure notifications.
          handler.py: Payment initiation, capture, refund actions.
          service.py: Payment orchestration, retry logic, idempotency handling.
          repo.py: Payment record persistence.
          models.py: Payment intent and refund document shapes.
          client.py: Payment provider client (Stripe, Adyen, Braintree).
          payment_adapter.py: Provider-agnostic payment interface.

      invoices:
        description: Invoice generation, delivery, and payment tracking.
        files:
          module.yaml: Module identity, invoice actions.
          events.yaml: invoice.issued, invoice.paid, invoice.overdue.
          notifications.yaml: Invoice delivery and overdue reminders.
          admin.yaml: Invoice list, manual write-off tools.
          handler.py: Invoice create, list, and mark-paid actions.
          service.py: Invoice generation, line item totals, PDF rendering.
          repo.py: Invoice persistence.
          models.py: Invoice and line item document shapes.

      kyc_compliance:
        description: Identity verification and AML compliance workflows.
        files:
          module.yaml: Module identity, KYC submission and status actions.
          events.yaml: kyc.submitted, kyc.approved, kyc.rejected.
          notifications.yaml: Verification status notifications.
          admin.yaml: KYC review queue, manual override tools.
          handler.py: KYC submission and status query actions.
          service.py: Document verification orchestration, risk scoring.
          repo.py: KYC case persistence.
          models.py: KYC case and document document shapes.
          client.py: Identity verification provider client (Persona, Jumio, Onfido).

      transfers:
        description: Peer-to-peer and bank transfer initiation, scheduling, and status.
        files:
          module.yaml: Module identity, transfer actions.
          events.yaml: transfer.initiated, transfer.completed, transfer.failed.
          subscriptions.yaml: Reacts to transfer events to update balances.
          notifications.yaml: Transfer status notifications.
          handler.py: Transfer initiation and status query actions.
          service.py: Transfer validation, scheduling, bank routing.
          repo.py: Transfer record persistence.
          models.py: Transfer and bank account document shapes.
          state_machine.py: Transfer lifecycle states.

  social_community:
    description: Social networks, community platforms, forums, and fan communities.
    common_app_types:
      - social network
      - community forum
      - fan club
      - interest group
      - niche community
    modules:
      feed:
        description: Personalized activity feed — posts, reactions, ranking, pagination.
        files:
          module.yaml: Module identity, feed query actions.
          subscriptions.yaml: Reacts to post and follow events to update feed.
          handler.py: Feed list and refresh actions.
          service.py: Feed assembly, ranking, deduplication.
          repo.py: Feed item persistence.
          models.py: Feed item document shapes.
          ranking.py: Recency, engagement, and follow-graph scoring.

      posts:
        description: User-created content — text, media, polls.
        files:
          module.yaml: Module identity, post CRUD actions.
          events.yaml: post.created, post.deleted, post.reported.
          notifications.yaml: Mention and reply notifications.
          handler.py: Post create, list, delete, report actions.
          service.py: Post validation, mention parsing, media attachment.
          repo.py: Post persistence.
          models.py: Post and attachment document shapes.
          moderation.py: Content policy checks and auto-flagging.

      follows:
        description: Follow/unfollow graph — follower counts, mutual detection.
        files:
          module.yaml: Module identity, follow actions.
          events.yaml: follow.created, follow.removed.
          handler.py: Follow, unfollow, list followers/following actions.
          service.py: Follow graph management, mutual follow detection.
          repo.py: Follow edge persistence.
          models.py: Follow edge document shapes.

      reactions:
        description: Likes, emoji reactions, and aggregated reaction counts.
        files:
          module.yaml: Module identity, reaction actions.
          events.yaml: reaction.added, reaction.removed.
          handler.py: Add and remove reaction actions.
          service.py: Reaction toggle logic, count aggregation.
          repo.py: Reaction record persistence.
          models.py: Reaction document shapes.

      groups:
        description: Topic-based groups or communities — membership, rules, moderation.
        files:
          module.yaml: Module identity, group management actions.
          events.yaml: group.created, group.member_joined, group.member_removed.
          settings.yaml: Group privacy, posting rules, member approval settings.
          admin.yaml: Group oversight, bulk moderation tools.
          handler.py: Group CRUD and membership actions.
          service.py: Membership approval logic, group discovery.
          repo.py: Group and membership persistence.
          models.py: Group and membership document shapes.

      moderation:
        description: Content and user moderation — reports, queues, bans, appeals.
        files:
          module.yaml: Module identity, moderation actions.
          subscriptions.yaml: Reacts to report events to populate moderation queue.
          admin.yaml: Moderation queue, user ban tools, appeal review.
          handler.py: Report submission and moderation action endpoints.
          service.py: Report triage, escalation logic, ban enforcement.
          repo.py: Report and action record persistence.
          models.py: Report and moderation action document shapes.
          moderation.py: Auto-moderation rules and threshold logic.

  messaging_communication:
    description: Real-time and async messaging — DMs, threads, channels, announcements.
    common_app_types:
      - team messaging
      - community chat
      - customer inbox
      - announcement platform
    modules:
      threads:
        description: Threaded conversations — creation, participant management, read state.
        files:
          module.yaml: Module identity, thread actions.
          events.yaml: thread.created, thread.archived.
          handler.py: Thread create, list, archive actions.
          service.py: Thread creation, participant management.
          repo.py: Thread persistence.
          models.py: Thread and participant document shapes.
          policy.py: Participant-scoped access guards.

      messages:
        description: Message send, delivery, read receipts, and deletion.
        files:
          module.yaml: Module identity, message actions.
          events.yaml: message.sent, message.deleted.
          notifications.yaml: New message notification.
          channels.yaml: WebSocket channel definitions for real-time delivery.
          handler.py: Send, delete, list message actions.
          service.py: Message validation, read state update, preview generation.
          repo.py: Message and read-state persistence.
          models.py: Message and read-state document shapes.

      channels:
        description: Named broadcast channels — creation, membership, topic management.
        files:
          module.yaml: Module identity, channel management actions.
          events.yaml: channel.created, channel.member_added.
          settings.yaml: Channel notification and retention settings.
          handler.py: Channel CRUD and membership actions.
          service.py: Channel access control, topic management.
          repo.py: Channel and membership persistence.
          models.py: Channel and membership document shapes.

      announcements:
        description: Org-wide or audience-targeted broadcast announcements.
        files:
          module.yaml: Module identity, announcement actions.
          events.yaml: announcement.created.
          notifications.yaml: Announcement delivery notification.
          channels.yaml: Broadcast channel definitions.
          admin.yaml: Announcement composer and audience targeting.
          handler.py: Create and list announcement actions.
          service.py: Audience resolution, delivery scheduling.
          repo.py: Announcement persistence.
          models.py: Announcement and audience document shapes.

      presence:
        description: Online status, last-seen, and typing indicators.
        files:
          module.yaml: Module identity, presence query actions.
          handler.py: Presence update and query actions.
          service.py: Presence state management, heartbeat expiry.
          repo.py: Presence state persistence (low-TTL).
          models.py: Presence state document shapes.

  content_publishing:
    description: Content creation, editorial workflow, publishing, and distribution.
    common_app_types:
      - blog
      - newsletter
      - news site
      - documentation platform
      - digital magazine
    modules:
      posts:
        description: Article and post authoring — drafts, revisions, metadata.
        files:
          module.yaml: Module identity, post CRUD actions.
          events.yaml: post.published, post.unpublished, post.scheduled.
          admin.yaml: Post list, editor, scheduling tools.
          handler.py: Post CRUD and publish actions.
          service.py: Draft management, slug generation, SEO validation.
          repo.py: Post persistence.
          models.py: Post, revision, and tag document shapes.

      editorial_workflow:
        description: Review and approval flow for content before publication.
        files:
          module.yaml: Module identity, workflow actions.
          events.yaml: review.requested, review.approved, review.rejected.
          subscriptions.yaml: Reacts to post events to trigger review.
          notifications.yaml: Review request and decision notifications.
          handler.py: Submit for review, approve, reject actions.
          service.py: Workflow state management, reviewer assignment.
          repo.py: Workflow state persistence.
          models.py: Review state and assignment document shapes.
          state_machine.py: Editorial workflow states and allowed transitions.

      media_library:
        description: Image and video asset management for content.
        files:
          module.yaml: Module identity, media management actions.
          handler.py: Upload, list, tag, and delete media actions.
          service.py: Media processing, thumbnail generation, tagging.
          repo.py: Media metadata persistence.
          models.py: Media asset document shapes.
          client.py: CDN and image processing provider client.

      categories_tags:
        description: Taxonomy management — category trees and tag vocabularies.
        files:
          module.yaml: Module identity, taxonomy actions.
          admin.yaml: Category and tag editor.
          handler.py: Category and tag CRUD actions.
          service.py: Hierarchy management, slug deduplication.
          repo.py: Category and tag persistence.
          models.py: Category and tag document shapes.

      subscribers:
        description: Email subscriber list, subscription management, and segmentation.
        files:
          module.yaml: Module identity, subscriber actions.
          events.yaml: subscriber.added, subscriber.unsubscribed.
          notifications.yaml: Welcome and confirmation emails.
          admin.yaml: Subscriber list, segment management, export tools.
