version: 1
batches:
  - id: app_build_tasks
    trigger_agent: AppPlanAgent
    source:
      kind: context_variable
      path: app_task_batch_items
      task_model: ${build_task_model}
    worker:
      mode: ag2_agent
      agent_field: initial_agent
      prompt_field: initial_message
      context_fields:
        - task_id
        - task_type
        - capability_pack_id
        - surface_id
        - surface_kind
        - owned_paths
        - acceptance_criteria
        - context_variables
        - integration_needs
        - domain_context
    execution:
      concurrency: 8
      dependency_field: depends_on
      failure_policy: continue_with_available
      # Four total AG2 attempts per task, including its one bounded correction.
      # An output rejection defers correction to Factory policy without losing evidence.
      retry_limit: 3
      timeout_seconds: 600
    recovery:
      trigger_agent: AppValidationAgent
      request_key: app_task_recovery_request
      outcome_key: app_task_recovery_result
      status_key: app_task_recovery_status
      input_keys: [app_build_plan, build_timestamp]
    result:
      context_key: app_task_batch_results
      status_key: app_task_batch_status
      merge_strategy: collect_task_outputs
      require_owned_paths: true
