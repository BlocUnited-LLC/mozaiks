workflow_name: AppGenerator
max_turns: 25
human_in_the_loop: true
workflow_startup_mode: AgentDriven
orchestration_pattern: DefaultPattern
initial_message_to_user: null
initial_message: 'InterviewAgent: Greet the user, clarify the non-AI app scope,
  and gather any missing CRUD/page/auth/integration requirements before code generation
  begins.'
initial_agent: InterviewAgent
runtime_extensions:
  - kind: lifecycle_hooks
    entrypoint: workflows.AppGenerator.tools.platform.build_lifecycle:get_hooks