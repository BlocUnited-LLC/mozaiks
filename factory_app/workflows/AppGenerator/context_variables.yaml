definitions:
  platform_user_email:
    type: string
    description: >
      Email address of the authenticated platform user who started this AppGenerator
      session. Injected by the hosted platform at workflow start from the session JWT.
      Used by scaffold/config agents to populate `app/app.json` `admins` without
      prompting the user. Falls back to null in OSS / unauthenticated contexts, in
      which case InterviewAgent captures the email during the intake interview.
    source:
      type: state
      default: null
  build_registry_id:
    type: string
    description: >
      ID of the hosted app_registry record created at pipeline start by ValueEngine's
      create_app_record lifecycle tool. Flows through the full pipeline so
      generate_and_download can update the record to 'generated' once the bundle
      is written. Null in OSS/unauthenticated runs where app_registry is not installed.
    source:
      type: state
      default: null
  build_mode:
    type: string
    description: >
      Build mode for AppGenerator. `initial` means generate the app bundle from
      scratch; `revision` means revise an existing bundle from persisted state.
    source:
      type: state
      default: initial
  workflow_sequence:
    type: string
    description: >
      Active workflow sequence that launched this run, such as app_revision,
      app_surface_revision, conceptual_replan, or full_rebuild.
    source:
      type: state
      default: null
  revision_scope:
    type: string
    description: >
      Revision scope: patch | design | feature | core. Seeded by the
      refinement control plane. AppPlanAgent uses this to scope the rebuild —
      patch edits targeted files, feature extends the plan, core restarts.
    source:
      type: state
      default: null
  change_request_id:
    type: string
    description: Stable lineage id for the active revision request.
    source:
      type: state
      default: null
  revision_id:
    type: string
    description: Runtime-generated revision run id for the current builder revision.
    source:
      type: state
      default: null
  artifact_kind:
    type: string
    description: >
      Artifact family currently being refined, such as app_bundle or
      workflow_bundle. Seeded by the refinement control plane so AppGenerator
      can distinguish app-bundle-local work from broader cross-artifact changes.
    source:
      type: state
      default: null
  artifact_version_id:
    type: string
    description: >
      Version id of the app bundle artifact being refined. Null for initial
      generation runs. AppPlanAgent loads the existing build_tasks from this
      version when build_mode is revision.
    source:
      type: state
      default: null
  sequence_status:
    type: string
    description: >
      Builder sequence state before the revision launch: in_progress |
      completed | stale | revising.
    source:
      type: state
      default: in_progress
  revision_origin_workflow:
    type: string
    description: Workflow where the revision request originated before reroute.
    source:
      type: state
      default: null
  refinement_request:
    type: string
    description: >
      Raw user-supplied refinement request text, passed through from the
      canonical RefinementRequest. InterviewAgent reads this instead of re-interviewing when
      build_mode is revision.
    source:
      type: state
      default: null
  refinement_request_meta:
    type: object
    description: >
      Full typed RefinementRequest payload persisted by the control plane.
      Useful when downstream agents need artifact ids, source surface, or other
      request metadata beyond the raw refinement text.
    source:
      type: state
      default: null
  screen:
    type: string
    description: >
      Builder surface or screen identifier that launched the current refinement
      request, such as studio-create. Preserved for analytics and future
      surface-aware prompt shaping.
    source:
      type: state
      default: null
  change_intent:
    type: object
    description: >
      Typed refinement classification emitted by the control plane. Contains the
      final `revision_scope`, rationale, and layer-touch information so
      AppGenerator can distinguish a local patch from a wider feature or
      concept-driven restart.
    source:
      type: state
      default: null
  impact_set:
    type: object
    description: >
      Typed downstream impact summary emitted by the control plane. Contains
      affected workflows, affected declarative families, restart_from, and
      rebuild/replanning flags for the current refinement request.
    source:
      type: state
      default: null
  pivot_description:
    type: string
    description: >
      User's original change request text, injected by the control plane when
      the active workflow_sequence is conceptual_replan. Describes the nature
      of the concept-level pivot so AppPlanAgent can align the new build plan
      to explicit pivot intent rather than applying incremental revisions.
    source:
      type: state
      default: null
  preserve_families:
    type: array
    description: >
      Artifact families that the conceptual_replan should preserve. Default is
      ["brand"]. AppPlanAgent may use this to understand which artifact layers
      have preservation intent. Carry-forward behavior is future work.
    source:
      type: state
      default: []
  previous_app_bundle_ref:
    type: string
    description: >
      Artifact version id of the app bundle at the time the conceptual_replan
      was triggered. Null when not available. Advisory — no file copy or merge
      occurs from this reference in the current implementation.
    source:
      type: state
      default: null
  carry_forward_modules:
    type: array
    description: >
      Advisory list of module ids from the previous app bundle that AppPlanAgent
      may consider reusing during a conceptual_replan. Defaults to [] when not
      supplied by the workbench. This is a preservation hint only — AppPlanAgent
      must not blindly re-emit these modules. Each module must still fit the new
      concept and pass the standard capability-pack derivation. Domain-specific
      modules that no longer fit should be omitted. No automatic file copy or
      merge occurs.
    source:
      type: state
      default: []
  llm_profile:
    type: string
    description: >
      Advisory LLM profile name injected by the control plane when the
      active workflow_sequence requires stronger reasoning (conceptual_replan
      or full_rebuild). Maps to a named profile in ai.json llm_profiles.
      Null for patch, design, and feature routes. Advisory only.
    source:
      type: state
      default: null
  context_graph_pack:
    type: object
    description: >
      Compact Context Graph prompt pack loaded by the before_chat lifecycle
      tool. Contains the prompt-safe graph status, relevant paths, matched
      nodes, relationship hints, warnings, and semantic annotation targets.
      This is advisory code-context intelligence, not routing or execution
      authority.
    source:
      type: state
      default: null
  context_graph_catalog:
    type: object
    description: >
      Rich machine-readable Context Graph catalog for diagnostics and tooling.
      This is intentionally distinct from context_graph_pack. Populated by
      load_context_graph_context when a current app context graph or artifact
      workspace graph is available.
    source:
      type: state
      default: null
  context_graph_status:
    type: string
    description: >
      Startup load status for Context Graph prompt packs: loaded, unavailable,
      or null when the loader has not run.
    source:
      type: state
      default: null
  context_graph_reason:
    type: string
    description: >
      Specific Context Graph load reason such as missing_app_id,
      current_app_context_graph_unavailable, or context_refresh_prior_version.
      Null when graph prompt context loaded without a special condition.
    source:
      type: state
      default: null
  context_graph_warnings:
    type: array
    description: Warnings emitted while loading Context Graph context.
    source:
      type: state
      default: []
  context_graph_health:
    type: object
    description: >
      Deterministic Context Graph load health and coverage metadata, including
      scan limits, selected file counts, parser availability, and skipped-file
      counts when a local source scan was performed.
    source:
      type: state
      default: null
  current_app_context_version_id:
    type: string
    description: >
      Current AppContextVersion id evaluated before a revision workflow starts.
      Revision agents use this as the durable handle for source-backed App
      Intelligence, Context Graph, and source retrieval tools.
    source:
      type: state
      default: null
  app_context_summary:
    type: object
    description: >
      Prompt-safe summary of the current AppContextVersion, including artifact
      refs, source refs, ownership boundaries, stale status, and warnings.
      This is context authority for revision startup, not raw source content.
    source:
      type: state
      default: null
  app_context_required:
    type: boolean
    description: >
      True when this run is a refinement or revision route that must have a
      current AppContextVersion before agents perform build or edit work.
    source:
      type: state
      default: false
  app_intelligence_ready:
    type: boolean
    description: True when startup loaded an App Intelligence catalog.
    source:
      type: state
      default: false
  app_intelligence_status:
    type: string
    description: Startup load status for App Intelligence context.
    source:
      type: state
      default: null
  app_intelligence_summary:
    type: string
    description: Compact human-readable summary of indexed source coverage.
    source:
      type: state
      default: null
  app_intelligence_health:
    type: object
    description: App Intelligence coverage, scan health, and startup warnings.
    source:
      type: state
      default: null
  app_intelligence_catalog:
    type: object
    description: >
      Prompt-safe App Intelligence catalog containing architecture, capability,
      ownership, integration, data, and risk summaries. Exact code is not
      embedded here; agents use source retrieval tools for selected files.
    source:
      type: state
      default: null
  source_context_catalog:
    type: object
    description: >
      Prompt-safe source corpus catalog for indexed files, chunks, symbols, and
      imports. It is an index for retrieval, not full source content.
    source:
      type: state
      default: null
  app_type:
    type: string
    description: >
      Entry path selected at the app_type_selector gate. One of "greenfield_app"
      (fresh concept, no prior design docs) or "brownfield_app" (user has a rough
      idea or existing project).
      Seeded from gate context when navigating via the build journey. InterviewAgent
      uses this to tailor its opening questions — "greenfield_app" starts from
      scratch, "brownfield_app" asks what they already have.
    source:
      type: state
      default: "greenfield_app"
  builder_options:
    type: object
    description: Optional app-agnostic builder UI option payload carried through workflow sequences.
    source:
      type: state
      default: null
  concept_overview:
    type: string
    description: Project description and overview from the BuilderConcepts collection (produced
      by ValueEngine).
    source:
      type: data_reference
      database_name: mozaiksai
      collection: BuilderConcepts
      query_template:
        app_id: '{{runtime.app_id}}'
      fields:
      - ConceptOverview
      default: null
  concept_api_endpoints:
    type: array
    description: Optional API endpoints blueprint from the BuilderConcepts collection (produced
      by ValueEngine).
    source:
      type: data_reference
      database_name: mozaiksai
      collection: BuilderConcepts
      query_template:
        app_id: '{{runtime.app_id}}'
      fields:
      - ApiEndpoints
      default: []
  concept_blueprint:
    type: object
    description: Optional structured blueprint from the BuilderConcepts collection (produced
      by ValueEngine).
    source:
      type: data_reference
      database_name: mozaiksai
      collection: BuilderConcepts
      query_template:
        app_id: '{{runtime.app_id}}'
      fields:
      - Blueprint
      default: null
  frontend_design_document:
    type: string
    description: Latest frontend design document generated by DesignDocs (if available).
    source:
      type: data_reference
      database_name: mozaiksai
      collection: DesignDocuments
      query_template:
        app_id: '{{runtime.app_id}}'
        kind: frontend
        status: succeeded
      fields:
      - content
      default: null
  backend_design_document:
    type: string
    description: >
      Latest backend design document generated by DesignDocs (if available).
      Human-readable reference for backend rationale, API intent, and event architecture.
    source:
      type: data_reference
      database_name: mozaiksai
      collection: DesignDocuments
      query_template:
        app_id: '{{runtime.app_id}}'
        kind: backend
        status: succeeded
      fields:
      - content
      default: null
  database_design_document:
    type: string
    description: Latest database design document generated by DesignDocs (if available).
    source:
      type: data_reference
      database_name: mozaiksai
      collection: DesignDocuments
      query_template:
        app_id: '{{runtime.app_id}}'
        kind: database
        status: succeeded
      fields:
      - content
      default: null
  ui_design_document:
    type: string
    description: >
      Latest UI schema design document generated by DesignDocs (if available).
      YAML-formatted page-by-page layout guide using the platform primitive system.
      Primary input for AppSchemaAgent when producing AppSchemaOutput.
    source:
      type: data_reference
      database_name: mozaiksai
      collection: DesignDocuments
      query_template:
        app_id: '{{runtime.app_id}}'
        kind: ui_schema
        status: succeeded
      fields:
      - content
      default: null
  experience_spec_document:
    type: string
    description: >
      Human-readable YAML representation of the ExperienceSpec, generated from the
      typed experience_spec and stored as the ui_schema doc content. Used by
      AppSchemaAgent and AgentGenerator as a readable reference for persistent UI
      ownership and workflow touchpoints.
    source:
      type: data_reference
      database_name: mozaiksai
      collection: DesignDocuments
      query_template:
        app_id: '{{runtime.app_id}}'
        kind: ui_schema
        status: succeeded
      fields:
      - content
      default: null
  experience_spec:
    type: object
    description: >
      Typed ExperienceSpec from DesignDocs — the authoritative machine-readable
      page structure. Contains navigation_model, brand_direction, and pages[] with
      typed primitive section specifications (id, primitive, intent, config_hint).
      AppPlanAgent treats this as the canonical source for pages[] when present,
      mapping designed sections directly to sections_hint[] rather than inferring
      page structure from capability packs.
    source:
      type: data_reference
      database_name: mozaiksai
      collection: DesignDocuments
      query_template:
        app_id: '{{runtime.app_id}}'
        kind: ui_schema
        status: succeeded
      fields:
      - experience_spec
      default: null
  design_surface_map:
    type: object
    description: >
      Canonical typed surface realization contract persisted by DesignDocs.
      This is the primary machine-readable source for deciding which capability
      packs become modules, workflows, refinement surfaces, integrations, or UI-only surfaces.
    source:
      type: data_reference
      database_name: mozaiksai
      collection: DesignDocuments
      query_template:
        app_id: '{{runtime.app_id}}'
        kind: backend
        status: succeeded
      fields:
      - surface_map
      default: null
  data_contract:
    type: object
    description: >
      Canonical typed database ownership and migration contract persisted by DesignDocs.
      AppGenerator uses this as the source of truth for staged `data/contract.json`
      and for deterministic backend collection ownership.
    source:
      type: data_reference
      database_name: mozaiksai
      collection: DataContracts
      query_template:
        app_id: '{{runtime.app_id}}'
      fields:
      - data_contract
      default: null
  captured_theme_config:
    type: object
    description: >
      Most recent canonical theme_config captured by ThemeCapture for this app.
      Highest-fidelity visual input for AppSchemaAgent when deriving theme_config_patch.
    source:
      type: data_reference
      database_name: mozaiksai
      collection: ThemeCaptures
      query_template:
        app_id: '{{runtime.app_id}}'
      fields:
      - theme_config
      default: null
  subscription_contract:
    type: object
    description: >
      Provider-neutral SubscriptionContractOutput produced by
      SubscriptionContractDesigner in the current workflow sequence, when present.
      This is the canonical contract for config/subscriptions.yaml, entitlement
      gates, token wallets, token allowances, add-on products, generated
      usage/billing pages, and workflow/module metering declarations.
    source:
      type: state
      default: null
  subscription_contract_artifact:
    type: object
    description: >
      Latest persisted subscription_contract summary artifact. Used as a fallback
      when the current sequence did not carry subscription_contract in state.
    source:
      type: data_reference
      database_name: mozaiksai
      collection: ArtifactVersions
      query_template:
        app_id: '{{runtime.app_id}}'
        artifact_kind: subscription_contract
        artifact_key: subscription_contract
        lifecycle_status: current
      fields:
      - commit_metadata
      default: null
  revenue_model:
    type: string
    description: >
      Core OSS monetization route for the app being built. Determines whether
      subscription contracts, entitlement gates, token wallets, usage meters,
      and plan catalog artifacts are included in the build plan. "Monetized" is
      not a valid final model; it must resolve to a concrete route.
      Valid values: free | subscriptions | usage_based | custom | hybrid.
      Aliased values are mapped: pay_per_use -> usage_based and
      one_time_purchase -> custom.
    source:
      type: state
      default: free
  app_backend_url:
    type: string
    description: >
      Base HTTP URL of the active Mozaiks app host for this app.
      AI agents call this URL + the platform module action API to persist data
      and trigger domain events. Injected by the platform at workflow start when
      a backend instance exists; null in schema-only runs.
    source:
      type: state
      default: null
  agent_websocket_url:
    type: string
    description: WebSocket URL for the agent backend (typically produced by AgentGenerator
      export).
    source:
      type: data_reference
      database_name: mozaiksai
      collection: WorkflowExports
      query_template:
        app_id: '{{runtime.app_id}}'
        workflow_type: agent-generator
      fields:
      - agent_websocket_url
      default: null
  agent_api_url:
    type: string
    description: HTTP API URL for the agent backend (typically produced by AgentGenerator
      export).
    source:
      type: data_reference
      database_name: mozaiksai
      collection: WorkflowExports
      query_template:
        app_id: '{{runtime.app_id}}'
        workflow_type: agent-generator
      fields:
      - agent_api_url
      default: null
  agent_repo_url:
    type: string
    description: GitHub repository URL for the latest AgentGenerator export (if available).
    source:
      type: data_reference
      database_name: mozaiksai
      collection: WorkflowExports
      query_template:
        app_id: '{{runtime.app_id}}'
        workflow_type: agent-generator
      fields:
      - repo_url
      default: null
  agent_names:
    type: array
    description: Agent names extracted from the most recent AgentGenerator bundle export
      (if available).
    source:
      type: data_reference
      database_name: mozaiksai
      collection: WorkflowExports
      query_template:
        app_id: '{{runtime.app_id}}'
        workflow_type: agent-generator
      fields:
      - agent_names
      default: []
  tool_names:
    type: array
    description: Tool names extracted from the most recent AgentGenerator bundle export
      (if available).
    source:
      type: data_reference
      database_name: mozaiksai
      collection: WorkflowExports
      query_template:
        app_id: '{{runtime.app_id}}'
        workflow_type: agent-generator
      fields:
      - tool_names
      default: []
  available_agents:
    type: array
    description: Alias for agent_names (preferred downstream name).
    source:
      type: data_reference
      database_name: mozaiksai
      collection: WorkflowExports
      query_template:
        app_id: '{{runtime.app_id}}'
        workflow_type: agent-generator
      fields:
      - available_agents
      default: []
  available_tools:
    type: array
    description: Alias for tool_names (preferred downstream name).
    source:
      type: data_reference
      database_name: mozaiksai
      collection: WorkflowExports
      query_template:
        app_id: '{{runtime.app_id}}'
        workflow_type: agent-generator
      fields:
      - available_tools
      default: []
  workflow_integration_metadata:
    type: object
    description: >
      Canonical normalized AgentGenerator-to-AppGenerator handoff metadata for the
      latest workflow_bundle artifact. Contains contract_version, bundle_name,
      workflows[], and primary_workflow. Hydrated before AppGenerator agents run
      when a workflow_bundle artifact exists.
    source:
      type: computed
      default: null
  generated_workflow_integrations:
    type: array
    description: >
      Normalized list of AgentGenerator-produced workflow integrations. Each item
      carries workflow_name, capability_id, startup_mode, and trigger_events.
      AppGenerator uses this list to wire module capabilities, emitted events, and
      reactions deterministically.
    source:
      type: computed
      default: []
  workflow_bundle_artifact_version_id:
    type: string
    description: >
      Source artifact version id for the workflow_bundle artifact that hydrated
      workflow_integration_metadata. Null when AppGenerator is running without an
      upstream workflow bundle.
    source:
      type: computed
      default: null
  generated_workflow_name:
    type: string
    description: >
      Canonical name of the workflow generated by AgentGenerator for this app (e.g.
      "CustomerSupport"). Use this as the direct `workflow_id` when persistent
      page actions need to launch the workflow. This is not the value used in
      `workflow_capability_ids` for domain event wiring. Null when no
      AgentGenerator workflow has been produced for this app.
    source:
      type: data_reference
      database_name: mozaiksai
      collection: WorkflowExports
      query_template:
        app_id: '{{runtime.app_id}}'
        workflow_type: agent-generator
      fields:
      - workflow_name
      default: null
  generated_workflow_capability_id:
    type: string
    description: >
      Stable hyphenated capability ID for the AgentGenerator-produced workflow
      (e.g. "customer-support"). This is the value to use in workflow_capability_ids
      fields of module.yaml and events.yaml so the platform can resolve the workflow
      at runtime. Null when no workflow has been generated.
    source:
      type: data_reference
      database_name: mozaiksai
      collection: WorkflowExports
      query_template:
        app_id: '{{runtime.app_id}}'
        workflow_type: agent-generator
      fields:
      - capability_id
      default: null
  generated_workflow_startup_mode:
    type: string
    description: >
      Startup mode of the AgentGenerator-produced workflow: AgentDriven (agents speak
      first without user input) or UserDriven (waits for the user to send a message).
      AppPlanAgent and AppSchemaAgent use this only to shape launch expectations
      and copy. The runtime owns whether the workflow speaks first after session
      launch.
    source:
      type: data_reference
      database_name: mozaiksai
      collection: WorkflowExports
      query_template:
        app_id: '{{runtime.app_id}}'
        workflow_type: agent-generator
      fields:
      - workflow_startup_mode
      default: null
  generated_workflow_trigger_events:
    type: array
    description: >
      Trigger event contracts declared in the AgentGenerator-produced workflow's
      orchestrator.yaml triggers block. Each entry carries the event type and any
      capability_id that fires the workflow. ConfigMiddlewareAgent uses these when
      generating events.yaml subscriptions so domain events wire up to the correct
      workflow capability without hardcoding workflow names.
    source:
      type: data_reference
      database_name: mozaiksai
      collection: WorkflowExports
      query_template:
        app_id: '{{runtime.app_id}}'
        workflow_type: agent-generator
      fields:
      - trigger_events
      default: []
  workflow_integration_repair_status:
    type: string
    description: >
      Bounded repair status for AgentGenerator-to-AppGenerator workflow wiring.
      One of not_applicable | needs_revision | passed | blocked.
    source:
      type: computed
      default: null
  workflow_integration_repair_count:
    type: integer
    description: Number of workflow-integration repair passes already scheduled.
    source:
      type: computed
      default: 0
  workflow_integration_repair_max_attempts:
    type: integer
    description: Maximum automated workflow-integration repair attempts before blocking.
    source:
      type: computed
      default: 2
  workflow_integration_repair_request:
    type: string
    description: Focused ConfigMiddlewareAgent repair instruction derived from acceptance gate failures.
    source:
      type: computed
      default: null
  workflow_integration_repair_failed_tests:
    type: array
    description: Raw workflow integration failed tests that caused the repair pass.
    source:
      type: computed
      default: []
  workflow_integration_repair_result:
    type: object
    description: Full workflow integration repair scheduling result.
    source:
      type: computed
      default: null
  bundle_repair_status:
    type: string
    description: >
      Bounded repair status for deterministic generated-bundle scanner failures.
      One of not_applicable | needs_revision | passed | blocked.
    source:
      type: computed
      default: null
  bundle_repair_target:
    type: string
    description: >
      Agent that owns the next generated-bundle repair pass. Null unless
      bundle_repair_status is needs_revision.
    source:
      type: computed
      default: null
  bundle_repair_attempt_count:
    type: integer
    description: Number of generated-bundle scanner repair passes already scheduled.
    source:
      type: computed
      default: 0
  bundle_repair_max_attempts:
    type: integer
    description: Maximum automated generated-bundle scanner repair attempts before blocking.
    source:
      type: computed
      default: 2
  bundle_repair_request:
    type: string
    description: Focused repair instruction derived from generated-bundle scanner failures.
    source:
      type: computed
      default: null
  bundle_repair_errors:
    type: array
    description: Raw generated-bundle scanner errors that caused the repair pass.
    source:
      type: computed
      default: []
  bundle_repair_result:
    type: object
    description: Full generated-bundle scanner repair scheduling result.
    source:
      type: computed
      default: null
  interview_complete:
    type: boolean
    description: True once the intake interview has gathered enough non-AI product
      scope to begin app generation.
    source:
      type: state
      default: false
      triggers:
      - type: agent_text
        agent: InterviewAgent
        ui_hidden: true
        match:
          equals: NEXT
  app_build_plan:
    type: object
    description: Canonical app build plan derived from the brief and design documents.
      It defines capability packs, pages, entities, roles, integrations, theme preferences,
      and generation order for downstream code generation.
    source:
      type: computed
      default: null
  app_plan_ready:
    type: boolean
    description: True once AppPlanAgent has persisted the canonical app build plan.
    source:
      type: computed
      default: false
  app_task_batch_items:
    type: array
    description: Hydrated task batch items for each AppGenerator build task, written by app_build_plan.
    source:
      type: computed
      default: []
  app_task_batch_status:
    type: string
    description: >
      Status of AppGenerator task batch execution: planned | running |
      completed | failed.
    source:
      type: computed
      default: null
  app_task_batch_results:
    type: object
    description: Normalized results from AppGenerator task batch execution.
    source:
      type: computed
      default: null
  app_task_batch_results_summary:
    type: object
    description: Compact task batch status and task-key summary written after AssemblyAgent merges task outputs.
    source:
      type: computed
      default: null
  dev_pack_id:
    type: string
    description: >
      Active domain dev pack identifier. Used by middleware hooks such as
      hook_language_profile_context to load the correct language profile from
      build_context/{dev_pack_id}/language_profile.yaml. Projected from the
      active build context at launch time. Defaults to webapp_builder when not
      set by the active build context or sequence.
    source:
      type: state
      default: webapp_builder
  build_task_model:
    type: string
    description: >
      Qualified name of the domain task model used by the app_build_tasks
      batch. Resolved at task batch launch time from this context variable.
      Defaults to AppBuildTask for the webapp_builder domain. A future domain
      pack overrides this to supply its own task model without changing the
      harness contract.
    source:
      type: state
      default: AppBuildTask
  operator_capabilities:
    type: array
    description: >
      Capability identifiers enabled by the active workspace/operator build
      context. Empty list in OSS mode. Projected from
      build_context/{context_name}/context.yaml at launch time.
    source:
      type: build_context
      default: []
  capability_packs:
    type: array
    description: >
      Prompt-safe capability pack descriptors discovered from the active
      build_context/{context_name}/context.yaml when it declares pack:. Each
      entry is a CapabilityPack dict with fields such as id, capabilities,
      facades, pack_source_path, and capability_source.
      Empty list in OSS mode.
    source:
      type: build_context
      default: []
  capability_registry:
    type: object
    description: >
      Build-context deterministic capability routing rules. Maps capability
      identifiers to their implementation strategy (capability_pack_id,
      implementation_mode, surface_kind). AppPlanAgent consults this before
      LLM reasoning to route known operator capabilities deterministically.
      Empty dict in OSS mode. Projected from build_context/{context_name}/context.yaml
      at launch time.
    source:
      type: build_context
      default: {}
  operator_contracts:
    type: array
    description: >
      Prompt-safe typed operator contract descriptors loaded from the selected
      build_context/{context_name}/contract.yaml file and projected for this
      workflow.
    source:
      type: build_context
      default: []
  provider_backed_capabilities:
    type: array
    description: >
      Capabilities implemented by external, proprietary, or operator-managed
      providers rather than generated app-local internals.
    source:
      type: build_context
      default: []
  operator_policies:
    type: object
    description: >
      Build-time operator policies such as entitlement mode, billing mode,
      adapter boundaries, review requirements, or generation constraints.
    source:
      type: build_context
      default: {}
  app_manifest:
    type: object
    description: App manifest metadata used by AppSchemaAgent to persist app.json startup and validate page routes.
    source:
      type: computed
      default: null
  app_pages:
    type: array
    description: List of AppPageSchema objects persisted by AppSchemaAgent via save_app_schema.
    source:
      type: computed
      default: []
  app_theme_config_patch:
    type: object
    description: Partial brand/theme artifact persisted for this app (may be null).
    source:
      type: computed
      default: null
  app_shell_config:
    type: object
    description: Optional shell content/behavior config persisted by AppSchemaAgent.
    source:
      type: computed
      default: null
  app_asset_manifest:
    type: object
    description: Optional app asset inventory persisted by AppSchemaAgent.
    source:
      type: computed
      default: null
  app_custom_route_bundle:
    type: object
    description: Optional bounded custom full-page React route bundle persisted by AppSchemaAgent.
    source:
      type: computed
      default: null
  app_schema_ready:
    type: boolean
    description: True once AppSchemaAgent has persisted the app manifest and page schemas.
    source:
      type: computed
      default: false
  integration_needs:
    type: array
    description: >
      App-scoped third-party connector needs discovered by AppPlanAgent build
      tasks, task batch outputs, or task agents via record_integration_need.
      IntegrationReadinessAgent aggregates this list and prompts inline only for
      unresolved required integration setup.
    source:
      type: computed
      default: []
  integration_readiness_status:
    type: string
    description: >
      Integration readiness checkpoint status set by check_integration_readiness:
      ready | needs_configuration | blocked.
    source:
      type: computed
      default: null
  integration_readiness_result:
    type: object
    description: Raw result payload from the AppGenerator integration readiness checkpoint.
    source:
      type: computed
      default: null
  connector_inventory:
    type: object
    description: App-scoped connector inventory loaded from the platform connector store.
    source:
      type: computed
      default: null
  required_connector_services:
    type: array
    description: Normalized connector service ids required by the current app build.
    source:
      type: computed
      default: []
  ready_connector_services:
    type: array
    description: Normalized connector service ids ready for reuse by the current app build.
    source:
      type: computed
      default: []
  missing_connector_services:
    type: array
    description: Normalized required connector service ids still unresolved.
    source:
      type: computed
      default: []
  task_run_mode:
    type: boolean
    description: True when an AppGenerator agent is executing one scoped task batch item.
    source:
      type: state
      default: false
  current_build_task:
    type: object
    description: Current build task spec for task batch item execution.
    source:
      type: state
      default: null
  current_build_task_id:
    type: string
    description: Current build task identifier for task batch item execution.
    source:
      type: state
      default: null
  current_build_task_type:
    type: string
    description: Current build task type for task batch item execution.
    source:
      type: state
      default: null
  integration_tests_passed:
    type: boolean
    description: Set by run_integration_tests tool to route handoffs.
    source:
      type: computed
      default: false
  integration_test_result:
    type: object
    description: Raw integration test result payload (may be null).
    source:
      type: computed
      default: null
  pending_schema_migration:
    type: object
    description: >
      Migration document produced by DatabaseAgent during a refinement run.
      Null for greenfield generation runs. generate_and_download injects this
      into the bundle as data/migrations/{migration_id}.json when present.
    source:
      type: computed
      default: null
  app_validation_strategy:
    type: string
    description: >
      Requested validation strategy for AppGenerator code validation. Allowed values:
      e2b | local | skip. Null lets the validation tool resolve a runtime-appropriate
      default.
    source:
      type: state
      default: null
  app_validation_status:
    type: string
    description: >
      Validation outcome set by validate_app_build. One of pending | passed | failed | skipped.
    source:
      type: computed
      default: pending
  app_validation_strategy_used:
    type: string
    description: Resolved validation strategy actually used for the current run.
    source:
      type: computed
      default: null
  app_validation_preview_url:
    type: string
    description: Preview URL returned by app validation (may be null).
    source:
      type: computed
      default: null
  app_validation_result:
    type: object
    description: Raw app validation result payload (may be null).
    source:
      type: computed
      default: null
  wiring_validation_passed:
    type: boolean
    description: Set by the deterministic module/page wiring check.
    source:
      type: computed
      default: false
  wiring_validation_result:
    type: object
    description: Raw module/page wiring validation payload.
    source:
      type: computed
      default: null
  module_implementation_validation_passed:
    type: boolean
    description: Set by the deterministic module.yaml-to-backend implementation check.
    source:
      type: computed
      default: false
  module_implementation_validation_result:
    type: object
    description: Raw module implementation validation payload.
    source:
      type: computed
      default: null
  workflow_integration_validation_passed:
    type: boolean
    description: Set by the deterministic AgentGenerator workflow integration check.
    source:
      type: computed
      default: false
  workflow_integration_validation_result:
    type: object
    description: Raw AgentGenerator workflow integration validation result.
    source:
      type: computed
      default: null
  generated_app_dir:
    type: string
    description: Absolute path to the generated app bundle directory after schema save or download packaging.
    source:
      type: computed
      default: null
  generated_app_zip:
    type: string
    description: Absolute path to the generated ZIP bundle after DownloadAgent packaging.
    source:
      type: computed
      default: null
  download_status:
    type: string
    description: Download packaging status, such as ready or cancelled.
    source:
      type: computed
      default: null
  app_download_ready:
    type: boolean
    description: True after DownloadAgent has packaged the app bundle and the artifact UI has completed.
    source:
      type: computed
      default: false
  download_result:
    type: object
    description: Compact download packaging result with bundle paths and file count.
    source:
      type: computed
      default: null
  admin_registry:
    type: object
    description: >
      AdminRegistry dict persisted by save_admin_registry after AdminRegistryAgent runs.
      Contains schema_version and pages[] (id, label, path, icon, order, enabled, scope).
      Used by the module contract quality gate to validate that every admin.yaml panel
      `page` field references a declared page id. Null until AdminRegistryAgent completes.
    source:
      type: computed
      default: null
  app_ui_quality_status:
    type: string
    description: >
      UI schema quality gate outcome set by validate_app_ui_quality. One of
      passed | needs_revision | blocked. Drives AG2 transition routing after
      AppUIQualityAgent.
    source:
      type: computed
      default: null
  app_ui_quality_warnings:
    type: array
    description: Deterministic warnings produced by the app UI quality gate.
    source:
      type: computed
      default: []
  app_ui_quality_revision_count:
    type: integer
    description: Number of automated AppSchemaAgent revision loops used by the UI quality gate.
    source:
      type: computed
      default: 0
  app_ui_quality_revision_request:
    type: string
    description: Focused revision instruction passed back to AppSchemaAgent when UI quality needs revision.
    source:
      type: computed
      default: null
  app_ui_quality_result:
    type: object
    description: Raw app UI quality gate result payload.
    source:
      type: computed
      default: null
  module_contract_quality_status:
    type: string
    description: >
      Quality gate outcome set by review_module_contract_quality. One of
      passed | blocked. Drives handoff routing after ConfigMiddlewareAgent in
      the sequential (non-task_run_mode) path.
    source:
      type: computed
      default: null
  module_contract_quality_warnings:
    type: array
    description: >
      Deterministic warnings from audit_module_contracts. Populated by the
      hook_module_contract_quality_gate hook before ModuleContractQualityAgent
      speaks. Empty list when no issues are found.
    source:
      type: computed
      default: []
  module_runtime_quality_status:
    type: string
    description: >
      Quality gate outcome set by review_module_runtime_quality after
      ServiceAgent emits module backend Python. One of passed | needs_revision |
      blocked. Drives handoff routing before FrontendStubAgent.
    source:
      type: computed
      default: null
  module_runtime_quality_warnings:
    type: array
    description: >
      Deterministic warnings from the module runtime quality gate. Flags
      placeholder/sample/mock data, TODO runtime logic, and hardcoded
      stats/trends in generated module backend code.
    source:
      type: computed
      default: []
  module_runtime_quality_revision_count:
    type: integer
    description: Number of automated ServiceAgent revision loops already used by the runtime quality gate.
    source:
      type: computed
      default: 0
  module_runtime_quality_revision_request:
    type: string
    description: Revision instructions generated by the module runtime quality gate, or null when none are needed.
    source:
      type: computed
      default: null
  module_runtime_quality_result:
    type: object
    description: Raw module runtime quality result payload persisted by review_module_runtime_quality.
    source:
      type: computed
      default: null
  code_files:
    type: array
    description: >
      Accumulated generated file overlay entries emitted by AppGenerator agents
      and auto-save tools before AssemblyAgent writes the canonical
      generated_files map. Later entries with the same filename replace earlier
      entries.
    source:
      type: computed
      default: []
  deleted_files:
    type: array
    description: >
      Relative generated file paths that should be removed from the current
      assembled bundle during repair/refinement. Used when a stale or forbidden
      artifact must be deleted rather than overwritten.
    source:
      type: computed
      default: []
  generated_files:
    type: object
    description: Canonical generated app bundle file map assembled from schema and task-batch outputs.
    source:
      type: computed
      default: {}
  assembled_source:
    type: string
    description: Assembly source marker describing which canonical lanes produced generated_files.
    source:
      type: computed
      default: null
