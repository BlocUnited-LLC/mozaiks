handoff_rules:
- source_agent: user
  target_agent: InterviewAgent
  handoff_type: condition
  condition_type: expression
  condition_scope: null
  condition: ${interview_complete} == False
  transition_target: AgentTarget
- source_agent: InterviewAgent
  target_agent: user
  handoff_type: after_work
  condition_type: null
  condition_scope: null
  condition: null
  transition_target: RevertToUserTarget
- source_agent: InterviewAgent
  target_agent: AppPlanAgent
  handoff_type: condition
  condition_type: expression
  condition_scope: null
  condition: ${interview_complete} == True
  transition_target: AgentTarget
- source_agent: AppPlanAgent
  target_agent: AppSchemaAgent
  handoff_type: after_work
  condition_type: null
  condition_scope: null
  condition: null
  transition_target: AgentTarget
- source_agent: AppSchemaAgent
  target_agent: AppUIQualityAgent
  handoff_type: after_work
  condition_type: null
  condition_scope: null
  condition: null
  transition_target: AgentTarget
- source_agent: AppUIQualityAgent
  target_agent: AppSchemaAgent
  handoff_type: condition
  condition_type: expression
  condition_scope: null
  condition: ${app_ui_quality_status} == "needs_revision"
  transition_target: AgentTarget
- source_agent: AppUIQualityAgent
  target_agent: AdminRegistryAgent
  handoff_type: condition
  condition_type: expression
  condition_scope: null
  condition: ${app_ui_quality_status} == "passed"
  transition_target: AgentTarget
- source_agent: AdminRegistryAgent
  target_agent: AssemblyAgent
  handoff_type: after_work
  condition_type: null
  condition_scope: null
  condition: null
  transition_target: AgentTarget
- source_agent: AppUIQualityAgent
  target_agent: user
  handoff_type: condition
  condition_type: expression
  condition_scope: null
  condition: ${app_ui_quality_status} == "blocked"
  transition_target: RevertToUserTarget
- source_agent: AssemblyAgent
  target_agent: IntegrationReadinessAgent
  handoff_type: after_work
  condition_type: null
  condition_scope: null
  condition: null
  transition_target: AgentTarget
# Schema-driven path: schemas are written to disk by save_app_schema; check integration readiness before download
- source_agent: IntegrationReadinessAgent
  target_agent: DownloadAgent
  handoff_type: condition
  condition_type: expression
  condition_scope: null
  condition: ${app_schema_ready} == True and ${integration_readiness_status} != "blocked"
  transition_target: AgentTarget
# Code-generation path: check integration readiness before validation
- source_agent: IntegrationReadinessAgent
  target_agent: AppValidationAgent
  handoff_type: condition
  condition_type: expression
  condition_scope: null
  condition: ${app_schema_ready} != True and ${integration_readiness_status} != "blocked"
  transition_target: AgentTarget
- source_agent: IntegrationReadinessAgent
  target_agent: user
  handoff_type: condition
  condition_type: expression
  condition_scope: null
  condition: ${integration_readiness_status} == "blocked"
  transition_target: RevertToUserTarget
- source_agent: DatabaseAgent
  target_agent: terminate
  handoff_type: condition
  condition_type: expression
  condition_scope: null
  condition: ${task_run_mode} == True
  transition_target: TerminateTarget
- source_agent: DatabaseAgent
  target_agent: ConfigMiddlewareAgent
  handoff_type: after_work
  condition_type: null
  condition_scope: null
  condition: null
  transition_target: AgentTarget
- source_agent: ControlPlaneAgent
  target_agent: terminate
  handoff_type: condition
  condition_type: expression
  condition_scope: null
  condition: ${task_run_mode} == True
  transition_target: TerminateTarget
- source_agent: ControlPlaneAgent
  target_agent: AppValidationAgent
  handoff_type: after_work
  condition_type: null
  condition_scope: null
  condition: null
  transition_target: AgentTarget
- source_agent: ConfigMiddlewareAgent
  target_agent: ModuleContractQualityAgent
  handoff_type: after_work
  condition_type: null
  condition_scope: null
  condition: null
  transition_target: AgentTarget
- source_agent: ConfigMiddlewareAgent
  target_agent: terminate
  handoff_type: condition
  condition_type: expression
  condition_scope: null
  condition: ${task_run_mode} == True
  transition_target: TerminateTarget
- source_agent: ModuleContractQualityAgent
  target_agent: ModelAgent
  handoff_type: condition
  condition_type: expression
  condition_scope: null
  condition: ${module_contract_quality_status} == "passed"
  transition_target: AgentTarget
- source_agent: ModuleContractQualityAgent
  target_agent: user
  handoff_type: condition
  condition_type: expression
  condition_scope: null
  condition: ${module_contract_quality_status} == "blocked"
  transition_target: RevertToUserTarget
- source_agent: ModelAgent
  target_agent: terminate
  handoff_type: condition
  condition_type: expression
  condition_scope: null
  condition: ${task_run_mode} == True
  transition_target: TerminateTarget
- source_agent: ModelAgent
  target_agent: ServiceAgent
  handoff_type: after_work
  condition_type: null
  condition_scope: null
  condition: null
  transition_target: AgentTarget
- source_agent: ServiceAgent
  target_agent: ModuleRuntimeQualityAgent
  handoff_type: after_work
  condition_type: null
  condition_scope: null
  condition: null
  transition_target: AgentTarget
- source_agent: ModuleRuntimeQualityAgent
  target_agent: ServiceAgent
  handoff_type: condition
  condition_type: expression
  condition_scope: null
  condition: ${module_runtime_quality_status} == "needs_revision"
  transition_target: AgentTarget
- source_agent: ModuleRuntimeQualityAgent
  target_agent: FrontendStubAgent
  handoff_type: condition
  condition_type: expression
  condition_scope: null
  condition: ${module_runtime_quality_status} == "passed"
  transition_target: AgentTarget
- source_agent: ModuleRuntimeQualityAgent
  target_agent: user
  handoff_type: condition
  condition_type: expression
  condition_scope: null
  condition: ${module_runtime_quality_status} == "blocked"
  transition_target: RevertToUserTarget
- source_agent: FrontendStubAgent
  target_agent: terminate
  handoff_type: condition
  condition_type: expression
  condition_scope: null
  condition: ${task_run_mode} == True
  transition_target: TerminateTarget
- source_agent: FrontendStubAgent
  target_agent: ControllerAgent
  handoff_type: after_work
  condition_type: null
  condition_scope: null
  condition: null
  transition_target: AgentTarget
- source_agent: ControllerAgent
  target_agent: terminate
  handoff_type: condition
  condition_type: expression
  condition_scope: null
  condition: ${task_run_mode} == True
  transition_target: TerminateTarget
- source_agent: ControllerAgent
  target_agent: IntegrationReadinessAgent
  handoff_type: after_work
  condition_type: null
  condition_scope: null
  condition: null
  transition_target: AgentTarget
- source_agent: AppValidationAgent
  target_agent: IntegrationTestAgent
  handoff_type: condition
  condition_type: expression
  condition_scope: null
  condition: ${app_validation_status} != "failed"
  transition_target: AgentTarget
- source_agent: AppValidationAgent
  target_agent: DatabaseAgent
  handoff_type: after_work
  condition_type: null
  condition_scope: null
  condition: null
  transition_target: AgentTarget
- source_agent: IntegrationTestAgent
  target_agent: DownloadAgent
  handoff_type: condition
  condition_type: expression
  condition_scope: null
  condition: ${integration_tests_passed} == True
  transition_target: AgentTarget
- source_agent: IntegrationTestAgent
  target_agent: DatabaseAgent
  handoff_type: after_work
  condition_type: null
  condition_scope: null
  condition: null
  transition_target: AgentTarget
- source_agent: DownloadAgent
  target_agent: user
  handoff_type: after_work
  condition_type: null
  condition_scope: null
  condition: null
  transition_target: RevertToUserTarget
- source_agent: user
  target_agent: InterviewAgent
  handoff_type: condition
  condition_type: string_llm
  condition_scope: null
  condition: When the user requests changes to scope, pages, CRUD behavior, authentication,
    integrations, or other application requirements before finalizing the bundle.
  transition_target: AgentTarget
- source_agent: user
  target_agent: terminate
  handoff_type: condition
  condition_type: string_llm
  condition_scope: null
  condition: When the user confirms the app bundle download is complete and no further
    changes are needed.
  transition_target: TerminateTarget
