      ```

      For persistent CRUD apps, the `build_tasks` shape must include the persistence and backend paths explicitly. Minimal example:

      ```json
      {
        "data_contract": {
          "version": "1",
          "surfaces": [
            {
              "surface_id": "projects",
              "surface_kind": "module",
              "collections": [
                {
                  "module_id": "projects",
                  "name": "projects",
                  "entity_name": "projects",
                  "indexes": [
                    {"name": "project_owner_created_at", "keys": [{"field": "owner_id", "order": 1}, {"field": "created_at", "order": -1}]}
