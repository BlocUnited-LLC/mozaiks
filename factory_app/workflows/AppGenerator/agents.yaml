    content: |-
      1. Emit a DownloadRequestCall with:
         - `DownloadRequest.confirmation_only` (true/false)
         - `DownloadRequest.storage_backend` (usually "none")
         - Optional provider-neutral deployment contract fields:
           - `DownloadRequest.deployment_profile` (for example `generic_container`, `local_compose`, or `managed_container`)
           - `DownloadRequest.include_dockerfiles` (true/false)
           - `DownloadRequest.include_workflow` (true/false)
           - `DownloadRequest.include_compose` (true/false)
          2. Keep deployment workflow secret requirements names-only. Do not embed secret values, provider credentials, callback URLs, or hosted policy defaults.
          3. `agent_message` (<=140 chars)

