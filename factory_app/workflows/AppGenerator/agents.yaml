          "auth_strategy": "<string|null>",
          "service_scope": ["<string>"],
          "frontend_scope": ["<string>"],
          "theme_preferences": "<string|null>",
          "brand_intent": {
            "style_summary": "<string>",
            "brand_keywords": ["<string>"],
            "experience_goals": ["<string>"],
            "appearance_hint": "<string|null>"
          },
          "shell_preset_hint": "product_app | workspace_studio | public_plus_app | conversation_app | flow_app | null",
          "external_integrations": [
            { "name": "<string>", "kind": "<string>", "purpose": "<string>" }
          ],
          "event_flows": [
            {
              "event_type": "domain.messaging_core.message_sent",
              "producer_pack_id": "messaging_core",
              "producing_action": "send_message",
              "subscriber_intents": ["notify recipient", "optional AI thread summary"],
              "workflow_capability_ids": ["messaging_core.summarize_thread"]
            }
          ],
          "agent_backend_required": true,
          "data_contract": null,
          "data_contract": null,
          "pending_schema_migration": null,
          "build_tasks": [
            {
              "task_id": "task_control_plane_pack",
              "task_type": "control_plane_pack",
              "capability_pack_id": null,
              "surface_id": "app_refinement_harness",
              "surface_kind": "control_plane",
              "execution_target": "AppGenerator",
              "initial_agent": "ControlPlaneAgent",
              "description": "Generate the optional app-local refinement harness pack.",
              "initial_message": "Generate a declarative control-plane pack that routes scoped refinements to existing workflow_sequences only.",
              "owned_paths": ["control_plane/config/control_plane.yaml", "control_plane/config/tools.yaml"],
              "depends_on": [],
              "acceptance_criteria": ["Routes use workflow_sequence only", "No custom harness Python"]
            }
          ],
          "generation_order": ["<string>"]
        },
        "workflows": [
          {
            "name": "AppGenerator",
            "description": "Control-plane harness task",
