              "content": "schema_version: mozaiks.subscriptions.v1\n..."
            }
          ]
        },
        "code_files": [
          {
            "filename": "config/subscriptions.yaml",
            "content": "schema_version: mozaiks.subscriptions.v1\n..."
          }
        ],
