      logo_url:
        type: union
        variants:
        - str
        - 'null'
        description: Optional logo URL.
      favicon_url:
        type: union
        variants:
        - str
        - 'null'
        description: Optional favicon URL.

  AppThemeCorePatch:
    type: model
    fields:
      primary:
        type: union
        variants:
        - str
        - 'null'
        description: Optional primary color token name.
      variant:
        type: union
        variants:
        - str
        - 'null'
        description: Optional visual variant.
      radius:
        type: union
        variants:
        - str
        - 'null'
        description: Optional radius scale.
      font:
        type: union
        variants:
        - str
        - 'null'
        description: Optional body font token.
      font_heading:
        type: union
        variants:
        - str
        - 'null'
        description: Optional heading font token.
      appearance:
        type: union
        variants:
        - str
        - 'null'
        description: Optional appearance, usually dark, light, or system.
      density:
        type: union
        variants:
        - str
        - 'null'
        description: Optional density scale.
      branding:
        type: union
        variants:
        - AppThemeBrandingPatch
        - 'null'
        description: Optional branding patch.

  AppThemeIdentityPatch:
    type: model
    fields:
      name:
        type: union
        variants:
        - str
        - 'null'
        description: Optional identity name.
      tagline:
        type: union
        variants:
        - str
        - 'null'
        description: Optional tagline.
      app_name:
        type: union
        variants:
        - str
        - 'null'
        description: Optional app display name.

  AppThemeFontPatch:
    type: model
    fields:
      family:
        type: union
        variants:
        - str
        - 'null'
        description: Optional font family.
      fallbacks:
        type: union
        variants:
        - str
        - 'null'
        description: Optional CSS fallback list.
      googleFont:
        type: union
        variants:
        - str
        - 'null'
        description: Optional Google Fonts URL.
      localFont:
        type: union
        variants:
        - bool
        - 'null'
        description: Whether this is a local font.
      src:
        type: union
        variants:
        - str
        - 'null'
        description: Optional local font src.

  AppThemeFontsPatch:
    type: model
    fields:
      body:
        type: union
        variants:
        - AppThemeFontPatch
        - 'null'
        description: Optional body font patch.
      heading:
        type: union
        variants:
        - AppThemeFontPatch
        - 'null'
        description: Optional heading font patch.
      logo:
        type: union
        variants:
        - AppThemeFontPatch
        - 'null'
        description: Optional logo font patch.

  AppThemeConfigPatch:
    type: model
    fields:
      theme:
        type: union
        variants:
        - AppThemeCorePatch
        - 'null'
        description: Optional core theme token patch.
      identity:
        type: union
        variants:
        - AppThemeIdentityPatch
        - 'null'
        description: Optional identity patch.
      fonts:
        type: union
        variants:
        - AppThemeFontsPatch
        - 'null'
        description: Optional font patch.

  AppShellLogoPatch:
    type: model
    fields:
      src:
        type: union
        variants:
        - str
        - 'null'
        description: Optional logo src.
      wordmark:
        type: union
        variants:
        - str
        - 'null'
        description: Optional wordmark src.
      alt:
        type: union
        variants:
        - str
        - 'null'
        description: Optional alt text.
      href:
        type: union
        variants:
        - str
        - 'null'
        description: Optional logo link.

  AppShellActionIntent:
    type: literal
    values:
    - create_app
    - open_studio
    - open_notifications
    - open_settings
    - open_profile
    - custom

  AppShellActionSurface:
    type: literal
    values:
    - studio
    - app_studio
    - workflow_session
    - transition
    - public
    - page

  AppShellActionVariantWhen:
    type: model
    fields:
      surface:
        type: union
        variants:
        - AppShellActionSurface
        - 'null'
        description: Optional semantic surface match for this shell action variant.
      shellMode:
        type: union
        variants:
        - AppShellMode
        - 'null'
        description: Optional shell mode match.
      workflow_sequence:
        type: union
        variants:
        - str
        - 'null'
        description: Optional workflow sequence id such as build.
      transition:
        type: union
        variants:
        - str
        - 'null'
        description: Optional transition id.
      has_active_app:
        type: union
        variants:
        - bool
        - 'null'
        description: Optional active-app context requirement.

  AppShellHeaderActionVariant:
    type: model
    fields:
      when:
        type: AppShellActionVariantWhen
        description: Semantic shell context that activates this action variant.
      label:
        type: union
        variants:
        - str
        - 'null'
        description: Optional replacement label.
      path:
        type: union
        variants:
        - str
        - 'null'
        description: Optional replacement route path.
      pathTemplate:
        type: union
        variants:
        - str
        - 'null'
        description: Optional dynamic route template using {appId}; fallbackPath is used when variables are unavailable.
      fallbackPath:
        type: union
        variants:
        - str
        - 'null'
        description: Optional fallback route path for pathTemplate.
      variant:
        type: union
        variants:
        - str
        - 'null'
        description: Optional visual variant.
      icon:
        type: union
        variants:
        - str
        - 'null'
        description: Optional replacement icon asset filename.

  AppShellHeaderAction:
    type: model
    fields:
      id:
        type: str
        description: Stable action id.
      intent:
        type: union
        variants:
        - AppShellActionIntent
        - 'null'
        description: Optional semantic intent. Prefer finite intents over product-specific ids.
      label:
        type: str
        description: Action label.
      path:
        type: union
        variants:
        - str
        - 'null'
        description: Route path or transition path.
      pathTemplate:
        type: union
        variants:
        - str
        - 'null'
        description: Optional dynamic route template using {appId}.
      fallbackPath:
        type: union
        variants:
        - str
        - 'null'
        description: Optional fallback route path for pathTemplate.
      href:
        type: union
        variants:
        - str
        - 'null'
        description: Optional external URL.
      variants:
        type: optional_list
        items: AppShellHeaderActionVariant
        description: Optional semantic variants. Use for stateful label/target changes; do not encode raw route override rules.
      variant:
        type: union
        variants:
        - str
        - 'null'
        description: Optional visual variant.
      visible:
        type: bool
        description: Whether the action is visible.
        default: true

  AppShellHeaderPatch:
    type: model
    fields:
      logo:
        type: union
        variants:
        - AppShellLogoPatch
        - 'null'
        description: Optional shell logo patch.
      actions:
        type: optional_list
        items: AppShellHeaderAction
        description: Optional global shell actions. Use sparingly; prefer at most one primary action.

  AppShellShortcutsPatch:
    type: model
    fields:
      header:
        type: optional_list
        items: str
        description: Optional header shortcut ids.
      profile:
        type: optional_list
        items: str
        description: Optional profile shortcut ids.
      mobile:
        type: optional_list
        items: str
        description: Optional mobile bottom-bar shortcut ids.
      footer:
        type: optional_list
        items: str
        description: Optional footer shortcut ids.
      footerHideOnMobile:
        type: bool
        description: Whether footer shortcuts hide on mobile.
        default: true

  AppShellNavigationViewportPolicy:
    type: model
    fields:
      global:
        type: str
        description: >
          Placement for global app navigation on this viewport. Common values:
          header, sidebar, rail, bottomBar, sheet, more, hidden.
      local:
        type: str
        description: >
          Placement for local page/module navigation on this viewport. Common values:
          sidebar, rail, tabs, sheet, hidden.
      footer:
        type: str
        description: Footer visibility policy for this viewport. Use visible or hidden.

  AppShellNavigationPolicyPatch:
    type: model
    fields:
      desktop:
        type: union
        variants:
        - AppShellNavigationViewportPolicy
        - 'null'
        description: Desktop shell navigation placement policy.
      mobile:
        type: union
        variants:
        - AppShellNavigationViewportPolicy
        - 'null'
        description: Mobile shell navigation placement policy.
      maxMobileItems:
        type: int
        description: Maximum mobile bottom bar items. Must be 1-5.
        default: 5
      autoFromPages:
        type: bool
        description: Whether pages without explicit navigation metadata should become global nav items. Prefer false.
        default: false

  AppShellNavigationItemPatch:
    type: model
    fields:
      id:
        type: str
        description: Stable item id or shortcut id to merge from the route/shortcut catalog.
      label:
        type: union
        variants:
        - str
        - 'null'
        description: Optional custom label.
      path:
        type: union
        variants:
        - str
        - 'null'
        description: Optional route path.
      href:
        type: union
        variants:
        - str
        - 'null'
        description: Optional link href.
      icon:
        type: union
        variants:
        - str
        - 'null'
        description: Optional icon id.
      scope:
        type: literal
        values:
        - global
        - local
        - profile
        - footer
        description: Semantic navigation scope.
      order:
        type: union
        variants:
        - int
        - 'null'
        description: Optional sort order.
      requiresRole:
        type: union
        variants:
        - str
        - 'null'
        description: Optional role gate.
      visible:
        type: bool
        description: Whether the item is visible.
        default: true
      placement:
        type: union
        variants:
        - AppShellNavigationPlacement
        - 'null'
        description: Optional per-viewport placement override.

  AppShellNavigationPatch:
    type: model
    fields:
      policy:
        type: union
        variants:
        - AppShellNavigationPolicyPatch
        - 'null'
        description: Shell placement policy. Keep this small and app-wide.
      items:
        type: optional_list
        items: AppShellNavigationItemPatch
        description: >
          Optional app-level nav contributions for entries not owned by a page schema.
          Prefer page.navigation for page-owned routes and shortcuts for common chrome.

  AppShellChromeViewportPatch:
    type: model
    fields:
      header:
        type: union
        variants:
        - bool
        - 'null'
        default: null
        description: Whether the shell header/top bar is visible on this viewport.
      footer:
        type: union
        variants:
        - bool
        - 'null'
        default: null
        description: Whether the shell footer is visible on this viewport.
      bottomBar:
        type: union
        variants:
        - bool
        - 'null'
        default: null
        description: Whether the mobile-style bottom navigation bar is visible on this viewport.
      localNav:
        type: union
        variants:
        - bool
        - str
        - 'null'
        default: null
        description: Local navigation visibility or placement hint such as true, false, sidebar, rail, sheet, or tabs.

  AppShellChromeModePatch:
    type: model
    fields:
      desktop:
        type: union
        variants:
        - AppShellChromeViewportPatch
        - 'null'
        default: null
        description: Desktop chrome visibility for this shell mode.
      mobile:
        type: union
        variants:
        - AppShellChromeViewportPatch
        - 'null'
        default: null
        description: Mobile chrome visibility for this shell mode.

  AppShellChromeModesPatch:
    type: model
    fields:
      standard:
        type: union
        variants:
        - AppShellChromeModePatch
        - 'null'
        default: null
        description: Optional override for normal app pages.
      workspace:
        type: union
        variants:
        - AppShellChromeModePatch
        - 'null'
        default: null
        description: Optional override for dense dashboards, module workspaces, admin portals, or profile workspaces.
      conversation:
        type: union
        variants:
        - AppShellChromeModePatch
        - 'null'
        default: null
        description: Optional override for chat, DM, inbox, or realtime conversation routes.
      focused:
        type: union
        variants:
        - AppShellChromeModePatch
        - 'null'
        default: null
        description: Optional override for onboarding, setup, selection, review, and workflow transition routes.
      immersive:
        type: union
        variants:
        - AppShellChromeModePatch
        - 'null'
        default: null
        description: Optional override for full-canvas, media, map, game, or kiosk experiences.
      public:
        type: union
        variants:
        - AppShellChromeModePatch
        - 'null'
        default: null
        description: Optional override for public marketing, legal, or unauthenticated routes.

  AppShellChromePatch:
    type: model
    fields:
      defaultMode:
        type: union
        variants:
        - AppShellMode
        - 'null'
        default: null
        description: Default shell chrome mode for routes that do not declare shell_mode.
      modes:
        type: union
        variants:
        - AppShellChromeModesPatch
        - 'null'
        default: null
        description: Optional per-mode chrome overrides. Omit modes that can use platform defaults.

  AppShellConfigPatch:
    type: model
    fields:
      header:
        type: union
        variants:
        - AppShellHeaderPatch
        - 'null'
        description: Optional shell header patch for logo and sparse global actions.
      shortcuts:
        type: union
        variants:
        - AppShellShortcutsPatch
        - 'null'
        description: Optional canonical shell shortcuts. Allowed keys are header, profile, mobile, footer, and footerHideOnMobile only.
      navigation:
        type: union
        variants:
        - AppShellNavigationPatch
        - 'null'
        description: >
          Optional dynamic shell navigation policy/contributions. Use this to choose
          app-wide placement behavior; use AppPageSchema.navigation for page-owned items.
      chrome:
        type: union
        variants:
        - AppShellChromePatch
        - 'null'
        default: null
        description: >
          Optional shell chrome policy. Prefer route-level AppPageSchema.shell_mode
          and keep this policy compact; override only when the app needs different
          header/footer/bottom-bar visibility for the standard shell modes.

  AppSchemaOutput:
    type: model
    fields:
      agent_message:
        type: str
        description: Short summary of the schema produced.
      manifest:
        type: AppManifest
        description: >
          App metadata used to persist app.json startup and validate page routes.
          Persistent routes are derived from the emitted ui/pages/*.yaml schemas.
      pages:
        type: list
        items: AppPageSchema
        description: >
          One AppPageSchema per page. Each is persisted as ui/pages/{name}.yaml and
          rendered by the platform shell's RouteRenderer using the primitive system.
          Prefer this declarative lane by default; emit an empty list only when every
          persistent page is owned by custom_route_bundle.
      custom_route_bundle:
        type: union
        variants:
        - AppCustomRouteBundle
        - 'null'
        description: >
          Rare bounded custom full-page React escape hatch. When present, save_app_schema
          persists ui/route_manifest.json, ui/pages/custom/*.jsx, and a deterministic
          ui/index.js registry barrel. Use only for persistent pages that the shipped
          declarative primitives cannot express cleanly.
      theme_config_patch:
        type: union
        variants:
        - AppThemeConfigPatch
        - 'null'
        description: >
          Partial brand/theme artifact patch merged into brand/theme_config.json by
          save_app_schema. This may include `theme`, `primitives`, and semantic
          `ui.chat` / `ui.shell` / `ui.page` visual tokens. Null to inherit the
          platform default brand.
      shell_config:
        type: union
        variants:
        - AppShellConfigPatch
        - 'null'
        description: >
          Optional compact shell behavior config persisted as config/shell.json.
          Prefer null when platform defaults are enough. When needed, use
          header.logo/actions, canonical shortcuts, navigation.policy,
          non-page-owned navigation.items, and chrome mode overrides only.
          shortcuts may only contain header, profile, mobile, footer, and
          footerHideOnMobile. This must not contain raw spacing, padding, density
          tokens or custom shortcut catalogs.
      asset_manifest:
        type: union
        variants:
        - AppAssetManifest
        - 'null'
        description: >
          Optional asset inventory persisted as config/asset_manifest.json. Use this
          for non-token media metadata (logos/icons/hero imagery) and asset
          provenance; do not use theme_config_patch or shell_config as a media dump.
      data_contract:
        type: union
        variants:
        - DataContract
        - 'null'
        default: null
        description: >
          Optional data contract persisted as data/contract.json. Leave null only
          for apps with no durable app-owned persistence. Use it for module
          collections, cross-module aggregate ownership, or an explicit existing
          database contract. Do not emit helper code under services/data/.
          Do not emit ad hoc shared folders or non-canonical app/backend helper names.

  DataContractAlias:
    type: model
    fields:
      alias:
        type: str
        description: Namespaced alias for the collection or lifecycle path.
      collection:
        type: str
        description: Canonical collection name referenced by the alias.
      owner_module:
        type: str
        description: Module that owns the collection or lifecycle contract.
      access:
        type: union
        variants:
        - str
        - 'null'
        description: Optional access label such as lifecycle_update.
      description:
        type: union
        variants:
        - str
        - 'null'
        description: Optional human-readable rationale for the alias.

  DataContractOwnership:
    type: model
    fields:
      surface_id:
        type: str
        description: Surface identifier that owns this collection — matches the parent DataContractSurface.surface_id.
      surface_kind:
        type: str
        description: Surface kind — typically "module".

  DataContractLifecycle:
    type: model
    fields:
      write_mode:
        type: str
        description: How records are written — e.g. "module_action" or "direct".
      migration_policy:
        type: union
        variants:
        - str
        - 'null'
        description: Migration policy — e.g. "additive_only". Null to inherit the platform default.

  DataContractField:
    type: model
    fields:
      name:
        type: str
        description: Field name as stored in the document.
      type:
        type: str
        description: Field value type — e.g. "string", "int", "bool", "datetime".
      required:
        type: union
        variants:
        - bool
        - 'null'
        description: Whether the field is required on write. Null means optional.

  DataContractIndexKey:
    type: model
    fields:
      field:
        type: str
        description: Document field path to index.
      order:
        type: int
        description: Sort order — 1 for ascending, -1 for descending.

  DataContractIndex:
    type: model
    fields:
      name:
        type: union
        variants:
        - str
        - 'null'
        description: Optional index name.
      keys:
        type: list
        items: DataContractIndexKey
        description: >
          Ordered list of index keys. Each key specifies a field and sort direction.
          Example: [{"field": "app_id", "order": 1}, {"field": "created_at", "order": -1}].
      unique:
        type: union
        variants:
        - bool
        - 'null'
        description: Whether the index enforces uniqueness. Null means non-unique.
      sparse:
        type: union
        variants:
        - bool
        - 'null'
        description: Whether the index skips documents missing the indexed field.

  DataContractCollection:
    type: model
    fields:
      name:
        type: str
        description: Canonical collection name used in ctx.persistence.collection(module_id, name).
      scope:
        type: str
        description: Isolation scope — typically "app".
      ownership:
        type: DataContractOwnership
        description: >
          Ownership record with surface_id and surface_kind matching the parent surface.
      fields:
        type: optional_list
        items: DataContractField
        description: Field declarations for this collection.
      indexes:
        type: optional_list
        items: DataContractIndex
        description: Index declarations for this collection.
      lifecycle:
        type: union
        variants:
        - DataContractLifecycle
        - 'null'
        description: Optional lifecycle policy. Null to use platform defaults.

  DataContractSurface:
    type: model
    fields:
      surface_id:
        type: str
        description: >
          Stable identifier for this persistence surface — typically matches the module_id
          that owns these collections (e.g., "tasks", "projects").
      surface_kind:
        type: str
        description: >
          Surface kind — typically "module". Use "external" for existing-DB surfaces.
      collections:
        type: list
        items: DataContractCollection
        description: Collections owned by this surface.

  DataContract:
    type: model
    fields:
      version:
        type: str
        description: Contract version string — use "1".
      surfaces:
        type: list
        items: DataContractSurface
        description: >
          Persistence surfaces. One entry per module that owns durable collections.
          Each surface declares its collections with fields, indexes, and lifecycle policy.
          Required — must be a non-empty list for apps with durable persistence.
      aliases:
        type: optional_list
        items: DataContractAlias
        description: >
          Optional cross-surface alias declarations for collections accessed
          outside their owning module. Omit when all access is module-local.
      shared_collections:
        type: optional_list
        items: str
        description: >
          Optional explicit list of collection names shared across surfaces.
          Omit when all collections are owned by a single module.

  ControllerOutput:
    type: model
    fields:
      mode:
        type: literal
        values:
        - module_api_adapter
        - app_backend_admin_surface
        description: Whether ControllerAgent emitted a module API adapter or the app-backend admin surface.
      app_backend_admin_config:
        type: union
        variants:
        - AppBackendAdminConfig
        - 'null'
        description: >
          Typed split app-backend admin config. Required in app_backend_admin_surface
          mode and null for normal module API adapter output.
      code_files:
        type: list
        items: CodeFileEntry
        description: >
          Serialized code files for the bounded API surface. The download/assembly
          path may regenerate canonical split admin files from app_backend_admin_config.
      agent_message:
        type: union
        variants:
        - str
        - 'null'
        description: Optional summary message.

  ImplementedPythonStub:
    type: model
    fields:
      path:
        type: str
        description: Concrete module-local Python file path to write, such as modules/task_manager/backend/handler.py.
      kind:
        type: literal
        values:
        - handler
        - service
        - repo
        - policy
        - schemas
        - settings_hook
        - notifications_hook
        - admin_hook
        - helper
        description: Stub family. Must match the declared module_contract.python_stubs entry.
      purpose:
        type: str
        description: Why this implemented Python stub exists.
      contract_refs:
        type: optional_list
        items: str
        description: Contract fields or entrypoints this file satisfies.
      content:
        type: str
        description: Complete Python source for this stub file.

  ServiceOutput:
    type: model
    fields:
      python_files:
        type: list
        items: ImplementedPythonStub
        description: >
          Implemented module backend stub files. These are the typed source of truth
          for ServiceAgent-owned Python outputs and must align with module_contract.python_stubs.
      code_files:
        type: list
        items: CodeFileEntry
        description: Serialized file mirror. Extraction may rebuild canonical files from python_files.
      agent_message:
        type: union
        variants:
        - str
        - 'null'
        description: Optional summary message.

  ImplementedJsStub:
    type: model
    fields:
      path:
        type: str
        description: Concrete frontend stub file path to write, such as ui/admin/CampaignMetricsPanel.jsx.
      surface:
        type: literal
        values:
        - admin_component
        description: Declared frontend customization surface. Must match the declared module_contract.js_stubs entry.
      registry_key:
        type: str
        description: Component registry key consumed by the app-level registration barrel.
      purpose:
        type: str
        description: Why this implemented JS stub exists.
      contract_refs:
        type: optional_list
        items: str
        description: Contract fields that reference this file or registry key.
      content:
        type: str
        description: Complete JS/JSX source for this stub file.

  FrontendStubOutput:
    type: model
    fields:
      js_files:
        type: list
        items: ImplementedJsStub
        description: >
          Implemented frontend customization files. These are the typed source of truth
          for FrontendStubAgent-owned JS/JSX outputs and must align with module_contract.js_stubs.
      registration_barrel:
        type: union
        variants:
        - str
        - 'null'
        description: Deterministic ui/index.js registration barrel content. Null only when no-op barrel is intentionally omitted.
      code_files:
        type: list
        items: CodeFileEntry
        description: Serialized file mirror. Extraction may rebuild canonical files from js_files + registration_barrel.
      agent_message:
        type: union
        variants:
        - str
        - 'null'
        description: Optional summary message.

  AdminRegistryOutput:
    type: model
    fields:
      admin_registry:
        type: AdminRegistry
        description: The admin portal page registry for this generated app. Serialized to admin/admin_registry.yaml.
      code_files:
        type: list
        items: CodeFileEntry
        description: Serialized file mirror — always includes admin/admin_registry.yaml.
      agent_message:
        type: union
        variants:
        - str
        - 'null'
        description: Optional summary message.

  IntegrationReadinessSummary:
    type: model
    fields:
      status:
        type: literal
        values:
        - ready
        - needs_configuration
        - blocked
        description: Connector readiness state after checking app-scoped integrations.
      ready:
        type: bool
        description: Whether downstream validation/download may continue.
      checked_services:
        type: optional_list
        items: str
        description: Connector services considered by this checkpoint.
      ready_services:
        type: optional_list
        items: str
        description: Connector services already ready or collected inline.
      unresolved_required_services:
        type: optional_list
        items: str
        description: Required connector services still missing.
      agent_message:
        type: str
        description: Short readiness summary for the user.

  IntegrationReadinessOutput:
    type: model
    fields:
      integration_readiness:
        type: IntegrationReadinessSummary
        description: AppGenerator integration readiness checkpoint result.

registry:
  InterviewAgent: null
  AppPlanAgent: AppBuildPlanOutput
  AppSchemaAgent: AppSchemaOutput
  AppUIQualityAgent: AppUIQualityReviewRequest
  AdminRegistryAgent: AdminRegistryOutput
  IntegrationReadinessAgent: IntegrationReadinessOutput
  DatabaseAgent: DatabaseOutput
  ControlPlaneAgent: ControlPlaneOutput
  ConfigMiddlewareAgent: ConfigMiddlewareOutput
  ModuleContractQualityAgent: ModuleContractQualityReviewRequest
  ModelAgent: ModelOutput
  ServiceAgent: ServiceOutput
  ModuleRuntimeQualityAgent: ModuleRuntimeQualityReviewRequest
  FrontendStubAgent: FrontendStubOutput
  ControllerAgent: ControllerOutput
  AssemblyAgent: CodeFilesOutput
  AppValidationAgent: AppValidationRequestCall
  DownloadAgent: DownloadRequestCall


