      event_triggers:
        type: optional_list
        items: str
        description: Optional event triggers.
      roles:
        type: optional_list
        items: str
        description: Optional visibility roles.

  AppGridConfig:
    type: model
    fields:
      columns:
        type: int
        description: Grid columns, 1 through 6.
      gap:
        type: union
        variants:
        - str
        - 'null'
        description: Optional grid gap.
      children:
        type: list
        items: AppPageChildSection
        description: Child primitive sections. Required for Grid.

  AppModalConfig:
    type: model
    fields:
      title:
        type: union
        variants:
        - str
        - 'null'
        description: Optional modal title.
      description:
        type: union
        variants:
        - str
        - 'null'
        description: Optional modal copy.
      size:
        type: union
        variants:
        - str
        - 'null'
        description: "Optional size: small, medium, large, or full."
      actions:
        type: optional_list
        items: AppPageAction
        description: Optional modal actions.
      children:
        type: optional_list
        items: AppPageChildSection
        description: Optional child sections.

  AppPageSectionConfig:
    type: union
    variants:
    - AppPageHeaderConfig
    - AppResourceTableConfig
    - AppSummaryStripConfig
    - AppInlineEmptyStateConfig
    - AppLoadingStateConfig
    - AppErrorStateConfig
    - AppPanelConfig
    - AppSurfaceCardConfig
    - AppStatusPillConfig
    - AppMetricConfig
    - AppSegmentedBarConfig
    - AppDataTableConfig
    - AppFormConfig
    - AppGridConfig
    - AppButtonConfig
    - AppModalConfig
    - AppAlertConfig
    - AppSkeletonConfig
    - AppEmptyConfig
    - AppTimelineConfig
    - AppCodeBlockConfig
    - AppProgressTrackerConfig
    - AppAlertBannerConfig
    - AppActionButtonConfig
    - AppFileListConfig

  AppPageSlotExtension:
    type: model
    fields:
      slot:
        type: literal
        values:
        - header
        - empty_state
        - hero
        - sidebar
        - actions_bar
        description: >
          Named UI zone this extension replaces within an otherwise declarative page.
          header replaces the page header area; empty_state replaces the empty state of
          the main data section; hero replaces the above-fold hero for gallery/landing
          pages; sidebar provides custom sidebar content; actions_bar replaces the
          actions zone above the main content section.
      component:
        type: str
        description: >
          Component registry key registered in ui/index.js. Must match a custom React
          component under ui/pages/custom/. Use PascalCase matching the registerComponent
          call in ui/index.js.

  AppPageSection:
    type: model
    fields:
      id:
        type: str
        description: Stable section identifier within the page (kebab-case).
      primitive:
        type: literal
        values:
        - DataTable
        - Form
        - Grid
        - Button
        - Modal
        - Alert
        - Skeleton
        - Empty
        - PageHeader
        - ResourceTable
        - SummaryStrip
        - InlineEmptyState
        - LoadingState
        - ErrorState
        - Panel
        - SurfaceCard
        - StatusPill
        - Metric
        - SegmentedBar
        - Timeline
        - CodeBlock
        - ProgressTracker
        - AlertBanner
        - ActionButton
        - FileList
        - PricingCatalog
        description: UI primitive type from the shipped chat-ui primitive system.
      title:
        type: union
        variants:
        - str
        - 'null'
        description: Optional section heading displayed above the primitive.
      config:
        type: AppPageSectionConfig
        description: >
          Strict primitive-specific config. The config model must match the
          selected primitive. Do not emit open-ended placeholder objects.
      event_triggers:
        type: optional_list
        items: str
        description: "Event types this section subscribes to (e.g. ui.datatable.refresh, ui.form.set_field)."
      roles:
        type: optional_list
        items: str
        description: Roles that can see this section. Null means visible to all page roles.

  AppShellNavigationPlacement:
    type: model
    fields:
      desktop:
        type: union
        variants:
        - str
        - 'null'
        description: Optional desktop placement such as header, sidebar, rail, sheet, profile, visible, or hidden.
      mobile:
        type: union
        variants:
        - str
        - 'null'
        description: Optional mobile placement such as bottomBar, sheet, more, profile, visible, or hidden.

  AppShellMode:
    type: literal
    values:
    - standard
    - workspace
    - conversation
    - focused
    - immersive
    - public

  AppPageNavigation:
    type: model
    fields:
      id:
        type: union
        variants:
        - str
        - 'null'
        description: Optional stable navigation id. Defaults to the page name or route slug.
      label:
        type: union
        variants:
        - str
        - 'null'
        description: Optional navigation label. Defaults to the page title.
      icon:
        type: union
        variants:
        - str
        - 'null'
        description: Optional icon id for shell renderers that support icons.
      scope:
        type: literal
        values:
        - global
        - local
        - profile
        - footer
        description: Navigation scope. Use global for main app destinations, local for section/workspace nav, profile for account menu, and footer for legal/support links.
      order:
        type: union
        variants:
        - int
        - 'null'
        description: Optional sort order within the resolved navigation scope.
      visible:
        type: bool
        description: Whether this route contributes a navigation item.
        default: true
      placement:
        type: union
        variants:
        - AppShellNavigationPlacement
        - 'null'
        description: Optional placement override. Omit to let shell navigation policy decide per viewport.

  AppPageSchema:
    type: model
    fields:
      name:
        type: str
        description: Page name in PascalCase — used as the component registration key.
      route:
        type: str
        description: URL route path (e.g. /dashboard).
      title:
        type: str
        description: Display title shown in the page header.
      page_type:
        type: literal
        values:
        - record_list
        - record_detail
        - analytics_dashboard
        - workflow_board
        - activity_feed
        - gallery
        - wizard
        - split_view
        - settings
        - landing
        - checkout_success
        description: >
          Structural page archetype. Carries the intended structural pattern so
          coding agents implement the right UI without guessing from field names.
          record_list: entity browse (DataTable/ResourceTable + actions);
          record_detail: entity detail/edit (Form + panels + related data);
          analytics_dashboard: KPI/chart surfaces (Metric/Grid/SummaryStrip);
          workflow_board: kanban/pipeline/board (task mgmt, CRM pipeline);
          activity_feed: chronological event/audit/notification log (Timeline);
          gallery: visual grid/marketplace/catalog (Grid of SurfaceCards);
          wizard: multi-step flow (onboarding, checkout, setup);
          split_view: simultaneous list+detail (inbox, file explorer, thread list);
          settings: categorized settings/preferences forms;
          landing: public/marketing/unauthenticated pages;
          checkout_success: post-redirect checkout/payment confirmation route
          that must be implemented through custom_route_bundle.
      layout:
        type: literal
        values:
        - grid
        - sidebar
        - full-width
        - split
        description: Page layout strategy.
      shell_mode:
        type: union
        variants:
        - AppShellMode
        - 'null'
        default: null
        description: >
          Route chrome mode consumed by the shell. Use standard for normal app pages,
          workspace for dense dashboards/admin/module surfaces, conversation for chat/DM
          style routes, focused for setup/transition screens, immersive for canvas/media
          experiences, and public for marketing/legal/public pages.
      roles:
        type: optional_list
        items: str
        description: Roles that can access this page. Null means all authenticated users.
      navigation:
        type: union
        variants:
        - AppPageNavigation
        - 'null'
        description: >
          Optional route-level navigation contribution consumed by the shell navigation resolver.
          Prefer this for page-owned global or local nav so config/shell.json stays policy-focused.
      sections:
        type: list
        items: AppPageSection
        description: Ordered primitive sections composing the page.
      extensions:
        type: optional_list
        items: AppPageSlotExtension
        description: >
          Declared custom slot overrides for specific UI zones. Use only when a named
          zone (header, empty_state, hero, sidebar, actions_bar) cannot be expressed
          with primitives. Each extension names a bounded slot and the registered custom
          React component that replaces it. The rest of the page stays declarative.
          Null for most pages — do not use as a general React escape hatch.

  AppBackendAdminPanel:
    type: model
    fields:
      id:
        type: str
        description: Stable app-backend admin panel id.
      label:
        type: str
        description: Human-facing admin panel label.
      description:
        type: union
        variants:
        - str
        - 'null'
        description: Optional supporting description.
      section:
        type: literal
        values:
        - overview
        - access
        - billing
        - usage
        - operations
        - settings
        - integrations
        - support
        description: Semantic admin section where this app-backend panel appears.
      order:
        type: int
        description: Sort order within the section.
      renderer:
        type: literal
        values:
        - builtin
        - schema
        - custom_component
        description: >
          Panel rendering mode. `schema` is the normal deterministic path, `builtin`
          mounts a shipped panel, and `custom_component` is the bounded escape hatch.
      builtin_panel:
        type: union
        variants:
        - str
        - 'null'
        description: Built-in panel id when renderer=builtin. Must be one of stats, users, subscriptions.
      layout:
        type: union
        variants:
        - str
        - 'null'
        description: Optional admin panel layout when renderer=schema. One of grid, sidebar, full-width, split.
      sections:
        type: list
        items: AppPageSection
        description: >
          Declarative panel sections when renderer=schema. Reuses the same primitive
          section contract as ui/pages/*.yaml inside the admin shell.
      component:
        type: union
        variants:
        - str
        - 'null'
        description: Registered component key when renderer=custom_component.
      permissions:
        type: optional_list
        items: str
        description: Optional backend-enforced permissions or role ids for this panel.

  AppBackendAdminConfig:
    type: model
    fields:
      schema_version:
        type: literal
        values:
        - mozaiks.admin.app_backend.v1
        description: Must be mozaiks.admin.app_backend.v1.
      panels:
        type: list
        items: AppBackendAdminPanel
        description: App-business admin panels exposed through GET /api/admin/config.

  AppCustomRouteEntry:
    type: model
    fields:
      id:
        type: str
        description: Stable route identifier written to ui/route_manifest.json.
      label:
        type: str
        description: Human-facing label for navigation or route discovery.
      path:
        type: str
        description: Browser route path for the custom full-page React surface.
      component:
        type: str
        description: Component registry key that ui/index.js will register for this route.
      requiresAuth:
        type: bool
        description: Whether the route requires an authenticated user.
      order:
        type: union
        variants:
        - int
        - 'null'
        description: Optional sort order hint for shell navigation.
      meta:
        type: union
        variants:
        - AppCustomRouteMeta
        - 'null'
        description: Optional route metadata such as title or shell flags.
      purpose:
        type: str
        description: Why this route cannot be represented cleanly as a declarative AppPageSchema.

  AppCustomRouteMeta:
    type: model
    fields:
      title:
        type: union
        variants:
        - str
        - 'null'
        description: Optional route title.
      shell:
        type: union
        variants:
        - str
        - 'null'
        description: Optional shell presentation hint.
      shellMode:
        type: union
        variants:
        - AppShellMode
        - 'null'
        default: null
        description: Optional route chrome mode for this custom route.
      nav_group:
        type: union
        variants:
        - str
        - 'null'
        description: Optional navigation group.
      icon:
        type: union
        variants:
        - str
        - 'null'
        description: Optional icon id.
      requiresRole:
        type: union
        variants:
        - str
        - 'null'
        description: >
          Optional role gate for navigation visibility (e.g. "admin"). Declaration
          intent only — shell enforcement for route rendering and sidebar filtering
          is not yet implemented. Do not rely on this field as a security boundary;
          module authorization/service/policy remains the authoritative enforcement layer for
          resource-scoped authorization.

  AppCustomPageFile:
    type: model
    fields:
      route_id:
        type: str
        description: Route id from AppCustomRouteEntry.id that owns this page file.
      path:
        type: str
        description: Custom page file path under ui/pages/custom/ with a .jsx extension, e.g. ui/pages/custom/InvestorDealRoom.jsx.
      component_name:
        type: str
        description: Default exported React component name used by the generated file.
      registry_key:
        type: str
        description: Component registry key that must match the owning AppCustomRouteEntry.component exactly.
      purpose:
        type: str
        description: Why this custom page file exists and what interaction/layout gap it satisfies.
      contract_refs:
        type: optional_list
        items: str
        description: Contract fields or upstream design references this file satisfies.
      content:
        type: str
        description: Complete React source for the custom page file.

  AppCustomRouteBundle:
    type: model
    fields:
      route_manifest:
        type: list
        items: AppCustomRouteEntry
        description: Exact pages[] entries to persist into ui/route_manifest.json.
      page_files:
        type: list
        items: AppCustomPageFile
        description: Full-page React files owned by the custom route manifest. There must be exactly one page file per route_manifest entry.

  AppManifest:
    type: model
    fields:
      app_name:
        type: str
        description: Human-readable application name.
      description:
        type: union
        variants:
        - str
        - 'null'
        description: >
          One or two sentence product description for Studio and generated app
          management surfaces. Preserve ValueEngine ConceptBlueprint.concept_overview
          or value_manifest.concept_overview when available; do not invent vague
          placeholder copy.
      tagline:
        type: union
        variants:
        - str
        - 'null'
        description: >
          Short product tagline or positioning line for app dashboard identity.
          Prefer a concise phrase derived from ConceptBlueprint.value_proposition.
          Null when the concept has not established a real tagline.
      value_proposition:
        type: union
        variants:
        - str
        - 'null'
        description: >
          The durable user value statement for this app. Preserve
          ConceptBlueprint.value_proposition or value_manifest.value_proposition
          when available so Studio can show app purpose consistently.
      version:
        type: str
        description: Semantic version string (e.g. 1.0.0).
      auth_strategy:
        type: union
        variants:
        - str
        - 'null'
        description: "Auth approach: public | basic-login | role-based | third-party."
      roles:
        type: optional_list
        items: str
        description: All roles defined in the application.
      default_route:
        type: str
        description: Route to redirect to after login (e.g. /dashboard).
      pages:
        type: list
        items: str
        description: Redundant declarative page-name index. save_app_schema canonicalizes this from AppSchemaOutput.pages[*].name before persistence.
      custom_routes:
        type: optional_list
        items: str
        description: Optional redundant custom route id index. save_app_schema canonicalizes this from custom_route_bundle.route_manifest[*].id before persistence.

  AppAssetEntry:
    type: model
    fields:
      asset_id:
        type: str
        description: Stable identifier used by ui/pages schemas and shell config to reference this asset.
      kind:
        type: str
        description: Asset category such as logo, icon, hero_image, illustration, or video.
      source:
        type: literal
        values:
        - local
        - remote
        - uploaded
        - generated
        - stock
        description: Origin of the asset payload.
      path:
        type: union
        variants:
        - str
        - 'null'
        description: Relative file path inside the app bundle when source is local/uploaded.
      url:
        type: union
        variants:
        - str
        - 'null'
        description: Absolute URL when source is remote.
      alt:
        type: union
        variants:
        - str
        - 'null'
        description: Accessibility alt text for user-facing visual assets.
      usage:
        type: optional_list
        items: str
        description: Surfaces where this asset is expected to appear (page ids, shell slots, etc.).
      license:
        type: union
        variants:
        - str
        - 'null'
        description: Optional license string or provenance note.
      tags:
        type: optional_list
        items: str
        description: Optional search tags for future asset retrieval.

  AppAssetManifest:
    type: model
    fields:
      version:
        type: str
        description: Asset manifest schema version.
      assets:
        type: list
        items: AppAssetEntry
        description: Canonical list of app assets referenced by page and shell contracts.

  AppThemeBrandingPatch:
    type: model
    fields:
      app_name:
        type: union
        variants:
        - str
        - 'null'
