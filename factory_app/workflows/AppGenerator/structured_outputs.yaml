models:
  PrimitiveSectionHint:
    type: model
    fields:
      primitive:
        type: literal
        values:
        - DataTable
        - Form
        - Grid
        - Button
        - Modal
        - Alert
        - Skeleton
        - Empty
        - PageHeader
        - ResourceTable
        - SummaryStrip
        - InlineEmptyState
        - LoadingState
        - ErrorState
        - Panel
        - SurfaceCard
        - StatusPill
        - Metric
        - SegmentedBar
        - Timeline
        - CodeBlock
        - ProgressTracker
        - AlertBanner
        - ActionButton
        - FileList
        - PricingCatalog
        description: >
          Primitive type name from the shipped chat-ui primitive registry.
          Must match exactly — AppSchemaAgent validates against this list.
      config_hint:
        type: optional_str
        description: >
          JSON-encoded partial primitive config scaffold, or null when config is
          entirely context-dependent. Keys must match the primitive's contract
          (see [SHIPPED PAGE PRIMITIVES] for per-primitive field definitions).
          Required fields for the primitive must be present. AppSchemaAgent
          decodes this JSON string and merges it with additional context — do
          not omit required fields here. Null only when config is entirely
          context-dependent and cannot be scaffolded at planning time.
          Example: "{\"columns\": [\"id\", \"name\"], \"api_endpoint\": \"/api/modules/tasks/list_tasks\"}"
      section_id_hint:
        type: union
        variants:
        - str
        - 'null'
        description: >
          Suggested kebab-case section id. AppSchemaAgent may use or refine
          this; it should reflect what the section represents.
      title_hint:
        type: union
        variants:
        - str
        - 'null'
        description: Optional section heading hint for AppSchemaAgent.
      intent:
        type: union
        variants:
        - str
        - 'null'
        description: >
          Designed intent for this section, passed through from ExperienceSpec when
          present. AppSchemaAgent uses this as the authoritative purpose statement
          when generating the section config.

  AppBuildPage:
    type: model
    fields:
      name:
        type: str
        description: Human-readable page name.
      route:
        type: str
        description: Primary route path for the page.
      purpose:
        type: str
        description: What the page exists to let the user do.
      design_intent:
        type: union
        variants:
        - str
        - 'null'
        description: >
          Designed intent passed through from ExperienceSpec when present. Null when
          the page was inferred from capability packs rather than designed explicitly.
      primary_entities:
        type: optional_list
        items: str
        description: Entities or records primarily manipulated on the page.
      primary_actions:
        type: optional_list
        items: str
        description: CRUD or workflow actions supported by the page.
      ui_layout:
        type: literal
        values:
        - grid
        - sidebar
        - full-width
        - split
        - 'null'
        description: "Preferred layout hint for AppSchemaAgent: grid | sidebar | full-width | split. Null to let AppSchemaAgent decide."
      shell_mode_hint:
        type: union
        variants:
        - str
        - 'null'
        default: null
        description: >
          Preferred shell chrome mode for this route: standard, workspace,
          conversation, focused, immersive, or public. Null to let AppSchemaAgent
          infer from page purpose.
      ui_surface:
        type: literal
        values:
        - declarative_page
        - custom_react_page
        description: >
          Persistent app UI surface type. Use declarative_page by default; use
          custom_react_page only when shipped page primitives cannot express the
          route.
      page_type_hint:
        type: literal
        values:
        - record_list
        - record_detail
        - analytics_dashboard
        - workflow_board
        - activity_feed
        - gallery
        - wizard
        - split_view
        - settings
        - landing
        - checkout_success
        - 'null'
        description: >
          Structural page archetype hint for AppSchemaAgent. Drives which primitives
          and structural patterns are appropriate. record_list for entity browse/CRUD;
          record_detail for entity detail/edit; analytics_dashboard for KPI/chart
          surfaces; workflow_board for kanban/pipeline/board views; activity_feed for
          chronological event/notification/audit surfaces; gallery for visual grid and
          marketplace/catalog listings; wizard for multi-step flows (onboarding, checkout,
          setup); split_view for simultaneous list+detail (inbox, file explorer, chat);
          settings for categorized settings/preferences; landing for public/marketing pages;
          checkout_success for post-redirect checkout/payment confirmation routes that
          must use custom_route_bundle.
          Do not default everything to record_list — match the page purpose to the right
          archetype.
      sections_hint:
        type: optional_list
        items: PrimitiveSectionHint
        description: >
          Typed primitive section hints for AppSchemaAgent. Each hint names
          the primitive and provides a partial config scaffold with required
          fields populated. AppSchemaAgent uses these as the base config and
          extends them with page context. Emit one hint per expected UI
          section on the page.
  AppBuildEntity:
    type: model
    fields:
      name:
        type: str
        description: Entity name.
      operations:
        type: optional_list
        items: str
        description: Required operations for this entity.
      notes:
        type: union
        variants:
        - str
        - 'null'
        description: Optional implementation note.
  WorkspaceCatalogCheck:
    type: model
    fields:
      catalog_id:
        type: str
        description: >
          Workspace integration catalog ID (e.g. "mozaikspay", "twilio", "openai").
          Must match a known entry in the integrations catalog.
      display_name:
        type: str
        description: Human-readable integration name from the catalog.
      workspace_status:
        type: literal
        values:
          - configured
          - partial
          - missing
          - unknown
        description: >
          Status returned by check_workspace_integrations.
          configured = all required env vars present — auto-wire this integration.
          partial = some required env vars missing — flag to the user.
          missing = no required env vars present — pass to record_integration_need.
          unknown = catalog_only mode — cannot verify; surface setup guidance.
      auto_wire:
        type: bool
        description: >
          True when workspace_status is "configured". The generated app should
          reference this integration without prompting the user for credentials.
      missing_secrets:
        type: optional_list
        items: str
        description: >
          Secret names that are missing, present when workspace_status is
          "partial" or "missing". Empty for "configured" and "unknown".
  AppBuildIntegration:
    type: model
    fields:
      name:
        type: str
        description: Integration name.
      service:
        type: optional_str
        description: Normalized connector service id such as email_provider, analytics_provider, crm_provider, storage_provider, or model_provider. Prefer this when the integration requires a platform connector.
      display_name:
        type: optional_str
        description: Human-readable connector label shown in inline credential prompts and the app-scoped integrations surface.
      kind:
        type: str
        description: Integration type such as payments, email, analytics, agent-backend,
          storage, or external-api.
      purpose:
        type: str
        description: Why the integration exists in the product.
      required_at:
        type: literal
        values:
        - build_time
        - validation_time
        - runtime
        - deployment
        - optional
        default: runtime
        description: Earliest lifecycle point where this integration must be configured.
      optional:
        type: bool
        default: false
        description: Whether the app can proceed without this integration.
      required_fields:
        type: optional_list
        items: AppIntegrationRequiredField
        description: >
          Optional connector setup fields. Each item should include name, label,
          type (secret, text, url, select), required, and frontend_safe. Secret
          fields are write-only and must never be returned to generated code.
  AppIntegrationRequiredField:
    type: model
    fields:
      name:
        type: str
        description: Stable field id.
      label:
        type: str
        description: Human-facing field label.
      type:
        type: literal
        values:
        - secret
        - text
        - url
        - select
        - number
        - json
        description: Field input type.
      required:
        type: bool
        description: Whether this field is required.
      frontend_safe:
        type: bool
        description: Whether the value can be exposed to frontend code.
      options:
        type: optional_list
        items: str
        description: Optional select values.
  AppIntegrationRequiredBy:
    type: model
    fields:
      kind:
        type: literal
        values:
        - task
        - agent
        - path
        - capability_pack
        - unknown
        description: Reference kind requiring this integration.
      id:
        type: union
        variants:
        - str
        - 'null'
        description: Task, agent, or capability id when applicable.
      path:
        type: union
        variants:
        - str
        - 'null'
        description: Bundle path when kind=path.
  AppIntegrationNeed:
    type: model
    fields:
      service:
        type: str
        description: Normalized connector service id such as email_provider, analytics_provider, crm_provider, storage_provider, or model_provider.
      display_name:
        type: optional_str
        description: Human-readable label for inline credential collection.
      kind:
        type: literal
        values:
        - api_key
        - oauth
        - webhook
        - managed_capability
        - internal_service
        description: Connector/configuration kind.
      purpose:
        type: str
        description: Why this task needs the integration.
      required_at:
        type: literal
        values:
        - build_time
        - validation_time
        - runtime
        - deployment
        - optional
        default: runtime
        description: Earliest lifecycle point where this credential/configuration is required.
      optional:
        type: bool
        default: false
        description: Whether the build can proceed without this service.
      required_by:
        type: union
        variants:
        - AppIntegrationRequiredBy
        - 'null'
        description: Task, agent, paths, or capability pack requiring this integration.
      required_fields:
        type: optional_list
        items: AppIntegrationRequiredField
        description: >
          Optional connector setup fields. Each item should include name, label,
          type (secret, text, url, select), required, and frontend_safe. Secret
          fields are write-only and must never be returned to generated code.
  AppCapabilityRequiredIntegration:
    type: model
    fields:
      service:
        type: str
        description: Normalized app-scoped connector service id required by the capability pack.
      provider:
        type: optional_str
        description: Provider id used by the backing integration or managed capability.
      display_name:
        type: optional_str
        description: Human-readable label shown in inline credential prompts and the app-scoped integrations surface.
      kind:
        type: literal
        values:
        - api_key
        - oauth
        - webhook
        - managed_capability
        - internal_service
        description: Connector/configuration kind needed by this capability pack.
      purpose:
        type: str
        description: Why this capability pack requires the connector.
      required_at:
        type: literal
        values:
        - build_time
        - validation_time
        - runtime
        - deployment
        - optional
        default: runtime
        description: Earliest lifecycle point where this connector must be configured.
      optional:
        type: bool
        default: false
        description: Whether the capability can run without this connector.
      required_fields:
        type: optional_list
        items: AppIntegrationRequiredField
        description: >
          Connector setup fields. Public fields may be frontend_safe=true; secrets
          must use type=secret and frontend_safe=false. Raw values never belong in
          generated artifacts.
  AppEventFlow:
    type: model
    fields:
      event_type:
        type: str
        description: Canonical event type. Generic generated app facts must use domain.{module_id}.{event_name}.
      producer_pack_id:
        type: str
        description: Capability pack/module that owns and publishes this event after committing state.
      producing_action:
        type: str
        description: Module action that commits the state change before emitting this event.
      subscriber_intents:
        type: optional_list
        items: str
        description: Notification, subscription, integration, or workflow reactions caused by this event.
      workflow_capability_ids:
        type: optional_list
        items: str
        description: Capability ids invoked from this event, never raw workflow names.
  AppContextVariable:
    type: model
    fields:
      key:
        type: str
        description: Context variable key.
      value:
        type: str
        description: Stringified scalar or JSON value.
      value_type:
        type: literal
        values:
        - string
        - integer
        - number
        - boolean
        - json
        - 'null'
        description: How the string value should be decoded by runtime helpers.
  AppWorkflowTouchpoint:
    type: model
    fields:
      page_name:
        type: str
        description: Generated persistent page that should expose the workflow launch affordance.
      section_id_hint:
        type: union
        variants:
        - str
        - 'null'
        description: Optional section id or placement hint for where the workflow launch action belongs.
      action_id:
        type: str
        description: Stable action id the page schema should use for this launch affordance.
      label:
        type: str
        description: User-facing CTA label for the workflow launch action.
      workflow_id:
        type: str
        description: Runtime workflow registry id to launch from the page surface. This is not a workflow capability id.
      placement:
        type: literal
        values:
        - primary_button
        - section_action
        - row_action
        - empty_state
        description: Preferred placement of the workflow launch affordance in the page schema.
      context_variables:
        type: optional_list
        items: AppContextVariable
        description: Optional deterministic context_variables payload for the workflow launch. Keys must belong to the target workflow context contract.
      purpose:
        type: str
        description: Why this page should launch the workflow.
  BrandIntent:
    type: model
    fields:
      style_summary:
        type: str
        description: Short description of the desired brand or visual direction.
      brand_keywords:
        type: optional_list
        items: str
        description: Keywords that should remain true when deriving theme overrides and page presentation.
      experience_goals:
        type: optional_list
        items: str
        description: Desired experiential qualities such as premium, efficient, trustworthy, or playful.
      appearance_hint:
        type: union
        variants:
        - str
        - 'null'
        description: Optional shell appearance hint such as light, dark, or system.
  AppSurface:
    type: model
    fields:
      surface_id:
        type: str
        description: Stable realization-surface identifier copied from DesignDocs surface_map when available.
      surface_kind:
        type: literal
        values:
        - module
        - workflow
        - control_plane
        - external_integration
        - ui_only
        description: Concrete realization boundary for this surface.
      owner:
        type: literal
        values:
        - app
        - hosted
        - platform
        description: Runtime owner responsible for this surface. Preserved from DesignDocs surface_map. app = generated app-owned module or integration; hosted = hosted product service; platform = platform-provided capability.
      source_capability_packs:
        type: optional_list
        items: str
        description: Capability-pack hints this surface realizes, preserved from DesignDocs surface_map.
      label:
        type: str
        description: Human-readable surface label.
      summary:
        type: str
        description: Brief description of what this surface owns.
      primary_entities:
        type: optional_list
        items: str
        description: Domain entities primarily owned by this surface.
      owned_pages:
        type: optional_list
        items: str
        description: Persistent pages primarily owned by this surface.
      owned_mutations:
        type: optional_list
        items: str
        description: Deterministic mutations or actions owned by this surface.
      events_emitted:
        type: optional_list
        items: str
        description: Domain events this surface may emit.
      workflow_triggers:
        type: optional_list
        items: str
        description: Workflow capability ids or trigger intents this surface may start.
      dependencies:
        type: optional_list
        items: str
        description: Other surface ids this surface depends on.
  AppSurfaceMap:
    type: model
    fields:
      surfaces:
        type: list
        items: AppSurface
        description: Realization boundaries for the app, derived from DesignDocs surface_map when present.
  AppCapabilityPack:
    type: model
    fields:
      capability_pack_id:
        type: str
        description: Stable identifier for the capability pack.
      surface_id:
        type: str
        description: Realization surface this capability pack maps to.
      surface_kind:
        type: literal
        values:
        - module
        - workflow
        - control_plane
        - external_integration
        - ui_only
        description: Surface kind this capability pack realizes. Do not assume every pack becomes a module.
      pack_type:
        type: literal
        values:
        - crud_pack
        - admin_pack
        - messaging_pack
        - commerce_pack
        - marketplace_pack
        - campaigns_pack
        - billing_pack
        - notifications_pack
        - analytics_pack
        - agent_backend_integration
        - ai_review_pack
        - ai_analysis_pack
        - ai_extraction_pack
        - custom_domain
        description: Canonical pack family selected for the product.
      label:
        type: str
        description: Human-readable pack name.
      summary:
        type: str
        description: Brief description of what this pack contributes to the product.
      implementation_mode:
        type: literal
        values:
        - declarative_module
        - agentic_workflow
        - hybrid
        - external_integration
        description: How this pack should be realized at build time. This complements surface_kind; it does not replace it.
      primary_entities:
        type: optional_list
        items: str
        description: Domain entities primarily owned by this pack.
      primary_pages:
        type: optional_list
        items: str
        description: Pages or screens the pack is expected to drive.
      operations:
        type: optional_list
        items: str
        description: Primary actions and behaviors supplied by the pack.
      required_integrations:
        type: optional_list
        items: AppCapabilityRequiredIntegration
        description: >
          Structured app-scoped connector requirements for this pack. Managed capabilities
          must copy pack-declared requirements here instead of downgrading them to
          string names, so IntegrationReadinessAgent can request exact public and
          secret fields.
      agentic_extensions:
        type: optional_list
        items: str
        description: Optional AI-driven behaviors layered on top of the pack.
      capability_source:
        type: optional_str
        description: >
          Implementation origin of this capability pack. Use one of:
          managed_capability (provided by a hosted platform capability — do not generate
          a module_contract for the managed capability id itself; generate app-owned
          facade module_contract tasks when UI/pages need local app actions),
          host_universal (provided universally by the platform host — no scaffold needed),
          framework_pack (provided by an OSS or operator framework pack — generate only
          the declared app-specific wiring),
          generated_module (app-owned generated module — generate full module contracts),
          external_adapter (third-party external service adapter — api_surface only).
  BuildTaskBase:
    type: model
    description: >
      Stable harness ABI contract. Every domain task model must include these
      fields. The task batch harness reads only these fields; domain-specific
      fields belong in domain_context and are invisible to the harness.
    fields:
      task_id:
        type: str
        description: Stable task identifier for the build unit.
      initial_agent:
        type: str
        description: Agent that should execute this task batch item.
      initial_message:
        type: str
        description: Seed message instructing the task worker on exactly what to generate.
      owned_paths:
        type: optional_list
        items: str
        description: Canonical file paths this task exclusively owns.
      depends_on:
        type: optional_list
        items: str
        description: Task ids that must complete before this task runs.
      acceptance_criteria:
        type: optional_list
        items: str
        description: Concrete completion checks for the task output.
      context_variables:
        type: optional_list
        items: AppContextVariable
        description: Context variables seeded into task batch execution.
      integration_needs:
        type: optional_list
        items: AppIntegrationNeed
        description: Third-party connectors this build task expects to need.
      domain_context:
        type: optional_str
        default: null
        description: >
          JSON-encoded domain-specific pass-through string. The harness reads
          BuildTaskBase fields only and ignores this field entirely.
          Domain execution agents JSON-decode domain_context to access task_type,
          capability_pack_id, surface_kind, and any other domain-specific
          routing fields. A future non-webapp task model populates this with
          its own vocabulary without changing the harness contract.
          Must be a valid JSON object string or null.

  AppBuildTask:
    type: model
    fields:
      task_id:
        type: str
        description: Stable task identifier for the build unit.
      task_type:
        type: literal
        values:
        - subscription_config
        - service_foundation
        - module_contract
        - persistence_contract
        - data_models
        - business_services
        - api_surface
        - page_bundle
        - agent_backend_integration
        - control_plane_pack
        - ai_disclosure_docs
        - legal_docs
        description: >
          Explicit build-task type used for downstream execution planning. Persistent
          app pages use the declarative AppSchemaAgent path. `page_bundle` means a
          declarative page/schema bundle and must be paired with AppSchemaAgent.
          `subscription_config` emits only config/subscriptions.yaml from
          SubscriptionContractDesigner when contract_required=true.
          `module_contract` emits only module.yaml, contracts/*.yaml, and optional
          runtime_extensions.yaml; it must not own backend/*.py.
          `data_models` emits modules/{module_id}/backend/schemas.py and must start
          at ModelAgent.
          `business_services` emits module backend implementation files such as
          handler.py, service.py, repo.py, policy.py, and declared hooks; it must
          start at ServiceAgent and must not own schemas.py in task-batch execution.
          `service_foundation` emits app-level support code at app-bundle-relative
          services/integrations/ clients, services/adapters/ provider boundaries,
          services/routes/ route files, and security/secrets.yaml when a names-only
          secret contract is required. Service files assemble under physical
          app/services/ in generated workspaces.
          These files are not runtime modules and must not own business actions,
          events, lifecycle state, or persistence authority.
          `service_foundation` must not own provider-neutral deployment artifacts
          such as Dockerfile, docker-compose.yml, env.example,
          deployment.manifest.json, or .github/workflows/*. Those are emitted by
          the deployment contract renderer during download/export.
          `control_plane_pack` is required for surface_kind=control_plane tasks and
          emits an optional app-local control_plane/ harness pack. It must start
          at ControlPlaneAgent — do NOT use service_foundation, api_surface, or
          module_contract for control_plane surfaces.
          surface_kind=external_integration may use `api_surface` for thin
          clients, `service_foundation` for direct app-owned provider adapters under
          services/adapters/, explicit services/routes/, or security/secrets.yaml, or
          `agent_backend_integration` for workflow touchpoints.
          `page_bundle` is the only valid task_type for surface_kind=ui_only.
      capability_pack_id:
        type: union
        variants:
        - str
        - 'null'
        description: Capability pack this task belongs to. Null only for truly cross-cutting setup work.
      surface_id:
        type: str
        description: Realization surface this task belongs to.
      surface_kind:
        type: literal
        values:
        - module
        - workflow
        - control_plane
        - external_integration
        - ui_only
        description: Surface kind realized by this task.
      execution_target:
        type: str
        description: Runtime or generator system responsible for executing the task.
      initial_agent:
        type: str
        description: Agent that should execute this task batch item.
      description:
        type: str
        description: Human-readable summary of the task.
      initial_message:
        type: str
        description: Seed message instructing the task worker on exactly what to generate.
      owned_paths:
        type: optional_list
        items: str
        description: Canonical file paths this task exclusively owns.
      depends_on:
        type: optional_list
        items: str
        description: Task ids that must complete before this task runs.
      acceptance_criteria:
        type: optional_list
        items: str
        description: Concrete completion checks for the task output.
      context_variables:
        type: optional_list
        items: AppContextVariable
        description: Context variables seeded into task batch execution.
      integration_needs:
        type: optional_list
        items: AppIntegrationNeed
        description: >
          Third-party connectors this build task expects to need. Agents may
          discover more at execution time with record_integration_need; the
          IntegrationReadinessAgent fans all needs in before validation/download.
      domain_context:
        type: optional_str
        default: null
        description: >
          JSON-encoded domain-specific pass-through string seeded by AppPlanAgent
          for execution agents. The harness ignores this field. Webapp tasks
          JSON-encode task_type, capability_pack_id, surface_kind, execution_target,
          and surface_id here so that future domain packs can substitute their
          own vocabulary without changing the harness contract.
          Must be a valid JSON object string or null.

  AppMonetizationPlan:
    type: model
    description: >
      Resolved monetization taxonomy for this app. "Monetized" is not a build
      route by itself; this object records the concrete money-flow model and
      whether the OSS subscription runtime is actually required.
    fields:
      monetized:
        type: bool
        description: True when the app has any revenue, payment, contribution, sponsored, or paid-access flow.
      revenue_model:
        type: literal
        values:
        - free
        - subscriptions
        - usage_based
        - transactional
        - marketplace
        - sponsored
        - donations
        - community_funded
        - hybrid
        description: >
          Concrete revenue route. Do not use "monetized" as the value. Use
          subscriptions only for recurring access, seats, paid feature gates,
          quotas, credits, or token allowances. Use transactional for product,
          booking, download, invoice, or one-time checkout flows. Use marketplace
          for multi-party buyer/seller flows. Use sponsored for paid placement,
          ad, boost, or campaign visibility flows. Use community_funded for
          campaign-style backing/funding windows with app/operator-specific policy.
      subscription_contract_requirement:
        type: literal
        values:
        - not_required
        - conditional
        - required
        description: >
          Whether SubscriptionContractDesigner should produce config/subscriptions.yaml.
          Required only for subscriptions or usage models with plan gates, seats,
          quotas, credits, or token allowances. Transactional, marketplace,
          sponsored, donation, and community-funded apps set this to not_required
          unless they also sell app access tiers or usage budgets.
      primary_payer:
        type: union
        variants:
        - str
        - 'null'
        description: User or organization expected to pay, such as customer, buyer, seller, creator, team admin, sponsor, donor, or backer.
      primary_payee:
        type: union
        variants:
        - str
        - 'null'
        description: Recipient of funds or value flow, such as app owner, seller, creator, service provider, campaign owner, or platform.
      money_flow_summary:
        type: str
        description: One-sentence explanation of what is being paid for and when value is delivered.
      required_capability_routes:
        type: optional_list
        items: str
        description: Capability routes required by the taxonomy, such as saas_subscriptions, usage_metering, commerce, marketplace, sponsored_placements, donations, or investor_marketplace.
      rationale:
        type: str
        description: >
          Reasoning that ties the selected model to concept_overview,
          concept_blueprint, design_surface_map, experience_spec,
          monetization_enabled, builder_options, or revenue_model context.

  CarryForwardDecision:
    type: model
    fields:
      module_id:
        type: str
        description: >
          Module directory name from the previous app bundle
          (e.g. 'notifications', 'billing_portal').
      decision:
        type: literal
        values:
        - reuse
        - adapt
        - regenerate
        - drop
        description: >
          Planning intent for this carry-forward candidate.
          reuse: preserve the module's role in the new plan (no file copy).
          adapt: create a new/updated module task inspired by the prior contract.
          regenerate: include the capability but generate a fresh implementation.
          drop: module no longer fits the new concept.
      reason:
        type: str
        description: >
          Human-readable explanation for the decision. Must be non-empty.
          Reference new-concept fit, classification, or contract inspection
          findings as appropriate.
      source:
        type: literal
        values:
        - carry_forward_candidate
        - human_override
        - planner
        description: >
          What drove this decision.
          carry_forward_candidate: driven primarily by the carry_forward_classification.
          human_override: explicit client instruction to reuse/drop this module.
          planner: AppPlanAgent reasoning beyond the advisory classification.
      affected_build_tasks:
        type: optional_list
        items: str
        description: >
          Task ids from build_tasks that are directly related to this decision.
          Empty when no specific tasks are affected (e.g. for a drop decision).

  AppBuildPlan:
    type: model
    fields:
      agent_message:
        type: str
        description: Short planning summary for the build plan.
      pages:
        type: optional_list
        items: AppBuildPage
        description: Ordered pages planned for the app. AppSchemaAgent materializes each page into a full AppPageSchema.
      entities:
        type: optional_list
        items: AppBuildEntity
        description: Canonical entities and required operations.
      roles:
        type: optional_list
        items: str
        description: User roles that influence auth or visibility.
      auth_strategy:
        type: union
        variants:
        - str
        - 'null'
        description: Auth approach such as public, basic-login, role-based, or third-party auth.
      service_scope:
        type: optional_list
        items: str
        description: Backend capabilities that must be generated.
      frontend_scope:
        type: optional_list
        items: str
        description: >
          Frontend capabilities that must be generated. Persistent page routes compile
          declaratively through AppSchemaAgent; AppGenerator does not support a raw
          frontend page/component generation lane.
      theme_preferences:
        type: union
        variants:
        - str
        - 'null'
        description: >
          Raw user-expressed style preference captured during the intake interview
          (e.g. "dark, minimal", "corporate blue", "techy sci-fi feel"). Null if the
          user expressed no visual preference. Read by AppSchemaAgent to infer
          theme_config_patch, shell_config, and asset_manifest — no mapping is done
          here, the agent reasons directly.
      brand_intent:
        type: union
        variants:
        - BrandIntent
        - 'null'
        description: >
          Structured brand and experience direction preserved from upstream planning.
          This is the durable design context AppSchemaAgent should consult before
          defaulting to platform styling.
      shell_preset_hint:
        type: union
        variants:
        - str
        - 'null'
        description: >
          Optional prompt-time shell preset id from shell_presets.yaml. This is
          not a runtime artifact. AppSchemaAgent uses it to choose normal
          AppPageSchema.navigation, AppPageSchema.shell_mode, and optional
          shell_config defaults. Null when platform defaults are sufficient.
      surface_map:
        type: union
        variants:
        - AppSurfaceMap
        - 'null'
        description: Explicit realization boundaries for the app, preserved from DesignDocs and refined by AppPlanAgent.
      capability_packs:
        type: optional_list
        items: AppCapabilityPack
        description: Canonical product capability packs selected before deriving pages, entities, and build tasks.
      revenue_model:
        type: union
        variants:
        - str
        - 'null'
        default: free
        description: >
          Resolved revenue model for the app. "Monetized" is not a valid final
          model; it must resolve to one of:
          free | subscriptions | usage_based | transactional | marketplace |
          sponsored | donations | community_funded | hybrid.

          Aliased values are mapped: pay_per_use -> usage_based;
          one_time_purchase -> transactional.

          This field drives which billing, checkout, usage, marketplace,
          sponsored-placement, donation, campaign, entitlement, and plan-catalog
          artifacts are required in build_tasks. Null is treated as free.
      monetization_plan:
        type: union
        variants:
        - AppMonetizationPlan
        - 'null'
        default: null
        description: >
          Detailed monetization taxonomy decision. Required when revenue_model is
          not free. It records whether config/subscriptions.yaml is required or
          whether the app should route to commerce, marketplace, sponsored,
          donation, campaign, or custom/operator capabilities without a
          subscription contract.
      external_integrations:
        type: optional_list
        items: AppBuildIntegration
        description: External integrations required by the product.
      workspace_integration_status:
        type: optional_list
        items: WorkspaceCatalogCheck
        description: >
          Results from check_workspace_integrations called during planning.
          One entry per catalog integration checked. Downstream agents use
          this to know which integrations are already configured (auto-wire)
          vs. missing (require IntegrationReadinessAgent to collect inline).
          Empty when no catalog integrations were checked.
      event_flows:
        type: optional_list
        items: AppEventFlow
        description: "Cross-pack event flow map: module-owned domain events, producing actions, and downstream reactions."
      workflow_touchpoints:
        type: optional_list
        items: AppWorkflowTouchpoint
        description: Persistent page entry points that launch or resume workflow sessions from the app UI.
      agent_backend_required:
        type: bool
        description: Whether this app must integrate with an upstream generated agent backend.
      build_tasks:
        type: list
        items: AppBuildTask
        description: Explicit execution-oriented build tasks derived from the plan.
      data_contract:
        type: union
        variants:
        - DataContract
        - 'null'
        default: null
        description: >
          Canonical generated data planning object for persistent app modules,
          cross-module aggregate ownership, or explicit existing database
          integration. It is written to data/contract.json by DatabaseAgent.
          Ordinary generated apps may set this to null when generated-scoped
          ctx.persistence is sufficient.
      pending_schema_migration:
        type: union
        variants:
        - DataMigrationDocument
        - 'null'
        description: Optional additive data migration intent for data/migrations/{migration_id}.json, or null when no migration is planned.
      deployment_targets:
        type: optional_list
        items: DeployTargetSpec
        description: Optional provider-neutral deployment target specs associated with this app build plan.
      deployment_template_manifest:
        type: union
        variants:
        - DeploymentTemplateManifest
        - 'null'
        description: Optional deterministic deployment manifest describing generated deployment outputs.
      carry_forward_decisions:
        type: optional_list
        items: CarryForwardDecision
        description: >
          Per-module carry-forward planning decisions recorded during conceptual_replan.
          Empty (default) for non-conceptual builds. Planning metadata only — does
          not trigger file copy, merge, or AssemblyAgent preservation behavior.
          AppPlanAgent records one entry per carry_forward_modules candidate.
      generation_order:
        type: optional_list
        items: str
        description: Recommended ordered phases for downstream generation.
  AppBuildPlanOutput:
    type: model
    fields:
      AppBuildPlan:
        type: AppBuildPlan
        description: Canonical app build plan persisted for downstream agents.
  DeployTargetRuntime:
    type: model
    fields:
      container_port:
        type: int
        description: Runtime container port exposed by the generated app.
      health_path:
        type: str
        description: HTTP path used for health checks.
      start_command:
        type: union
        variants:
        - str
        - 'null'
        description: Optional explicit start command override.
  DeployTargetEnvironment:
    type: model
    fields:
      required_variables:
        type: optional_list
        items: str
        description: Variables that must be configured before runtime.
      optional_variables:
        type: optional_list
        items: str
        description: Variables that are optional for this target.
      secret_variables:
        type: optional_list
        items: str
        description: Variable names treated as secrets and injected by adapters, never committed.
      public_variables:
        type: optional_list
        items: str
        description: Safe client-facing variables.
  DeployTargetImage:
    type: model
    fields:
      image_name:
        type: str
        description: Provider-neutral image name hint.
      tag_strategy:
        type: literal
        values:
        - commit_sha
        - timestamp
        - manual
        description: Generic tag strategy for build outputs.
  DeployTargetChecks:
    type: model
    fields:
      build:
        type: bool
        description: Whether build checks are required.
      smoke:
        type: bool
        description: Whether smoke checks are required.
      health:
        type: bool
        description: Whether health checks are required.
  DeployTargetProviderMetadataEntry:
    type: model
    fields:
      key:
        type: str
        description: Stable provider-profile metadata key.
      value:
        type: str
        description: Provider-profile metadata value encoded as a string.
  DeployTargetProviderProfile:
    type: model
    fields:
      name:
        type: str
        description: Provider-neutral profile name, such as generic.
      description:
        type: union
        variants:
        - str
        - 'null'
        description: Optional provider profile description.
      metadata:
        type: optional_list
        items: DeployTargetProviderMetadataEntry
        description: Optional bounded metadata entries. Use an empty list when no metadata is needed.
  CiSecretRequirement:
    type: model
    fields:
      name:
        type: str
        description: Provider-neutral CI secret name. Names only, never values.
      purpose:
        type: union
        variants:
        - str
        - 'null'
        description: Optional human-readable purpose for the secret name.
      used_by:
        type: union
        variants:
        - str
        - 'null'
        description: Optional generic workflow identifier such as build_workflow.
  CiWorkflowInputRequirement:
    type: model
    fields:
      name:
        type: str
        description: Names-only workflow input identifier.
      required:
        type: bool
        description: Whether the workflow input is required when the workflow is manually dispatched.
      purpose:
        type: union
        variants:
        - str
        - 'null'
        description: Optional human-readable purpose for the workflow input.
  CiSecretRequirements:
    type: model
    fields:
      required:
        type: optional_list
        items: CiSecretRequirement
        description: Required CI secret names for the generated workflow. Names only, no values.
      optional:
        type: optional_list
        items: CiSecretRequirement
        description: Optional CI secret names for the generated workflow. Names only, no values.
      workflow_inputs:
        type: optional_list
        items: CiWorkflowInputRequirement
        description: Names-only workflow input requirements used by the generated CI workflow.
  DeployTargetSpec:
    type: model
    fields:
      target_id:
        type: str
        description: Stable deployment target identifier.
      target_kind:
        type: literal
        values:
        - container
        - compose
        - external_adapter
        description: Provider-neutral target classification.
      runtime:
        type: DeployTargetRuntime
        description: Runtime contract for the deployment target.
      artifact_outputs:
        type: optional_list
        items: str
        description: Deployment artifact paths emitted for this target.
      environment:
        type: DeployTargetEnvironment
        description: Environment variable contract for this target.
      image:
        type: DeployTargetImage
        description: Generic container image naming strategy.
      checks:
        type: DeployTargetChecks
        description: Build/smoke/health checks required for this target.
      provider_profile:
        type: union
        variants:
        - DeployTargetProviderProfile
        - 'null'
        description: Optional provider profile metadata. Keep generic by default.
      deployment_profile:
        type: union
        variants:
        - str
        - 'null'
        description: Optional named deployment profile such as generic_container or local_compose.
      ci_secret_requirements:
        type: union
        variants:
        - CiSecretRequirements
        - 'null'
        description: Optional names-only CI secret and workflow input contract for generated workflows.
  DeploymentHealthcheck:
    type: model
    fields:
      path:
        type: str
        description: Health endpoint path used by deployment checks.
      port:
        type: int
        description: Port associated with the health endpoint.
  DeploymentSafeDetail:
    type: model
    fields:
      key:
        type: str
        description: Non-secret build output detail key.
      value:
        type: str
        description: Non-secret build output detail value encoded as a string.
  DeploymentBuildOutput:
    type: model
    fields:
      repo_url:
        type: union
        variants:
        - str
        - 'null'
        description: Optional repository URL where export/build artifacts are tracked.
      commit_sha:
        type: union
        variants:
        - str
        - 'null'
        description: Optional source revision identifier for the build output.
      build_status:
        type: literal
        values:
        - pending
        - running
        - succeeded
        - failed
        description: Provider-neutral build handoff status.
      image_ref:
        type: union
        variants:
        - str
        - 'null'
        description: Container image reference when available (required for succeeded in validator helpers).
      artifact_digest:
        type: union
        variants:
        - str
        - 'null'
        description: "Optional immutable artifact digest using sha256: prefix."
      workflow_run_url:
        type: union
        variants:
        - str
        - 'null'
        description: Optional generic workflow execution URL from the build/export system.
      logs_url:
        type: union
        variants:
        - str
        - 'null'
        description: Optional generic build/export logs URL.
      safe_details:
        type: optional_list
        items: DeploymentSafeDetail
        description: Optional non-secret metadata for hosts/adapters.
      error_code:
        type: union
        variants:
        - str
        - 'null'
        description: Optional provider-neutral error code when build_status is failed.
  DeploymentTemplateManifest:
    type: model
    fields:
      schema_version:
        type: str
        description: Manifest schema identifier.
      app_id:
        type: str
        description: Application id this manifest belongs to.
      deployment_profile:
        type: str
        description: Named deployment profile used for generation.
      generated_files:
        type: optional_list
        items: str
        description: Files emitted by deployment template generation.
      required_env:
        type: optional_list
        items: str
        description: Required env variable names.
      secret_env:
        type: optional_list
        items: str
        description: Secret env variable names (names only, no values).
      exposed_ports:
        type: optional_list
        items: int
        description: Exposed runtime ports.
      healthcheck:
        type: DeploymentHealthcheck
        description: Health check contract.
      ci_workflow:
        type: union
        variants:
        - str
        - 'null'
        description: Optional CI workflow artifact path.
      ci_secret_requirements:
        type: union
        variants:
        - CiSecretRequirements
        - 'null'
        description: Concrete names-only CI secret and workflow input requirements for the generated workflow artifact.
      dockerfile:
        type: union
        variants:
        - str
        - 'null'
        description: Optional Dockerfile artifact path.
      compose:
        type: union
        variants:
        - str
        - 'null'
        description: Optional docker-compose artifact path.
      validation_status:
        type: literal
        values:
        - pending
        - valid
        - invalid
        description: Deployment manifest validation status.
      deploy_target_spec:
        type: DeployTargetSpec
        description: Source deployment target spec used to generate this manifest.
      build_output_contract:
        type: union
        variants:
        - DeploymentBuildOutput
        - 'null'
        description: Optional provider-neutral build output handoff contract reference.
  CodeFileEntry:
    type: model
    fields:
      filename:
        type: str
        description: Relative generated file path.
      content:
        type: str
        description: File content.
  CodeFilesOutput:
    type: model
    fields:
      code_files:
        type: list
        items: CodeFileEntry
        description: Generated or assembled code files.
      agent_message:
        type: union
        variants:
        - str
        - 'null'
        description: Optional summary message.
  DatabaseArtifactFile:
    type: model
    fields:
      path:
        type: str
        description: Concrete database artifact path such as data/contract.json or data/migrations/{migration_id}.json.
      kind:
        type: literal
        values:
        - data_contract_json
        - data_migration_json
        description: Deterministic database artifact kind.
      purpose:
        type: str
        description: Why this database artifact exists.
      entity_refs:
        type: optional_list
        items: str
        description: Entities or concepts primarily represented by this artifact.
      content:
        type: str
        description: Complete JSON text for this artifact.
  DataMigrationIndexKey:
    type: model
    fields:
      field:
        type: str
        description: Indexed field name.
      order:
        type: int
        description: Sort order, normally 1 or -1.
  DataMigrationIndex:
    type: model
    fields:
      name:
        type: union
        variants:
        - str
        - 'null'
        description: Optional index name.
      keys:
        type: list
        items: DataMigrationIndexKey
        description: Ordered index keys.
      unique:
        type: bool
        description: Whether this index is unique.
  DataMigrationOperation:
    type: model
    fields:
      type:
        type: literal
        values:
        - ensure_collection
        - ensure_index
        - add_field
        - add_collection
        description: Additive migration operation type.
      module_id:
        type: union
        variants:
        - str
        - 'null'
        description: Module that owns the target collection when applicable.
      entity_name:
        type: union
        variants:
        - str
        - 'null'
        description: Entity or collection name affected by the operation.
      field_name:
        type: union
        variants:
        - str
        - 'null'
        description: Field added by add_field operations.
      field_type:
        type: union
        variants:
        - str
        - 'null'
        description: Type for an added field when applicable.
      required:
        type: bool
        description: Whether an added field is required.
      index:
        type: union
        variants:
        - DataMigrationIndex
        - 'null'
        description: Index declaration for ensure_index operations.
      description:
        type: union
        variants:
        - str
        - 'null'
        description: Optional operation note.
  DataMigrationDocument:
    type: model
    fields:
      migration_id:
        type: str
        description: Stable migration id used in data/migrations/{migration_id}.json.
      version:
        type: str
        description: Migration document version.
      summary:
        type: union
        variants:
        - str
        - 'null'
        description: Optional migration summary.
      operations:
        type: list
        items: DataMigrationOperation
        description: Additive runtime migration operations.
  DatabaseOutput:
    type: model
    fields:
      database_files:
        type: list
        items: DatabaseArtifactFile
        description: Typed data contract or migration artifacts emitted by DatabaseAgent.
      code_files:
        type: list
        items: CodeFileEntry
        description: Serialized file mirror. Extraction may rebuild canonical files from database_files.
      pending_schema_migration:
        type: union
        variants:
        - DataMigrationDocument
        - 'null'
        description: Additive migration document staged under data/migrations/{migration_id}.json, or null when no migration is staged.
      agent_message:
        type: union
        variants:
        - str
        - 'null'
        description: Optional summary message.
  DownloadRequest:
    type: model
    fields:
      confirmation_only:
        type: bool
        description: If true, show confirmation UI first and create files after
          user confirms.
        default: false
      storage_backend:
        type: str
        description: Storage target ('none', 'local', 's3').
        default: none
      description:
        type: union
        variants:
        - str
        - 'null'
        description: Optional description text (reserved).
      deployment_profile:
        type: union
        variants:
        - str
        - 'null'
        description: Optional provider-neutral deployment profile id.
      include_dockerfiles:
        type: bool
        description: Include deterministic Dockerfile output from deployment contract.
        default: false
      include_workflow:
        type: bool
        description: Include deterministic CI workflow output from deployment contract.
        default: false
      include_compose:
        type: bool
        description: Include deterministic docker-compose output from deployment contract.
        default: false
  DownloadRequestCall:
    type: model
    fields:
      DownloadRequest:
        type: DownloadRequest
        description: Download configuration.
      agent_message:
        type: str
        description: Concise message (<=140 chars) shown in download UI.
  AppUIQualityReviewRequest:
    type: model
    fields:
      max_revision_attempts:
        type: int
        description: Maximum automated AppSchemaAgent revision loops before blocking.
        default: 2
      agent_message:
        type: str
        description: Concise quality-gate message before review_ui_quality runs.
  ModuleContractQualityReviewRequest:
    type: model
    fields:
      max_revision_attempts:
        type: int
        description: >
          Maximum automated revision loops before blocking. Reserved for future
          loop-back support; currently unused because ConfigMiddlewareAgent runs
          as a scoped task batch worker and cannot be revisited from the main workflow.
        default: 1
      agent_message:
        type: str
        description: >
          Concise quality-gate message before review_module_contract_quality runs.
  ModuleRuntimeQualityReviewRequest:
    type: model
    fields:
      max_revision_attempts:
        type: int
        description: >
          Maximum automated ServiceAgent revision loops before blocking for
          user/operator review.
        default: 1
      agent_message:
        type: str
        description: >
          Concise quality-gate message before review_module_runtime_quality runs.
  ValidationErrorEntry:
    type: model
    fields:
      file:
        type: str
        description: Relative file path.
      line:
        type: int
        description: 1-based line number.
      column:
        type: union
        variants:
        - int
        - 'null'
        description: 1-based column number when available.
      message:
        type: str
        description: Error message.
  AppValidation:
    type: model
    fields:
      validation_strategy:
        type: literal
        values:
        - e2b
        - local
        - skip
        description: Validation strategy requested or resolved for this run.
      validation_status:
        type: literal
        values:
        - passed
        - failed
        - skipped
        description: Outcome of the validation strategy. `skipped` is explicit and not a failure.
      preview_url:
        type: union
        variants:
        - str
        - 'null'
        description: Preview URL to the running app (if started).
      errors:
        type: list
        items: ValidationErrorEntry
        description: Build/test errors with file/line info.
      fix_suggestions:
        type: optional_list
        items: str
        description: Suggested fixes for any errors.
      next_action:
        type: literal
        values:
        - export
        - fix_and_retry
        - manual_review
        description: Recommended next step.
  AppValidationOutput:
    type: model
    fields:
      AppValidation:
        type: AppValidation
        description: App validation results.
  AppValidationRequest:
    type: model
    fields:
      validation_strategy:
        type: literal
        values:
        - e2b
        - local
        - skip
        description: Requested validation strategy. Use context app_validation_strategy when provided; otherwise choose skip for smoke or local/e2b when explicitly configured.
      start_dev_server:
        type: bool
        description: Whether validation may start a preview/dev server when the strategy supports it.
      timeout_seconds:
        type: int
        description: Maximum validation runtime in seconds.
      commands:
        type: optional_list
        items: str
        description: Optional build commands. Omit to use the canonical default validation commands.
  AppValidationRequestCall:
    type: model
    fields:
      AppValidationRequest:
        type: AppValidationRequest
        description: Deterministic validation request consumed by the auto validation gate.
      agent_message:
        type: union
        variants:
        - str
        - 'null'
        description: Short validation status message.
  BackendFoundationFile:
    type: model
    fields:
      path:
        type: str
        description: Concrete app-bundle-relative service foundation file path such as services/config.py, security/secrets.yaml, services/integrations/provider_client.py, services/routes/webhooks.py, or services/adapters/secrets/vault_provider.py. Physical generated workspaces place services/* under app/services/*. Do not use this model for Dockerfile, docker-compose.yml, env.example, deployment.manifest.json, or .github/workflows/* deployment artifacts.
      kind:
        type: literal
        values:
        - scaffold
        - config
        - database_connection
        - middleware
        - integration_helper
        - provider_adapter
        - tooling
        description: Service foundation file family.
      purpose:
        type: str
        description: Why this service foundation file exists.
      contract_refs:
        type: optional_list
        items: str
        description: Build-plan paths or contract surfaces this file satisfies.
      content:
        type: str
        description: Complete source for this service foundation file.
  BackendFoundationBundle:
    type: model
    fields:
      files:
        type: list
        items: BackendFoundationFile
        description: Typed service foundation files emitted in ConfigMiddleware service_foundation mode.
  SubscriptionConfigBundle:
    type: model
    fields:
      files:
        type: list
        items: CodeFileEntry
        description: >
          Serialized subscription contract files emitted in ConfigMiddleware
          subscription_config mode. Must contain only config/subscriptions.yaml.
  ModelFile:
    type: model
    fields:
      path:
        type: str
        description: Concrete module schema helper path such as modules/tasks/backend/schemas.py.
      entity_name:
        type: union
        variants:
        - str
        - 'null'
        description: Primary entity this model file represents when known.
      purpose:
        type: str
        description: Why this backend/schemas.py file exists.
      content:
        type: str
        description: Complete source for this schemas.py file.
  ModelOutput:
    type: model
    fields:
      model_files:
        type: list
        items: ModelFile
        description: Typed backend/schemas.py files emitted by ModelAgent.
      code_files:
        type: list
        items: CodeFileEntry
        description: Serialized file mirror. Extraction may rebuild canonical files from model_files.
      agent_message:
        type: union
        variants:
        - str
        - 'null'
        description: Optional summary message.
  # ===========================================================================
  # CANONICAL MODULE CONTRACT MODELS
  # ConfigMiddlewareAgent emits these typed objects before serializing them to
  # modules/{module_id}/{module.yaml,contracts/events.yaml,contracts/reactions.yaml,
  # contracts/notifications.yaml,contracts/settings.yaml,contracts/admin.yaml,
  # contracts/profile.yaml,contracts/relationships.yaml}. YAML declares the contract; Python files
  # implement behavior through referenced handlers/hooks.
  # ===========================================================================

  ModuleIdentity:
    type: model
    fields:
      id:
        type: str
        description: Stable module id matching the folder name under modules/{module_id}.
      display_name:
        type: str
        description: Human-facing module name.
      version:
        type: str
        description: Semantic version string.
      type:
        type: literal
        values:
        - standard
        - messaging
        - workflow
        - event_pipeline
        - transactional
        - billing
        description: >
          Module type governs scaffold conventions and type-specific YAML additions.
          standard = request/response CRUD (default).
          messaging = stateful communication with read/unread tracking using canonical module contracts only.
          workflow = named lifecycle/state behavior implemented through canonical module contracts and backend policy helpers.
          event_pipeline = automated multi-step lifecycle driven by events, reactions, and optional background polling.
          transactional = append-only ledger for value movements.
          billing = plan-gated entitlements, checkout sessions, subscription lifecycle, and webhook-driven state transitions.
      description:
        type: str
        description: Short module summary.
      owner:
        type: str
        description: Owning surface, typically app or hosted.
      visibility:
        type: str
        description: Visibility hint for discovery and invocation.
      handler:
        type: str
        description: "Canonical Python entrypoint in module-local form backend.handler:ModuleClass."
      user_data_scope:
        type: bool
        description: >
          Set to true when the module stores user-personally-identifiable or user-owned records (contacts, messages, profiles, interests, memberships, transactions). When true the runtime auto-registers the module with the account_data_registry and requires backend/account_data_handler.py to exist. Set false for admin-only, system, or platform-owned records.

  ModulePermission:
    type: model
    fields:
      id:
        type: str
        description: Stable permission id (e.g. contacts.read).
      description:
        type: str
        description: Human-readable permission purpose.

  JsonSchemaProperty:
    type: model
    fields:
      name:
        type: str
        description: Property name.
      type:
        type: literal
        values:
        - string
        - integer
        - number
        - boolean
        - object
        - array
        - 'null'
        description: JSON-compatible property type.
      description:
        type: union
        variants:
        - str
        - 'null'
        description: Optional field description.
      required:
        type: bool
        description: Whether this property is required.
      enum_values:
        type: optional_list
        items: str
        description: Optional finite string values.
      items_type:
        type: union
        variants:
        - str
        - 'null'
        description: Array item type when type=array.

  JsonSchemaContract:
    type: model
    fields:
      type:
        type: literal
        values:
        - object
        - array
        - string
        - integer
        - number
        - boolean
        - 'null'
        description: Top-level JSON-compatible type.
      description:
        type: union
        variants:
        - str
        - 'null'
        description: Optional contract description.
      required:
        type: optional_list
        items: str
        description: Required property names for object contracts.
      properties:
        type: optional_list
        items: JsonSchemaProperty
        description: Object properties as a finite typed list.
      items_type:
        type: union
        variants:
        - str
        - 'null'
        description: Array item type when type=array.

  ModuleAction:
    type: model
    fields:
      id:
        type: str
        description: Stable action id exposed through the module executor.
      description:
        type: str
        description: What the action does.
      handler_method:
        type: str
        description: Method exposed by backend/handler.py for this action. The handler may delegate to service, policy, repo, and schema layers.
      api_surface:
        type: optional_str
        description: >
          External HTTP exposure posture for this action. Use public or
          public_readonly only for anonymous-safe HTTP actions. Omit it or use
          internal/admin_internal for actions that require an authenticated token
          when AUTH_ENABLED=true. This does not bypass permissions or
          entitlement_gate checks.
      input_schema:
        type: JsonSchemaContract
        description: Typed JSON-schema-like input contract.
      output_schema:
        type: JsonSchemaContract
        description: Typed JSON-schema-like output contract.
      permissions:
        type: optional_list
        items: str
        description: Permission ids required to invoke this action.
      emits:
        type: optional_list
        items: str
        description: Event types declared in events.yaml that this action may publish.
      entitlement_gate:
        type: optional_str
        description: >
           Capability id to check via EntitlementPort before dispatching this action.
           Set only on actions that require an active end-user SaaS plan grant in
           the generated app (e.g. "analytics.dashboard"). Null/absent for actions
           with no generated-app entitlement requirement — the no-op adapter grants
           those unconditionally. Do NOT set this on admin_internal actions, and do
           not use it to model hosted product pack-access licensing.

  ModuleCapability:
    type: model
    fields:
      capability_id:
        type: str
        description: Public capability id clients/workflows invoke instead of raw action or workflow ids.
      kind:
        type: literal
        values:
        - action
        - workflow
        - page
        - transition
        - hosted
        description: Target family resolved by platform_app.
      target:
        type: str
        description: Action id, workflow id, route path, transition id, or hosted target id.
      title:
        type: str
        description: Human-facing label.
      permissions:
        type: optional_list
        items: str
        description: Permission ids required to invoke this capability.
      input_schema:
        type: union
        variants:
        - JsonSchemaContract
        - 'null'
        description: Optional input schema for workflow/hosted/page capability invocation.

  AdminRegistryPage:
    type: model
    fields:
      id:
        type: str
        description: Stable page id. Referenced by module admin panels via the `page` field in admin.yaml.
      label:
        type: str
        description: Human-facing page label shown in the admin portal nav.
      path:
        type: str
        description: URL path for this admin page. Use :appId as a placeholder for the app context (e.g. /apps/:appId/orders).
      icon:
        type: union
        variants:
        - str
        - 'null'
        description: Icon hint string matched to the frontend icon map (e.g. dashboard, users, billing, chart, server, settings, plug, history, support). Null only when no icon applies.
      order:
        type: int
        description: Sort position within the nav for this scope.
      enabled:
        type: bool
        description: Whether this page appears in the nav. Defaults to true.
      scope:
        type: literal
        values:
        - workspace
        - app
        description: workspace pages appear in the global Studio nav; app pages appear in the per-app admin portal nav.

  AdminRegistry:
    type: model
    fields:
      schema_version:
        type: str
        description: Must be mozaiks.admin.registry.v1.
      pages:
        type: list
        items: AdminRegistryPage
        description: All admin pages for this app's admin portal, ordered by scope then order field.

  ModuleAdminPanel:
    type: model
    fields:
      id:
        type: str
        description: Stable panel id. Use module-scoped ids such as campaigns.overview.
      label:
        type: str
        description: Human-facing panel label shown inside the admin portal page.
      description:
        type: str
        description: What an app owner can manage or inspect in this panel.
      page:
        type: str
        description: Id of the admin page (from admin_registry.yaml) where this panel mounts. Must match a page id declared in the app's admin/admin_registry.yaml.
      order:
        type: int
        description: Sort order within the target admin page.
      renderer:
        type: literal
        values:
        - schema
        - custom_component
        description: schema reuses the shipped page primitive contract inside AdminPortal; custom_component requires ui/admin registration.
      layout:
        type: union
        variants:
        - str
        - 'null'
        description: Layout hint for schema-rendered admin panels. Use grid, sidebar, full-width, or split. Null only for custom_component panels.
      sections:
        type: optional_list
        items: AppPageSection
        description: Declarative primitive sections rendered inside the admin panel when renderer=schema. Reuse the same section contract as ui/pages/*.yaml and bind data with config.api_endpoint.
      component:
        type: union
        variants:
        - str
        - 'null'
        description: Component registry id when renderer=custom_component; null for schema renderer. Custom components require a matching js_stubs entry.
      permissions:
        type: optional_list
        items: str
        description: Permission ids or roles required to see or use this panel.

  ModuleManifest:
    type: model
    fields:
      schema_version:
        type: str
        description: Must be mozaiks.module.v1.
      module:
        type: ModuleIdentity
        description: Typed module identity object. Do not emit freeform keys.
      permissions:
        type: list
        items: ModulePermission
        description: Permission declarations owned by the module.
      actions:
        type: list
        items: ModuleAction
        description: Deterministic backend actions exposed through backend/handler.py and backed by the module service layer.
      capabilities:
        type: list
        items: ModuleCapability
        description: Public invocation surfaces resolved by platform_app.

  ModuleEvent:
    type: model
    fields:
      type:
        type: str
        description: Namespaced event type. Generic modules may declare only domain.* events.
      version:
        type: int
        description: Event schema version.
      description:
        type: str
        description: Event meaning as an immutable business fact.
      producer:
        type: str
        description: Module id expected to publish this event.
      payload_schema:
        type: JsonSchemaContract
        description: Typed JSON-schema-like payload contract.

  ModuleEventsManifest:
    type: model
    fields:
      schema_version:
        type: literal
        values:
          - mozaiks.events.v1
        description: Must be mozaiks.events.v1.
      events:
        type: list
        items: ModuleEvent
        description: Events this module is allowed to publish.

  ModuleReactionTarget:
    type: model
    fields:
      kind:
        type: literal
        values:
        - handler
        - capability
        - notification
        description: Reaction target family.
      handler_method:
        type: union
        variants:
        - str
        - 'null'
        description: Method name on backend/handler.py used when kind=handler.
      capability_id:
        type: union
        variants:
        - str
        - 'null'
        description: Capability id to invoke when kind=capability.
      notification_id:
        type: union
        variants:
        - str
        - 'null'
        description: Notification rule id when kind=notification.

  ModuleReaction:
    type: model
    fields:
      id:
        type: str
        description: Stable reaction id.
      event_type:
        type: str
        description: Namespaced event type this module reacts to.
      target:
        type: ModuleReactionTarget
        description: Handler, capability, or notification target.
      filters:
        type: optional_list
        items: str
        description: Optional declarative filter expressions based on event envelope/payload.
      idempotency_key:
        type: str
        description: Template used to prevent duplicate reaction execution.
      permissions:
        type: optional_list
        items: str
        description: Permission ids required for the reaction when applicable.

  ModuleReactionsManifest:
    type: model
    fields:
      schema_version:
        type: literal
        values:
          - mozaiks.reactions.v1
        description: Must be mozaiks.reactions.v1.
      reactions:
        type: list
        items: ModuleReaction
        description: Event reactions declared by this module.

  ModuleNotificationAudience:
    type: model
    fields:
      roles:
        type: optional_list
        items: str
        description: Roles that receive the notification.
      permissions:
        type: optional_list
        items: str
        description: Permissions that qualify users for the notification.
      resolver:
        type: union
        variants:
        - str
        - 'null'
        description: Optional module-local Python resolver hook for dynamic audiences. Must be mirrored in python_stubs.

  ModuleNotification:
    type: model
    fields:
      id:
        type: str
        description: Stable notification rule id.
      event_type:
        type: str
        description: Event type that creates the notification intent.
      title:
        type: str
        description: Notification title template.
      body:
        type: str
        description: Notification body template.
      channels:
        type: list
        items: str
        description: Delivery channels such as in_app or email.
      audience:
        type: ModuleNotificationAudience
        description: Audience declaration or resolver hook.
      preference_key:
        type: str
        description: User preference key controlling this notification.
      default_enabled:
        type: bool
        description: Whether the notification is enabled by default.
      renderer:
        type: union
        variants:
        - str
        - 'null'
        description: Optional module-local Python renderer hook for complex message content. Must be mirrored in python_stubs.

  ModuleNotificationsManifest:
    type: model
    fields:
      schema_version:
        type: literal
        values:
          - mozaiks.notifications.v1
        description: Must be mozaiks.notifications.v1.
      notifications:
        type: list
        items: ModuleNotification
        description: Event-to-notification intent mappings.

  ModuleSetting:
    type: model
    fields:
      id:
        type: str
        description: Stable setting id.
      label:
        type: str
        description: Human-facing setting label.
      type:
        type: literal
        values:
        - string
        - integer
        - boolean
        - select
        - secret_ref
        - object
        description: Setting value type.
      required:
        type: bool
        description: Whether the setting must be provided.
      scope:
        type: literal
        values:
        - app
        - user
        - tenant
        description: Setting scope.
      default:
        type: union
        variants:
        - str
        - int
        - bool
        - 'null'
        description: Scalar default value, JSON string for object defaults, or null for no default.
      allowed_values:
        type: optional_list
        items: str
        description: Allowed values for select/string enum settings.
      validator:
        type: union
        variants:
        - str
        - 'null'
        description: "Optional module-local Python validation hook such as backend.settings:validate_api_key. Must be mirrored in python_stubs."
      on_change:
        type: union
        variants:
        - str
        - 'null'
        description: Optional module-local Python hook invoked after setting changes. Must be mirrored in python_stubs.

  ModuleFeatureFlag:
    type: model
    fields:
      id:
        type: str
        description: Stable feature flag id.
      label:
        type: str
        description: Human-facing label.
      type:
        type: literal
        values:
        - boolean
        description: Feature flag type.
      default:
        type: bool
        description: Default enabled state.
      scope:
        type: literal
        values:
        - app
        - user
        - tenant
        description: Feature flag scope.

  ModuleSettingsManifest:
    type: model
    fields:
      schema_version:
        type: literal
        values:
          - mozaiks.settings.v1
        description: Must be mozaiks.settings.v1.
      settings:
        type: list
        items: ModuleSetting
        description: Module-local setting declarations.
      features:
        type: list
        items: ModuleFeatureFlag
        description: Module-local feature flags.

  ModuleAdminManifest:
    type: model
    fields:
      schema_version:
        type: literal
        values:
          - mozaiks.admin.v2
        description: Must be mozaiks.admin.v2.
      panels:
        type: list
        items: ModuleAdminPanel
        description: Module-owned panels. Each panel declares a `page` id referencing a page in the app's admin/admin_registry.yaml.
      hooks:
        type: optional_list
        items: str
        description: "Optional module-local Python hooks for custom panel data. Format: 'module.path:function_name', e.g. 'backend.admin:resolve_campaign_metrics'. Every hook must be mirrored in python_stubs and must resolve within the module boundary."

  ModulePythonStub:
    type: model
    fields:
      path:
        type: str
        description: Module-local Python stub path such as backend/handler.py, backend/service.py, backend/repo.py, backend/policy.py, backend/schemas.py, or backend/settings.py.
      kind:
        type: literal
        values:
        - handler
        - service
        - repo
        - policy
        - schemas
        - settings_hook
        - notifications_hook
        - admin_hook
        - account_data_handler
        - helper
        description: >
          Stub family. Keep this finite and contract-driven. Layered module backends should declare handler, service, repo, policy, and schemas when a durable module is generated. Declare account_data_handler when module.yaml sets user_data_scope: true — the file must export AccountDataHandler with async delete_user_data(*, app_id, user_id) and async export_user_data(*, app_id, user_id) methods.
      purpose:
        type: str
        description: Why this stub exists and what contract surface it implements. For kind=repo, generated content must use ctx.persistence.collection(module_id, entity_name), must not use ctx.db, and must not import get_mongo_client.
      contract_refs:
        type: optional_list
        items: str
        description: Contract fields or entrypoints this stub satisfies, e.g. settings_yaml.settings[api_key].validator.

  ModuleJsStub:
    type: model
    fields:
      path:
        type: str
        description: Frontend stub path relative to the app bundle, e.g. ui/admin/CampaignMetricsPanel.jsx.
      surface:
        type: literal
        values:
        - admin_component
        description: Declared frontend customization surface. AppGenerator emits only bounded admin custom components in this module lane; persistent pages remain declarative and app-level custom full-page routes live in AppSchemaOutput.custom_route_bundle.
      registry_key:
        type: str
        description: Runtime/component registry key referenced by the YAML contract.
      purpose:
        type: str
        description: Why this frontend customization stub exists.
      contract_refs:
        type: optional_list
        items: str
        description: Contract fields that reference this component, e.g. admin_yaml.panels[campaigns.overview].component.

  ModuleRuntimeExtension:
    type: model
    fields:
      kind:
        type: literal
        values:
        - api_router
        - startup_service
        description: |
          Extension kind:
          - api_router: FastAPI router mounted at host startup (webhook receivers, raw-body routes).
          - startup_service: Background service started/stopped with host lifecycle (persistent connections).
      entrypoint:
        type: str
        description: |
          Module-local Python entrypoint in the form module.path:attribute.
          api_router must point to backend.router:get_router.
          startup_service must point to backend.worker:{ServiceClass}.
      prefix:
        type: union
        variants:
        - str
        - 'null'
        description: URL prefix for api_router extensions (e.g. /webhooks/provider). Null for startup_service.

  ModuleRuntimeExtensionsManifest:
    type: model
    fields:
      schema_version:
        type: literal
        values:
        - mozaiks.runtime_extensions.v1
        description: Schema version for runtime_extensions.yaml.
      extensions:
        type: list
        items: ModuleRuntimeExtension
        description: List of host-level extensions declared by this module.

  ModuleProfileField:
    type: model
    fields:
      id:
        type: str
        description: Stable field id. Used as the data key in the rendered panel.
      label:
        type: str
        description: Human-readable field label.
      type:
        type: literal
        values:
          - string
          - number
          - currency
          - date
          - boolean
          - status
        description: Field display type. Must be one of the six runtime-supported types. Unknown types are rejected at load time.

  ModuleProfilePanel:
    type: model
    fields:
      id:
        type: str
        description: Stable panel id. Must be unique within the profile manifest.
      title:
        type: str
        description: Human-readable panel title shown on the profile page.
      description:
        type: union
        variants:
          - str
          - 'null'
        description: Optional subtitle or helper text.
      kind:
        type: literal
        values:
          - metrics
          - list
          - component
        description: >
          Panel display kind. metrics and list require a non-empty fields[].
          component requires a component key and no fields[]. form is reserved
          and rejected at load time — never emit kind=form.
      action:
        type: union
        variants:
          - str
          - 'null'
        description: >
          Module action id that populates the panel at /api/me/profile-panels
          request time. Must reference an action declared in module.yaml.
          Omit for component panels that do not call a module action.
      component:
        type: union
        variants:
          - str
          - 'null'
        description: >
          Custom React component registry key. Required when kind=component.
          Must be mirrored in js_stubs. Null for metrics and list panels.
      fields:
        type: optional_list
        items: ModuleProfileField
        description: >
          Data fields rendered inside the panel. Required (non-empty) for
          metrics and list panels. Must be omitted for component panels.
      order:
        type: union
        variants:
          - int
          - 'null'
        description: Optional display order. Lower numbers appear first. Defaults to 100.

  ModuleProfileTab:
    type: model
    fields:
      id:
        type: str
        description: >
          Stable tab id. Must be unique within this module's profile manifest.
          Used as the React tab key and the URL anchor.
      label:
        type: str
        description: Human-readable tab label displayed in the horizontal tab bar.
      order:
        type: union
        variants:
          - int
          - 'null'
        description: >
          Display order. Lower numbers appear first. Defaults to 100.
          Use low values (10, 20) for core social tabs (messages, contacts).
      action:
        type: union
        variants:
          - str
          - 'null'
        description: >
          Module action id called to hydrate the tab body at
          /api/me/profile-tabs request time. Must reference an action declared
          in module.yaml. Omit if the tab is purely component-driven with no
          server data.
      component:
        type: union
        variants:
          - str
          - 'null'
        description: >
          React component registry key that renders the tab body. Required.
          Must be mirrored in js_stubs so the shell can resolve it at runtime.
          The component receives { tab, data } props where data is the hydrated
          action result.

  ModuleProfileManifest:
    type: model
    fields:
      schema_version:
        type: literal
        values:
          - mozaiks.profile.v1
        description: Must be mozaiks.profile.v1.
      panels:
        type: optional_list
        items: ModuleProfilePanel
        description: >
          Stacked-card panels (panel mode). Prefer tabs for new modules. Panel ids
          must be unique. Emit only panels the module can meaningfully populate
          from its own declared actions. Do not expose admin-only actions or
          secrets.
      tabs:
        type: optional_list
        items: ModuleProfileTab
        description: >
          Tab contributions to the social profile page (/me, /u/:username).
          Tab ids must be unique within this module. Emit tabs when the module
          has user-scoped data worth a dedicated profile section — for example
          a wallet summary, contacts roster, or message inbox. Do not add tabs
          for every module; only emit when the tab content is meaningfully
          user-facing. Each tab must declare a component and may declare an
          action to hydrate it with server data.

  ModuleRelationshipProvider:
    type: model
    fields:
      id:
        type: str
        description: Stable provider id. Must be unique within relationships.yaml.
      label:
        type: str
        description: Human-readable group label, for example Owned Apps or Joined Communities.
      description:
        type: union
        variants:
          - str
          - 'null'
        description: Optional helper text describing what this provider returns.
      order:
        type: union
        variants:
          - int
          - 'null'
        description: Optional provider order. Lower numbers are hydrated and displayed first. Defaults to 100.
      action:
        type: str
        description: Module action id that returns current-user relationship rows. Must reference an action declared in module.yaml.
      resource_types:
        type: list
        items: str
        description: Non-empty list of resource types this provider may return, for example app, community, or document.
      relationship_types:
        type: optional_list
        items: str
        description: Optional list of relationship types this provider may return, for example owner, member, watcher, or invited.

  ModuleRelationshipsManifest:
    type: model
    fields:
      schema_version:
        type: literal
        values:
          - mozaiks.relationships.v1
        description: Must be mozaiks.relationships.v1.
      providers:
        type: list
        items: ModuleRelationshipProvider
        description: >
          Current-user relationship providers declared by this module. Provider
          ids must be unique. Each provider action must return normalized
          relationship rows for resources the current user owns, administers,
          belongs to, watches, backs, or is invited to.

  ModuleContractBundle:
    type: model
    fields:
      module_id:
        type: str
        description: Module folder id under modules/{module_id}.
      module_yaml:
        type: ModuleManifest
        description: module.yaml contract object.
      events_yaml:
        type: ModuleEventsManifest
        description: events.yaml contract object.
      reactions_yaml:
        type: ModuleReactionsManifest
        description: reactions.yaml contract object.
      notifications_yaml:
        type: ModuleNotificationsManifest
        description: notifications.yaml contract object.
      settings_yaml:
        type: ModuleSettingsManifest
        description: settings.yaml contract object.
      admin_yaml:
        type: ModuleAdminManifest
        description: admin.yaml contract object for feature panels mounted inside semantic /admin sections.
      profile_yaml:
        type: union
        variants:
          - ModuleProfileManifest
          - 'null'
        description: >
          Optional contracts/profile.yaml. Emit only when this module has
          user-scoped data worth surfacing on the user profile page — for
          example account summary, notification preferences, or usage stats.
          Null for most modules. Do not emit for every module.
      relationships_yaml:
        type: union
        variants:
          - ModuleRelationshipsManifest
          - 'null'
        description: >
          Optional contracts/relationships.yaml. Emit only when this module can
          enumerate current-user relationships to module-owned resources for a
          generic My Apps, Portfolio, or My Resources surface. Null for most modules.
      python_stubs:
        type: optional_list
        items: ModulePythonStub
        description: Python implementation stubs required by the contract. Durable module surfaces should normally declare backend/handler.py, backend/service.py, backend/repo.py, backend/policy.py, and backend/schemas.py, plus any bounded hook files referenced by YAML.
      js_stubs:
        type: optional_list
        items: ModuleJsStub
        description: Optional JS/TS frontend customization stubs required by declared admin custom components.
      runtime_extensions_yaml:
        type: union
        variants:
        - ModuleRuntimeExtensionsManifest
        - 'null'
        description: Optional runtime_extensions.yaml contract. Emit only when the module needs an api_router (webhook receiver) or startup_service (persistent background connection). Null for most modules.

  ControlPlaneRouteRef:
    type: model
    fields:
      workflow_sequence:
        type: str
        description: >
          Required workflow_sequence id from workflows/extended_orchestration/extension_registry.json.
          This is the only route target allowed in generated control_plane.yaml routes.

  ControlPlaneArtifactChangeRoutes:
    type: model
    fields:
      patch:
        type: ControlPlaneRouteRef
        description: Sequence selected for local patch requests.
      design:
        type: ControlPlaneRouteRef
        description: Sequence selected for design/schema-level requests.
      feature:
        type: ControlPlaneRouteRef
        description: Sequence selected for additive feature requests.
      core:
        type: ControlPlaneRouteRef
        description: Sequence selected for core product-direction changes.

  ControlPlaneArtifactRouting:
    type: model
    fields:
      artifact_kind:
        type: str
        description: Stable artifact kind this routing policy applies to, such as app_bundle or workflow_bundle.
      label:
        type: str
        description: Human-readable artifact label.
      routes:
        type: ControlPlaneArtifactChangeRoutes
        description: Change-class route map. Each route contains workflow_sequence only.

  ControlPlaneRoutingManifest:
    type: model
    fields:
      default_artifact_kind:
        type: str
        description: Default artifact kind when a refinement request does not specify one.
      artifacts:
        type: list
        items: ControlPlaneArtifactRouting
        description: Artifact routing policies for the harness.

  ControlPlaneCheckpointManifestOutput:
    type: model
    fields:
      event:
        type: literal
        values:
        - request_submitted
        - scope_requested
        - contract_surface_requested
        - coding_requested
        description: >
          LLM-backed control-plane checkpoint event. Mozaiks infers checkpoint
          id, mode, handler implementation, and structured output contract from
          this event.
      prompt_id:
        type: str
        description: Prompt id declared in control_plane/prompts/*.yaml.
      tool_ids:
        type: optional_list
        items: str
        description: Tool ids from control_plane/config/tools.yaml available to this checkpoint.

  ControlPlaneManifestOutput:
    type: model
    fields:
      schema_version:
        type: literal
        values:
        - mozaiks.control_plane
        description: Control-plane manifest schema version.
      routing:
        type: ControlPlaneRoutingManifest
        description: Artifact routing policy. Routes may contain workflow_sequence only.
      checkpoints:
        type: list
        items: ControlPlaneCheckpointManifestOutput
        description: >
          LLM-backed checkpoint prompts/tools. Do not declare deterministic
          handler checkpoints; Mozaiks supplies them in runtime.

  ControlPlaneToolDefinition:
    type: model
    fields:
      id:
        type: str
        description: Stable tool id.
      kind:
        type: str
        description: Tool kind, such as context_tool.
      description:
        type: str
        description: Human-readable tool purpose.
      entrypoint:
        type: str
        description: Shipped tool entrypoint. Generated apps must not invent undeclared Python tools.
      available_to:
        type: optional_list
        items: str
        description: Checkpoint events where this tool is available.

  ControlPlaneToolsManifestOutput:
    type: model
    fields:
      schema_version:
        type: literal
        values:
        - mozaiks.control_plane.tools
        description: Control-plane tools manifest schema version.
      tools:
        type: list
        items: ControlPlaneToolDefinition
        description: Tool bindings available to checkpoints.

  ControlPlaneScopePolicies:
    type: model
    fields:
      max_selected_paths:
        type: int
        description: Maximum number of paths inferred by scope selection before clarification is required.
      auto_apply_max_paths:
        type: int
        description: Maximum number of scoped paths that can be patched without an explicit scope confirmation.
      overflow_behavior:
        type: literal
        values:
        - clarify
        - workflow
        description: Behavior when inferred scope exceeds max_selected_paths. Use workflow to escalate to a full workflow sequence.

  ControlPlanePoliciesManifestOutput:
    type: model
    fields:
      schema_version:
        type: literal
        values:
        - mozaiks.control_plane.policies
        description: Control-plane policies manifest schema version.
      scope:
        type: ControlPlaneScopePolicies
        description: Deterministic scope and auto-apply bounds for the harness.

  ControlPlanePromptFile:
    type: model
    fields:
      id:
        type: str
        description: Prompt id referenced by checkpoints.
      filename:
        type: str
        description: Prompt file path under control_plane/prompts/, e.g. control_plane/prompts/change_classifier_system.yaml.
      content:
        type: str
        description: Prompt content.

  ControlPlanePackBundle:
    type: model
    fields:
      control_plane_yaml:
        type: ControlPlaneManifestOutput
        description: Serialized to control_plane/config/control_plane.yaml.
      tools_yaml:
        type: ControlPlaneToolsManifestOutput
        description: Serialized to control_plane/config/tools.yaml.
      policies_yaml:
        type: union
        variants:
        - ControlPlanePoliciesManifestOutput
        - 'null'
        description: Optional policies manifest serialized to control_plane/config/policies.yaml.
      prompt_files:
        type: optional_list
        items: ControlPlanePromptFile
        description: Prompt files serialized under control_plane/prompts/.

  ControlPlaneOutput:
    type: model
    fields:
      control_plane_pack:
        type: ControlPlanePackBundle
        description: Required typed app-local control-plane harness pack.
      code_files:
        type: list
        items: CodeFileEntry
        description: Serialized file mirror. The typed control_plane_pack is the source of truth.
      agent_message:
        type: union
        variants:
        - str
        - 'null'
        description: Optional concise summary.

  ConfigMiddlewareOutput:
    type: model
    fields:
      mode:
        type: literal
        values:
        - module_contract_bundle
        - service_foundation
        - subscription_config
        description: Output mode selected from current_build_task_type or a bounded workflow-integration repair pass.
      module_contract:
        type: union
        variants:
        - ModuleContractBundle
        - 'null'
        description: Required in module_contract_bundle mode; null for service_foundation mode.
      service_foundation_bundle:
        type: union
        variants:
        - BackendFoundationBundle
        - 'null'
        description: Required in service_foundation mode; null for module_contract_bundle and subscription_config modes.
      subscription_config_bundle:
        type: union
        variants:
        - SubscriptionConfigBundle
        - 'null'
        description: Required in subscription_config mode; null for other modes.
      code_files:
        type: list
        items: CodeFileEntry
        description: Serialized files. In typed modes, these mirror module_contract, service_foundation_bundle, or subscription_config_bundle.
      agent_message:
        type: union
        variants:
        - str
        - 'null'
        description: Optional concise summary.
  # ===========================================================================
  # SCHEMA-DRIVEN UI GENERATION MODELS (v2 primitive system)
  # Agents output these typed schemas; tools serialize them to YAML/JSON files.
  # Persistent app UI is declarative by default, with a rare bounded custom_route_bundle
  # for full-page React escapes when the shipped primitive system cannot express a route.
  # ===========================================================================

  AppPrimitiveValue:
    type: union
    variants:
    - str
    - int
    - float
    - bool
    - 'null'

  AppSelectionMode:
    type: literal
    values:
    - none
    - single
    - multi

  AppFormLayout:
    type: literal
    values:
    - vertical
    - horizontal
    - grid

  AppStatusValue:
    type: literal
    values:
    - done
    - active
    - pending
    - error

  AppAlertVariant:
    type: literal
    values:
    - default
    - info
    - success
    - warning
    - destructive

  AppPrimitiveKeyValue:
    type: model
    fields:
      key:
        type: str
        description: Stable object key.
      value:
        type: AppPrimitiveValue
        description: Deterministic scalar value. Open-ended nested objects are not allowed in strict UI contracts.

  AppPageAction:
    type: model
    fields:
      id:
        type: union
        variants:
        - str
        - 'null'
        description: Optional stable action id. Recommended when the action may be referenced by selection or empty-state handling.
      label:
        type: str
        description: Display label for the action.
      variant:
        type: union
        variants:
        - str
        - 'null'
        description: Optional visual variant hint for Button-backed actions.
      action_type:
        type: literal
        values:
        - navigate
        - event
        - workflow
        - submit
        - delete
        description: How this action behaves.
      href:
        type: union
        variants:
        - str
        - 'null'
        description: Route or API/module endpoint. Required for navigate, submit, and delete actions; supports {field} interpolation.
      event_type:
        type: union
        variants:
        - str
        - 'null'
        description: "Event emitted on click (event actions only, e.g. ui.modal.open)."
      workflow_id:
        type: union
        variants:
        - str
        - 'null'
        description: Runtime workflow registry id to launch when action_type=workflow. Never use workflow capability ids here.
      context_variables:
        type: optional_list
        items: AppPrimitiveKeyValue
        description: Optional deterministic context_variables entries for workflow actions. save_app_schema persists these as an object.
      payload:
        type: optional_list
        items: AppPrimitiveKeyValue
        description: Generic scalar payload entries used by event, submit, or delete actions. save_app_schema persists these as an object.
      requires_selection:
        type: bool
        description: Whether a row/item must be selected before this action is enabled.
        default: false
      closes_modal:
        type: bool
        description: Whether modal-backed action execution should close the modal automatically.
        default: true

  AppTableColumn:
    type: model
    fields:
      key:
        type: str
        description: Data key for the column.
      label:
        type: union
        variants:
        - str
        - 'null'
        description: Human-facing column label. Null uses the key.
      sortable:
        type: bool
        description: Whether the column can be sorted.
        default: false
      type:
        type: union
        variants:
        - str
        - 'null'
        description: Optional display type such as text, number, date, status, currency, or action.
      width:
        type: union
        variants:
        - str
        - 'null'
        description: Optional CSS width hint.

  AppSelectOption:
    type: model
    fields:
      value:
        type: AppPrimitiveValue
        description: Option value.
      label:
        type: str
        description: Option label.

  AppFormField:
    type: model
    fields:
      name:
        type: str
        description: Field name.
      label:
        type: str
        description: Field label.
      type:
        type: literal
        values:
        - text
        - email
        - password
        - number
        - textarea
        - select
        - checkbox
        description: Field input type.
      required:
        type: bool
        description: Whether the field is required.
        default: false
      placeholder:
        type: union
        variants:
        - str
        - 'null'
        description: Optional placeholder.
      options:
        type: optional_list
        items: AppSelectOption
        description: Select options. Null for non-select fields.

  AppEmptyStateConfig:
    type: model
    fields:
      title:
        type: union
        variants:
        - str
        - 'null'
        description: Empty-state title.
      message:
        type: union
        variants:
        - str
        - 'null'
        description: Empty-state supporting copy.
      action:
        type: union
        variants:
        - AppPageAction
        - 'null'
        description: One optional empty-state action.
      error_title:
        type: union
        variants:
        - str
        - 'null'
        description: Optional load-error title for data-backed primitives.
      error_message:
        type: union
        variants:
        - str
        - 'null'
        description: Optional load-error message for data-backed primitives.
      retry_label:
        type: union
        variants:
        - str
        - 'null'
        description: Optional retry action label for data-backed primitives.

  AppTimelineItem:
    type: model
    fields:
      label:
        type: str
        description: Timeline item label.
      status:
        type: AppStatusValue
        description: Timeline item status.
      description:
        type: union
        variants:
        - str
        - 'null'
        description: Optional detail.
      timestamp:
        type: union
        variants:
        - str
        - 'null'
        description: Optional timestamp.

  AppProgressStage:
    type: model
    fields:
      label:
        type: str
        description: Stage label.
      status:
        type: AppStatusValue
        description: Stage status.
      description:
        type: union
        variants:
        - str
        - 'null'
        description: Optional detail.

  AppFileListItem:
    type: model
    fields:
      name:
        type: str
        description: File name.
      type:
        type: union
        variants:
        - str
        - 'null'
        description: Optional file type.
      size:
        type: union
        variants:
        - str
        - 'null'
        description: Optional display size.
      url:
        type: union
        variants:
        - str
        - 'null'
        description: Optional file URL.
      status:
        type: union
        variants:
        - str
        - 'null'
        description: Optional status such as ready, generating, or error.

  AppDataTableConfig:
    type: model
    fields:
      columns:
        type: list
        items: AppTableColumn
        description: Table columns. Required for DataTable.
      api_endpoint:
        type: union
        variants:
        - str
        - 'null'
        description: Optional canonical module endpoint for row data. Use /api/modules/{module_id}/{action_id}; do not include query strings or fragments. Put limits in page_size and filters in payload/input config.
      data_key:
        type: union
        variants:
        - str
        - 'null'
        description: Optional response key containing row data.
      selection:
        type: union
        variants:
        - AppSelectionMode
        - 'null'
        description: Optional row selection mode.
      pagination:
        type: bool
        description: Whether pagination is enabled.
        default: false
      page_size:
        type: union
        variants:
        - int
        - 'null'
        description: Optional page size.
      search:
        type: bool
        description: Whether table-local search is enabled.
        default: false
      actions:
        type: optional_list
        items: AppPageAction
        description: Optional row or toolbar actions.
      empty:
        type: union
        variants:
        - AppEmptyStateConfig
        - 'null'
        description: Optional empty-state copy/action.

  AppFormConfig:
    type: model
    fields:
      fields:
        type: list
        items: AppFormField
        description: Form fields. Required for Form.
      layout:
        type: union
        variants:
        - AppFormLayout
        - 'null'
        description: Optional form layout.
      columns:
        type: union
        variants:
        - int
        - 'null'
        description: Optional number of grid columns.
      submit_label:
        type: union
        variants:
        - str
        - 'null'
        description: Optional submit label.
      submit_action:
        type: union
        variants:
        - AppPageAction
        - 'null'
        description: Submit action. Prefer module/API routes or workflow actions.
      cancel_label:
        type: union
        variants:
        - str
        - 'null'
        description: Optional cancel label.
      cancel_action:
        type: union
        variants:
        - AppPageAction
        - 'null'
        description: Optional cancel action.
      disabled:
        type: bool
        description: Whether the form is disabled.
        default: false

  AppButtonConfig:
    type: model
    fields:
      label:
        type: str
        description: Button label.
      variant:
        type: union
        variants:
        - str
        - 'null'
        description: Optional button variant.
      size:
        type: union
        variants:
        - str
        - 'null'
        description: Optional size.
      action:
        type: union
        variants:
        - AppPageAction
        - 'null'
        description: Optional structured action.

  AppModalLeafConfig:
    type: model
    fields:
      title:
        type: union
        variants:
        - str
        - 'null'
        description: Optional modal title.
      description:
        type: union
        variants:
        - str
        - 'null'
        description: Optional modal copy.
      size:
        type: union
        variants:
        - str
        - 'null'
        description: "Optional size: small, medium, large, or full."
      actions:
        type: optional_list
        items: AppPageAction
        description: Optional modal actions.

  AppAlertConfig:
    type: model
    fields:
      title:
        type: union
        variants:
        - str
        - 'null'
        description: Optional alert title.
      message:
        type: str
        description: Alert message.
      variant:
        type: union
        variants:
        - AppAlertVariant
        - 'null'
        description: Optional alert variant.
      dismissible:
        type: bool
        description: Whether the alert is dismissible.
        default: false

  AppSkeletonConfig:
    type: model
    fields:
      rows:
        type: union
        variants:
        - int
        - 'null'
        description: Optional number of rows.
      height:
        type: union
        variants:
        - str
        - 'null'
        description: Optional height.

  AppEmptyConfig:
    type: model
    fields:
      title:
        type: union
        variants:
        - str
        - 'null'
        description: Optional empty title.
      message:
        type: union
        variants:
        - str
        - 'null'
        description: Optional empty message.
      action:
        type: union
        variants:
        - AppPageAction
        - 'null'
        description: One optional action.
      icon:
        type: union
        variants:
        - str
        - 'null'
        description: Optional icon id.

  AppTimelineConfig:
    type: model
    fields:
      title:
        type: union
        variants:
        - str
        - 'null'
        description: Optional timeline title.
      items:
        type: list
        items: AppTimelineItem
        description: Ordered timeline items.

  AppCodeBlockConfig:
    type: model
    fields:
      title:
        type: union
        variants:
        - str
        - 'null'
        description: Optional code block title.
      code:
        type: str
        description: Code content.
      language:
        type: union
        variants:
        - str
        - 'null'
        description: Optional language.
      filename:
        type: union
        variants:
        - str
        - 'null'
        description: Optional filename.

  AppProgressTrackerConfig:
    type: model
    fields:
      title:
        type: union
        variants:
        - str
        - 'null'
        description: Optional progress title.
      stages:
        type: list
        items: AppProgressStage
        description: Ordered stages.

  AppAlertBannerConfig:
    type: model
    fields:
      title:
        type: union
        variants:
        - str
        - 'null'
        description: Optional banner title.
      message:
        type: str
        description: Banner message.
      variant:
        type: union
        variants:
        - AppAlertVariant
        - 'null'
        description: Optional banner variant.
      dismissible:
        type: bool
        description: Whether the banner is dismissible.
        default: false
      actions:
        type: optional_list
        items: AppPageAction
        description: Optional banner actions.

  AppActionButtonConfig:
    type: model
    fields:
      title:
        type: union
        variants:
        - str
        - 'null'
        description: Optional action group title.
      layout:
        type: union
        variants:
        - str
        - 'null'
        description: "Optional layout: row or column."
      actions:
        type: list
        items: AppPageAction
        description: Actions in the group.

  AppFileListConfig:
    type: model
    fields:
      title:
        type: union
        variants:
        - str
        - 'null'
        description: Optional file list title.
      files:
        type: list
        items: AppFileListItem
        description: Files to show.

  AppTableFilter:
    type: model
    fields:
      label:
        type: str
        description: User-facing filter label.
      value:
        type: str
        description: Stable filter value.
      field:
        type: union
        variants:
        - str
        - 'null'
        description: Optional row field to match.
      match_values:
        type: optional_list
        items: str
        description: Optional values accepted by this filter.

  AppTableSort:
    type: model
    fields:
      label:
        type: str
        description: User-facing sort label.
      value:
        type: str
        description: Stable sort value.
      key:
        type: union
        variants:
        - str
        - 'null'
        description: Optional row field used for sorting.
      direction:
        type: union
        variants:
        - str
        - 'null'
        description: "Optional sort direction: asc or desc."
      type:
        type: union
        variants:
        - str
        - 'null'
        description: Optional sort value type such as date, text, or number.

  AppPageHeaderConfig:
    type: model
    fields:
      title:
        type: str
        description: Page title.
      subtitle:
        type: union
        variants:
        - str
        - 'null'
        description: One short page subtitle.
      actions:
        type: optional_list
        items: AppPageAction
        description: Optional header actions. Prefer one primary action and one secondary action at most.
      title_font:
        type: union
        variants:
        - str
        - 'null'
        description: "Optional title font hint: body or heading."

  AppResourceTableConfig:
    type: model
    fields:
      columns:
        type: list
        items: AppTableColumn
        description: Resource table columns.
      api_endpoint:
        type: union
        variants:
        - str
        - 'null'
        description: Optional canonical module endpoint for row data. Use /api/modules/{module_id}/{action_id}; do not include query strings or fragments. Put limits in page_size and filters in payload/input config.
      data_key:
        type: union
        variants:
        - str
        - 'null'
        description: Optional response key containing row data.
      selection:
        type: union
        variants:
        - AppSelectionMode
        - 'null'
        description: Optional row selection mode.
      pagination:
        type: bool
        description: Whether pagination is enabled.
        default: false
      page_size:
        type: union
        variants:
        - int
        - 'null'
        description: Optional page size.
      search:
        type: bool
        description: Whether table-local search is enabled.
        default: true
      search_placeholder:
        type: union
        variants:
        - str
        - 'null'
        description: Optional search input placeholder.
      search_keys:
        type: optional_list
        items: str
        description: Optional row fields used for search.
      filters:
        type: optional_list
        items: AppTableFilter
        description: Optional compact filter tabs.
      default_filter:
        type: union
        variants:
        - str
        - 'null'
        description: Optional default filter value.
      sorts:
        type: optional_list
        items: AppTableSort
        description: Optional sort options.
      default_sort:
        type: union
        variants:
        - str
        - 'null'
        description: Optional default sort value.
      actions:
        type: optional_list
        items: AppPageAction
        description: Optional row or toolbar actions.
      empty:
        type: union
        variants:
        - AppEmptyStateConfig
        - 'null'
        description: Optional empty-state copy/action.

  AppSummaryItem:
    type: model
    fields:
      id:
        type: union
        variants:
        - str
        - 'null'
        description: Optional stable summary item id.
      label:
        type: str
        description: Metric label.
      value:
        type: AppPrimitiveValue
        description: Metric value. Use null when value_key binds to an api_endpoint response.
      value_key:
        type: union
        variants:
        - str
        - 'null'
        description: Dot-path into the section api_endpoint response, such as metrics.total.value.
      detail:
        type: union
        variants:
        - str
        - 'null'
        description: Optional short detail.
      detail_key:
        type: union
        variants:
        - str
        - 'null'
        description: Dot-path into the section api_endpoint response for detail text.
      trend_key:
        type: union
        variants:
        - str
        - 'null'
        description: Dot-path into the section api_endpoint response for trend detail. Use only when the bound module action computes a real historical comparison; otherwise keep null.
      format:
        type: union
        variants:
        - str
        - 'null'
        description: "Optional value formatter: number, currency, or percent."
      trend_format:
        type: union
        variants:
        - str
        - 'null'
        description: "Optional trend formatter: number, currency, or percent."
      trend_label:
        type: union
