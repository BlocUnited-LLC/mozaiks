tools:
- agent: AppSchemaAgent
  file: save_app_schema.py
  function: save_app_schema
  description: >
    Persist the AppSchemaOutput to the app bundle directory. Serializes app startup to
    app.json, each AppPageSchema to ui/pages/{name}.yaml, optional custom_route_bundle
    artifacts to ui/route_manifest.json + ui/pages/custom/*.jsx + ui/index.js, and merges
    theme/shell/asset artifacts into their canonical config files when provided.
    Called automatically after AppSchemaAgent speaks.
  tool_type: Agent_Tool
  auto_tool_call: true
  bind_to_agent: false
- agent: AppUIQualityAgent
  file: ui_quality.py
  function: review_ui_quality
  description: >
    Review persisted AppSchemaAgent output for production UI quality issues and
    set app_ui_quality_status to passed, needs_revision, or blocked for the
    AppGenerator handoff gate.
  tool_type: Agent_Tool
  auto_tool_call: true
  bind_to_agent: false
- agent: ModuleContractQualityAgent
  file: review_module_contract_quality.py
  function: review_module_contract_quality
  description: >
    Audit module YAML contract files from ConfigMiddlewareAgent for schema
    compliance and set module_contract_quality_status to passed or blocked for
    the AppGenerator handoff gate. Called automatically after
    ModuleContractQualityAgent speaks.
  tool_type: Agent_Tool
  auto_tool_call: true
  bind_to_agent: false
- agent: ModuleRuntimeQualityAgent
  file: module_runtime_quality.py
  function: review_module_runtime_quality
  description: >
    Audit generated module backend Python from ServiceAgent for runtime
    placeholder data, hardcoded stats/trends, and TODO/mock/sample logic. Sets
    module_runtime_quality_status to passed, needs_revision, or blocked for the
    AppGenerator handoff gate. Called automatically after
    ModuleRuntimeQualityAgent speaks.
  tool_type: Agent_Tool
  auto_tool_call: true
  bind_to_agent: false
- agent: AppPlanAgent
  file: app_build_plan.py
  function: app_build_plan
  description: Persist the canonical app build plan so downstream generation agents
    can read the same scoped capability packs, pages, entities, roles, integrations,
    theme preferences, and generation order.
  tool_type: Agent_Tool
  auto_tool_call: true
  bind_to_agent: false
- agent: AppPlanAgent
  file: read_carry_forward_module_contract.py
  function: read_carry_forward_module_contract
  description: >
    Read selected contract files (module.yaml, contracts/*.yaml,
    runtime_extensions.yaml) from a carry-forward candidate in the previous
    app_bundle artifact workspace. Allowed only during conceptual_replan
    when previous_app_bundle_ref is present in context. Read-only — no
    backend Python source, no file copies, no artifact writes, no LLM calls.
    Use carry_forward_classification from carry_forward_modules to decide
    which modules warrant inspection before planning reuse, adaptation, or
    regeneration.
  tool_type: Agent_Tool
  auto_tool_call: false
- agent: AdminRegistryAgent
  file: save_admin_registry.py
  function: save_admin_registry
  description: >
    Persist AdminRegistryOutput to context. Saves admin_registry for downstream
    page-ref validation and merges code_files (including admin/admin_registry.yaml)
    into the accumulated bundle. Called automatically after AdminRegistryAgent speaks.
  tool_type: Agent_Tool
  auto_tool_call: true
  bind_to_agent: false
- agent: AssemblyAgent
  file: assemble_app_tasks.py
  function: assemble_app_tasks
  description: Merge AppGenerator task batch outputs into one assembled code_files bundle.
  tool_type: Agent_Tool
  auto_tool_call: true
  bind_to_agent: false
- agent: AssemblyAgent
  file: resolve_carry_forward_preservation.py
  function: resolve_carry_forward_preservation
  description: >
    Runs automatically after assemble_app_tasks completes. Copies only Phase 7A
    allowlisted module contract files (module.yaml and contracts/*.yaml) from
    the prior app bundle workspace into the assembled output for modules with a
    reuse carry_forward_decision. Generated output wins all conflicts — the
    resolver only fills paths not already produced by generation. Backend Python,
    runtime_extensions.yaml, custom React, route manifests, database artifacts,
    env files, and all non-declarative files are never copied. No-ops gracefully
    when prior workspace is unavailable or carry_forward_decisions is absent.
    Emits carry_forward_report and carry_forward_additions to context_variables.
  tool_type: Agent_Tool
  auto_tool_call: true
  bind_to_agent: false
- agent: IntegrationReadinessAgent
  file: integration_readiness.py
  function: check_integration_readiness
  description: >
    Aggregate integration needs from AppGenerator planning, task batch outputs,
    and discovered task context. Reuse app connectors when ready and
    prompt inline for unresolved required credentials before validation/download.
  tool_type: UI_Tool
  auto_tool_call: true
  bind_to_agent: false
  ui:
    component: AgentAPIKeysBundleInput
    mode: inline
    workflow_primitive: form_card
    realization: workflow_wrapper
  ui_contract:
    surface_kind: agent_tool
    payload_schema:
      type: object
      properties:
        heading:
          type: string
        description:
          type: string
        services:
          type: array
      additionalProperties: true
    actions_schema:
    - id: submit
      label: Submit Keys
      variant: primary
      payload_schema:
        type: object
        properties:
          services:
            type: array
        additionalProperties: true
    - id: cancel
      label: Cancel
      variant: secondary
      payload_schema:
        type: object
        properties: {}
        additionalProperties: true
- agent: ControllerAgent
  file: integration_readiness.py
  function: record_integration_need
  description: Record an integration need discovered while generating an API adapter or controller surface.
  tool_type: Agent_Tool
  auto_tool_call: false
- agent: DownloadAgent
  file: generate_and_download.py
  function: generate_and_download
  description: Bundle generated app files into a ZIP and present the AppWorkbench
    artifact UI (code + preview + export).
  tool_type: UI_Tool
  auto_tool_call: true
  bind_to_agent: false
  ui:
    component: AppWorkbench
    mode: artifact
    workflow_primitive: artifact_workbench
    realization: workflow_wrapper
  ui_contract:
    surface_kind: agent_tool
    payload_schema:
      type: object
      properties:
        title:
          type: string
        workbench:
          type: object
        files:
          type: array
      additionalProperties: true
    actions_schema:
    - id: download_complete
      label: Continue
      variant: primary
      approved: true
      payload_schema:
        type: object
        properties:
          download_accepted:
            type: boolean
        additionalProperties: true
    - id: export_to_github
      label: Export to GitHub
      variant: secondary
      payload_schema:
        type: object
        properties:
          repo_name:
            type: string
          commit_message:
            type: string
        additionalProperties: true
    - id: close
      label: Close
      variant: ghost
      payload_schema:
        type: object
        properties: {}
        additionalProperties: true
- agent: AppValidationAgent
  file: app_validation.py
  function: validate_app_bundle_from_request
  description: >
    Deterministically validate the generated app bundle from AppValidationAgent's
    structured request. Runs app build validation, agent-backend checks when
    agent backend context exists, and module/page wiring checks. Called
    automatically after AppValidationAgent speaks.
  tool_type: Agent_Tool
  auto_tool_call: true
  bind_to_agent: false
- agent: AppValidationAgent
  file: integration_tests.py
  function: run_integration_tests
  description: >
    Run lightweight integration checks between the generated frontend app and the
    agent backend context (env var wiring, endpoint availability). Called internally
    by the AppValidationAgent runtime gate.
  tool_type: Agent_Tool
  auto_tool_call: false
  bind_to_agent: false
- agent: AppValidationAgent
  file: validate_wiring.py
  function: validate_wiring
  description: >
    Cross-reference every page api_endpoint field against the known module action
    registry (capability_packs + modules/*/module.yaml). Flags orphaned page
    endpoints, query-string endpoints, and fragment endpoints (blocking), and
    unreferenced module actions (advisory). Called internally by the
    AppValidationAgent runtime gate alongside run_integration_tests.
  tool_type: Agent_Tool
  auto_tool_call: false
  bind_to_agent: false
lifecycle_tools:
  - trigger: before_chat
    agent: null
    file: ../_shared/context_graph/load_context_graph_context.py
    function: load_context_graph_context
    description: Load the current compact Context Graph pack into context_variables before agent prompt hooks run.
    tool_type: Agent_Tool
  - trigger: before_chat
    agent: null
    file: hydrate_app_build_plan_context.py
    function: hydrate_app_build_plan_context
    description: Hydrate task-batch context from a preloaded AppBuildPlan before AppGenerator agents run.
    tool_type: Agent_Tool
  - trigger: on_start
    agent: null
    file: tools/platform/build_lifecycle.py
    function: emit_build_started
    description: Notify platform build tracking when workflow run starts.
    tool_type: Agent_Tool
  - trigger: on_complete
    agent: null
    file: tools/platform/build_lifecycle.py
    function: emit_build_completed
    description: Notify platform build tracking when workflow run completes.
    tool_type: Agent_Tool
  - trigger: on_fail
    agent: null
    file: tools/platform/build_lifecycle.py
    function: emit_build_failed
    description: Notify platform build tracking when workflow run fails.
    tool_type: Agent_Tool
