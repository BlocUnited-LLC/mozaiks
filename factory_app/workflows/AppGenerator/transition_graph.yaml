transition_rules:
# Failed assembly returns to bounded recovery policy, never unchanged assembly.
- source_agent: user
  target_agent: AppValidationAgent
  transition_type: condition
  condition_type: context_equals
  condition_key: app_assembly_status
  condition_value: failed
  transition_target: AgentTarget
# A user reply after task execution returns to the existing recovery policy.
# Retained evidence and budgets must be checked before planning can run again.
- source_agent: user
  target_agent: AppValidationAgent
  transition_type: condition
  condition_type: context_expression
  context_expression: "${app_task_batch_results}"
  transition_target: AgentTarget
# The explicit autonomous choice bypasses intake after recovery priority.
# AppPlanAgent consumes the approved upstream brief and design documents.
- source_agent: user
  target_agent: AppPlanAgent
  transition_type: condition
  condition_type: context_equals
  condition_key: coding_participation
  condition_value: autonomous
  transition_target: AgentTarget
- source_agent: user
  target_agent: InterviewAgent
  transition_type: condition
  condition_type: context_expression
  context_expression: "${interview_outcome} != 'ready'"
  transition_target: AgentTarget
- source_agent: user
  target_agent: terminate
  transition_type: after_turn
  transition_target: TerminateTarget
  termination_reason: workflow_failed
- source_agent: InterviewAgent
  target_agent: AppPlanAgent
  transition_type: condition
  condition_type: context_equals
  condition_key: interview_outcome
  condition_value: ready
  transition_target: AgentTarget
- source_agent: InterviewAgent
  target_agent: user
  transition_type: condition
  condition_type: context_equals
  condition_key: interview_outcome
  condition_value: needs_input
  transition_target: RevertToUserTarget
- source_agent: InterviewAgent
  target_agent: terminate
  transition_type: condition
  condition_type: context_equals
  condition_key: interview_outcome
  condition_value: blocked
  transition_target: TerminateTarget
  termination_reason: workflow_failed
- source_agent: InterviewAgent
  target_agent: terminate
  transition_type: after_turn
  transition_target: TerminateTarget
  termination_reason: workflow_failed
- source_agent: AppPlanAgent
  target_agent: AppPlanAgent
  transition_type: condition
  condition_type: context_equals
  condition_key: app_plan_outcome
  condition_value: needs_revision
  transition_target: AgentTarget
# A blocked plan has spent its repair budget and will not improve by being asked
# again. Without this it fell through to the unconditional terminate below, but
# only after the task batch triggered on an empty app_task_batch_items and the
# run died as a generic workflow_failed - discarding the four named ownership
# errors review had already produced. Terminating here keeps the reason.
- source_agent: AppPlanAgent
  target_agent: terminate
  transition_type: condition
  condition_type: context_equals
  condition_key: app_plan_outcome
  condition_value: blocked
  transition_target: TerminateTarget
  termination_reason: workflow_failed
- source_agent: AppPlanAgent
  target_agent: terminate
  transition_type: after_turn
  transition_target: TerminateTarget
  termination_reason: workflow_failed
- source_agent: AppPlanAgent
  target_agent: AssemblyAgent
  transition_type: condition
  condition_type: context_equals
  condition_key: app_task_batch_status
  condition_value: completed
  transition_target: AgentTarget
# continue_with_available reports 'partial' when some task failed. Without this
# rule the batch would finish and match nothing, turning a loud crash into a
# silent stall. A partial build goes to assembly so acceptance can judge what
# was produced and the bundle repair loop can act on it.
- source_agent: AppPlanAgent
  target_agent: AssemblyAgent
  transition_type: condition
  condition_type: context_equals
  condition_key: app_task_batch_status
  condition_value: partial
  transition_target: AgentTarget
- source_agent: AppSchemaAgent
  target_agent: AppUIQualityAgent
  transition_type: after_turn
  transition_target: AgentTarget
- source_agent: AppUIQualityAgent
  target_agent: AppValidationAgent
  transition_type: condition
  condition_type: context_equals
  condition_key: bundle_repair_target
  condition_value: AppSchemaAgent
  transition_target: AgentTarget
- source_agent: AppUIQualityAgent
  target_agent: AppSchemaAgent
  transition_type: condition
  condition_type: context_equals
  condition_key: app_ui_quality_status
  condition_value: needs_revision
  transition_target: AgentTarget
- source_agent: AppUIQualityAgent
  target_agent: AdminRegistryAgent
  transition_type: condition
  condition_type: context_equals
  condition_key: app_ui_quality_status
  condition_value: passed
  transition_target: AgentTarget
- source_agent: AppUIQualityAgent
  target_agent: user
  transition_type: condition
  condition_type: context_equals
  condition_key: app_ui_quality_status
  condition_value: blocked
  transition_target: RevertToUserTarget
- source_agent: AdminRegistryAgent
  target_agent: AssemblyAgent
  transition_type: after_turn
  transition_target: AgentTarget
- source_agent: AssemblyAgent
  target_agent: AppValidationAgent
  transition_type: condition
  condition_type: context_equals
  condition_key: app_assembly_status
  condition_value: failed
  transition_target: AgentTarget
- source_agent: AssemblyAgent
  target_agent: AppValidationAgent
  transition_type: condition
  condition_type: context_equals
  condition_key: app_task_batch_status
  condition_value: partial
  transition_target: AgentTarget
- source_agent: AssemblyAgent
  target_agent: AppValidationAgent
