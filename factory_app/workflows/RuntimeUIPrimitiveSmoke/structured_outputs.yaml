registry:
  ReviewAgent: RuntimeUIPrimitiveSmokeResult

models:
  RuntimeUIPrimitiveSmokeResult:
    type: model
    fields:
      agent_message:
        type: str
        description: User-facing completion message.
      result:
        type: str
        description: One-sentence smoke summary for the runtime UI primitive lanes.
      composer_reply_seen:
        type: bool
        description: Whether the composer-routed human reply checkpoint completed.
      approved:
        type: bool
        description: Whether the structured approval checkpoint was accepted.
      approval_action:
        type: str
        description: Action returned by the approval card.
      artifact_emitted:
        type: bool
        description: Whether the artifact viewer surface was emitted.
      surface_component:
        type: str
        description: Component name used for the artifact surface.
