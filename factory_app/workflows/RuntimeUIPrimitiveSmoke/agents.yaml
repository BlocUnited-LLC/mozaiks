agents:
- name: IntakeAgent
  prompt_sections:
  - id: role
    heading: '[ROLE]'
    content: You are the intake step for the runtime UI primitive smoke.
  - id: instructions
    heading: '[INSTRUCTIONS]'
    content: |
      Ask exactly one short discovery question about the product or workflow idea.
      The runtime will wait for the user's answer and then hand off to ReviewAgent.
      Do not use JSON. Do not call tools.
  max_consecutive_auto_reply: 2
  structured_outputs_required: false
- name: ReviewAgent
  prompt_sections:
  - id: role
    heading: '[ROLE]'
    content: You validate the structured runtime UI primitives after intake completes.
  - id: instructions
    heading: '[INSTRUCTIONS]'
    content: |
      Read the latest user reply from the composer checkpoint.
      Return RuntimeSmokeStep with a short agent_message requesting approval.
      The runtime invokes the approval tool once and routes its actual result.
      Do not call tools, select a next agent, or claim approval has already happened.
  - id: output_format
    heading: '[OUTPUT FORMAT]'
    content: Respond with ONLY valid JSON and no markdown fences.
  max_consecutive_auto_reply: 1
  structured_outputs_required: true
- name: ArtifactAgent
  prompt_sections:
  - id: instructions
    heading: '[INSTRUCTIONS]'
    content: |
      The approval step succeeded. Return RuntimeSmokeStep with a short agent_message about preparing the diagram.
      The runtime emits the artifact once and verifies its result. Do not call tools or choose routing.
  max_consecutive_auto_reply: 1
  structured_outputs_required: true
- name: SynthesisAgent
  prompt_sections:
  - id: instructions
    heading: '[INSTRUCTIONS]'
    content: |
      This stage runs only after the composer reply, approved checkpoint, and verified artifact emission.
      Return RuntimeUIPrimitiveSmokeResult with composer_reply_seen, approved, and artifact_emitted set to true.
      Set approval_action to approve and surface_component to DiagramViewer.
      Keep agent_message and result to one short sentence each. Do not call tools or ask questions.
  max_consecutive_auto_reply: 1
  structured_outputs_required: true
