schema_version: mozaiks.capability_pack.v1
capability_pack_id: entitlements
label: Entitlements
summary: >
  SaaS plan/tier management and feature access control. Owns plan catalog,
  user plan assignment, trial lifecycle, and feature gates. Connects to the
  payments_integration hosted pack via domain events — entitlements reacts to
  payment outcomes; it does not own payment processing itself.
visibility: public

pack_type: entitlements_pack
implementation_mode: declarative_module
delivery_mode: app_embedded

requires:
  licensed_services: []
  connectors: []

contributes:
  modules:
    - plans
    - user_plans
  pages:
    - pricing
  admin_sections:
    - billing
  workflows: []
  events:
    - domain.entitlements.plan_assigned
    - domain.entitlements.plan_upgraded
    - domain.entitlements.plan_downgraded
    - domain.entitlements.trial_started
    - domain.entitlements.trial_expired

hard_constraints:
  - The plans module owns plan catalog and feature flag definitions only — no payment logic.
  - The user_plans module owns per-user/org plan state and trial lifecycle only.
  - Feature gate checks are synchronous reads from user_plans — not workflow calls.
  - Payment events (hosted.billing.*) come from the payments_integration pack; react via subscriptions.yaml.
  - Do not implement payment processing, refunds, or checkout in this pack.
  - Trial expiry enforcement runs via a startup_service subscription to domain events, not via cron.

event_flows:
  - trigger: hosted.billing.payment_succeeded
    reactions:
      - upgrade user_plans record to paid tier
      - emit domain.entitlements.plan_upgraded
      - notify the user
  - trigger: hosted.billing.subscription_cancelled
    reactions:
      - downgrade user_plans record to free tier
      - emit domain.entitlements.plan_downgraded
  - trigger: domain.entitlements.trial_started
    reactions:
      - schedule trial expiry (via startup_service timer or platform clock event)
      - notify the user of trial terms
