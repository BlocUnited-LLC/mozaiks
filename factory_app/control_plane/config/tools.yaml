schema_version: mozaiks.control_plane.tools.v1
tools:
  - id: get_concept_overview
    kind: context_tool
    description: Load the current concept overview and high-level concept metadata for the active app.
    entrypoint: factory_app.control_plane.tools.get_concept_overview:get_concept_overview
    available_to:
      - request_submitted
      - scope_requested
      - coding_requested
  - id: get_design_summary
    kind: context_tool
    description: Load the latest persisted design docs and surface-map summary for the active app.
    entrypoint: factory_app.control_plane.tools.get_design_summary:get_design_summary
    available_to:
      - request_submitted
      - coding_requested
  - id: get_artifact_summary
    kind: context_tool
    description: Load artifact lineage, validation status, and recent change history for the current refinement target.
    entrypoint: factory_app.control_plane.tools.get_artifact_summary:get_artifact_summary
    available_to:
      - request_submitted
      - scope_requested
      - route_requested
      - coding_requested
  - id: get_build_state
    kind: context_tool
    description: Load current build-plan and theme-capture state for the active app.
    entrypoint: factory_app.control_plane.tools.get_build_state:get_build_state
    available_to:
      - request_submitted
      - scope_requested
      - coding_requested
  - id: get_artifact_workspace_scope
    kind: context_tool
    description: Load a safe workspace tree and related-file previews for the selected artifact version and scoped files.
    entrypoint: factory_app.control_plane.tools.get_artifact_workspace_scope:get_artifact_workspace_scope
    available_to:
      - coding_requested
  - id: get_artifact_workspace_catalog
    kind: context_tool
    description: Load a safe workspace catalog, directory summary, and request-matched candidate files for the artifact version.
    entrypoint: factory_app.control_plane.tools.get_artifact_workspace_catalog:get_artifact_workspace_catalog
    available_to:
      - scope_requested
