schema_version: mozaiks.control_plane.tools
tools:
  - id: get_revision_context
    kind: context_tool
    description: Load runtime-owned revision context including session state, tracked artifact lineage, persisted summary payloads, resolved canonical inputs, and active change-request lineage.
    entrypoint: mozaiksai.control_plane.tools.get_revision_context:get_revision_context
    available_to:
      - request_submitted
      - scope_requested
      - coding_requested
  - id: get_artifact_summary
    kind: context_tool
    description: Load artifact lineage, validation status, and recent change history for the current refinement target.
    entrypoint: factory_app.control_plane.tools.get_artifact_summary:get_artifact_summary
    available_to:
      - request_submitted
      - scope_requested
      - route_requested
      - coding_requested
  - id: get_artifact_workspace_scope
    kind: context_tool
    description: Load a safe workspace tree and related-file previews for the selected artifact version and scoped files.
    entrypoint: factory_app.control_plane.tools.get_artifact_workspace_scope:get_artifact_workspace_scope
    available_to:
      - coding_requested
  - id: get_artifact_workspace_catalog
    kind: context_tool
    description: Load a safe workspace catalog, directory summary, and request-matched candidate files for the artifact version.
    entrypoint: factory_app.control_plane.tools.get_artifact_workspace_catalog:get_artifact_workspace_catalog
    available_to:
      - scope_requested
  - id: get_context_graph_catalog
    kind: context_tool
    description: Load the merged current AppContextGraph and artifact code graph for graph-aware scope selection, including candidate files, matched nodes, and relationship hints.
    entrypoint: factory_app.control_plane.tools.get_context_graph_catalog:get_context_graph_catalog
    available_to:
      - scope_requested
  - id: get_context_graph_scope
    kind: context_tool
    description: Load graph-neighborhood context for explicitly scoped files, including related files, symbols, and edges from the current app/artifact Context Graph.
    entrypoint: factory_app.control_plane.tools.get_context_graph_scope:get_context_graph_scope
    available_to:
      - coding_requested
  - id: get_stale_artifact_families
    kind: context_tool
    description: Return the artifact families (concept, brand, design_docs, workflow_bundle, app_bundle) that have stale versions for this app. Used by the classifier to detect upstream families invalidated by a prior change request so routing can include the minimal necessary refresh.
    entrypoint: factory_app.control_plane.tools.get_stale_artifact_families:get_stale_artifact_families
    available_to:
      - request_submitted
  - id: get_contract_surface_context
    kind: context_tool
    description: Load the artifact workspace file tree and context graph catalog for contract surface resolution. Used by the ContractSurfacePlanner to confirm which canonical paths exist in the workspace before resolving surface file lists.
    entrypoint: factory_app.control_plane.tools.get_contract_surface_context:get_contract_surface_context
    available_to:
      - contract_surface_requested
  - id: get_carry_forward_candidates
    kind: context_tool
    description: >
      Inspect the previous app_bundle artifact workspace and return a structured
      module inventory (ModuleInventoryEntry list) for carry-forward analysis.
      Read-only — no file writes, no artifact writes, no LLM calls.
      Returns empty modules + warnings when the previous workspace is missing or
      unreadable. Registered at route_requested because conceptual_replan routing
      is determined at that checkpoint; Phase 3 will call this tool
      programmatically from _build_context_seed() to auto-populate
      carry_forward_modules without requiring the client to supply it.
    entrypoint: factory_app.control_plane.tools.get_carry_forward_candidates:get_carry_forward_candidates
    available_to:
      - route_requested
