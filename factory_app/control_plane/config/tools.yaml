schema_version: mozaiks.control_plane.tools
tools:
  - id: get_revision_context
    kind: context_tool
    description: Load runtime-owned revision context including session state, tracked artifact lineage, persisted summary payloads, resolved canonical inputs, and active change-request lineage.
    entrypoint: mozaiksai.control_plane.tools.get_revision_context:get_revision_context
    available_to:
      - request_submitted
      - scope_requested
      - coding_requested
  - id: get_artifact_summary
    kind: context_tool
    description: Load artifact lineage, validation status, and recent change history for the current refinement target.
    entrypoint: factory_app.control_plane.tools.get_artifact_summary:get_artifact_summary
    available_to:
      - request_submitted
      - scope_requested
      - route_requested
      - coding_requested
  - id: get_artifact_workspace_scope
    kind: context_tool
    description: Load a safe workspace tree and related-file previews for the selected artifact version and scoped files.
    entrypoint: factory_app.control_plane.tools.get_artifact_workspace_scope:get_artifact_workspace_scope
    available_to:
      - coding_requested
  - id: get_artifact_workspace_catalog
    kind: context_tool
    description: Load a safe workspace catalog, directory summary, and request-matched candidate files for the artifact version.
    entrypoint: factory_app.control_plane.tools.get_artifact_workspace_catalog:get_artifact_workspace_catalog
    available_to:
      - scope_requested
