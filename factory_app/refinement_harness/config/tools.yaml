schema_version: mozaiks.refinement_harness.tools.v1
tools:
  - id: get_revision_context
    kind: context_tool
    description: Load runtime-owned revision context including session state, tracked artifact lineage, persisted summary payloads, resolved canonical inputs, and active change-request lineage.
    entrypoint: mozaiksai.control_plane.tools.get_revision_context:get_revision_context
    available_to:
      - request_submitted
      - scope_requested
      - coding_requested
  - id: get_artifact_summary
    kind: context_tool
    description: Load artifact lineage, validation status, and recent change history for the current refinement target.
    entrypoint: factory_app.refinement_harness.tools.get_artifact_summary:get_artifact_summary
    available_to:
      - request_submitted
      - scope_requested
      - route_requested
      - coding_requested
  - id: get_artifact_workspace_scope
    kind: context_tool
    description: Load a safe workspace tree and related-file previews for the selected artifact version and scoped files.
    entrypoint: factory_app.refinement_harness.tools.get_artifact_workspace_scope:get_artifact_workspace_scope
    available_to:
      - coding_requested
  - id: get_artifact_workspace_catalog
    kind: context_tool
    description: Load a safe workspace catalog, directory summary, and request-matched candidate files for the artifact version.
    entrypoint: factory_app.refinement_harness.tools.get_artifact_workspace_catalog:get_artifact_workspace_catalog
    available_to:
      - scope_requested
  - id: get_context_graph_catalog
    kind: context_tool
    description: Load the requested build's code graph for scope selection, including candidate files, matched nodes, and relationship hints.
    entrypoint: factory_app.refinement_harness.tools.get_context_graph_catalog:get_context_graph_catalog
    available_to:
      - scope_requested
  - id: get_app_intelligence_context
    kind: context_tool
    description: Load compact App Intelligence for the current app or selected artifact, including architecture, capability, ownership, integration, data, risk, and agent-context policy summaries without raw source contents.
    entrypoint: factory_app.refinement_harness.tools.app_intelligence:get_app_intelligence_context
    available_to:
      - request_submitted
      - scope_requested
      - contract_surface_requested
      - coding_requested
  - id: run_app_source_validation
    kind: validation_tool
    description: Run framework-aware validation commands from the current App Intelligence source context after staged source changes are ready for review.
    entrypoint: factory_app.refinement_harness.tools.app_validation:run_app_source_validation
    available_to:
      - coding_requested
  - id: get_context_graph_scope
    kind: context_tool
    description: Load graph-neighborhood context for explicitly scoped files in the requested build, including related files, symbols, and edges.
    entrypoint: factory_app.refinement_harness.tools.get_context_graph_scope:get_context_graph_scope
    available_to:
      - coding_requested
  - id: search_app_source_context
    kind: context_tool
    description: Search the requested build's redacted source corpus, or the current app corpus when no build is selected.
    entrypoint: factory_app.refinement_harness.tools.source_context:search_app_source_context
    available_to:
      - scope_requested
      - contract_surface_requested
      - coding_requested
  - id: read_app_source_file
    kind: context_tool
    description: Read one indexed file from the requested build's redacted source corpus, or from the current app corpus when no build is selected.
    entrypoint: factory_app.refinement_harness.tools.source_context:read_app_source_file
    available_to:
      - scope_requested
      - coding_requested
  - id: get_related_app_source_files
    kind: context_tool
    description: Return related indexed source files for a selected path using SourceContextBundle import and directory relationships.
    entrypoint: factory_app.refinement_harness.tools.source_context:get_related_app_source_files
    available_to:
      - coding_requested
  - id: get_stale_artifact_families
    kind: context_tool
    description: Return the artifact families (concept, brand, design_docs, workflow_bundle, app_bundle) that have stale versions for this app. Used by the classifier to detect upstream families invalidated by a prior change request so routing can include the minimal necessary refresh.
    entrypoint: factory_app.refinement_harness.tools.get_stale_artifact_families:get_stale_artifact_families
    available_to:
      - request_submitted
  - id: get_contract_surface_context
    kind: context_tool
    description: Load the artifact workspace file tree and context graph catalog for contract surface resolution. Used by the ContractSurfacePlanner to confirm which canonical paths exist in the workspace before resolving surface file lists.
    entrypoint: factory_app.refinement_harness.tools.get_contract_surface_context:get_contract_surface_context
    available_to:
      - contract_surface_requested
  - id: get_carry_forward_candidates
    kind: context_tool
    description: >
      Inspect the previous app_bundle artifact workspace and return a structured
      module inventory (ModuleInventoryEntry list) for carry-forward analysis.
      Read-only — no file writes, no artifact writes, no LLM calls.
      Returns empty modules + warnings when the previous workspace is missing or
      unreadable. Registered at route_requested because conceptual_replan routing
      is determined at that checkpoint; Phase 3 will call this tool
      programmatically from _build_context_seed() to auto-populate
      carry_forward_modules without requiring the client to supply it.
    entrypoint: factory_app.refinement_harness.tools.get_carry_forward_candidates:get_carry_forward_candidates
    available_to:
      - route_requested
  - id: read_artifact_file
    kind: context_tool
    description: Read a single file from the artifact workspace by its relative path. Returns file content up to 80,000 characters. Use when an agent needs to inspect a specific artifact file by known path rather than browsing the full workspace catalog.
    entrypoint: factory_app.refinement_harness.tools.read_artifact_file:read_artifact_file
    available_to:
      - scope_requested
      - coding_requested
