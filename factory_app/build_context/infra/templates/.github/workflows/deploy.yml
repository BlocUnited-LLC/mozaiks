# Generated by mozaiks InfraScaffoldAgent — edit after generation as needed.
# ============================================================================
# {{APP_NAME}} — Deploy workflow
# Template variables: {{APP_NAME}}, {{REGISTRY}}, {{DEPLOY_TARGET}}
# Environment names such as staging/production belong to the operator or host.
# They are separate from Mozaiks artifact review staging and promotion.
# ============================================================================
name: Deploy

on:
  push:
    branches:
      - main      # auto-deploy to production
      - staging   # auto-deploy to staging
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false  # never cancel an in-flight deploy

permissions:
  contents: read
  id-token: write  # OIDC token for cloud provider login

jobs:
  # ── Build and push Docker image ──────────────────────────────────────────────
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    environment:
      name: >-
        ${{
          github.event.inputs.environment
          || (github.ref == 'refs/heads/staging' && 'staging')
          || 'production'
        }}
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate build configuration
        env:
          VITE_OIDC_REDIRECT_URI: ${{ vars.VITE_OIDC_REDIRECT_URI || secrets.VITE_OIDC_REDIRECT_URI }}
          VITE_OIDC_AUTHORITY: ${{ vars.VITE_OIDC_AUTHORITY || secrets.VITE_OIDC_AUTHORITY }}
        run: |
          missing=()
          for name in VITE_OIDC_REDIRECT_URI; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ -z "${VITE_OIDC_AUTHORITY:-}" ]; then
            echo "WARNING: VITE_OIDC_AUTHORITY not set — OIDC login will not work"
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "ERROR: required secrets not set: ${missing[*]}" >&2
            exit 1
          fi

      - name: Set image tag
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          ENV_NAME="${{ github.event.inputs.environment || (github.ref == 'refs/heads/staging' && 'staging') || 'production' }}"
          echo "tag={{REGISTRY}}/{{APP_NAME}}:${ENV_NAME}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to container registry
        # Replace this step with the login action for your registry.
        # Azure ACR example (uncomment and configure):
        # - uses: azure/login@v2
        #   with:
        #     client-id: ${{ secrets.AZURE_OIDC_CLIENT_ID }}
        #     tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        #     subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        # - run: az acr login --name ${{ secrets.ACR_NAME }}
        #
        # GitHub Container Registry example:
        # - uses: docker/login-action@v3
        #   with:
        #     registry: ghcr.io
        #     username: ${{ github.actor }}
        #     password: ${{ secrets.GITHUB_TOKEN }}
        run: echo "Configure registry login for {{DEPLOY_TARGET}}"

      - name: Build and push image
        run: |
          docker build \
            --build-arg VITE_OIDC_AUTHORITY="${{ vars.VITE_OIDC_AUTHORITY || secrets.VITE_OIDC_AUTHORITY }}" \
            --build-arg VITE_OIDC_REDIRECT_URI="${{ vars.VITE_OIDC_REDIRECT_URI || secrets.VITE_OIDC_REDIRECT_URI }}" \
            --build-arg VITE_OIDC_DISCOVERY_URL="${{ vars.VITE_OIDC_DISCOVERY_URL || '' }}" \
            -t "${{ steps.meta.outputs.tag }}" \
            .
          docker push "${{ steps.meta.outputs.tag }}"

  # ── Deploy image to target platform ─────────────────────────────────────────
  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'production' }}
    needs: build-and-push
    runs-on: ubuntu-latest
    environment:
      name: >-
        ${{
          github.event.inputs.environment
          || (github.ref == 'refs/heads/staging' && 'staging')
          || 'production'
        }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          # Replace this block with the deploy command for {{DEPLOY_TARGET}}.
          #
          # Azure Container Apps example:
          #   az containerapp update \
          #     --name {{APP_NAME}} \
          #     --resource-group <rg-name> \
          #     --image "$IMAGE_TAG"
          #
          # Fly.io example:
          #   fly deploy --image "$IMAGE_TAG" --app {{APP_NAME}}
          #
          # Render: update the SERVICE_ID image via the Render API.
          echo "Deploying $IMAGE_TAG to {{DEPLOY_TARGET}}"

  # ── Post-deploy health verify ────────────────────────────────────────────────
  verify:
    name: Health check
    needs: deploy
    runs-on: ubuntu-latest
    environment:
      name: >-
        ${{
          github.event.inputs.environment
          || (github.ref == 'refs/heads/staging' && 'staging')
          || 'production'
        }}
    steps:
      - name: Wait for app to come up
        run: sleep 30

      - name: Health check
        env:
          APP_URL: ${{ vars.APP_URL || secrets.APP_URL }}
        run: |
          for i in {1..10}; do
            if curl -sf "${APP_URL}/api/health"; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i failed — retrying in 15s"
            sleep 15
          done
          echo "Health check failed after 10 attempts — triggering rollback" >&2
          # Add rollback command here for {{DEPLOY_TARGET}}
          exit 1
