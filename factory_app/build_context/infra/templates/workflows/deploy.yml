# Generated by mozaiks InfraScaffoldAgent — edit after generation as needed.
# ============================================================================
# {{APP_NAME}} — Deploy workflow
# Template variables: {{APP_NAME}}, {{REGISTRY}}, {{DEPLOY_TARGET}}
# Environment names such as staging/production belong to the operator or host.
# They are separate from Mozaiks artifact review staging and promotion.
# ============================================================================
name: Deploy

on:
  push:
    branches:
      - main      # auto-deploy to production
      - staging   # auto-deploy to staging
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false  # never cancel an in-flight deploy

permissions:
  contents: read
  id-token: write  # OIDC token for cloud provider login

jobs:
  # ── Build and push Docker image ──────────────────────────────────────────────
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    environment:
      name: >-
        ${{
          github.event.inputs.environment
          || (github.ref == 'refs/heads/staging' && 'staging')
          || 'production'
        }}
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate build configuration
        env:
          VITE_OIDC_REDIRECT_URI: ${{ vars.VITE_OIDC_REDIRECT_URI || secrets.VITE_OIDC_REDIRECT_URI }}
          VITE_OIDC_AUTHORITY: ${{ vars.VITE_OIDC_AUTHORITY || secrets.VITE_OIDC_AUTHORITY }}
          VITE_OIDC_DISCOVERY_URL: ${{ vars.VITE_OIDC_DISCOVERY_URL || secrets.VITE_OIDC_DISCOVERY_URL }}
        run: |
          is_placeholder() {
            local value="${1:-}"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            [[ "$value" == "placeholder-change-me" || "$value" == "<NEEDED"* ]]
          }

          missing=()
          for name in VITE_OIDC_REDIRECT_URI; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            elif is_placeholder "${!name}"; then
              missing+=("$name (placeholder)")
            fi
          done

          oidc_sources=()
          for name in VITE_OIDC_AUTHORITY VITE_OIDC_DISCOVERY_URL; do
            if [ -n "${!name:-}" ] && ! is_placeholder "${!name}"; then
              oidc_sources+=("$name")
            fi
          done
          if [ "${#oidc_sources[@]}" -eq 0 ]; then
            missing+=("VITE_OIDC_AUTHORITY or VITE_OIDC_DISCOVERY_URL")
          fi

          if [ ${#missing[@]} -gt 0 ]; then
            printf 'Missing required build configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Set image tag
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          ENV_NAME="${{ github.event.inputs.environment || (github.ref == 'refs/heads/staging' && 'staging') || 'production' }}"
          echo "tag={{REGISTRY}}/{{APP_NAME}}:${ENV_NAME}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to container registry
        # Replace this step with the login action for your registry.
        #
        # Azure ACR example:
        #   - uses: azure/login@v2
        #     with:
        #       client-id: ${{ secrets.AZURE_OIDC_CLIENT_ID }}
        #       tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        #       subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        #   - run: az acr login --name ${{ secrets.ACR_NAME }}
        #
        # GitHub Container Registry example:
        #   - uses: docker/login-action@v3
        #     with:
        #       registry: ghcr.io
        #       username: ${{ github.actor }}
        #       password: ${{ secrets.GITHUB_TOKEN }}
        run: echo "Configure registry login for {{DEPLOY_TARGET}}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tag }}
          build-args: |
            VITE_OIDC_AUTHORITY=${{ vars.VITE_OIDC_AUTHORITY || secrets.VITE_OIDC_AUTHORITY }}
            VITE_OIDC_CLIENT_ID=${{ vars.VITE_OIDC_CLIENT_ID || secrets.VITE_OIDC_CLIENT_ID || '{{APP_NAME}}' }}
            VITE_OIDC_DISCOVERY_URL=${{ vars.VITE_OIDC_DISCOVERY_URL || '' }}
            VITE_OIDC_SCOPE=${{ vars.VITE_OIDC_SCOPE || 'openid profile email' }}
            VITE_OIDC_REDIRECT_URI=${{ vars.VITE_OIDC_REDIRECT_URI || secrets.VITE_OIDC_REDIRECT_URI }}
            VITE_MOCK_MODE=false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy image to target platform ─────────────────────────────────────────
  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'production' }}
    needs: build-and-push
    runs-on: ubuntu-latest
    environment:
      name: >-
        ${{
          github.event.inputs.environment
          || (github.ref == 'refs/heads/staging' && 'staging')
          || 'production'
        }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate deploy configuration
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
        run: |
          is_placeholder() {
            local value="${1:-}"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            [[ "$value" == "placeholder-change-me" || "$value" == "<NEEDED"* ]]
          }

          missing=()
          # Validate required runtime secrets.
          # Add app-specific required names to this list.
          required_names=(MONGO_URI OPENAI_API_KEY ANTHROPIC_API_KEY INTERNAL_API_KEY)
          for name in "${required_names[@]}"; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            elif is_placeholder "${!name}"; then
              missing+=("$name (placeholder)")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required deploy configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Deploy to {{DEPLOY_TARGET}}
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
        run: |
          # Replace this block with the deploy command for {{DEPLOY_TARGET}}.
          #
          # Azure Container Apps example:
          #   az containerapp update \
          #     --name {{APP_NAME}} \
          #     --resource-group <rg-name> \
          #     --image "$IMAGE_TAG"
          #
          # Fly.io example:
          #   fly deploy --image "$IMAGE_TAG" --app {{APP_NAME}}
          #
          # Render: use the Render Deploy Hook or update the service via the Render API.
          #
          # Generic (SSH + Docker Compose):
          #   ssh $SSH_HOST "docker pull $IMAGE_TAG && docker compose up -d"
          echo "Deploying $IMAGE_TAG to {{DEPLOY_TARGET}}"

  # ── Post-deploy health verify with rollback stub ────────────────────────────
  verify:
    name: Health check
    needs: [build-and-push, deploy]
    runs-on: ubuntu-latest
    environment:
      name: >-
        ${{
          github.event.inputs.environment
          || (github.ref == 'refs/heads/staging' && 'staging')
          || 'production'
        }}
    steps:
      - name: Wait for app to come up
        run: sleep 30

      - name: Health check
        env:
          APP_URL: ${{ vars.APP_URL || secrets.APP_URL }}
        run: |
          for i in {1..10}; do
            if curl -sf "${APP_URL}/api/health"; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i failed — retrying in 15s"
            sleep 15
          done
          echo "Health check failed after 10 attempts" >&2
          # Add platform-specific rollback here, e.g.:
          #   az containerapp revision deactivate --name {{APP_NAME}} ...
          #   fly releases rollback --app {{APP_NAME}}
          exit 1
