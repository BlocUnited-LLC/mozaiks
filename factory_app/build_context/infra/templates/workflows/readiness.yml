# Generated by mozaiks InfraScaffoldAgent — edit after generation as needed.
# ============================================================================
# {{APP_NAME}} — Staging readiness workflow
# Run this manually before promoting staging → production.
# This is environment staging for a promoted/exported app. It is not Mozaiks
# artifact review staging, which happens before ArtifactVersion promotion.
# ============================================================================
name: Staging Readiness

on:
  workflow_dispatch:
    inputs:
      run_container_gate:
        description: "Build and smoke the deployment image locally"
        required: true
        default: true
        type: boolean
      run_remote_health:
        description: "Check deployed staging health endpoints"
        required: true
        default: true
        type: boolean
      run_entitlement_gate:
        description: "Smoke subscription entitlement gates against staging"
        required: true
        default: true
        type: boolean

concurrency:
  group: "staging-readiness-{{APP_NAME}}"
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  readiness:
    name: Staging readiness report
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.APP_URL }}

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval \"db.adminCommand('ping')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio anyio httpx

      - name: Validate declared secrets
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
        run: |
          # This validates the names expected by the generated app contract.
          # Real secret values must live in the operator's CI/cloud secret store.
          # Add app-specific secret names to this list (read from app/security/secrets.yaml).
          required=(MONGO_URI OPENAI_API_KEY ANTHROPIC_API_KEY INTERNAL_API_KEY)
          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required staging secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          echo "All required secrets present."

      - name: Set up Docker Buildx
        if: ${{ inputs.run_container_gate }}
        uses: docker/setup-buildx-action@v3

      - name: Build deployment image
        if: ${{ inputs.run_container_gate }}
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: "{{APP_NAME}}:staging-readiness-${{ github.sha }}"
          build-args: |
            VITE_OIDC_AUTHORITY=${{ vars.VITE_OIDC_AUTHORITY || secrets.VITE_OIDC_AUTHORITY }}
            VITE_OIDC_CLIENT_ID=${{ vars.VITE_OIDC_CLIENT_ID || secrets.VITE_OIDC_CLIENT_ID || '{{APP_NAME}}' }}
            VITE_OIDC_DISCOVERY_URL=${{ vars.VITE_OIDC_DISCOVERY_URL || '' }}
            VITE_OIDC_SCOPE=${{ vars.VITE_OIDC_SCOPE || 'openid profile email' }}
            VITE_OIDC_REDIRECT_URI=${{ vars.VITE_OIDC_REDIRECT_URI || secrets.VITE_OIDC_REDIRECT_URI }}
            VITE_MOCK_MODE=false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke deployment image startup
        if: ${{ inputs.run_container_gate }}
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
        run: |
          docker run --rm -d \
            --name {{APP_NAME}}-readiness-smoke \
            -p 8010:8000 \
            -e MONGO_URI="$MONGO_URI" \
            -e OPENAI_API_KEY="$OPENAI_API_KEY" \
            -e ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" \
            -e INTERNAL_API_KEY="$INTERNAL_API_KEY" \
            -e MOZAIKS_ENV=staging \
            -e AUTH_ENABLED=false \
            {{APP_NAME}}:staging-readiness-${{ github.sha }}

          for i in {1..12}; do
            if curl -sf http://localhost:8010/api/health; then
              echo "Container health check passed"
              docker stop {{APP_NAME}}-readiness-smoke
              exit 0
            fi
            echo "Attempt $i — waiting 10s"
            sleep 10
          done
          docker stop {{APP_NAME}}-readiness-smoke 2>/dev/null || true
          echo "Container failed to pass health check in 120s" >&2
          exit 1

      - name: Check deployed staging health
        if: ${{ inputs.run_remote_health }}
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "APP_URL environment variable is required." >&2
            exit 1
          fi

          curl --fail --show-error --silent "$APP_URL/api/health" | tee health.json
          curl --fail --show-error --silent "$APP_URL/api/health/readiness" | tee readiness.json
          echo "Remote health checks passed."

      - name: Smoke subscription entitlement gates
        if: ${{ inputs.run_entitlement_gate }}
        env:
          APP_URL: ${{ vars.APP_URL }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          # Optional: set smoke tokens if your entitlement module requires a test user.
          ENTITLEMENT_SMOKE_TOKEN: ${{ secrets.ENTITLEMENT_SMOKE_TOKEN }}
          ENTITLEMENT_SMOKE_USER_ID: ${{ vars.ENTITLEMENT_SMOKE_USER_ID }}
        run: |
          # This hook is intentionally app-owned. Hosted products may replace it
          # with product-specific gates after consuming deployment.manifest.json.
          # Adjust this script path if you have a custom entitlement smoke script.
          if [ -f scripts/smoke_entitlement_api.py ]; then
            python scripts/smoke_entitlement_api.py --json | tee entitlement-smoke.json
          else
            echo "No entitlement smoke script found — checking health/readiness only."
            curl --fail --show-error --silent "$APP_URL/api/health/readiness" | tee entitlement-smoke.json
          fi

      - name: Upload readiness artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "staging-readiness-{{APP_NAME}}-${{ github.run_id }}"
          path: |
            health.json
            readiness.json
            entitlement-smoke.json
          if-no-files-found: ignore
