schema_version: mozaiks.module.v1
module:
  id: support
  display_name: Support
  version: 1.0.0
  description: App support requests and ticket-authorized conversations. Conversation bodies are stored in the messages module.
  owner: app
  visibility: private
  handler: backend.handler:SupportHandler
  user_data_scope: true

permissions:
  - id: support.submit
    description: Submit support requests and view own requests.
  - id: support.read
    description: Read all support requests (operator/admin).
  - id: support.manage
    description: Manage support queues, reply to requests, and update request status.

actions:
  - id: create_support_request
    description: Create a support request with its linked messages thread and first message.
    handler_method: create_support_request
    input_schema:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message: { type: string }
        subject: { type: string }
        page_url: { type: string }
        page_title: { type: string }
        # severity — optional; the handler defaults omitted values to low.
        severity:
          type: string
          enum: [low, medium, high]
        # app_id — the app this ticket is about. Stored as subject_app_id.
        app_id:
          type: string
    output_schema:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
        request: { type: object }
        error: { type: string }
    permissions: [support.submit]
    emits: [domain.support.request_created]

  - id: list_support_requests
    description: List support requests by user, app, or workspace-level index.
    handler_method: list_support_requests
    input_schema:
      type: object
      additionalProperties: false
      properties:
        # status — optional; the handler defaults omitted values to open.
        status:
          type: string
          enum: [open, waiting, resolved, archived, all]
        # scope — optional; the handler defaults omitted values to user.
        scope:
          type: string
          enum: [user, app, workspace]
        # app_id — optional subject app id filter.
        app_id:
          type: string
        # limit — optional; the handler defaults omitted values to 50.
        limit:
          type: integer
    output_schema:
      type: object
      required: [requests, total]
      properties:
        requests: { type: array }
        total: { type: integer }
    permissions: [support.submit]

  - id: get_support_conversation
    description: Read a ticket conversation as its requester or a support reader.
    handler_method: get_support_conversation
    input_schema:
      type: object
      additionalProperties: false
      required: [request_id]
      properties:
        request_id: { type: string }
    output_schema:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
        thread: { type: object }
        messages: { type: array }
        error: { type: string }
    permissions: [support.submit]

  - id: reply_support_request
    description: Reply to an open ticket as its requester or a support manager.
    handler_method: reply_support_request
    input_schema:
      type: object
      additionalProperties: false
      required: [request_id, body]
      properties:
        request_id: { type: string }
        body: { type: string }
    output_schema:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
        message: { type: object }
        error: { type: string }
    permissions: [support.submit]

  - id: update_support_status
    description: Update support status or assignee.
    handler_method: update_support_status
    input_schema:
      type: object
      additionalProperties: false
      required: [request_id, status]
      properties:
        request_id: { type: string }
        status:
          type: string
          enum: [open, waiting, resolved, archived]
        assignee_id: { type: string }
    output_schema:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
        request_id: { type: string }
        status: { type: string }
    permissions: [support.manage]
    emits: [domain.support.status_changed]

capabilities:
  - capability_id: support.requests.create
    kind: action
    target: create_support_request
    title: Create support request
    permissions: [support.submit]
  - capability_id: support.requests.list
    kind: action
    target: list_support_requests
    title: List support requests
    permissions: [support.submit]
  - capability_id: support.requests.update_status
    kind: action
    target: update_support_status
    title: Update support status
    permissions: [support.manage]
