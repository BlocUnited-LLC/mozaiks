context_id: webapp_builder
description: Web application build profile.

applies_to_workflows:
  - AppGenerator

values:
  dev_pack_id: webapp_builder
  build_task_model: AppBuildTask

assets:
  - path: templates
    kind: templates
    description: >
      Web app scaffold templates emitted by InfraScaffoldAgent for generated apps.
      Includes config/auth.yaml (provider-neutral auth contract) and
      ui/auth/authAdapter.js (facade for the shared @mozaiks/chat-ui/auth adapter).
      Auth template variable: AUTH_DEFAULT_ROUTE. The backend projects the
      validated contract and effective auth mode; generated adapters do not
      implement OIDC or select local demo mode.

  - path: language_profile.yaml
    kind: catalog
    projections:
      - id: webapp_language_profile
        records: null
        recipients:
          - ConfigMiddlewareAgent
          - ModelAgent
          - ServiceAgent
          - FrontendStubAgent
          - ControllerAgent
          - DatabaseAgent
        render: full
        marker: LANGUAGE_PROFILE_CONTEXT
        heading: Language and Framework Profile
