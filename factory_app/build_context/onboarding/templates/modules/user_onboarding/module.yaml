schema_version: mozaiks.module.v1
module:
  id: user_onboarding
  display_name: User Onboarding
  version: 1.0.0
  description: >
    Tracks onboarding tour progress per user. Records which steps have been completed
    and whether the user has dismissed the tour. The OSS runtime installTour()
    primitive reads app/config/onboarding.yaml for step definitions; this module
    persists the per-user completion state.
  handler: backend.handler:UserOnboardingHandler
  user_data_scope: true

permissions:
  - id: onboarding.read
    description: Read tour progress and completion state.
  - id: onboarding.write
    description: Mark steps complete and dismiss the tour.

actions:
  - id: get_onboarding_status
    api_surface: public_readonly
    description: >
      Return the current user's tour completion state — which steps are done,
      overall progress percentage, and whether the tour has been dismissed.
    handler_method: get_onboarding_status
    input_schema:
      type: object
      properties: {}
    output_schema:
      type: object
      required: [completed_steps, progress, dismissed]
      properties:
        completed_steps: { type: array, items: { type: string } }
        progress: { type: number }
        dismissed: { type: boolean }
    permissions: [onboarding.read]

  - id: complete_step
    api_surface: public
    description: >
      Mark a tour step as completed. step_id must match a step id declared in
      app/config/onboarding.yaml. Emits hosted.onboarding.step_completed.
    handler_method: complete_step
    input_schema:
      type: object
      required: [step_id]
      properties:
        step_id: { type: string }
    output_schema:
      type: object
      required: [success, completed_steps, progress]
      properties:
        success: { type: boolean }
        completed_steps: { type: array, items: { type: string } }
        progress: { type: number }
    permissions: [onboarding.write]
    emits: [hosted.onboarding.step_completed]

  - id: dismiss_onboarding
    api_surface: public
    description: >
      Dismiss the onboarding tour for the current user. The tour will not be
      shown again after dismissal. Emits hosted.onboarding.dismissed.
    handler_method: dismiss_onboarding
    input_schema:
      type: object
      properties: {}
    output_schema:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
    permissions: [onboarding.write]
    emits: [hosted.onboarding.dismissed]

capabilities:
  - capability_id: onboarding.read
    kind: action
    target: get_onboarding_status
    title: Get onboarding status
    permissions: [onboarding.read]
  - capability_id: onboarding.write
    kind: action
    target: complete_step
    title: Complete onboarding step
    permissions: [onboarding.write]
