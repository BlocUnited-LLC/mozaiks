schema_version: mozaiks.integrations.v1
integrations:
  - id: mozaikspay
    name: MozaiksPay
    category: payments
    description: Managed payment, subscription, and billing portal provider for Mozaiks apps.
    required_secrets:
      - MOZAIKSPAY_API_BASE
      - MOZAIKSPAY_CLIENT_ID
      - MOZAIKSPAY_CLIENT_SECRET
    optional_secrets:
      - MOZAIKSPAY_API_KEY
    setup_steps:
      - Provision a MozaiksPay client for this app from the hosted billing/admin flow.
      - Copy the MozaiksPay API base URL and generated client ID.
      - Store the client secret in the app connector vault or MOZAIKSPAY_CLIENT_SECRET.
      - Use the mozaikspay managed capability pack for generated billing and usage pages.

  - id: resend
    name: Resend
    category: email
    description: Transactional email delivery with high deliverability.
    required_secrets:
      - RESEND_API_KEY
    optional_secrets:
      - RESEND_FROM_EMAIL
    setup_steps:
      - Sign in to resend.com → API Keys
      - Create an API key with Send access
      - Verify your sending domain under Domains

  - id: sendgrid
    name: SendGrid
    category: email
    description: Email delivery, marketing campaigns, and analytics.
    required_secrets:
      - SENDGRID_API_KEY
    optional_secrets:
      - SENDGRID_FROM_EMAIL
    setup_steps:
      - Sign in to SendGrid → Settings → API Keys
      - Create an API key with Mail Send permission
      - Verify your sender identity under Sender Authentication

  - id: twilio
    name: Twilio
    category: sms
    description: SMS, voice, and WhatsApp messaging.
    required_secrets:
      - TWILIO_ACCOUNT_SID
      - TWILIO_AUTH_TOKEN
      - TWILIO_PHONE_NUMBER
    optional_secrets: []
    setup_steps:
      - Sign in to Twilio Console → Account → API keys & tokens
      - Copy the Account SID and Auth Token
      - Purchase or verify a phone number to use as the sender

  - id: slack
    name: Slack
    category: notifications
    description: Team notifications, alerts, and workflow triggers via Slack.
    required_secrets:
      - SLACK_BOT_TOKEN
    optional_secrets:
      - SLACK_WEBHOOK_URL
      - SLACK_DEFAULT_CHANNEL
    setup_steps:
      - Go to api.slack.com/apps → Create New App
      - Add OAuth scopes: chat:write, channels:read
      - Install the app to your workspace and copy the Bot User OAuth Token

  - id: github
    name: GitHub
    category: source_control
    description: Repository access, webhooks, and CI/CD triggers.
    required_secrets:
      - GITHUB_TOKEN
    optional_secrets:
      - GITHUB_ORG
      - GITHUB_WEBHOOK_SECRET
    setup_steps:
      - Go to GitHub → Settings → Developer settings → Personal access tokens
      - Generate a token with repo and workflow scopes
      - For org-level access, use a GitHub App or fine-grained token scoped to the org

  - id: s3
    name: AWS S3
    category: storage
    description: Object storage for files, images, and generated artifacts.
    required_secrets:
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_S3_BUCKET
    optional_secrets:
      - AWS_REGION
      - AWS_S3_ENDPOINT_URL
    setup_steps:
      - In AWS IAM, create a user with AmazonS3FullAccess or a scoped S3 policy
      - Generate Access Key ID and Secret Access Key under Security Credentials
      - Create or identify the S3 bucket this app will use

  - id: cloudinary
    name: Cloudinary
    category: storage
    description: Image and video upload, transformation, and delivery CDN.
    required_secrets:
      - CLOUDINARY_CLOUD_NAME
      - CLOUDINARY_API_KEY
      - CLOUDINARY_API_SECRET
    optional_secrets: []
    setup_steps:
      - Sign in to Cloudinary Console → Settings → API Keys
      - Copy the Cloud Name, API Key, and API Secret

  - id: postgres
    name: PostgreSQL
    category: database
    description: Relational database for structured app data.
    required_secrets:
      - POSTGRES_URL
    optional_secrets:
      - POSTGRES_POOL_SIZE
    setup_steps:
      - Provision a PostgreSQL instance (e.g. Supabase, Neon, RDS, or self-hosted)
      - Copy the connection string in the format postgresql://user:pass@host:port/dbname

  - id: redis
    name: Redis
    category: cache
    description: In-memory cache, session store, and pub/sub broker.
    required_secrets:
      - REDIS_URL
    optional_secrets: []
    setup_steps:
      - Provision a Redis instance (e.g. Upstash, Redis Cloud, or self-hosted)
      - Copy the connection URL in the format redis://user:pass@host:port

  - id: openai
    name: OpenAI
    category: ai
    description: GPT models, embeddings, and assistants API.
    required_secrets:
      - OPENAI_API_KEY
    optional_secrets:
      - OPENAI_ORG_ID
    setup_steps:
      - Sign in to platform.openai.com → API Keys
      - Create a new secret key and copy it immediately (shown once)

  - id: anthropic
    name: Anthropic
    category: ai
    description: Claude models for reasoning, analysis, and generation.
    required_secrets:
      - ANTHROPIC_API_KEY
    optional_secrets: []
    setup_steps:
      - Sign in to console.anthropic.com → API Keys
      - Create a new key and copy it immediately (shown once)

  - id: google_oauth
    name: Google OAuth
    category: auth
    description: Sign in with Google for user authentication.
    required_secrets:
      - GOOGLE_CLIENT_ID
      - GOOGLE_CLIENT_SECRET
    optional_secrets:
      - GOOGLE_REDIRECT_URI
    setup_steps:
      - Go to Google Cloud Console → APIs & Services → Credentials
      - Create an OAuth 2.0 Client ID (Web application type)
      - Add your app's redirect URI to the Authorized redirect URIs list

  - id: segment
    name: Segment
    category: analytics
    description: Customer data platform for event tracking and analytics routing.
    required_secrets:
      - SEGMENT_WRITE_KEY
    optional_secrets: []
    setup_steps:
      - Sign in to Segment → Sources → Add Source → Node.js
      - Copy the Write Key from the source settings
