version: 1
description: Canonical AG2 beta Network patternbook for generated Mozaiks workflows.
authority: factory_app/build_context/AgentGenerator/ag2_network_patterns.yaml
global_rules:
  - Workflow YAML remains the authoring contract; runtime compiles it to AG2 beta Network objects.
  - Handoff conditions are deterministic only. Do not generate llm or string_llm condition types.
  - LLM reasoning can classify intent by setting context variables or returning structured output before routing.
  - Tools mutate workflow state or return typed routing objects; transition_graph.yaml must stay declarative and verifiable.
  - Prefer patterns with compiled_now support unless the user intent clearly requires a pattern that needs the full WorkflowAdapter path.
patterns:
  - id: 1
    key: context_aware_routing
    label: Context-Aware Routing
    cookbook_status: partial
    mozaiks_support: compiled_now
    selection_aliases:
      - classifier
      - router
      - dispatch
      - specialist routing
    intent_signals:
      - route by request type
      - classify then dispatch
      - send issues to the right specialist
    avoid_when:
      - the work is a fixed ordered pipeline
      - the user wants open-ended specialist consultation
    beta_primitives:
      - TransitionGraph
      - ContextEquals
      - set_context
      - FromSpeaker
      - AgentTarget
      - TerminateTarget
    graph_strategy: context_branch
    routing_idiom: context_routing
    required_context:
      - category
    required_tools:
      - classify_as_<category>
    agent_archetypes:
      - RouterAgent
      - SpecialistAgent
    transition_generation:
      strategy: context_branch
      ordering:
        - specialist_terminate_rules
        - router_context_routes
      terminal_rule: Each specialist terminates or returns to an explicit review agent after answering.
    generator_notes:
      - The router agent sets a category context variable through a tool or structured output.
      - Place specialist termination rules before sticky context routes so a persisted category does not loop.
      - Do not use framework-level LLM conditions.
    examples:
      WorkflowStrategy:
        WorkflowStrategy:
          workflow_name: SaaS Support Domain Router
          workflow_description: Classifies support requests by product surface and routes them to the right specialist.
          human_in_loop: false
          trigger: chat
          initiated_by: user
          pattern:
            - Context-Aware Routing
          workflow_stages:
            - stage_index: 0
              stage_name: Intake Classification
              stage_description: Router captures the request, sets category, and records confidence.
              agents_needed:
                - SupportRouterAgent
            - stage_index: 1
              stage_name: Specialist Resolution
              stage_description: The selected specialist resolves the request and emits a final disposition.
              agents_needed:
                - BillingSpecialistAgent
                - TechnicalSpecialistAgent

  - id: 2
    key: escalation
    label: Escalation
    cookbook_status: clean
    mozaiks_support: compiled_now
    selection_aliases:
      - tiered handling
      - escalation ladder
      - fallback to expert
    intent_signals:
      - try simple first
      - escalate on failure
      - move to expert when confidence is low
    avoid_when:
      - every specialist should be consulted
      - there is no failure or confidence threshold
    beta_primitives:
      - TransitionGraph
      - Handoff
      - ToolCalled
      - FromSpeaker
      - TerminateTarget
    graph_strategy: tiered_branch
    routing_idiom: state_or_tool_routed_escalation
    required_context:
      - escalation_required
      - resolution_confidence
    required_tools:
      - assess_confidence
      - mark_resolved
    agent_archetypes:
      - TriageAgent
      - EscalationCoordinatorAgent
      - ExpertAgent
    transition_generation:
      strategy: confidence_branch
      ordering:
        - resolved_terminate_rules
        - escalation_condition_routes
        - fallback_continue_rules
      terminal_rule: Terminate once a tier resolves or a human owner accepts escalation.
    generator_notes:
      - Model escalation decisions as deterministic confidence/status context variables.
      - Keep every tier's output auditable; escalation is a state transition, not a prompt-only decision.
    examples:
      WorkflowStrategy:
        WorkflowStrategy:
          workflow_name: Cloud Incident Escalation
          workflow_description: Applies tiered diagnostics and escalates to an expert when confidence falls below threshold.
          human_in_loop: true
          trigger: webhook
          initiated_by: system
          pattern:
            - Escalation
          workflow_stages:
            - stage_index: 0
              stage_name: Baseline Diagnostics
              stage_description: Triage agent correlates the incident and attempts scripted remediation.
              agents_needed:
                - AlertTriageAgent
            - stage_index: 1
              stage_name: Expert Escalation
              stage_description: Coordinator routes unresolved incidents to the right expert owner.
              agents_needed:
                - EscalationCoordinatorAgent
                - SRELeadAgent

  - id: 3
    key: feedback_loop
    label: Feedback Loop
    cookbook_status: clean
    mozaiks_support: compiled_now
    selection_aliases:
      - review loop
      - revise until approved
      - approval cycle
    intent_signals:
      - iterate until approved
      - review and revise
      - user approval checkpoint
    avoid_when:
      - the workflow has no review or approval state
      - the task should run once without feedback
    beta_primitives:
      - TransitionGraph
      - ContextEquals
      - FromSpeaker
      - AgentTarget
      - TerminateTarget
    graph_strategy: bounded_loop
    routing_idiom: approval_state_loop
    required_context:
      - approval_status
      - revision_requested
    required_tools:
      - record_review_decision
    agent_archetypes:
      - DraftAgent
      - ReviewAgent
      - RevisionAgent
    transition_generation:
      strategy: approval_loop
      ordering:
        - approval_terminate_rules
        - revision_routes
        - draft_review_routes
      terminal_rule: Terminate only when approval_status is approved or max_turns is reached.
    generator_notes:
      - Every loop must have an explicit approval or exit variable.
      - Use small max_turns caps for bounded review cycles.
    examples:
      WorkflowStrategy:
        WorkflowStrategy:
          workflow_name: Product Copy Review
          workflow_description: Drafts launch copy, captures review feedback, and loops until approval.
          human_in_loop: true
          trigger: chat
          initiated_by: user
          pattern:
            - Feedback Loop
          workflow_stages:
            - stage_index: 0
              stage_name: Draft
              stage_description: Author creates the first draft from the brief.
              agents_needed:
                - CopyDraftAgent
            - stage_index: 1
              stage_name: Review And Revise
              stage_description: Reviewer captures approval or requested changes and routes revisions.
              agents_needed:
                - CopyReviewAgent
                - CopyRevisionAgent

  - id: 4
    key: hierarchical
    label: Hierarchical
    cookbook_status: partial
    mozaiks_support: deterministic_subflow_now
    selection_aliases:
      - manager with teams
      - delegated subflows
      - layered specialists
    intent_signals:
      - coordinator delegates to sub-teams
      - work has manager and specialist layers
      - separate workstreams need synthesis
    avoid_when:
      - a flat pipeline is sufficient
      - workstreams need independent durable workflow sessions rather than workflow-local task batches
    beta_primitives:
      - Handoff
      - TransitionGraph
      - ContextEquals
      - AgentTarget
    graph_strategy: manager_delegate_synthesize
    routing_idiom: bounded_delegation
    required_context:
      - delegation_plan_ready
      - workstream_status
    required_tools:
      - create_delegation_plan
      - record_workstream_result
    agent_archetypes:
      - ManagerAgent
      - WorkstreamAgent
      - SynthesisAgent
    transition_generation:
      strategy: manager_owned_subsequence
      ordering:
        - manager_to_workstream_routes
        - workstream_to_synthesis_routes
      terminal_rule: Synthesis agent terminates after required workstreams are complete.
    generator_notes:
      - Use bounded workflow-local stages for normal delegation; use separate workflow sequence steps only when workstreams have independent runtime value.
      - Do not model every specialist as a separate workflow unless it has independent deployment/runtime value.
    examples:
      WorkflowStrategy:
        WorkflowStrategy:
          workflow_name: Market Entry Research
          workflow_description: Delegates market analysis to specialist workstreams and synthesizes a recommendation.
          human_in_loop: true
          trigger: chat
          initiated_by: user
          pattern:
            - Hierarchical
          workflow_stages:
            - stage_index: 0
              stage_name: Workstream Planning
              stage_description: Manager breaks the research into demand, competitor, and regulatory workstreams.
              agents_needed:
                - StrategyManagerAgent
            - stage_index: 1
              stage_name: Specialist Analysis
              stage_description: Specialists complete their scoped analysis and report findings upward.
              agents_needed:
                - DemandAnalystAgent
                - CompetitorAnalystAgent
                - RegulatoryAnalystAgent
            - stage_index: 2
              stage_name: Synthesis
              stage_description: Manager synthesizes findings into a go/no-go recommendation.
              agents_needed:
                - MarketSynthesisAgent

  - id: 5
    key: coordinator
    label: Coordinator
    cookbook_status: clean
    mozaiks_support: workflow_adapter_required
    selection_aliases:
      - organic
      - autopattern
      - free-form
      - manager specialists
    intent_signals:
      - a coordinator should choose which specialist to consult next
      - specialists can be added without graph rewiring
      - exploratory multi-agent collaboration
    avoid_when:
      - the route is known from static context variables
      - strict auditability requires a fixed route table
    beta_primitives:
      - Handoff
      - Finish
      - ToolResult
      - AgentTarget
      - TransitionGraph
    graph_strategy: coordinator_default_return
    routing_idiom: dynamic_handoff_tool
    required_context: []
    required_tools:
      - handoff
      - finish
    agent_archetypes:
      - CoordinatorAgent
      - SpecialistAgent
    transition_generation:
      strategy: minimal_graph_with_dynamic_tools
      ordering:
        - non_coordinator_default_return
      terminal_rule: Coordinator calls finish(summary) to close the workflow.
    generator_notes:
      - This is AG2 beta's replacement for open-ended manager selection.
      - Generate handoff(to) and finish(summary) tools when the full WorkflowAdapter path is available.
      - Until typed routing tools are enabled for a host, prefer Context-Aware Routing or Pipeline.
    examples:
      WorkflowStrategy:
        WorkflowStrategy:
          workflow_name: Expert Consultation Coordinator
          workflow_description: Coordinator consults specialists as needed and finishes with a synthesized answer.
          human_in_loop: true
          trigger: chat
          initiated_by: user
          pattern:
            - Coordinator
          workflow_stages:
            - stage_index: 0
              stage_name: Coordinate Specialist Input
              stage_description: Coordinator decides which specialist to consult next and tracks the running answer.
              agents_needed:
                - ConsultationCoordinatorAgent
                - ResearchSpecialistAgent
                - CriticSpecialistAgent
            - stage_index: 1
              stage_name: Final Synthesis
              stage_description: Coordinator closes the workflow with a concise summary.
              agents_needed:
                - ConsultationCoordinatorAgent

  - id: 6
    key: pipeline
    label: Pipeline
    cookbook_status: clean
    mozaiks_support: compiled_now
    selection_aliases:
      - sequential
      - step-by-step
      - linear
    intent_signals:
      - fixed ordered stages
      - each stage consumes previous output
      - audit-friendly linear flow
    avoid_when:
      - a router must choose between specialists
      - the user expects repeated review loops
    beta_primitives:
      - TransitionGraph.sequence
      - FromSpeaker
      - AgentTarget
      - TerminateTarget
    graph_strategy: sequence
    routing_idiom: static_graph
    required_context: []
    required_tools: []
    agent_archetypes:
      - StageAgent
    transition_generation:
      strategy: stage_order_sequence
      ordering:
        - stage_order
      terminal_rule: Last stage terminates with sequence_complete.
    generator_notes:
      - Use for the default generated workflow when intent is ordered and deterministic.
      - Do not create conditional routes unless a real review gate or error branch exists.
    examples:
      WorkflowStrategy:
        WorkflowStrategy:
          workflow_name: Loan Application Pipeline
          workflow_description: Performs intake, checks, underwriting, and notification in fixed order.
          human_in_loop: true
          trigger: form_submit
          initiated_by: user
          pattern:
            - Pipeline
          workflow_stages:
            - stage_index: 0
              stage_name: Intake Validation
              stage_description: Verifies required documents and normalizes applicant data.
              agents_needed:
                - IntakeValidationAgent
            - stage_index: 1
              stage_name: Risk Screening
              stage_description: Runs risk and compliance checks in sequence.
              agents_needed:
                - RiskScreeningAgent
            - stage_index: 2
              stage_name: Decision And Notification
              stage_description: Produces a decision and sends the applicant update.
              agents_needed:
                - UnderwritingAgent
                - NotificationAgent

  - id: 7
    key: redundant
    label: Redundant
    cookbook_status: partial
    mozaiks_support: deterministic_sequence_now
    selection_aliases:
      - compare approaches
      - majority vote
      - redundant reviewers
    intent_signals:
      - multiple independent attempts should be compared
      - first success or consensus matters
      - evaluator chooses best result
    avoid_when:
      - true same-turn parallel dispatch is required inside one workflow
      - there is only one obvious worker
    beta_primitives:
      - TransitionGraph.sequence
      - ContextEquals
      - TerminateTarget
    graph_strategy: sequential_redundant_then_evaluate
    routing_idiom: fixed_specialist_sweep
    required_context:
      - candidate_results
      - selected_candidate
    required_tools:
      - record_candidate_result
      - select_candidate
    agent_archetypes:
      - CandidateWorkerAgent
      - EvaluatorAgent
    transition_generation:
      strategy: sequential_candidates_then_evaluate
      ordering:
        - worker_sequence
        - evaluator_terminate
      terminal_rule: Evaluator terminates after selecting a candidate.
    generator_notes:
      - Use task_batches.yaml for real workflow-local parallel task execution.
      - Inside one pure transition-graph workflow, model redundant work as sequential candidate collection plus evaluation.
    examples:
      WorkflowStrategy:
        WorkflowStrategy:
          workflow_name: Forecast Comparison
          workflow_description: Collects multiple forecast candidates and selects the strongest one.
          human_in_loop: true
          trigger: schedule
          initiated_by: system
          pattern:
            - Redundant
          workflow_stages:
            - stage_index: 0
              stage_name: Candidate Generation
              stage_description: Multiple methods produce forecast candidates.
              agents_needed:
                - StatisticalForecastAgent
                - CausalForecastAgent
                - HeuristicForecastAgent
            - stage_index: 1
              stage_name: Evaluation
              stage_description: Evaluator compares candidate quality and selects the final recommendation.
              agents_needed:
                - ForecastEvaluatorAgent

  - id: 8
    key: star
    label: Star
    cookbook_status: clean
    mozaiks_support: compiled_now
    selection_aliases:
      - hub and spokes
      - one hub many specialists
      - central coordinator
    intent_signals:
      - one hub dispatches to several known spokes
      - spokes report back to a central coordinator
      - a coordinator owns final synthesis
    avoid_when:
      - the coordinator should dynamically choose arbitrary specialists
      - every step is simply linear
    beta_primitives:
      - TransitionGraph
      - ToolCalled
      - FromSpeaker
      - AgentTarget
      - TerminateTarget
    graph_strategy: hub_spoke_return
    routing_idiom: static_or_context_spoke_dispatch
    required_context:
      - selected_spoke
      - spoke_status
    required_tools:
      - select_spoke
      - record_spoke_result
    agent_archetypes:
      - HubAgent
      - SpokeAgent
    transition_generation:
      strategy: hub_owned_spoke_routes
      ordering:
        - hub_to_spoke_routes
        - spoke_to_hub_returns
        - hub_terminate_rule
      terminal_rule: Hub terminates after required spoke statuses are complete.
    generator_notes:
      - Use Star when the hub owns orchestration and the spoke set is known.
      - Use Coordinator when specialists should be dynamic and the host supports typed Handoff tools.
    examples:
      WorkflowStrategy:
        WorkflowStrategy:
          workflow_name: Vendor Onboarding Hub
          workflow_description: Hub routes vendor review packets to finance, security, and legal spokes.
          human_in_loop: true
          trigger: form_submit
          initiated_by: user
          pattern:
            - Star
          workflow_stages:
            - stage_index: 0
              stage_name: Hub Intake
              stage_description: Coordinator validates vendor details and selects required spokes.
              agents_needed:
                - VendorHubAgent
            - stage_index: 1
              stage_name: Spoke Reviews
              stage_description: Spokes review their domains and return findings to the hub.
              agents_needed:
                - FinanceSpokeAgent
                - SecuritySpokeAgent
                - LegalSpokeAgent
            - stage_index: 2
              stage_name: Hub Synthesis
              stage_description: Hub summarizes findings and prepares the final onboarding decision.
              agents_needed:
                - VendorHubAgent

  - id: 9
    key: triage_with_tasks
    label: Triage with Tasks
    cookbook_status: clean
    mozaiks_support: compiled_now
    selection_aliases:
      - task triage
      - plan then execute
      - typed task queue
    intent_signals:
      - triage produces a plan
      - tasks have prerequisite ordering
      - typed tasks route to specialists
    avoid_when:
      - there is no explicit task plan
      - the user only needs simple category routing
    beta_primitives:
      - TransitionGraph.sequence
      - ContextEquals
      - ChannelStateInject
      - TerminateTarget
    graph_strategy: triage_plan_then_sequence
    routing_idiom: plan_seeded_sequence
    required_context:
      - task_plan
      - current_task_type
    required_tools:
      - create_task_plan
    agent_archetypes:
      - TriageAgent
      - TaskWorkerAgent
      - ReviewerAgent
    transition_generation:
      strategy: triage_then_fixed_sequence
      ordering:
        - triage_to_first_task
        - task_sequence
        - review_terminate
      terminal_rule: Reviewer terminates after all planned tasks are summarized.
    generator_notes:
      - Prefer the fixed sequence variant; dynamic queues require compare-and-swap safeguards.
      - Use task_batches.yaml when task workers process many homogeneous items in parallel.
    examples:
      WorkflowStrategy:
        WorkflowStrategy:
          workflow_name: Research Brief Triage
          workflow_description: Triage creates a typed task plan, workers complete ordered tasks, and reviewer summarizes.
          human_in_loop: true
          trigger: chat
          initiated_by: user
          pattern:
            - Triage with Tasks
          workflow_stages:
            - stage_index: 0
              stage_name: Triage Plan
              stage_description: Triage agent decomposes the request into typed tasks.
              agents_needed:
                - TaskTriageAgent
            - stage_index: 1
              stage_name: Task Execution
              stage_description: Workers complete the research, writing, and review tasks in order.
              agents_needed:
                - ResearchWorkerAgent
                - WritingWorkerAgent
                - ReviewWorkerAgent
