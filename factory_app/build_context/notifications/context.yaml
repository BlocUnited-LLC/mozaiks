context_id: notifications
applies_to_workflows:
  - AppGenerator
assets:
  - path: contract.yaml
    kind: contract
  - path: templates/
    kind: templates
pack:
  id: notifications
  version: "0.1.15"
  status: active
  capability_source: generated_module
  deployment_env:
    optional:
      - SMTP_HOST
      - SMTP_FROM
      - SMTP_PORT
      - SMTP_SECURITY
      - SMTP_USER
    secret:
      - SMTP_PASSWORD
capabilities:
  - capability_id: notifications.email.send
    facade_recommended: notification_settings
  - capability_id: notifications.preferences.read
    facade_recommended: notification_settings
  - capability_id: notifications.preferences.write
    facade_recommended: notification_settings
