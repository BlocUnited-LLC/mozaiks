schema_version: mozaiks.reactions.v1
module_id: notification_settings

# These reactions fire external delivery adapters when domain events arrive.
# In-app notification storage is handled separately by contracts/notifications.yaml
# on the event-producing module — do not duplicate those entries here.
#
# Each reaction routes to the appropriate adapter (email.py or push.py).
# Operators customize the adapter body for their chosen provider.
#
# Add reactions here for any domain events in your app that should
# trigger external notification delivery.

reactions: []

