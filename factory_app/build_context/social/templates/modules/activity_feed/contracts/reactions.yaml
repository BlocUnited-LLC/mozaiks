schema_version: mozaiks.reactions.v1
reactions:
  - id: activity_feed_on_friendship_created
    event_type: domain.social.friendship.created
    target:
      kind: handler
      handler_method: on_friendship_created
    description: Record connection activity when two users become friends.

  - id: activity_feed_on_post_published
    event_type: domain.social.post.published
    target:
      kind: handler
      handler_method: on_post_published
    description: Record post activity when a user publishes a post.

  - id: activity_feed_on_post_commented
    event_type: domain.social.post.commented
    target:
      kind: handler
      handler_method: on_post_commented
    description: Record comment activity when a user comments on a post.
