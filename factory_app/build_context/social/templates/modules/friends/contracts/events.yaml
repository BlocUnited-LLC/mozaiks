schema_version: mozaiks.events.v1
events:
  - type: domain.social.friend_request.sent
    version: 1
    producer: friends
    description: A user sent a friend request to another user.
    payload_schema:
      type: object
      required: [request_id, requester_id, recipient_id]
      properties:
        request_id:     { type: string }
        requester_id:   { type: string }
        requester_name: { type: string }
        recipient_id:   { type: string }
        created_at:     { type: string }

  - type: domain.social.friend_request.declined
    version: 1
    producer: friends
    description: A recipient declined a pending friend request.
    payload_schema:
      type: object
      required: [request_id, requester_id, recipient_id]
      properties:
        request_id:   { type: string }
        requester_id: { type: string }
        recipient_id: { type: string }
        declined_at:  { type: string }

  - type: domain.social.friend_request.withdrawn
    version: 1
    producer: friends
    description: A requester withdrew their pending friend request.
    payload_schema:
      type: object
      required: [request_id, requester_id, recipient_id]
      properties:
        request_id:   { type: string }
        requester_id: { type: string }
        recipient_id: { type: string }
        withdrawn_at: { type: string }

  - type: domain.social.friendship.created
    version: 1
    producer: friends
    description: Two users became friends (friend request accepted).
    payload_schema:
      type: object
      required: [friendship_id, user_a_id, user_b_id, requester_id, request_id]
      properties:
        friendship_id: { type: string }
        user_a_id:     { type: string }
        user_b_id:     { type: string }
        requester_id:  { type: string }
        request_id:    { type: string }
        created_at:    { type: string }

  - type: domain.social.friendship.removed
    version: 1
    producer: friends
    description: A user removed a friend connection.
    payload_schema:
      type: object
      required: [user_id, friend_user_id]
      properties:
        user_id:        { type: string }
        friend_user_id: { type: string }
        removed_at:     { type: string }
