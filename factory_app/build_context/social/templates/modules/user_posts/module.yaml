schema_version: mozaiks.module.v1
module:
  id: user_posts
  display_name: Posts
  version: 1.0.0
  description: >
    User-generated posts with reactions (likes) and threaded comments.
    Posts are soft-deleted to preserve thread integrity. Hard deletion
    only occurs via the GDPR account_data_handler.
  user_data_scope: true
  handler: backend.handler:UserPostsHandler

permissions:
  - id: user_posts.read
    description: Read published posts, reactions, and comments.
  - id: user_posts.create
    description: Create and delete your own posts and comments.
  - id: user_posts.react
    description: Add or remove reactions on posts.
  - id: user_posts.moderate
    description: Delete any post or comment (moderation).
  - id: user_posts.admin
    description: Administer all post records.

actions:
  - id: create_post
    api_surface: public
    description: Create a new post visible to the user's network.
    handler_method: create_post
    input_schema:
      type: object
      required: [body]
      properties:
        body: { type: string, maxLength: 5000 }
        media_urls: { type: array, items: { type: string } }
        visibility: { type: string, enum: [public, friends, private] }
    output_schema:
      type: object
      required: [success, post]
      properties:
        success: { type: boolean }
        post: { type: object }
        error: { type: string }
    permissions: [user_posts.create]
    emits: [domain.social.post.published]

  - id: get_post
    api_surface: public_readonly
    description: Fetch a single post by post_id.
    handler_method: get_post
    input_schema:
      type: object
      required: [post_id]
      properties:
        post_id: { type: string }
    output_schema:
      type: object
      required: [post]
      properties:
        post: { type: object }
    permissions: [user_posts.read]

  - id: delete_post
    api_surface: public
    description: Soft-delete a post. Only the author or a moderator may delete.
    handler_method: delete_post
    input_schema:
      type: object
      required: [post_id]
      properties:
        post_id: { type: string }
    output_schema:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
        error: { type: string }
    permissions: [user_posts.create]
    emits: [domain.social.post.deleted]

  - id: list_posts
    api_surface: public_readonly
    description: List published posts, optionally filtered by author.
    handler_method: list_posts
    input_schema:
      type: object
      properties:
        author_id: { type: string }
        visibility: { type: string }
        limit: { type: integer }
        before: { type: string }
    output_schema:
      type: object
      required: [posts, count]
      properties:
        posts: { type: array }
        count: { type: integer }
        next_cursor: { type: string }
    permissions: [user_posts.read]

  - id: list_user_posts
    api_surface: public_readonly
    description: >
      List published posts by a specific user. Used to hydrate the Posts tab
      on /me and /u/:username profile pages.
    handler_method: list_user_posts
    input_schema:
      type: object
      properties:
        user_id: { type: string }
        limit: { type: integer }
        before: { type: string }
    output_schema:
      type: object
      required: [posts, count]
      properties:
        posts: { type: array }
        count: { type: integer }
        next_cursor: { type: string }
    permissions: [user_posts.read]

  - id: react_to_post
    api_surface: public
    description: >
      Add or remove a reaction (like) on a post. Idempotent — reacting
      again with the same type removes the reaction (toggle).
    handler_method: react_to_post
    input_schema:
      type: object
      required: [post_id]
      properties:
        post_id: { type: string }
        reaction_type: { type: string, enum: [like, love, celebrate, support] }
    output_schema:
      type: object
      required: [success, action]
      properties:
        success: { type: boolean }
        action: { type: string }    # added | removed
        reaction_count: { type: integer }
        error: { type: string }
    permissions: [user_posts.react]
    emits: [domain.social.post.reacted]

  - id: add_comment
    api_surface: public
    description: Add a comment to a post.
    handler_method: add_comment
    input_schema:
      type: object
      required: [post_id, body]
      properties:
        post_id: { type: string }
        body: { type: string, maxLength: 2000 }
    output_schema:
      type: object
      required: [success, comment]
      properties:
        success: { type: boolean }
        comment: { type: object }
        error: { type: string }
    permissions: [user_posts.create]
    emits: [domain.social.post.commented]

  - id: delete_comment
    api_surface: public
    description: Delete a comment. Only the comment author or a moderator may delete.
    handler_method: delete_comment
    input_schema:
      type: object
      required: [comment_id]
      properties:
        comment_id: { type: string }
    output_schema:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
        error: { type: string }
    permissions: [user_posts.create]
    emits: [domain.social.post.comment_deleted]

  - id: list_comments
    api_surface: public_readonly
    description: List comments for a post, oldest-first.
    handler_method: list_comments
    input_schema:
      type: object
      required: [post_id]
      properties:
        post_id: { type: string }
        limit: { type: integer }
        after: { type: string }
    output_schema:
      type: object
      required: [comments, count]
      properties:
        comments: { type: array }
        count: { type: integer }
        next_cursor: { type: string }
    permissions: [user_posts.read]

  - id: get_reaction_summary
    api_surface: public_readonly
    description: Return reaction counts and whether the current user has reacted.
    handler_method: get_reaction_summary
    input_schema:
      type: object
      required: [post_id]
      properties:
        post_id: { type: string }
    output_schema:
      type: object
      required: [total, by_type, viewer_reaction]
      properties:
        total: { type: integer }
        by_type: { type: object }
        viewer_reaction: { type: string }
    permissions: [user_posts.read]

capabilities:
  - capability_id: social.posts.create
    kind: action
    target: create_post
    title: Create Post
    permissions: [user_posts.create]
  - capability_id: social.posts.list
    kind: action
    target: list_posts
    title: List Posts
    permissions: [user_posts.read]
  - capability_id: social.posts.react
    kind: action
    target: react_to_post
    title: React to Post
    permissions: [user_posts.react]
  - capability_id: social.posts.comment
    kind: action
    target: add_comment
    title: Comment on Post
    permissions: [user_posts.create]
