contract_id: social
contract_type: build_pack_instructions

selection_rules:
  - id: select_for_social_apps
    when:
      intent_any:
        - friends
        - friend requests
        - social network
        - social platform
        - activity feed
        - news feed
        - follow
        - connections
        - user posts
        - social graph
    action: select_pack
  - id: confirm_for_community_apps
    when:
      intent_any:
        - community
        - forum
        - groups
        - members
    action: require_explicit_user_confirmation

recommended_domains:
  - social
  - community
  - network
  - creator platform
  - marketplace with social layer
  - collaboration

