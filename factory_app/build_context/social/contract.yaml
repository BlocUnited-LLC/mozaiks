  - path_prefix: services/friends/

runtime_boundaries:
  - id: persistence_layer
    rule: All repo files must use ctx.persistence.collection(module_id, entity_name). No direct Motor clients and no app_data_from_context aliases.
  - id: event_emission
    rule: Events emitted via ctx.emit() in service.py only. Handler and repo never emit.
  - id: bidirectional_friendship
    rule: >
      Friendship records are always written in pairs (user_a→user_b and user_b→user_a)
      so either side can query their own friends list without a $or query.
  - id: activity_feed_population
    rule: >
      ActivityFeedService.record_activity() is called exclusively via reactions to domain events
      (declared in activity_feed/contracts/reactions.yaml). Do not call it directly from friends
      or user_posts service code.
  - id: soft_delete_posts
    rule: >
      Posts are soft-deleted (status=deleted) to preserve comment threads and reaction counts.
      Hard delete is GDPR-only via account_data_handler.
  - id: user_data_scope
    rule: >
      friends and user_posts declare user_data_scope: true and ship account_data_handler.py.
      activity_feed events are derived records — purge them in account_data_handler when actor_id
      or about_user_id matches the deleted user.

facades: []

cross_pack_integrations:
  - pack_id: messaging
    description: >
      The friends pack integrates with messaging when both packs are selected.
      A friendship.created event may trigger an initial DM thread; the AppGenerator
      should declare a reaction in messages/contracts/reactions.yaml when both packs
      are present.
  - pack_id: commerce
    description: >
      User posts can reference commerce products (product_id context field). When both
      packs are present the AppGenerator may add a product_id field to create_post input.
