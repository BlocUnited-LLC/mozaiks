schema_version: mozaiks.module.v1
module:
  id: cloud_deployment
  display_name: Cloud Deployment
  description: >
    Facade module for Mozaiks Cloud deployment and environment operations.
    Submits, monitors, and manages app deployment lifecycle through the Mozaiks
    Cloud managed platform. All operations are app-owned; provider internals
    (Azure resource IDs, pipeline configuration, credential material) are never
    exposed to the generated app.
  handler: backend.handler:CloudDeploymentHandler

permissions:
  - id: cloud_deployment.read
    description: View deployment status and environment endpoints
  - id: cloud_deployment.write
    description: Submit deployments and request rollbacks

actions:
  - id: submit_deployment
    handler_method: submit_deployment
    api_surface: internal
    permissions:
      - cloud_deployment.write
    description: >
      Submit an authorized deployment/release request to Mozaiks Cloud.
      Requires cloud_deployment.write permission.

  - id: get_deployment_status
    handler_method: get_deployment_status
    api_surface: public_readonly
    input_schema:
      type: object
      additionalProperties: false
      properties:
        operation_id:
          type: string
          minLength: 1
      required: [operation_id]
    permissions:
      - cloud_deployment.read
    description: >
      Retrieve normalized deployment operation status by operation_id.
      Status values: pending, running, succeeded, failed, cancelled, rolling_back.

  - id: get_environment_endpoints
    handler_method: get_environment_endpoints
    api_surface: public_readonly
    input_schema:
      type: object
      additionalProperties: false
      properties:
        app_id:
          type: string
          minLength: 1
      required: [app_id]
    permissions:
      - cloud_deployment.read
    description: >
      Retrieve normalized environment endpoints for the app.
      Each endpoint has url, kind, and optional region.
      Provider-internal resource IDs are never returned.

  - id: get_deployment_health
    handler_method: get_deployment_health
    api_surface: public_readonly
    input_schema:
      type: object
      additionalProperties: false
      properties:
        deployment_id:
          type: string
          minLength: 1
      required: [deployment_id]
    permissions:
      - cloud_deployment.read
    description: >
      Retrieve sanitized deployment health for a provider-owned deployment.
      Provider-internal resource IDs and raw build logs are never returned.

  - id: request_rollback
    handler_method: request_rollback
    api_surface: internal
    permissions:
      - cloud_deployment.write
    description: >
      Request rollback of a deployment to a previous release through
      an explicitly authorized operation. Requires cloud_deployment.write permission.
