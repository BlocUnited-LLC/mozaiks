schema_version: mozaiks.reactions.v1
# Read-only reactions. This module never mutates DNS records, TLS certificates,
# Cloudflare zones, or any provider state in reaction handlers. Handlers only
# cache normalized status received from the hosted.cloud.* event namespace.
reactions:
  - id: domain_activated
    event_type: hosted.cloud.domain.activated
    target:
      kind: handler
      handler_method: handle_domain_activated
    description: >
      Receives normalized activation notification from Mozaiks Cloud.
      Updates local domain status cache. Read-only; never mutates
      provider DNS or TLS state.

  - id: domain_verification_updated
    event_type: hosted.cloud.domain.verification_updated
    target:
      kind: handler
      handler_method: handle_domain_verification_updated
    description: >
      Receives normalized verification status update from Mozaiks Cloud.
      Updates local verification cache. Read-only.

  - id: domain_failed
    event_type: hosted.cloud.domain.failed
    target:
      kind: handler
      handler_method: handle_domain_failed
    description: >
      Receives normalized failure notification from Mozaiks Cloud.
      Updates local domain status cache. Read-only.
