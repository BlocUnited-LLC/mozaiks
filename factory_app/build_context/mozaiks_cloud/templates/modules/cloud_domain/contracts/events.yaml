schema_version: mozaiks.events.v1
events:
  - type: cloud.domain.connected
    version: 1
    description: Emitted when a domain connection is initiated with Mozaiks Cloud.
    producer: cloud_domain
    payload_schema:
      type: object
      required:
        - operation_id
        - domain
      properties:
        operation_id:
          type: string
        domain:
          type: string

  - type: cloud.domain.status_updated
    version: 1
    description: Emitted when a domain's DNS or TLS status changes locally.
    producer: cloud_domain
    payload_schema:
      type: object
      required:
        - domain
        - status
      properties:
        domain:
          type: string
        status:
          type: string
          enum:
            - pending_verification
            - verified
            - activating
            - active
            - failed
            - disconnected
        tls_status:
          type: string
          enum:
            - pending
            - provisioning
            - active
            - failed

  - type: cloud.domain.disconnected
    version: 1
    description: Emitted when a domain is disconnected from the app.
    producer: cloud_domain
    payload_schema:
      type: object
      required:
        - domain
      properties:
        domain:
          type: string
