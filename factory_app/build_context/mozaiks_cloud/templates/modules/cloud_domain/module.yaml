schema_version: mozaiks.module.v1
module:
  id: cloud_domain
  display_name: Cloud Domain Management
  description: >
    Facade module for Mozaiks Cloud domain operations. Connects, verifies,
    activates, and disconnects custom domains with normalized DNS and TLS
    status display. All operations are app-owned; provider DNS/TLS internals
    (Cloudflare zone IDs, certificate material, registrar configuration) are
    never exposed to the generated app.
  handler: backend.handler:CloudDomainHandler

permissions:
  - id: cloud_domain.read
    description: View domain status and DNS instructions
  - id: cloud_domain.manage
    description: Connect, activate, and disconnect domains

actions:
  - id: connect_domain
    handler_method: connect_domain
    api_surface: internal
    permissions:
      - cloud_domain.manage
    description: >
      Connect an existing domain to the app via Mozaiks Cloud.
      Requires cloud_domain.manage permission.

  - id: get_domain_verification
    handler_method: get_domain_verification
    api_surface: public_readonly
    input_schema:
      type: object
      additionalProperties: false
      properties:
        binding_id:
          type: string
          minLength: 1
        tenant_id:
          type: string
          minLength: 1
        app_id:
          type: string
          minLength: 1
      required: [binding_id]
    permissions:
      - cloud_domain.read
    description: >
      Request ownership verification status and verification records for display.
      Each record has type, name, value, and optional ttl.

  - id: get_dns_instructions
    handler_method: get_dns_instructions
    api_surface: public_readonly
    input_schema:
      type: object
      additionalProperties: false
      properties:
        binding_id:
          type: string
          minLength: 1
        tenant_id:
          type: string
          minLength: 1
        app_id:
          type: string
          minLength: 1
      required: [binding_id]
    permissions:
      - cloud_domain.read
    description: >
      Retrieve DNS configuration instructions for the domain.
      Records are for display only; the Mozaiks Cloud provider applies DNS changes.

  - id: request_domain_activation
    handler_method: request_domain_activation
    api_surface: internal
    permissions:
      - cloud_domain.manage
    description: >
      Request domain activation after ownership verification.
      Requires cloud_domain.manage permission.

  - id: get_domain_status
    handler_method: get_domain_status
    api_surface: public_readonly
    input_schema:
      type: object
      additionalProperties: false
      properties:
        binding_id:
          type: string
          minLength: 1
        tenant_id:
          type: string
          minLength: 1
        app_id:
          type: string
          minLength: 1
      required: [binding_id]
    permissions:
      - cloud_domain.read
    description: >
      Retrieve DNS and TLS status for a connected domain.
      Domain status: pending_verification | verified | activating | active | failed | disconnected
      TLS status: pending | provisioning | active | failed

  - id: disconnect_domain
    handler_method: disconnect_domain
    api_surface: internal
    permissions:
      - cloud_domain.manage
    description: >
      Disconnect a domain from the app.
      Requires cloud_domain.manage permission.
