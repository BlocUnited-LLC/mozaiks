version: 1
description: >
  Prompt-time shell preset catalog for AppGenerator. Presets are app-wide
  chrome and navigation priors. They compile into AppBuildPlan
  shell_preset_hint, AppPageSchema.navigation, AppPageSchema.shell_mode, and
  optional shell_config. Runtime never loads this file.
defaults:
  fallback_preset: product_app
presets:
  product_app:
    description: Standard logged-in product with a few durable destinations.
    select_when:
    - Most customer-facing SaaS or product apps.
    - Global navigation has three to five primary destinations.
    shell_policy:
      desktop:
        global: header
        local: sidebar
        footer: visible
      mobile:
        global: bottomBar
        local: sheet
        footer: hidden
      maxMobileItems: 5
      autoFromPages: false
    chrome_default: standard
    page_guidance:
      primary_modes:
        default: standard
        settings: workspace
        setup: focused
      navigation_scopes:
        primary: global
        settings: profile
        legal: footer
  workspace_studio:
    description: Dense multi-resource management surface with persistent side navigation.
    select_when:
    - Internal tools, admin portals, CRMs, operations centers, or workspace managers.
    - Users repeatedly switch between resource lists, settings, and operational views.
    shell_policy:
      desktop:
        global: header
        local: sidebar
        footer: hidden
      mobile:
        global: bottomBar
        local: sheet
        footer: hidden
      maxMobileItems: 5
      autoFromPages: false
    chrome_default: workspace
    page_guidance:
      primary_modes:
        default: workspace
        detail: workspace
        setup: focused
      navigation_scopes:
        primary: global
        subsection: local
        settings: profile
  public_plus_app:
    description: Public routes plus authenticated product routes.
    select_when:
    - The app needs marketing, pricing, docs, or legal pages plus a logged-in product area.
    - Public pages should keep public chrome while authenticated pages use product chrome.
    shell_policy:
      desktop:
        global: header
        local: sidebar
        footer: visible
      mobile:
        global: bottomBar
        local: sheet
        footer: hidden
      maxMobileItems: 5
      autoFromPages: false
    chrome_default: standard
    page_guidance:
      primary_modes:
        public: public
        app: standard
        onboarding: focused
      navigation_scopes:
        public_primary: global
        app_primary: global
        legal: footer
  conversation_app:
    description: Chat, inbox, support, or collaboration-heavy product.
    select_when:
    - Primary UX is message threads, live chat, an inbox, or realtime collaboration.
    - The conversation surface needs to own the lower viewport edge.
    shell_policy:
      desktop:
        global: header
        local: sidebar
        footer: hidden
      mobile:
        global: bottomBar
        local: sheet
        footer: hidden
      maxMobileItems: 5
      autoFromPages: false
    chrome_default: standard
    page_guidance:
      primary_modes:
        inbox: workspace
        thread: conversation
        settings: workspace
      navigation_scopes:
        inbox: global
        thread: local
        settings: profile
  flow_app:
    description: Guided flow, onboarding, checkout, review, or approval product.
    select_when:
    - Primary UX is a sequential setup, submission, review, approval, or checkout flow.
    - The user should complete focused steps before entering a normal product area.
    shell_policy:
      desktop:
        global: header
        local: sidebar
        footer: hidden
      mobile:
        global: bottomBar
        local: sheet
        footer: hidden
      maxMobileItems: 5
      autoFromPages: false
    chrome_default: focused
    page_guidance:
      primary_modes:
        flow: focused
        summary: standard
        settings: workspace
      navigation_scopes:
        flow: direct-link only
        summary: global
        settings: profile
rules:
- Presets are prompt-time guidance only, not runtime artifacts.
- Select at most one shell_preset_hint unless the app clearly combines public and authenticated zones.
- Do not emit preset ids into generated runtime files.
- Compile the selected preset into normal AppPageSchema.navigation, AppPageSchema.shell_mode, and optional shell_config.
- Keep shell_config null when the selected preset matches platform defaults.
- Do not use presets to create extra shell buttons. Header actions still require explicit user/product intent.
- If a header action changes by workflow/app context, use semantic action variants with bounded when fields; do not generate path-prefix or query-param override rules.
