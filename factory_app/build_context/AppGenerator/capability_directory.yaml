version: 1
catalog_id: appgenerator_capability_directory
description: >
  Provider-neutral capability packs for AppGenerator.
  This catalog guides pack recommendation order only; selected packs still come
  from build_context/packs descriptors or explicit user intent.
global_rules:
  - Recommend packs only for capability intent present in the product brief or upstream plan.
  - Do not force a provider when the user names a different provider.
  - If a recommended pack is selected, use app-owned facade modules and thin service clients.
  - Runtime primitives such as auth, account profile, subscriptions, entitlement gates, token usage measurement, and token wallet accounting are platform-provided; generated app modules wire product-specific SaaS behavior on top of them.
app_agnostic_rules:
  - Default managed adapters are recommendation-only and must not become runtime requirements.
  - A selected managed adapter must cross runtime state changes through provider-neutral commands, events, or configured records.
  - Generated app pages must call app-owned facade modules; they must not call hosted product internals or payment provider SDKs directly.
  - Any default managed adapter must declare an external_adapter replacement path so user-selected providers can satisfy the same app-facing contract.
capabilities:
  - id: mozaikspay
    label: MozaiksPay Managed SaaS Billing
    capability_kind: operator_pack
    recommendation_rank: 1
    adapter_contract:
      role: default_managed_adapter
      app_facing_facades:
        - billing_portal
      replacement_kind: external_adapter
      runtime_effect_boundary: BillingFulfillmentCommand
      runtime_read_boundary: EntitlementPort
      canonical_runtime_state:
        - app/config/subscriptions.yaml
        - subscription assignment_store records
        - OSS token wallet ledger
    domains:
      - billing
      - subscriptions
      - usage
      - saas
    intent_signals:
      - App sells plans, tiers, seats, subscriptions, credits, usage, or paid access.
      - App needs a billing portal, subscription status, or runtime usage status.
      - User asks to turn the generated app into a SaaS product.
    selection_aliases:
      - mozaikspay
      - managed billing
      - managed subscriptions
      - billing
      - subscriptions
      - saas monetization
    generator_notes:
      - Prioritize the mozaikspay capability pack for SaaS monetization when it is available and the user has not explicitly named a different billing provider.
      - Generate the app-owned billing_portal facade, thin services/integrations/mozaikspay_client.py client, billing/usage pages, pricing page, and app/config/subscriptions.yaml plan contract.
      - Do not generate provider-specific billing module internals or hosted service code.
      - Do not generate checkout, webhook handlers, invoice logic, customer/payment provider mapping, refunds, wallet, payout, or provider credential handling.
      - Do not generate custom token metering or balance storage; read measured runtime usage from /api/me/usage or /api/admin/usage and use the OSS token wallet ledger for balances.
      - Use app/config/subscriptions.yaml when a generated SaaS app needs plan quotas, usage limits, token_wallets, or token_allowances.
      - Pages must bind through app-owned facade modules, not directly to the hosted MozaiksPay API or any external billing endpoint.
    alternatives:
      - id: custom_payments_provider
        capability_kind: external_adapter
        use_when: User brings a custom payment processor, wallet rail, or billing service.
        generator_notes:
          - Generate strict app-owned facade contracts and adapter stubs only.
          - Keep provider-specific mechanics under app/services/adapters/payments/.

  - id: messaging_pack
    label: Messaging
    capability_kind: operator_pack
    recommendation_rank: 2
    domains:
      - messaging
      - chat
      - direct_messages
      - threads
    intent_signals:
      - App needs users to send messages to each other.
      - App needs DM threads, group channels, support conversations, or threaded conversation history.
      - Product spec mentions chat, inbox, messaging, conversations, or threads.
      - App needs read/unread state for persisted internal conversations.
    selection_aliases:
      - messaging
      - messaging_pack
      - chat
      - dm
      - direct messages
      - threads
    generator_notes:
      - Select the messaging operator_pack when messaging is in the product brief.
      - The messages module owns threads, messages, read state, and in-app notification events.
      - Messaging has scope_type app/workspace and subject_app_id so support can be app-scoped while future social DMs can be workspace-scoped.
      - Do not generate contacts, friends, follows, invites, or feeds inside the messaging pack; those belong to social_pack.
      - Use support_pack for help desk ticket metadata and support pages.
      - Use notifications pack only for email/push delivery beyond runtime in-app notifications.
    capabilities_provided:
      - messaging.threads.list
      - messaging.messages.send

  - id: support_pack
    label: Support Desk
    capability_kind: operator_pack
    recommendation_rank: 3
    domains:
      - support
      - helpdesk
      - customer_operations
      - app_operations
    intent_signals:
      - App needs users to ask for help or open support tickets.
      - App needs an operator inbox, support replies, escalations, or per-app support follow-up.
      - Product spec mentions support desk, help desk, helpdesk, ticket, customer support, or operator follow-up.
    selection_aliases:
      - support
      - support_pack
      - help desk
      - helpdesk
      - customer support
      - support tickets
    generator_notes:
      - Select support_pack only when the app needs support request metadata or a support inbox.
      - support_pack requires messaging_pack. The support module stores request metadata and message_thread_id; the messages module stores all conversation bodies.
      - Support requests must carry subject_app_id so admin views can group support by app.
      - Do not hardcode support transcripts. Support messages must come from persisted messages threads.
      - Do not use support_pack for social DMs, friends, follows, invites, forums, proposals, or governance voting.
    capabilities_provided:
      - support.requests.create
      - support.requests.list
      - support.requests.update_status

  - id: social_pack
    label: Social Graph and Feed
    capability_kind: operator_pack
    recommendation_rank: 4
    domains:
      - social
      - community
      - friends
      - invites
      - feed
      - posts
    intent_signals:
      - App needs friends, follows, invitations, user posts, comments, reactions, or activity feeds.
      - App is a social network, creator platform, community app, member graph, or feed-based product.
      - Product spec mentions friends list, inviting friends, following users, posts, comments, likes, or activity feed.
    selection_aliases:
      - social
      - social_pack
      - friends
      - invites
      - activity feed
      - posts
    generator_notes:
      - Select social_pack only for apps where social graph or feed behavior is part of the product concept.
      - The social pack owns friends, follows/invites, user posts, reactions, comments, and feed records.
      - Use messaging_pack for DMs only when the app also needs private conversations.
      - Do not make governance features first-class here. Threads with voting, proposals, quorum, treasury, moderation policy, or member governance are app-specific — build them as app-owned modules, not as packs.
      - Dummy friend/post examples may be used in demo UI fallbacks, but persisted user social data must come from module actions.
    capabilities_provided:
      - social.friends.list
      - social.friends.connect
      - social.feed.read
      - social.posts.create
      - social.posts.list
      - social.posts.react
      - social.posts.comment

  - id: commerce_pack
    label: Commerce Storefront
    capability_kind: operator_pack
    recommendation_rank: 5
    domains:
      - commerce
      - ecommerce
      - storefront
      - catalog
      - cart
      - checkout
      - orders
      - inventory
    intent_signals:
      - App sells products, digital goods, merch, tickets, bookings, or one-time purchasable items.
      - App needs a product catalog, storefront, cart, checkout request flow, order history, or inventory tracking.
      - Product spec mentions ecommerce, e-commerce, online store, shop, storefront, cart, checkout, orders, or inventory.
      - App needs a generated commerce module that can pair with a managed payment capability or a bring-your-own payment adapter.
    selection_aliases:
      - commerce
      - commerce_pack
      - ecommerce
      - e-commerce
      - online store
      - shop
      - storefront
      - product catalog
      - cart
      - checkout
      - orders
      - inventory
    generator_notes:
      - Select commerce_pack when the generated app needs product selling, cart, checkout request, orders, or inventory.
      - The commerce module owns catalog, cart, checkout request, order, and fulfillment state.
      - Use the generated module templates from build_context/commerce; do not invent modules/ecommerce, modules/shop, modules/marketplace, managed payment provider modules, or provider-specific payment modules.
      - Payment processor mechanics remain outside commerce. Pair with a selected managed payment pack for the default managed checkout path, or create an app-owned services/adapters/payments integration only when the user explicitly brings a provider.
      - Use commerce as a single-merchant pack. Do not add seller onboarding, seller payouts, commissions, disputes, or multi-vendor dashboards unless a future commerce_marketplace overlay pack is selected.
      - Product detail routes that require route-param API binding or post-payment confirmation routes that poll provider state should use custom_route_bundle until declarative page schemas support those runtime needs.
    capabilities_provided:
      - commerce.products.browse
      - commerce.products.manage
      - commerce.inventory.manage
      - commerce.cart.manage
      - commerce.checkout.start
      - commerce.orders.manage

  - id: onboarding_pack
    label: User Onboarding Tour
    capability_kind: operator_pack
    recommendation_rank: 8
    domains:
      - onboarding
      - ux
      - first_time_user
    intent_signals:
      - App has multiple sections or a non-trivial navigation surface that first-time users may find unfamiliar.
      - App is aimed at end-users discovering features for the first time.
      - User asks for onboarding tour, getting started guide, product tour, walkthrough, or first-time user experience.
      - App targets non-technical end-users who benefit from guided first use.
    selection_aliases:
      - onboarding
      - onboarding_pack
      - product tour
      - getting started
      - guided tour
      - walkthrough
      - first time user
      - user onboarding
      - ftu
    generator_notes:
      - Select onboarding_pack only when the app has a meaningful navigation surface and targets users who benefit from guided first use.
      - Do not select for single-page tools, admin-only dashboards, developer tools, or operator-facing surfaces.
      - The primary generated output is app/config/onboarding.yaml — a declarative list of tour steps. This file's presence enables the tour; its absence disables it entirely.
      - Scaffold step selectors from the app's declared shell.json nav items and app/ui/pages/*.yaml routes. Use href-based selectors (e.g. a[href="/dashboard"]).
      - Limit to 3–5 steps covering the most important entry points visible to a new user on the free plan.
      - The OSS runtime provides installTour() and the tour overlay. Do not generate a custom React tour component or a separate /welcome page.
      - The user_onboarding state module follows the standard archetype. Step ids in its complete_step enum must match config/onboarding.yaml step ids exactly.

  - id: operator_readiness
    label: Operator Readiness
    capability_kind: operator_pack
    recommendation_rank: 9
    domains:
      - platform
      - launch
      - readiness
      - hosting
      - compliance
    intent_signals:
      - App is a host-operator platform or SaaS workspace that needs reproducible no-spend launch gates.
      - Product spec mentions launch readiness, evidence stamping, staging verification, or operator readiness.
      - App manages hosted customer apps, release gates, compliance approvals, or platform launch checklists.
    selection_aliases:
      - operator readiness
      - launch readiness
      - readiness gate
      - evidence ledger
      - no-spend launch
      - staging verification
    generator_notes:
      - Select this pack only for platform-style apps that need a deterministic launch/evidence workflow. Do not select it for ordinary customer apps or simple brochure sites.
      - AppPlanAgent must emit a readiness_profile and the generated files must be rendered from the pack templates, not scraped from freeform agent prose.
      - The primary generated output is config/operator_readiness.yaml. The pack also emits a local wrapper script and a short operator guide for reproducible no-spend checks.
      - Keep the generated outputs generic. Do not bake App Zero-specific env var names, provider ids, or paid-service defaults into this pack.

  - id: files_pack
    label: Files & Media Storage
    capability_kind: operator_pack
    recommendation_rank: 3
    domains:
      - files
      - media
      - storage
      - documents
    intent_signals:
      - App needs file upload, media storage, or document management.
      - Users upload images, documents, or attachments.
      - App stores user-generated files, photos, or media assets.
      - Product spec mentions file upload, document management, attachments, media library, or photo upload.
    selection_aliases:
      - files
      - file upload
      - media
      - storage
      - document management
      - attachments
      - photo upload
      - image upload
    generator_notes:
      - Generate the files module with metadata-only storage. Actual blobs are stored by the app's storage adapter.
      - Do not generate cloud storage SDK calls in the module backend.
      - Generate services/adapters/storage/{provider}.py when the app declares a specific cloud storage provider.
      - The storage_url field is an opaque provider URL returned by the storage adapter; the module does not validate or proxy it.
    capabilities_provided:
      - files.upload
      - files.read
      - files.delete

  - id: notifications_pack
    label: External Notification Delivery
    capability_kind: operator_pack
    recommendation_rank: 4
    domains:
      - notifications
      - email
      - push
      - sms
      - alerts
    capabilities_provided:
      - notifications.preferences.read
      - notifications.preferences.write
    intent_signals:
      - App delivers email alerts, push notifications, or SMS messages to users.
      - Users need to opt in or out of notification channels.
      - Domain events should trigger transactional email or mobile push delivery.
    selection_aliases:
      - notifications
      - email notifications
      - push notifications
      - sms notifications
      - transactional email
      - mobile push
      - email delivery
      - external notifications
    generator_notes:
      - Generate the notification_settings facade module for user preferences and a provider-neutral adapter stub under services/adapters/notifications/.
      - Do not re-implement in-app notification storage or websocket delivery — the runtime handles those via contracts/notifications.yaml on event-producing modules.
      - Do not embed provider SDK calls in module service.py — delivery mechanics belong in services/adapters/notifications/{channel}.py.
      - Generated adapter stubs must not include credential values — load from env vars (EMAIL_API_KEY, FCM_SERVER_KEY, etc.).
    alternatives:
      - id: managed_notification_platform
        capability_kind: managed_capability
        use_when: User brings a managed notification platform (Courier, Knock, Novu) with its own delivery API.
        generator_notes:
          - Generate a thin services/integrations/{platform}_client.py and a notification_settings facade module only.
          - Do not generate provider adapter stubs — the managed platform owns delivery.
