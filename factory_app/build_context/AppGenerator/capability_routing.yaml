version: 1

description: >
  Capability routing rules for AppGenerator. Apply these during app planning to
  decide what to generate vs. what to reference vs. what to hand off. These rules
  prevent generators from duplicating runtime infrastructure, rebuilding AI logic
  as deterministic code, or over-constraining user-owned custom capabilities.

layers:

  runtime_provided:
    description: >
      Built into mozaiksai. Always present in every deployed app. Never generate
      these as modules, capability packs, or build tasks — reference them as
      available platform infrastructure only.
    capabilities:
      - auth, sessions, JWT validation, OAuth flows
      - WebSocket transport and connection lifecycle
      - Unified event bus and domain event dispatch
      - Admin shell, panel registration, /admin routing
      - Platform notification storage and delivery pipeline
      - Module action routing via /api/modules/{module_id}/{action_id}
      - AG2 workflow orchestration engine and session management
      - User account and identity (/api/me contract)
    rule: >
      If the product spec mentions any of these, note them as available platform
      capabilities in service_scope. Do not add them to capability_packs or
      build_tasks. Domain-specific profile records (investor profiles, creator
      profiles, vendor profiles) are module-owned entities — they extend the
      platform identity contract; they do not replace it.

  ai_workflow:
    description: >
      AI reasoning, multi-step orchestration, content generation, autonomous
      decisions, recommendations, and agentic behavior. These belong to the
      workflow layer — produced by AgentGenerator, not by deterministic module code.
    rule: >
      When a feature requires reasoning, judgment, recommendations, content
      generation, or multi-step autonomous processing:
        1. Declare a workflow_touchpoint on the relevant page(s)
        2. Generate the deterministic module(s) that own the data the workflow
           reads and writes — actions, events, storage
        3. Generate a module_interface.yaml alongside the workflow declaring
           which module actions it will call
        4. Do NOT generate a deterministic module that tries to implement AI logic
      AgentGenerator produces the workflow. The module layer owns the data contract.
    examples:
      - '"smart recommendations"  → workflow touchpoint + recommendations storage module'
      - '"AI content generation"  → workflow touchpoint + content storage module'
      - '"intelligent routing"    → workflow touchpoint + queue/state module'
      - '"copilot / assistant"    → workflow touchpoint + context data modules'
      - '"agentic automation"     → workflow touchpoint + task/result storage module'

  capability_pack:
    description: >
      Well-known operator capability domains. Select the pack; generate only the
      app-specific wiring, page composition, and event flow bindings — not pack internals.
    packs:
      - id: messaging
        covers: DM threads, group channels, real-time delivery, read/unread state
        capability_kind: operator_pack
        use_when: App needs user-to-user or group messaging, threaded conversations, or real-time chat
        avoid_when: You only need one-way system alerts or push notifications — use the notifications pack instead

      - id: commerce
        covers: product catalog, storefront browse, inventory, cart, checkout request, orders, and fulfillment state
        capability_kind: operator_pack
        use_when: App sells products, digital goods, tickets, bookings, or other one-time purchasable items
        avoid_when: You only need SaaS subscriptions or plan gating — use the monetization subscriptions route instead; use a future marketplace overlay for multi-vendor seller payouts

      - id: files
        covers: file upload, storage, retrieval, media management
        capability_kind: operator_pack
        use_when: App needs user-generated file upload/download, media storage, or document management
        avoid_when: You only need to store structured data records — a custom module is simpler

      - id: notifications
        covers: multi-channel notification delivery (in-app, email, push, SMS)
        capability_kind: operator_pack
        use_when: App needs to alert users across channels (email, push, SMS, in-app) when domain events occur
        avoid_when: You only need in-app state changes with no user-facing delivery outside the app

    rule: >
      For these domains declare capability_kind as operator_pack.
      Generate the app-specific wiring (pages, façade module actions, event flows)
      but never regenerate pack internals.

    operator_pack_note: >
      Capability packs are operator_pack entries available only when workspace
      build_context projects them into capability_packs. Do NOT invent pack
      internals or add pack-backed capabilities unless they appear in the
      capability_packs context. If a capability is needed and no operator pack
      is available, declare it as a custom_owned external_adapter instead.

  ai_native_packs:
    description: >
      AI-native capability packs that pair a deterministic module surface with an
      autonomous BackendOnly AI workflow. AppGenerator generates the MODULE SIDE ONLY.
      The AI workflow bundle is generated in a SEPARATE AgentGenerator run triggered
      by the design_surface_map workflow_triggers declarations.
    rule: >
      For ai_review_pack, ai_analysis_pack, and ai_extraction_pack:
        1. Generate the module-side build tasks ONLY — no workflow build tasks.
        2. Do NOT emit a build task with surface_kind='workflow'. Workflow surfaces
           are AgentGenerator-owned and the AppBuildPlan validator rejects them.
        3. Wire reactions.yaml to route the domain event to the AI workflow
           using the canonical capability_id naming convention below.
        4. Declare workflow_triggers on the surface_map entry so the design layer
           records the capability_id the AgentGenerator run must generate.
    capability_id_convention:
      ai_review_pack:   "{module_id}-review-workflow"
      ai_analysis_pack: "{module_id}-analysis-workflow"
      ai_extraction_pack: "{module_id}-extraction-workflow"
    packs:
      - id: ai_review_pack
        covers: >
          Human-in-the-loop review workflow for submitted records. The module emits
          a submission event; the AI workflow evaluates the record and calls
          record_review_result back into the module.
        module_actions_required:
          - "submit_for_review — emits domain.{module_id}.submitted, sets status=under_review"
          - "record_review_result — accepts decision (approved|rejected|revision_requested) and feedback string"
        events_required:
          - "domain.{module_id}.submitted"
        reactions_required:
          event_type: "domain.{module_id}.submitted"
          target_kind: capability
          target_capability_id: "{module_id}-review-workflow"
        schema_fields_required:
          - review_status
          - review_feedback

      - id: ai_analysis_pack
        covers: >
          Automatic background enrichment triggered when records are created or updated.
          The module emits a creation event; the AI workflow analyzes the record and
          calls store_analysis_result back into the module. No user-initiated launch.
        module_actions_required:
          - "store_analysis_result — accepts analysis_result object, writes to record"
        events_required:
          - "domain.{module_id}.created"
        reactions_required:
          event_type: "domain.{module_id}.created"
          target_kind: capability
          target_capability_id: "{module_id}-analysis-workflow"
        schema_fields_required:
          - "analysis_result (subdocument)"

      - id: ai_extraction_pack
        covers: >
          Parallel batch processing of document sets or collections. The module emits
          a batch_submitted event; the AI workflow fans out parallel extraction workers
          and calls store_extraction_results back into the module.
        module_actions_required:
          - "process_batch — accepts batch_id, emits domain.{module_id}.batch_submitted"
          - "store_extraction_results — accepts batch_id and results array"
        events_required:
          - "domain.{module_id}.batch_submitted"
        reactions_required:
          event_type: "domain.{module_id}.batch_submitted"
          target_kind: capability
          target_capability_id: "{module_id}-extraction-workflow"
        schema_fields_required:
          - "extraction_results (array field on item schema)"

  monetization:
    description: >
      Revenue and payment capabilities. "Monetized" is only an intent signal;
      it is not itself a build route. Resolve monetized apps into a declared
      revenue_model before choosing files, modules, or provider packs. Domain
      catalogs may suggest likely models, but AppPlanAgent must make the model
      explicit in AppBuildPlan and explain it from concept/design context.

      Subscription contracts are required only when the app sells recurring
      access, gated features, seats, quotas, credits, or token allowances. Apps
      that only sell products, collect one-time payments, process marketplace
      orders, accept tips, sell ads, or run sponsored placement flows should use
      the relevant commerce/operator route and must not create
      config/subscriptions.yaml unless they also sell app access tiers or quotas.
    entries:
      - revenue_model: free
        capability_pack: none
        capability_kind: none
        subscription_contract: not_required
        build_tasks_required: []
        notes: >
          No payment, plan, checkout, wallet, entitlement, or paid placement
          surface is required. Do not generate config/subscriptions.yaml.

      - revenue_model: subscriptions
        capability_pack: saas_subscriptions
        capability_kind: operator_pack
        subscription_contract: required
        use_when: >
          The app sells recurring access, per-seat plans, team tiers, premium
          features, paid reports, account-level quotas, AI credits, or token
          allowances.
        build_tasks_required:
          - module_id: billing
            archetype: billing
            surface_kind: module
            notes: >
              Plan-gated actions, subscription lifecycle, portal session creation.
              entitlement_gate on every plan-gated action declaration is mandatory.
              get_plans public_readonly action is required — it reads config/subscriptions.yaml
              and is the canonical data source for the /pricing page.
          - surface_kind: page
            page_type: pricing
            route: /pricing
            notes: >
              Plan comparison and upgrade CTA page. Public-facing (no auth required).
              Populate plan data by calling billing.get_plans (reads config/subscriptions.yaml
              via load_subscriptions_config). Never hardcode plan data in the page schema —
              always derive from the subscriptions config so adding a plan tier is a config
              change only.
              When config/subscriptions.yaml declares pricing_catalog.groups, render those
              groups as compact service tabs/selectors and show only the plans or add-ons
              relevant to the selected group. Do not create separate subscription files for
              each tab; pricing_catalog is display metadata over the canonical contract.
        event_flows_required:
          - event: hosted.billing.subscription.activated
            reaction: sync token allowances and entitlements
          - event: hosted.billing.subscription.cancelled
            reaction: revoke gated capabilities
        operator_pack_note: >
          When the hosted platform's hosted_billing pack is available in capability_packs,
          use it for plan assignment, checkout session creation, and subscription lifecycle.
          Still generate a thin billing module that includes: (1) get_plans reading
          config/subscriptions.yaml for the pricing page; (2) a checkout facade that
          delegates to hosted_billing.create_checkout_session. Do not regenerate webhook
          handlers, invoice logic, or portal session management — hosted_billing owns those.
          The generated app owns: entitlement_gate declarations on plan-gated actions,
          the get_plans action, and the /pricing page.

      - revenue_model: usage_based
        capability_pack: usage_metering
        capability_kind: operator_pack
        subscription_contract: conditional
        aliases:
          - pay_per_use
        use_when: >
          The app charges by meter, credit, AI token, API call, export, render,
          job, or other usage unit. Use config/subscriptions.yaml only when the
          app also grants plan allowances, token wallets, or prepaid quotas.
        build_tasks_required:
          - module_id: usage
            archetype: billing
            surface_kind: module
            notes: >
              Usage meter declarations and app-owned facades for metered
              actions. token_wallet allowances belong in config/subscriptions.yaml
              only when SubscriptionContractDesigner emits contract_required=true.
        operator_pack_note: >
          When the hosted platform's token_wallet pack is available, reference it
          as the metering primitive. The generated app declares meter_id on usage
          actions; the platform tracks running totals.

      - revenue_model: transactional
        capability_pack: commerce
        capability_kind: operator_pack
        subscription_contract: not_required
        aliases:
          - one_time_purchase
        use_when: >
          The app sells products, bookings, downloads, services, events,
          invoices, or other one-time purchases. Product/order/cart state belongs
          to the app's commerce module; payment provider mechanics stay in the
          selected checkout pack.
        build_tasks_required:
          - module_id: commerce
            archetype: billing
            surface_kind: module
            notes: >
              Product catalog, cart/order lifecycle, inventory when relevant,
              and a start_checkout facade. checkout.session.completed or the
              host checkout callback marks purchase fulfillment.
          - surface_kind: page
            page_type: checkout_success
            route: /checkout/success
            notes: Post-purchase confirmation page.
        operator_pack_note: >
          When mozaikspay or another checkout pack is available in
          capability_packs, generate only the app-specific commerce facade:
          product/order/cart state → create_checkout_session → success page.
          Never regenerate Stripe internals or raw provider credential handling.

      - revenue_model: marketplace
        capability_pack: marketplace
        capability_kind: operator_or_custom_owned
        subscription_contract: conditional
        use_when: >
          The app connects buyers and sellers, creators and customers, service
          providers and clients, or other multi-party transactions with
          commissions, seller onboarding, escrow-like holds, payouts, disputes,
          or platform fees.
        build_tasks_required:
          - module_id: marketplace
            archetype: billing
            surface_kind: module
            notes: >
              Listing discovery, seller profile boundaries, order/offer records,
              platform fee metadata, payout state, and provider-neutral payment
              facades. If no marketplace operator pack exists, route as
              custom_owned with declared interfaces only.
        operator_pack_note: >
          Use config/subscriptions.yaml only when sellers or buyers also buy
          access tiers, listing quotas, premium tools, or AI credits. Do not use
          subscriptions.yaml to model individual order ownership, payouts,
          commissions, or settlement.

      - revenue_model: sponsored
        capability_pack: sponsored_placements
        capability_kind: operator_or_custom_owned
        subscription_contract: not_required
        aliases:
          - advertising
          - paid_placement
        use_when: >
          The app sells sponsored listings, promoted content, ad slots, boosted
          placement, campaign budgets, creator promotions, or marketing packages.
        build_tasks_required:
          - module_id: placements
            archetype: billing
            surface_kind: module
            notes: >
              Placement inventory, campaign windows, budget/intake records,
              review status, and performance readouts. Provider-specific ad
              networks and settlement stay in app-owned/operator adapters.
        operator_pack_note: >
          Sponsored placement is not a generic subscription contract. Add
          subscriptions only if the app also sells recurring platform access or
          placement-plan tiers.

      - revenue_model: donations
        capability_pack: donations
        capability_kind: operator_or_custom_owned
        subscription_contract: conditional
        use_when: >
          The app accepts tips, donations, patron support, pledges, or optional
          contributions without a mandatory purchase or product fulfillment.
        build_tasks_required:
          - module_id: contributions
            archetype: billing
            surface_kind: module
            notes: >
              Contribution intent records, supporter-visible receipts/status,
              and checkout facade. Recurring memberships may additionally route
              to subscriptions.

      - revenue_model: community_funded
        capability_pack: investor_marketplace
        capability_kind: operator_pack
        subscription_contract: conditional
        use_when: >
          The app has campaign-style funding windows, community backing,
          milestone-based commitments, creator/founder campaigns, or other
          contribution pools whose business meaning is not normal product
          checkout. This is usually host/app-specific policy, not a generic OSS
          subscription primitive.
        build_tasks_required:
          - module_id: campaign
            archetype: workflow
            surface_kind: module
            notes: >
              Campaign listing, contribution tracking, goal progress.
              Investor interest expressions backed by investor_marketplace.
          - surface_kind: page
            page_type: gallery
            route: /campaigns
            notes: Campaign discovery and contribution page.
        operator_pack_note: >
          When investor_marketplace is available in capability_packs, the
          generated app wires campaign events to the marketplace listing flow.
          Campaign backing, campaign returns, investment-like terms, settlement,
          and regulatory policy are not OSS first-class primitives. Use
          app-owned/operator modules. Add config/subscriptions.yaml only when
          the same app also sells recurring access, quotas, seats, or credits.

      - revenue_model: hybrid
        capability_pack: mixed
        capability_kind: composite
        subscription_contract: conditional
        use_when: >
          The app combines multiple revenue models, such as SaaS access plus
          ecommerce, marketplace fees plus seller subscriptions, or usage credits
          plus sponsored placements.
        build_tasks_required:
          - surface_kind: control_plane
            notes: >
              Split each money flow into its own capability route. Generate one
              config/subscriptions.yaml only for the access/quota/credit portion;
              keep transaction/order/payout/campaign records in their owning
              modules.

    rule: >
      For any app with monetization_enabled=true or builder_options.monetization.enabled=true:
        1. Treat monetized as "revenue model unresolved" until AppPlanAgent sets
           AppBuildPlan.revenue_model to a concrete value from this taxonomy.
        2. Declare the corresponding capability_pack in AppBuildPlan.capability_packs.
        3. Include the required build_tasks in AppBuildPlan.build_tasks.
        4. Set revenue_model in AppBuildPlan so downstream agents enforce contracts.
        5. Set or preserve subscription_contract.contract_required independently:
           true only for subscriptions, plan gates, seats, quotas, credits, token
           allowances, or usage budgets that need the OSS subscription runtime.
        6. If the operator pack is not available in context capability_packs,
           declare the billing/commerce/marketplace module as custom_owned with
           the same interface contract instead of inventing provider internals.
      Never generate Stripe, payment provider internals, or raw payment credentials
      as module business logic. Payment provider mechanics belong in operator packs
      or app/services/adapters/payments/ (hosted product only).

  custom_owned:
    description: >
      Advanced, custom, or bring-your-own capabilities the user owns entirely.
      Includes custom agentic frameworks, bespoke integration engines, custom
      runtime extensions, or any system whose internals the user controls.
    rule: >
      For custom or advanced capabilities:
        1. Generate module.yaml with declared action interfaces — the API boundary
           the platform routes into the custom system
        2. Generate runtime_extensions.yaml startup_service or api_router entry
           points when the custom system needs host-level hooks
        3. Generate empty backend stubs with clear interface contracts
        4. DO NOT implement the custom logic — the user owns the implementation
      This gives the platform a well-defined integration surface while leaving
      the custom system's internals entirely user-controlled.
    examples:
      - Custom agentic framework → module.yaml action interfaces + startup_service stub
      - Custom ML inference engine → module.yaml actions + api_router webhook stub
      - Custom real-time data feed → startup_service stub + module action for reads
      - Proprietary business engine → module.yaml action declarations only

