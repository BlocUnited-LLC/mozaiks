version: 1

description: >
  Advisory file contract catalog for AppGenerator. Declares task ownership
  boundaries, canonical output families, and hard constraints for each task type.

  Language-agnostic by design. File path templates under downstream_backend_defaults
  and optional_frontend_stubs use the active dev pack's language profile for their
  actual extension and path conventions. The webapp_builder dev pack
  (build_context/webapp_builder/language_profile.yaml) is the authoritative source
  for Python/FastAPI/MongoDB/React path conventions. A different dev pack would
  declare different conventions without changing this file.

  Runtime truth remains the structured outputs, build_tasks, owned_paths, and
  runtime loaders — not this catalog.

task_contracts:
  page_bundle:
    owner_agent: AppSchemaAgent
    summary: Declarative persistent app UI bundle owned by AppSchemaAgent.
    required_outputs:
      - app.json
      - ui/pages/*.yaml
    optional_outputs:
      - provenance.yaml
      - ui/route_manifest.json
      - ui/pages/custom/*.jsx
      - ui/index.js
      - ui/lib/moduleApi.js
      - brand/theme_config.json
      - dashboard/dashboard.yaml
      - config/shell.json
      - config/asset_manifest.json
    hard_constraints:
      - Persistent app pages stay declarative by default.
      - provenance.yaml is app-root metadata emitted by the scaffold/generator path. It records creation/refinement/validation lineage and declared contract refs; it must not contain secrets, absolute local paths, or provider execution state.
      - "Workflow launches from pages use action_type: workflow."
      - Prefer compact config/shell.json shortcuts for common shell chrome instead of repeating full header/profile/mobile/footer arrays.
      - Shell shortcuts may target header, profile, mobile, and footer slots using primitive ids such as home, apps, workspace, wallet, create, profile, messages, notifications, signout, signin, legal, terms, cookies, and privacy. Use dashboard only when the app declares a route/page with id dashboard; it is not a built-in shortcut. Do NOT include admin_portal in any shortcuts list — it is framework-injected automatically for admin users and must not be declared by app config or generated output.
      - Do not put profile-owned social surfaces such as friends, direct messages, user posts, or activity feed into config/shell.json shortcuts or generated global nav by default. They belong in contracts/profile.yaml tabs unless the product explicitly asks for a separate app-wide discovery route.
      - Prefer route-level AppPageSchema.navigation for page-owned global/local/profile/footer nav contributions; keep config/shell.json focused on app-wide navigation policy and built-in chrome shortcuts.
      - Workspace/App Dashboard portal structure belongs in dashboard/dashboard.yaml, not in config/shell.json, ui/route_manifest.json, admin/admin_registry.yaml, or workflows/extended_orchestration/extension_registry.json.
      - Dashboard manifests may reference workflow_sequence actions, but those sequences must already exist in workflows/extended_orchestration/extension_registry.json.
      - Use config/shell.json navigation.policy for placement rules such as desktop global=header, desktop local=sidebar, mobile global=bottomBar, mobile local=sheet, and mobile footer=hidden.
      - Put route chrome intent on AppPageSchema.shell_mode; use config/shell.json chrome only for app-wide mode-policy overrides.
      - Use shell_mode=conversation for DM/chat/thread routes, workspace for dense module/profile/admin-like work surfaces, focused for setup/review flows, immersive for full-viewport experiences, public for public/legal routes, and standard for ordinary pages.
      - Use explicit shell arrays only when labels, icons, role gates, or custom paths differ from the shortcut catalog.
      - Durable page mutations bind through declared api_endpoint values or canonical module actions.
      - Do not emit raw frontend source outside the bounded custom route bundle.
      - Pages that require reading URL query params on mount, polling an endpoint until state changes, or rendering conditional sections based on API response value must use custom_route_bundle; they cannot be expressed as declarative AppPageSchema.
      - A post-redirect confirmation page must not display confirmed/success state from the redirect URL alone. Confirmation must come from querying an app-owned module action after the backend has processed the event.
      - The api_endpoint field on a page section is a POST path only — no query strings, fragments, or dynamic path segments. Page-level filters, pagination limits, and record identifiers must go in payload or the module action input schema.
      - Custom route JSX must call module actions through moduleAction() imported from ui/lib/moduleApi.js. This file is always present in the generated bundle. Do not write raw fetch() calls to /api/modules/** directly in page components.
      - Custom route error handling must use err.error_code (and err.code) from the caught error object to branch on backend states. The generated moduleApi.js preserves structured error fields on thrown errors. Do not parse raw response text or HTTP status codes to infer error state.
      - Custom routes that launch LLM-backed or token-metered actions/workflows must detect INSUFFICIENT_TOKENS with isInsufficientTokensError(err), navigate to insufficientTokensRecoveryPath(err), and return without retrying automatically.
      - Custom routes that call entitlement-gated module actions must detect ENTITLEMENT_REQUIRED with isEntitlementRequiredError(err), navigate to entitlementUpgradePath(err), and return without retrying automatically. Both helpers are exported from ui/lib/moduleApi.js.

  subscription_config:
    owner_agent: ConfigMiddlewareAgent
    summary: >
      Provider-neutral generated-app SaaS subscription/token contract. Present
      only when SubscriptionContractDesigner emits contract_required=true.
    required_outputs:
      - config/subscriptions.yaml
    optional_outputs: []
    hard_constraints:
      - Generate config/subscriptions.yaml only from SubscriptionContractDesigner subscription_config_file.
      - Schema version must be mozaiks.subscriptions.v1.
      - Do not emit modules/{pack_name}/contracts/subscriptions.yaml or any module-local subscriptions.yaml.
      - Do not emit hosted billing admin actions, payment-provider products, price ids, invoices, checkout internals, or settlement logic in this file.
        - token_wallets live at the config root and are provider-neutral.
        - token_wallets[].depleted_balance declares safe app-local recovery routes for INSUFFICIENT_TOKENS; routes must not be external provider URLs.
        - top_up_products live at the config root and declare provider-neutral app-owned token packs by product_id, wallet_id, token_amount, and price.amount_cents/currency only.
        - token_allowances live under plans[] and every wallet_id must reference a declared token_wallet.
        - assignment_store declares where active app-owned subscription assignments are read by ConfiguredEntitlementAdapter.
        - Optional usage_charge_policies live at the config root and describe app-level customer charge estimates only; they may use runtime_llm_usage, provider_cost_usd markup, or a fixed token unit price.
        - Optional pricing_catalog groups are display metadata for public pricing tabs/service selectors only. They may group declared plan_ids and app/provider-owned add_on_ids, but they must not grant capabilities or carry payment-provider price IDs.
      - Use pricing_catalog when an app sells multiple service lines on one pricing surface, such as platform access, token packs, hosting, domains, marketing, or support.
      - Generated module actions that require paid access must declare actions[].entitlement_gate with a capability_id granted by at least one plan.
      - Monetized AI/token apps must expose billing/top-up/usage pages through an app-owned billing_portal facade module; pages must not call hosted or provider internals directly.
      - Token wallets and token_allowances are only for apps selling AI usage, credits, quotas, token packs, or usage-charge estimates; access-only SaaS plans must omit those fields.
      - Runtime token usage measurement and token wallet accounting are OSS runtime primitives; generated apps must not create duplicate usage or balance ledgers.


  module_contract:
    owner_agent: ConfigMiddlewareAgent
    summary: Canonical module contract bundle that declares module behavior before Python or JS implementation.
    required_outputs:
      - modules/{pack_name}/module.yaml
    optional_outputs:
      - modules/{pack_name}/contracts/events.yaml
      - modules/{pack_name}/contracts/reactions.yaml
      - modules/{pack_name}/contracts/notifications.yaml
      - modules/{pack_name}/contracts/policy_hooks.yaml
      - modules/{pack_name}/contracts/settings.yaml
      - modules/{pack_name}/contracts/admin.yaml
      - modules/{pack_name}/contracts/profile.yaml
      - modules/{pack_name}/contracts/relationships.yaml
      - modules/{pack_name}/runtime_extensions.yaml
    downstream_backend_defaults:
      - backend/handler.py
      - backend/service.py
      - backend/repo.py
      - backend/policy.py
      - backend/schemas.py
    optional_backend_hooks:
      - backend/settings.py
      - backend/notifications.py
      - backend/admin.py
    optional_frontend_stubs:
      - ui/admin/*.jsx
      - ui/index.js
    hard_constraints:
      - module.yaml is always required.
      - module_contract owned_paths are YAML/declarative contract files only - module.yaml, contracts/*.yaml, and optional runtime_extensions.yaml. Do not include backend/*.py in module_contract tasks; use data_models for backend/schemas.py and business_services for handler.py/service.py/repo.py/policy.py.
      - Emit only files declared by owned_paths or explicit file_manifest.
      - Omit YAML files that would serialize to empty arrays or null objects.
      - YAML declares the contract; downstream agents implement Python and JS stubs.
      - actions[].api_surface is part of the module contract. Use public or public_readonly only for anonymous-safe HTTP actions. Omit it or use internal/admin_internal for actions that require an authenticated token when AUTH_ENABLED=true.
      - Public/public_readonly actions are only anonymous entrypoints; they still dispatch with an enforce-mode authority carrying a concrete (possibly empty) permission set and still run actions[].permissions and actions[].entitlement_gate checks.
      - External HTTP dispatch and internal runtime dispatch are separate paths. Internal event reactions may use api_surface=internal and permissions=[] because the event bus is the authorization boundary; do not mark internal reaction handlers public.
      - contracts/reactions.yaml target.kind may be handler, capability, notification, or service_adapter. service_adapter targets must declare target.adapter and target.adapter_method, point only to app-owned services/adapters/* support code, and must not be used to bypass facade modules, module state ownership, or managed-provider boundaries.
      - JS stubs are allowed only for declared customization surfaces.
      - Emit contracts/profile.yaml only when a module has user-scoped data worth surfacing on the profile page (e.g. account summary, notification preferences, usage stats). Do not emit profile.yaml for every module.
      - profile.yaml tabs are the default for first-class social/profile sections such as friends, messages, user posts, and activity feed. Do not generate standalone /friends, /messages, /posts, or /feed routes or shell shortcuts for those surfaces by default.
      - profile.yaml panels and tabs must bind to module actions declared in module.yaml. Actions that need the viewed profile subject must declare an optional user_id input; viewer-scoped actions should use ctx.user_id instead. Do not expose admin-only actions or secrets through profile composition.
      - Do not emit profile.yaml with kind=form — that kind is reserved and not yet implemented.
      - profile.yaml does not replace /api/me identity. Auth identity and core account data remain platform-owned.
      - Emit contracts/relationships.yaml only when a module can enumerate current-user relationships to its own resources for generic My Apps, Portfolio, or My Resources surfaces.
      - relationships.yaml providers must bind to module actions declared in module.yaml. Provider actions must return normalized relationship rows with resource_type, resource_id, relationship_type, primary_route, capabilities, status, and metadata as needed.
      - Do not encode app-specific monetization, payment-provider, ownership-rights, or hosted-product policy in relationships.yaml. Keep it to generic resource relationship discovery.
      - When an app needs durable user classes, team membership, project collaborators, moderators, participants, invite flows, or resource-scoped route access, emit a membership-style module instead of storing app classes only in auth claims, app.json admins, frontend route metadata, or unrelated resource records.
      - Membership-style modules own resource-scoped class assignment records. Records should include user_id, resource_type, resource_id, class_id or role, status, created_by, created_at, and updated_at, plus tenant_id/workspace_id when the app uses those scopes.
      - Membership-style module policy must resolve authority from ctx.user_id, ctx.tenant_id, ctx.workspace_id, ctx.permissions, and module-owned records. Do not trust request body user_id, tenant_id, workspace_id, class, role, or permission fields for authorization.
      - When membership-style modules need configurable class labels, categories, or default vote/allocation weights, emit those defaults in contracts/settings.yaml. Do not hardcode class defaults in generated Python constants; active membership/policy records still grant rights.
      - Scoped private routes whose visibility depends on membership, ownership, invitation state, tenant/workspace scope, or resource access must declare meta.routeAuth pointing to an app-owned authorize_*_route module action. The action returns a minimal allowed/status/capabilities summary and must not return raw records, secrets, payment provider fields, or ledger data.
      - Emit contracts/policy_hooks.yaml only when another module, route guard, admin panel, or app-owned process needs to ask this module a generic policy question such as access, classification, or deterministic decision input. Hook providers must point to declared module actions and return allowlisted result shapes.
      - If class assignments affect vote weights, approval quorum, judging weight, or app-owned allocation logic, expose an app-owned policy hook or evaluator action from the membership/policy module. The consuming feature module owns any decision record, freeze semantics, or frozen process record it requires. Do not make snapshots a generic membership-module product feature.
      - Do not encode MozaiksPay, wallet, payout, hosted billing, managed hosting, growth campaign returns, investor marketplace policy, ownership-right claims, or hosted product revenue-share rules in generated membership modules. Those are hosted-product or app-specific economics concerns, not OSS user-class primitives.
      - Emit contracts/notifications.yaml only when one or more declared module events should create user-facing notifications. Notification rules are deterministic event-to-intent mappings consumed by the OSS runtime; generated apps must not create a standalone notifications module, notification persistence repo, or notification websocket worker for ordinary in-app alerts.
      - Notification rules must use schema_version mozaiks.notifications.v1, stable notification ids, event_type values declared in contracts/events.yaml or canonical domain/platform/hosted/mozaikspay namespaces, controlled channels from [in_app, email, push, sms], and explicit audience roles/permissions, audience.user_id_field for event-payload target users, or a declared module-local resolver hook.
      - Use channel in_app by default. Add email, push, or sms only when the app plan explicitly requires external delivery and the corresponding operator pack or app-owned provider adapter is available. Do not invent provider delivery internals in module business logic.
      - Use context_fields only for non-secret identifiers or display context needed by the notification center. Never include token, key, password, credential, payment provider, or idempotency fields.
      - Persistent modules express collection ownership through data_contract, not ad hoc database files.
      - backend/repo.py owns persistence operations and must not contain product policy.
      - backend/schemas.py owns typed DTO/document shapes and pure helpers.
      - backend/policy.py owns scope query helpers.
      - backend/policy.py should derive tenant/workspace/user resource filters from ctx.app_id, ctx.tenant_id, ctx.workspace_id, ctx.user_id, and ctx.permissions. Generated modules must not trust request-supplied tenant_id, workspace_id, or user_id params as authorization.
      - backend/repo.py may use ctx.persistence.collection(module_id, entity_name) for generated module persistence.
      - backend/repo.py must use module_id/entity_name values aligned with data_contract and data/contract.json.
      - Generated repo code must not use ctx.db.
      - Generated repo code must not import or call get_mongo_client().
      - Generated repo code must not hardcode database names.
      - Do not emit backend/models.py or backend/models/*.py.
      - Do not emit backend/database/schema.json or backend/database/seed.json.
      - Do not put DB access in backend/handler.py.
      - Do not put raw persistence logic in backend/service.py.
      - "list_* action output_schema must declare items.properties explicitly. A bare { type: array } with no items or item properties is invalid for list_* action outputs."
      - backend/service.py must not return raw repo records from list_* methods. Each record must be serialized through a _serialize_{entity}_row or _serialize_{entity}_record allowlist helper declared in backend/schemas.py. The allowlist ensures unknown future DB fields cannot leak into caller responses.

  persistence_contract:
    owner_agent: DatabaseAgent
    summary: Canonical generated app persistence intent and migration artifact family.
    required_outputs:
      - data/contract.json
    optional_outputs:
      - data/migrations/{migration_id}.json
    downstream_backend_defaults:
      - modules/{module_id}/backend/repo.py
      - modules/{module_id}/backend/policy.py
      - modules/{module_id}/backend/schemas.py
    hard_constraints:
      - data_contract is the canonical source of truth for durable generated app collections.
      - data/contract.json is the exported app artifact for that bundle.
      - data/migrations/{migration_id}.json is the exported additive migration artifact.
      - config/data.json is a removed path and must never appear in owned_paths, database_files, code_files, or generated bundle output.
      - config/data_migrations is a removed path and must never appear in owned_paths, database_files, code_files, or generated bundle output.
      - data/contract.json is opt-in only. Generate it only when the app plan explicitly needs a canonical app data contract, cross-module aggregate ownership, explicit authority records with stable collection names, explicit aliases, or an external existing database contract that ordinary generated-scoped persistence cannot represent.
      - Default generated apps must omit data/contract.json and use generated-scoped ctx.persistence.
      - Data contracts are generic app infrastructure, not hosted-product special cases. Do not emit ad hoc folders or host-internal helper names for normal generated apps.
      - app/data is declarative only. Do not emit Python helper files under data/ or services/data/.
      - Cross-surface collection access must be declared before module repo code uses it. Cross-module reads, lifecycle updates, shared aggregate ownership, and documented alias exclusions must be explicit in data/contract.json.
      - backend/schemas.py replaces backend model files.
      - backend/repo.py is derived from the data contract and owns persistence operations only.
      - backend/policy.py owns tenant/app/user scope query helpers.
      - Generated repo.py must use ctx.persistence.collection(module_id, entity_name) for generated module persistence.
      - Generated repo.py may use data aliases only when its module/action is explicitly declared in data/contract.json.
      - module_id/entity_name in repo.py must match data_contract surfaces and collections.
      - Generated repo.py must not use ctx.db.
      - Generated repo.py must not import or call get_mongo_client().
      - Generated repo.py must not hardcode database names.
      - backend/service.py calls repo.py and must not contain raw persistence logic.
      - backend/handler.py must not contain persistence logic.
      - Do not emit backend/models.py.
      - Do not emit backend/models/*.py.
      - Do not emit backend/database/schema.json.
      - Do not emit backend/database/seed.json.
      - Do not generate destructive migrations.

  service_foundation:
    owner_agent: ConfigMiddlewareAgent
    summary: App-level service support code for integrations, provider adapters, routes, and names-only secret policy. Paths are app-bundle-relative and assemble under physical app/services/ or app/security/.
    required_outputs: []
    optional_outputs:
      - services/config.py
      - services/integrations/*.py
      - services/routes/*.py
      - services/adapters/**/*.py
      - security/secrets.yaml
      - task-owned service support files
    hard_constraints:
      - Stay within current_build_task.owned_paths.
      - Emit integration glue or provider adapter support only.
      - Do not generate a standalone platform or alternate host.
      - App-owned support code belongs under app-bundle-relative services/integrations/ for external or hosted API clients, services/adapters/ for provider-specific implementation boundaries, and services/routes/ for app-level routes only when needed; physical generated workspaces place these under app/services/.
      - If app-owned runtime secrets are required, emit security/secrets.yaml as a names-only contract for provider/vault policy, env handles, and secret names. Never emit raw secret values.
      - Common services/adapters/ areas include auth, source_control, deployment, dns, registrar, cloud, storage, secrets, and payments when the generated app itself directly owns those provider mechanics rather than consuming a hosted platform capability.
      - Do not use service_foundation for Mozaiks-hosted deployment, DNS, domain, billing, payment processing, or platform operations. Hosted platform capabilities are consumed through hosted API clients/facade modules and host-owned records; provider adapters stay in the hosted product.
      - services/adapters/ and services/integrations/ must not own business actions, product lifecycle, user-facing actions, emitted domain events, or persistence authority. Modules own those behaviors.
      - Do not emit Dockerfile, docker-compose.yml, .env.example, .env.staging.example, .env.production.example, deployment.manifest.json, .github/workflows/*.yml, or other deployment packaging artifacts from service_foundation.
      - Deployment packaging artifacts are emitted only by the generate_and_download deployment contract renderer through DownloadRequest deployment_profile/include_* fields.
      - Generated deployment artifacts must follow the provider-neutral deployment contract, must never include real secrets or provider-tenant identifiers, and generated CI workflow secret references must stay names-only through ci_secret_requirements.

  refinement_harness:
    owner_agent: RefinementHarnessAgent
    summary: >
      Optional app-local declarative refinement harness. Use only when
      the app needs checkpoint/routing/refinement behavior beyond ordinary
      extension_registry.json transitions and workflow_sequences.
    required_outputs:
      - config/refinement_policy.yaml
      - refinement_harness/config/harness.yaml
    optional_outputs:
      - refinement_harness/config/tools.yaml
      - refinement_harness/config/policies.yaml
      - refinement_harness/prompts/*.yaml
    hard_constraints:
      - Generate this task only when the product explicitly needs a harnessed app lifecycle/refinement/session loop; most apps should omit it.
      - Do NOT generate module.yaml, handler.py, service.py, repo.py, backend/refinement_harness/*.py, or other module/runtime files.
      - Do NOT register this surface as a runtime module under app/modules/.
      - Stay within current_build_task.owned_paths.
      - config/refinement_policy.yaml is the app-local refinement policy seed. It must carry the shipped runtime contract and must not move ask/chat/workflows startup into harness.yaml.
      - Default app-local harnesses must extend mozaiks.default_refinement_harness with an empty overrides mapping instead of copying OSS tools, policies, checkpoints, routes, or prompt files.
      - Emit refinement_harness/config/tools.yaml, refinement_harness/config/policies.yaml, or refinement_harness/prompts/*.yaml only when the app has a real app-specific delta from the default harness.
      - harness.yaml routes declare workflow_sequence only; do not declare route_to, affected_workflows, affected_declarative_families, requires_replanning, requires_rebuild, or scope_summary.
      - Every workflow_sequence referenced by harness.yaml must exist in workflows/extended_orchestration/extension_registry.json and declare affected_declarative_families there.
      - Use shipped mozaiksai.control_plane implementations and tool entrypoints unless a future custom-harness Python contract is explicitly introduced.
      - Refinement harness artifacts coordinate app-level lifecycle, refinement, or session state only — no business domain logic.
      - Do not duplicate host-universal refinement engine behavior already provided by the platform.

  api_surface:
    owner_agent: ControllerAgent
    summary: Optional external API adapter lane. Default app behavior uses the platform module API.
    required_outputs: []
    optional_outputs:
      - modules/{pack_name}/backend/api.py
      - backend/admin_config.py
      - services/routes/admin.py
      - services/integrations/{pack_id}_client.py
    hard_constraints:
      - Default module access is /api/modules/{module_name}/{action_name}.
      - Page api_endpoint values must use /api/modules/{module_name}/{action_name} without query strings or fragments. Put pagination limits in page_size and filters in payload/input schemas.
      - Auth for /api/modules/** is platform-owned. Custom API adapters must not bypass module action auth, permissions, entitlement checks, or module_scope_resolver scope validation.
      - Emit bespoke REST adapters only when explicitly requested.
      - Delegate behavior to backend/handler.py instead of duplicating business logic.
      - Service admin config is a separate contract and must expose only GET /api/admin/config.
      - For managed-capability adapter tasks (owned_paths under services/integrations/), generate thin client wrappers only — no provider business logic, no proprietary provider internals in generated files.
      - Managed capability adapter clients must target the stable API contract supplied by the operator/provider boundary (e.g. POST {APP_BACKEND_URL}/api/modules/{module_id}/{action_id}). Do not embed host-specific secrets or provider credentials in generated files.
      - Pages must not bind directly to /api/modules/{managed_capability_id}/{action}. When managed-capability data must appear on a persistent page, AppGenerator generates an app-owned façade module (generated_module) whose service calls the managed capability adapter client. Pages bind to /api/modules/{facade_module_id}/{action} using the standard page→module convention.
      - Provider implementation adapters that are not managed-capability API clients belong in services/adapters/ through service_foundation, not under modules/ and not in services/integrations/.

backend_helper_files:
  description: >
    Rules for backend/{helper_name}.py files generated under app/modules/{module_id}/backend/.
    Helper files are explicit build outputs — they must be declared before generation.
    They are not a catch-all for logic that does not fit canonical layers.
    App-level support code under services/integrations/ or services/adapters/ is governed by
    task_contracts.service_foundation or task_contracts.api_surface, not by this module-local
    helper contract.

  canonical_layers:
    - backend/base_handler.py  # OSS-generated dispatch base — regenerated on upgrades, never edited
    - backend/handler.py       # workspace subclass — preserved on regen; add app extensions here
    - backend/service.py       # business logic and event publication
    - backend/repo.py          # persistence queries and writes
    - backend/policy.py        # authorization, ownership, transition checks
    - backend/schemas.py       # typed DTOs, enums, normalization helpers

  workspace_handler_split:
    description: >
      Pack templates that support workspace customization generate two handler files.
      base_handler.py contains the full OSS implementation and is always regenerated.
      handler.py is a thin subclass generated once and preserved. Workspaces declare
      extra params, param overrides, and extra actions in build_context/{pack_id}/extensions.yaml.
      See factory_app/build_context/AppGenerator/workspace_extensions_contract.yaml for the schema.
    base_handler_class_suffix: BaseHandler
    handler_class: "{ModuleId}Handler"
    handler_imports_from: ".base_handler"
    regeneration:
      base_handler.py: always overwrite
      handler.py: preserve (overwrite only with --force-handlers)

  helper_contract:
    canonical_location: backend/{helper_name}.py
    kind: helper
    generated_by: ServiceAgent
    required: false
    allowed_when:
      - external provider client wrapper for a declared integration
      - runtime_extensions.yaml api_router entrypoint implementation
      - runtime_extensions.yaml startup_service entrypoint implementation
      - module-local adapter or client wrapper for an external service
      - complex domain helper that would bloat service.py without creating a new canonical layer
      - integration helper tying two declared capabilities together at the module level
      - event subscriber startup logic when declared as a startup_service extension
      - module-local guard wrapper bridging a declared capability into this module's action layer
    prohibited_for:
      - generic business logic that belongs in service.py
      - persistence or database access that belongs in repo.py
      - authorization or scoping that belongs in policy.py
      - typed shapes or DTOs that belong in schemas.py
      - transport or WebSocket infrastructure (use runtime_extensions.yaml startup_service instead)
      - workflow or agent orchestration logic
      - arbitrary file splitting to break up long files
    rules:
      - must be declared in current_build_task.owned_paths or python_stubs before ServiceAgent generates it
      - must be imported by at least one canonical backend layer (handler.py, service.py) or referenced by runtime_extensions.yaml
      - must be module-local — no cross-module imports except to managed capability service interfaces
      - must not create new public module actions or bypass the handler dispatch contract
      - AppPlanAgent must declare it with a short rationale in the build task initial_message
      - ConfigMiddlewareAgent must add it to python_stubs before ServiceAgent runs
      - ServiceAgent must not invent helper files that do not appear in python_stubs

  runtime_extension_entrypoints:
    description: >
      When runtime_extensions.yaml is declared, each extension type requires an explicit backend file
      that must be declared in python_stubs. Entrypoints are module-local values such as
      backend.routes_hooks:get_router or backend.event_worker:MessageDeliveryWorker;
      never use modules.*, app.modules.*, or mozaiksai.* import paths.
    api_router:
      required_stub: backend/{router_file}.py
      factory_function: get_router
      note: Must be declared in python_stubs. ServiceAgent must not generate it unless declared.
    startup_service:
      required_stub: backend/{worker_file}.py
      service_class: "{ServiceClass}"
      note: Must be declared in python_stubs. ServiceAgent must not generate it unless declared.

  event_pipeline_conventions:
    description: >
      Additional contracts that apply when a module uses the event_pipeline archetype
      (multi-step pipeline driven by event reactions and background pollers).
    internal_action_contract:
      api_surface: internal
      permissions: "[]  # empty — event bus is the authorization boundary"
      emits: "must match events declared in this module's contracts/events.yaml"
      handler_method: "must be declared in reactions.yaml target.handler_method"
      idempotency: >
        The service layer must guard against duplicate activation. Check for an
        existing active record before inserting a new one and return
        {success: true, skipped: true} rather than an error on duplicates.
    poller_contract:
      location: backend/{poller_name}.py
      entrypoint_format: "backend.{poller_name}:{ServiceClass}"
      required_methods:
        - "start() -> None  # sync; creates asyncio task via loop.create_task"
        - "stop() -> None   # sync; cancels task"
      db_access: >
        Must use direct AsyncIOMotorClient(MONGO_URI) — NOT app_data_from_context.
        Startup services run outside any module request context.
      event_emission: >
        Must emit through the OSS runtime event dispatcher singleton, wrapped in
        try/except with a warning log on failure. Never let an emit failure crash
        the poller. Do not inline runtime import paths in prompt-time contracts.
      adapter_resolution: >
        Resolve provider adapters lazily inside _poll_once(). Return early when
        the adapter is not configured. Never crash the process on missing config.
    stub_adapter_contract:
      location: app/services/adapters/{area}/stub.py
      required: true
      activation: "env var e.g. SSL_ADAPTER=stub"
      purpose: >
        Enables the full pipeline to run locally and in CI with no external
        infrastructure. Must implement the same Protocol as the real adapter.
        May simulate lifecycle progression using in-process state.
    url_to_hostname_rule: >
      URL-shaped values (e.g. hosting_url containing https://...) must be parsed
      to extract the bare hostname before use in DNS records. Never write a URL
      as a CNAME target. Use urllib.parse.urlparse(url).hostname.

  account_data_handler:
    canonical_location: backend/account_data_handler.py
    kind: helper
    generated_by: ServiceAgent
    required: true_when_user_data_scope_is_set
    trigger: module.yaml declares module.user_data_scope=true
    implements_protocol: AccountDataHandler
    auto_registered_by: ModuleLoader at startup — no manual registration required
    required_methods:
      - "async delete_user_data(*, app_id: str, user_id: str) -> dict  # returns {deleted_count: int, ...}"
      - "async export_user_data(*, app_id: str, user_id: str) -> dict  # returns module-namespaced records"
    constructor_signature: "__init__(self, db: Any) -> None  # receives motor db from loader"
    hard_constraints:
      - Must be named AccountDataHandler (the loader discovers it by this name first).
      - Both methods must scope ALL queries through app_id AND user_id. Never delete or export records across tenants.
      - delete_user_data must be idempotent — calling it twice must not raise an error.
      - export_user_data must return an empty dict (not None or raise) when the user has no records.
      - For financial/ledger modules (transactional archetype), anonymise rather than delete user_id on ledger entries to preserve audit integrity. Document this in the method docstring.
      - "Return key names in export_user_data must be namespaced with the module_id to avoid collisions when the platform merges all module exports (e.g. {\"messages_threads\": [...], \"messages_dms\": [...]})."
      - Do not call service.py or handler.py from the handler — access the db directly for simplicity and to avoid ctx dependencies.
      - Do not import from other modules. The handler must be self-contained within its module's backend.
      - The ModuleLoader auto-registers this class; do not call account_data_registry.register() manually in the handler file.

  examples:
    - backend/provider_client.py   # external provider client wrapper
    - backend/routes_hooks.py       # api_router entrypoint — custom inbound route mounting
    - backend/event_worker.py      # startup_service entrypoint — background subscriber/worker
    - backend/notification_client.py # module-local wrapper over a notification capability
    - backend/audit_subscriber.py    # startup_service entrypoint for audit event handling
    - backend/verification_poller.py # startup_service — background DNS/state poller (event_pipeline)
    - backend/ssl_status_poller.py   # startup_service — background certificate poller (event_pipeline)
    - backend/account_data_handler.py # AccountDataHandler — GDPR delete + export for user-scoped modules

