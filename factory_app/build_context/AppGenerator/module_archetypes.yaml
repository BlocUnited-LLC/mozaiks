version: 1

description: >
  Advisory module archetypes used as prompt-time guidance for keeping module
  contracts and backend stubs consistent across domains.

  Language-agnostic by design. The backend_stub_defaults field lists canonical
  backend file names using path conventions. The active dev pack's language profile
  (e.g. build_context/webapp_builder/language_profile.yaml) is the authoritative
  source for actual file extensions and language-specific constraints. Archetypes
  define behavior conventions; the dev pack defines the implementation language.

  Archetypes do not change the canonical structured outputs. They guide selection
  of module.type and the behavior conventions that follow from it.

module_yaml_schema_notes:
  description: >
    module.yaml is validated by a strict Pydantic model (extra="forbid"). Only
    declared top-level keys are permitted: schema_version, module, permissions,
    actions, capabilities. Any other top-level key causes a validation error at
    startup.

  version_changelog_convention: >
    Do NOT add a top-level changelog: or history: field to module.yaml — those
    keys are not declared in ModuleDefinition and will cause an extra_forbidden
    validation error. Record version promotion notes as YAML block comments
    immediately before the schema_version line instead:

      # v1.0.0 (2026-07-01): Promoted to stable. Wired settlement reaction.
      schema_version: mozaiks.module.v1

    This preserves change history in a human-readable form without adding
    undeclared fields that break module loading.

  version_field: >
    Bump module.version (a semver string under the module: block) when
    promoting a module to stable or making a breaking contract change. The
    value is recorded in startup logs and is the canonical module version the
    runtime reports. Do not conflate the schema_version (always
    "mozaiks.module.v1") with the module identity version.

# Constraints enforced by ModuleLoader at startup for every archetype.
# Violations cause a hard ModuleLoadError before the app accepts traffic.
# List them here once rather than duplicating across every archetype block.
universal_hard_constraints:
  permission_consistency: >
    Every permission ID listed in action.permissions[] must be declared in the
    module-level permissions block. The loader validates this at startup and
    raises ModuleLoadError on any undeclared reference. Generate all permission
    IDs that actions reference — including special scopes such as access_as_user
    — as explicit entries in the top-level permissions block before referencing
    them in any action.
  notification_id_consistency: >
    Every reactions.yaml reaction with target.kind=notification must have a
    target.notification_id that matches an id declared in
    contracts/notifications.yaml. The loader validates this at startup and
    raises ModuleLoadError when notification_id is missing or undeclared, and
    also when a notification reaction exists but contracts/notifications.yaml
    does not. Generate contracts/notifications.yaml whenever any reaction
    dispatches to target.kind=notification.
  user_data_scope_file_required: >
    When module.yaml declares module.user_data_scope=true, the loader raises
    ModuleLoadError at startup if backend/account_data_handler.py is absent.
    Generate backend/account_data_handler.py implementing the AccountDataHandler
    protocol (delete_user_data + export_user_data) whenever user_data_scope=true
    is declared. Omit user_data_scope=true for modules that only reference
    user_id as a foreign key without owning the user's primary records.
  handler_method_required: >
    Every action.handler_method value declared in module.yaml must exist as a
    callable method on the handler class. The loader raises ModuleLoadError for
    any undeclared or renamed method. Generated handler classes must implement
    every method listed in module.yaml before the module can load.
  emits_events_declared: >
    Every event type listed in action.emits[] must be declared in
    contracts/events.yaml. The loader raises ModuleLoadError for any undeclared
    emit reference. backend/service.py must call ctx.emit() only for event types
    declared in module.yaml emits[] and contracts/events.yaml — orphaned
    ctx.emit() calls for events removed from the contract are not caught by the
    loader and must be covered by module drift-guard tests (see
    drift_guard_test_guidance below).

# Advisory test-scaffold guidance for AppGenerator. When generating a new
# module, scaffold tests/test_{module_id}_module_drift.py using these patterns
# so the app's CI suite catches module contract drift at test time — before
# the module is deployed or loaded by the runtime.
drift_guard_test_guidance:
  summary: >
    Drift-guard test file pattern for generated app modules. Scaffold once per
    module at generation time. Tests are intentionally lightweight — they load
    the module or inspect source, they do not mock business logic or run handler
    methods. The file should sit in the app-bundle tests/ directory alongside
    other module tests.
  patterns:
    handler_method_alignment:
      description: >
        Load the module via ModuleLoader and assert it succeeds. This triggers
        the handler_method reflection check at test time, catching any
        module.yaml/handler.py drift on every CI run rather than only at app
        startup.
      template: |
        def test_{module_id}_handler_methods_align_with_module_yaml(tmp_path):
            # Verify every module.yaml handler_method exists on the handler class.
            # ModuleLoader raises ModuleLoadError if any method is missing.
            loader = ModuleLoader(str(Path(__file__).resolve().parents[1] / "app"))
            loaded = loader.load("{module_id}")
            declared = {{a.handler_method for a in loaded.definition.actions}}
            handler_methods = {{m for m in dir(loaded.handler) if not m.startswith("_")}}
            assert declared <= handler_methods
    emits_service_alignment:
      description: >
        Use the OSS emit_drift utility to AST-scan backend/service.py for
        ctx.emit() calls with string-literal first arguments and assert each
        found event type is declared in the module's action.emits[] lists.
        Catches service.py calling ctx.emit() for events that were never
        declared or were removed from the contract — a gap ModuleLoader does
        not statically enforce. Only literal string arguments are checked;
        dynamic calls using variables are intentionally ignored (cannot be
        resolved statically). Import check_orphaned_emits from
        mozaiksai.core.runtime.app.emit_drift — available in any app that
        has the mozaiksai package installed.
      template: |
        from pathlib import Path
        from mozaiksai.core.runtime.app.emit_drift import check_orphaned_emits

        def test_{module_id}_service_emits_match_declared_events():
            module_dir = (
                Path(__file__).resolve().parents[1] / "app" / "modules" / "{module_id}"
            )
            orphans = check_orphaned_emits(module_dir)
            assert orphans == [], (
                f"backend/service.py calls ctx.emit() for undeclared events: "
                + ", ".join(f"{{e!r}} (line {{ln}})" for e, ln in orphans)
            )
    user_data_scope_handler_completeness:
      description: >
        When user_data_scope=true, assert backend/account_data_handler.py exists
        and that AccountDataHandler implements both required methods. The loader
        enforces file existence as a hard error; this test additionally catches
        accidental removal of methods from a previously correct implementation.
      template: |
        import inspect, yaml
        from pathlib import Path

        def test_{module_id}_account_data_handler_complete():
            app_root = Path(__file__).resolve().parents[1] / "app"
            module_dir = app_root / "modules" / "{module_id}"
            manifest = yaml.safe_load((module_dir / "module.yaml").read_text())
            if not manifest.get("module", {{}}).get("user_data_scope"):
                return  # not a user-data-scoped module

            handler_file = module_dir / "backend" / "account_data_handler.py"
            assert handler_file.exists(), "account_data_handler.py must exist when user_data_scope=true"

            import importlib.util
            spec = importlib.util.spec_from_file_location("adh", handler_file)
            mod = importlib.util.module_from_spec(spec)
            spec.loader.exec_module(mod)
            cls = getattr(mod, "AccountDataHandler", None)
            assert cls is not None, "AccountDataHandler class must be defined"
            assert callable(getattr(cls, "delete_user_data", None)), "delete_user_data must be implemented"
            assert callable(getattr(cls, "export_user_data", None)), "export_user_data must be implemented"

archetypes:
  standard:
    summary: Default deterministic module for CRUD and ordinary business logic.
    select_when:
      - The module owns standard business records and actions.
      - No real-time messaging semantics are required.
      - No ledger or named state-machine semantics are required.
    canonical_yaml_family:
      always:
        - module.yaml
      optional:
        - events.yaml
        - reactions.yaml
        - notifications.yaml
        - settings.yaml
        - admin.yaml
        - profile.yaml
        - policy_hooks.yaml
        - relationships.yaml
    backend_stub_defaults:
      - backend/handler.py
      - backend/service.py
      - backend/repo.py
      - backend/policy.py
      - backend/schemas.py
    hard_constraints:
      - Keep the handler layer thin — dispatch only, no business logic.
      - Put business logic in the service layer, persistence in the repo layer.
      - Publish only declared domain events.
      - Use public/public_readonly api_surface only for anonymous-safe read actions. Tenant, workspace, user, mutation, and admin actions require authenticated HTTP dispatch by default.
      - Build resource scope filters from ctx.app_id, ctx.tenant_id, ctx.workspace_id, ctx.user_id, and ctx.permissions in backend/policy.py rather than trusting request payload scope fields.
      - list_* service methods must serialize repo records through an allowlist helper defined in backend/schemas.py before returning. Never pass raw repo documents to callers. The allowlist returns only the fields declared in module.yaml output_schema items.properties; unknown or future DB fields are excluded by default.
      - If the module stores records that include user_id (i.e. it owns user-scoped data), set module.user_data_scope=true in module.yaml and generate backend/account_data_handler.py implementing the AccountDataHandler protocol (delete_user_data + export_user_data). The OSS loader auto-registers the handler at startup. Do not declare user_data_scope=true for modules that only reference user_id as a foreign key without owning the user's primary records (e.g. audit logs that reference but do not belong to the user).

  messaging:
    summary: Deterministic module for real-time or threaded communication.
    select_when:
      - The module owns threads, direct messages, announcements, or read state.
      - Delivery semantics and participant scoping are core behavior.
    canonical_yaml_family:
      always:
        - module.yaml
      optional:
        - events.yaml
        - reactions.yaml
        - notifications.yaml
        - settings.yaml
        - admin.yaml
        - profile.yaml
        - policy_hooks.yaml
        - relationships.yaml
    backend_stub_defaults:
      - backend/handler.py
      - backend/service.py
      - backend/repo.py
      - backend/policy.py
      - backend/schemas.py
    hard_constraints:
      - Message records carry thread_id and sender_id.
      - Thread records carry participants and per-member read state.
      - The repo layer provides read-state update helpers.
      - Event payloads include delivery metadata needed for real-time routing.
      - Do not emit channels.yaml; messaging metadata belongs in canonical contracts and backend policy helpers.
      - Messaging modules always own user-scoped data (message content, thread membership, read state). Set module.user_data_scope=true and generate backend/account_data_handler.py. delete_user_data must remove or anonymise the user's message content, DMs, and thread participation records. export_user_data must return all sent messages and thread membership.

  workflow:
    summary: Deterministic module that manages a named state machine.
    select_when:
      - The module owns state transitions, approvals, queues, or lifecycle stages.
      - Valid transitions and role-aware mutation rules are core behavior.
    canonical_yaml_family:
      always:
        - module.yaml
      optional:
        - events.yaml
        - reactions.yaml
        - notifications.yaml
        - settings.yaml
        - admin.yaml
        - profile.yaml
        - policy_hooks.yaml
        - relationships.yaml
    backend_stub_defaults:
      - backend/handler.py
      - backend/service.py
      - backend/repo.py
      - backend/policy.py
      - backend/schemas.py
    hard_constraints:
      - Managed documents carry a state field.
      - The policy layer exposes a validate_transition helper.
      - The service layer enforces transition validation before mutation.
      - Transition events include from_state and to_state when declared.
      - If the workflow module's managed documents are owned by a specific user (e.g. user-submitted requests, approvals initiated by a user), set module.user_data_scope=true and generate backend/account_data_handler.py. delete_user_data must delete or anonymise records where user_id matches the deleted user. export_user_data must return all user-initiated workflow records. Omit user_data_scope if the module owns only app-scoped or tenant-scoped state with no direct user_id ownership.

  membership:
    summary: >
      Deterministic module for resource-scoped user classes, memberships,
      invitations, collaborators, moderators, participants, and route access
      summaries. Use when an app needs durable app-local roles such as teacher,
      student, seller, buyer, project_owner, collaborator, reviewer, moderator,
      member, or viewer.
    select_when:
      - The app needs resource-scoped user classes, memberships, collaborators,
        participants, or invite/accept/remove flows.
      - Access to a route or record depends on a user's relationship to a
        specific resource, not only on global auth roles or token scopes.
      - My Apps, Portfolio, My Communities, or My Resources should list
        resources connected to the current user.
      - Vote weights, approval quorums, review authority, or other
        app-owned decision processes need deterministic class/policy inputs.
    canonical_yaml_family:
      always:
        - module.yaml
      optional:
        - contracts/events.yaml
        - contracts/reactions.yaml
        - contracts/notifications.yaml
        - contracts/policy_hooks.yaml
        - contracts/settings.yaml
        - contracts/admin.yaml
        - contracts/profile.yaml
        - contracts/relationships.yaml
    backend_stub_defaults:
      - backend/handler.py
      - backend/service.py
      - backend/repo.py
      - backend/policy.py
      - backend/schemas.py
      - backend/account_data_handler.py
    key_actions:
      - invite_member: >
          Create a pending invitation for a resource-scoped user class. The
          actor must be authorized through ctx.user_id, ctx.tenant_id,
          ctx.workspace_id, ctx.permissions, and existing module-owned
          membership records.
      - accept_invitation: >
          Accept the current user's pending invitation and create or activate
          a membership assignment. The service must ignore any request-body
          user_id that conflicts with ctx.user_id.
      - update_member_class: >
          Change a member's class or status for a scoped resource. Only
          authorized owners/admins/managers for that resource may call it.
      - list_members: >
          List members for an authorized resource using serialized allowlist
          rows. Never return raw membership records.
      - get_my_membership: >
          Return the current user's active membership summary for a resource.
      - authorize_resource_route: >
          Return a minimal route authorization summary with allowed,
          resource_type, resource_id, viewer_class, status, capabilities, and
          safe display metadata only.
      - list_user_relationships: >
          Return current-user resource relationship rows for
          contracts/relationships.yaml hydration.
      - evaluate_policy_hook: >
          Return an allowlisted deterministic policy result for app-owned
          access, classification, or decision-input requests declared in
          contracts/policy_hooks.yaml. The response must not expose raw
          membership records, secrets, payment data, or ledger rows.
    hard_constraints:
      - Auth identity and /api/me remain platform-owned. Do not create a
        replacement account/profile/user table to identify the signed-in user.
      - Durable app-specific classes are module-owned records scoped to
        resource_type/resource_id plus app/tenant/workspace context; they are
        not only JWT roles or frontend state.
      - backend/policy.py must derive access from ctx.user_id, ctx.tenant_id,
        ctx.workspace_id, ctx.permissions, and module-owned membership records.
        Do not trust request payload user_id, tenant_id, workspace_id, class,
        role, or permission fields as authorization truth.
      - Membership assignment records should include user_id, resource_type,
        resource_id, class_id or role, status, created_by, created_at, and
        updated_at. Include tenant_id/workspace_id when the app uses those
        scopes.
      - Set module.user_data_scope=true when the module owns membership or
        invitation records for users, and generate backend/account_data_handler.py.
        Delete/export behavior must be tenant/app scoped and documented.
      - Use contracts/relationships.yaml when the module can enumerate
        current-user resources. Provider actions must return normalized
        relationship rows only; relationship rows are routing inventory and
        never grant rights by themselves.
      - Private scoped routes must use meta.routeAuth pointing to an
        app-owned authorize_*_route action. Do not rely on frontend-only
        checks or global shell role strings for resource-scoped access.
      - contracts/profile.yaml is optional and only for personal account
        panels backed by user-scoped module data. It does not replace /api/me
        identity or resource administration surfaces.
      - Use contracts/policy_hooks.yaml only when another module, route guard,
        admin panel, or app-owned process needs to ask this module a generic
        policy question. Hook actions return allowlisted eligibility,
        class/relationship, capability, or decision-input values; consuming
        modules own any decision records or freeze semantics they require.
      - If the app needs configurable class labels, categories, or default
        voting/allocation weights, put that class catalog in
        contracts/settings.yaml. Do not hardcode class defaults in generated
        Python constants; active membership/policy records still grant rights.
      - This archetype is host-agnostic. Do not include MozaiksPay, wallet,
        payout, hosted billing, managed hosting, growth campaign returns,
        investor marketplace policy, ownership-right claims, or hosted product
        revenue-share logic in generated membership modules.

  event_pipeline:
    summary: >
      Deterministic module that drives an automated multi-step pipeline through
      event reactions and background polling. Use when a customer action starts a
      chain that spans multiple modules (e.g. domain verification → DNS → SSL → live),
      each step triggered automatically by the previous step's event rather than by
      human operators or manual action calls.
    select_when:
      - The module owns a multi-step lifecycle where each step emits an event that
        triggers the next step in a different module.
      - Background polling is needed to detect external state changes (DNS propagation,
        certificate issuance, payment confirmation) and advance the pipeline.
      - Steps must be idempotent and the pipeline must degrade gracefully when
        provider adapters are not configured.
    canonical_yaml_family:
      always:
        - module.yaml
        - contracts/events.yaml
        - contracts/reactions.yaml
      optional:
        - runtime_extensions.yaml   # startup_service for background poller
        - notifications.yaml
        - settings.yaml
    backend_stub_defaults:
      - backend/handler.py
      - backend/service.py
      - backend/repo.py
      - backend/policy.py
      - backend/schemas.py
      - backend/{poller_name}.py   # startup_service entrypoint for background polling
    hard_constraints:
      - Each pipeline step is an internal module action with api_surface=internal and permissions=[].
        The event bus is the authorization boundary; no user permission is required.
      - Internal actions must be idempotent — the service layer guards against duplicate
        activation requests, double-provisioning, and repeated state transitions.
      - reactions.yaml wires each cross-module event to a handler_method; never call
        a foreign module's service directly from business logic.
      - Background pollers use direct motor connection (AsyncIOMotorClient) because they
        run outside any module request context and cannot use app_data_from_context.
        Event emission uses the OSS dispatcher singleton (get_event_dispatcher().emit).
      - Provider adapters are resolved lazily and return None when not configured.
        The poller and service must return early gracefully rather than crashing.
      - A stub adapter must accompany every real provider adapter so the pipeline
        can run locally and in CI without external infrastructure.
      - URL-shaped values (e.g. hosting_url) must be parsed to extract the hostname
        before use in DNS records. Never write a URL as a CNAME target.
      - emits declarations in module.yaml must match events declared in contracts/events.yaml.
        Cross-module events subscribed to in reactions.yaml are declared by the producing module.

  state_machine:
    summary: >
      Deterministic module that owns records with a named status field driven
      by time-based transitions (e.g. pending → active → expired) or explicit
      operator/system triggers. Use when records progress through a lifecycle
      that includes at least one timestamp-gated automatic transition and
      requires an audit trail of every status change.
    select_when:
      - The module owns records with a status field that advances based on
        publish_at, expire_at, end_at, activate_at, or similar timestamps.
      - Status transitions must happen automatically without human operator action.
      - Records require an audit trail of every status change and who/what triggered it.
      - The transition logic is too heavy or operationally distinct to run
        inline in a request handler or as a startup_service background task.
    canonical_yaml_family:
      always:
        - module.yaml
        - contracts/events.yaml
      optional:
        - contracts/reactions.yaml
        - contracts/notifications.yaml
        - contracts/admin.yaml
        - contracts/settings.yaml
    backend_stub_defaults:
      - backend/handler.py
      - backend/service.py
      - backend/repo.py
      - backend/schemas.py
    hard_constraints:
      - >
        Expose a run_<entity>_lifecycle_tick(ctx) method on the service layer.
        This is the canonical tick: it scans for records with pending
        timestamp-gated transitions, advances their status, emits a
        domain event per transition, and returns a summary dict with
        { published_count, expired_count, errors } or equivalent keys.
        The method must be idempotent and safe to call frequently.
      - >
        Declare the tick as an internal module action (api_surface: internal,
        permissions: []) in module.yaml so operators can trigger it manually
        and tests can exercise it without a scheduler. Name it
        run_<entity>_lifecycle_tick consistently.
      - >
        Every status transition must emit a named domain event
        (e.g. domain.<module>.status_changed) and record an audit entry with
        the previous status, new status, timestamp, and trigger source.
      - >
        The repo layer must expose indexed query methods named
        find_pending_<transition>(now) that filter by status and timestamp
        field (e.g. publish_at <= now). Index both fields; never do a
        collection scan inside the tick.
      - >
        Choose the right tick delivery mechanism based on scale and isolation
        needs:

        startup_service (runtime_extensions.yaml): run inside the web server
        process as an asyncio background task. Suitable for lightweight expiry
        sweeps on small collections where sub-minute precision is not required,
        where a failed sweep can be retried on the next interval, and where
        running inside the server process is acceptable.

        external cron script (scripts/cron_<entity>_lifecycle.py): run as a
        separate process or container job outside the web server. Use this
        when the tick is operationally distinct (needs its own resource limits,
        must survive a web server restart, or must be independently observable
        in logs and metrics), when the collection is large enough that a slow
        tick could block the event loop, or when the deploy target supports
        scheduled jobs (azure_container_apps, fly with cron, GitHub Actions
        schedule). For azure_container_apps, the InfraScaffoldAgent should
        emit a Microsoft.App/jobs resource alongside the Container App.
      - >
        External cron entry points must use the _MinimalCtx pattern:
        a lightweight context stub with an async emit() method that captures
        emitted events without dispatching them to the live event bus.
        The script connects via get_mongo_client(), calls the service tick,
        and exits with a non-zero code on errors.
        Required env vars must be documented in the script module docstring.
      - >
        Do not call the tick from a user-facing request handler. The tick is
        a background concern. Operators may invoke it via the internal action
        surface; the scheduler invokes it on a fixed cadence.

  transactional:
    summary: Deterministic module for balances, ledgers, audit trails, or append-only value tracking.
    select_when:
      - The module owns balances, transfers, credits, debits, or double-entry semantics.
      - Append-only or audit-heavy writes are required.
    canonical_yaml_family:
      always:
        - module.yaml
      optional:
        - events.yaml
        - reactions.yaml
        - notifications.yaml
        - settings.yaml
        - admin.yaml
        - profile.yaml
        - policy_hooks.yaml
        - relationships.yaml
    backend_stub_defaults:
      - backend/handler.py
      - backend/service.py
      - backend/repo.py
      - backend/policy.py
      - backend/schemas.py
    hard_constraints:
      - State is derived from an append-only ledger.
      - The repo layer provides append_entry style writes instead of update_balance shortcuts.
      - Multi-document writes use atomic operations.
      - The schemas layer separates balance projections from ledger entries.
      - If ledger entries carry user_id (e.g. a per-user token wallet or user balance ledger), set module.user_data_scope=true and generate backend/account_data_handler.py. export_user_data must return the user's ledger entries and current balance projection. delete_user_data should anonymise the user_id field on ledger entries rather than deleting them (preserving financial audit integrity) — document this choice in the handler's docstring. Omit user_data_scope for purely app-scoped or tenant-scoped ledgers with no user_id ownership.

  billing:
    summary: >
      Deterministic module that gates features behind subscription plans, reacts
      to managed billing lifecycle events or fulfillment commands, and exposes
      self-serve upgrade/cancellation surfaces. Use when an app monetizes
      through subscriptions, pay-per-use, or one-time purchases and needs
      entitlement enforcement at the action level.
    select_when:
      - The module owns app-facing plan status, entitlement presentation, or checkout session facade actions.
      - Actions must be gated by entitlement_gate declarations tied to plan capabilities.
      - The module reacts to hosted billing lifecycle events or BillingFulfillmentCommand inputs
        to update app-facing subscription state.
      - Usage metering or token allowance sync is required on plan activation.
    canonical_yaml_family:
      always:
        - module.yaml
        - contracts/events.yaml
        - contracts/reactions.yaml
      optional:
        - notifications.yaml
        - settings.yaml
        - admin.yaml
    backend_stub_defaults:
      - backend/handler.py
      - backend/service.py
      - backend/repo.py
      - backend/policy.py
      - backend/schemas.py
    hard_constraints:
      - Every plan-gated module action must declare entitlement_gate in module.yaml
        referencing a capability_id from config/subscriptions.yaml.
      - Include a public_readonly get_plans action (no permissions, no entitlement_gate)
        that reads config/subscriptions.yaml using the OSS load_subscriptions_config
        runtime utility and returns the plan catalog with labels, capability ids, and
        usage limits. This is the canonical data source for the /pricing page — never
        hardcode plan data in JSX or page schemas, always derive from subscriptions config.
        It must return only catalog data, never tenant/workspace subscription assignment
        records, invoices, payment secrets, or customer identity data.
      - The service layer never checks entitlements itself — entitlement_gate on
        the action declaration is the authorization boundary.
      - Subscription state transitions are driven by hosted billing lifecycle
        events or BillingFulfillmentCommand inputs reacted to via reactions.yaml,
        not by direct payment provider webhooks or operator calls.
      - Usage meters (token_wallets, usage_limits) are synced from the plan
        snapshot captured at subscription activation time, not derived live.
      - The schemas layer exposes plan_snapshot, catalog_id, and catalog_version
        fields on subscription records for downstream audit traceability.
      - Emit hosted.* namespaced events for platform subscription lifecycle;
        emit domain.* events for app-level entitlement changes that other modules react to.
      - Generated OSS app modules must not own payment provider webhook receivers,
        payment provider SDK imports, customer/payment-provider mappings, refunds,
        wallet ledgers, payouts, or provider credential handling.
      - Checkout session facade records are append-only; never mutate a completed session.
      - Cancellation or plan-update facade flows must emit events that downstream
        entitlement and token-metered modules can react to independently.
      - >
        Any module that writes time-bounded pending records (checkout sessions,
        reservations, invitations, etc.) must include a background expiry watcher
        declared as a startup_service in runtime_extensions.yaml. The watcher runs
        on a fixed interval (recommended: hourly), calls a service-layer
        expire_stale_<records> method, and emits a <record>.expired domain event
        per expired record. The service method must be exposed as an internal
        module action (api_surface: internal) so operators can trigger it manually
        and tests can exercise it without spawning the startup service. The watcher
        uses a direct Motor connection (AsyncIOMotorClient via MONGO_URI /
        MONGO_DB_NAME) because it runs outside any module request context.

  entitlement_dispatch:
    summary: >
      Self-hosted entitlement dispatch module. Writes subscription assignment
      records to the collection declared in config/subscriptions.yaml
      assignment_store so that ConfiguredEntitlementAdapter can grant or deny
      capability access at module action dispatch time. Use in self-hosted OSS
      apps that manage their own subscriptions without the mozaiks-app hosted
      entitlement service.
    select_when:
      - App declares config/subscriptions.yaml with at least one plan that grants capabilities.
      - App is self-hosted (not deployed on the mozaiks-app hosted platform).
      - App needs to activate or deactivate capability grants when subscription events arrive.
      - App integrates with an external payment provider that emits normalized domain events.
    canonical_yaml_family:
      always:
        - module.yaml
        - contracts/events.yaml
        - contracts/reactions.yaml
      optional:
        - notifications.yaml
        - admin.yaml
    backend_stub_defaults:
      - backend/handler.py
      - backend/service.py
      - backend/repo.py
      - backend/policy.py
      - backend/schemas.py
    key_actions:
      - activate_subscription: >
          Writes a grant record to the assignment_store collection with
          plan_id, granted_capabilities (copied from the plan snapshot in
          config/subscriptions.yaml), status=active, and optional expires_at.
          Input: { user_id, plan_id, granted_at?, expires_at? }.
      - deactivate_subscription: >
          Updates the assignment record status to cancelled or expired.
          Input: { user_id, reason }.
      - get_entitlement_status: >
          Read-only status check safe to expose to authenticated UI callers.
          Returns current plan_id, status, and granted_capabilities for the
          requesting user. No entitlement_gate — this action is itself free.
    assignment_store_convention: >
      The module repo writes to the collection declared in
      config/subscriptions.yaml assignment_store.data_alias. The record schema
      must include fields that ConfiguredEntitlementAdapter expects:
        app_id, user_id (or tenant_id/workspace_id for non-user-scoped grants),
        plan_id, granted_capabilities (list of capability_id strings or
        { pack_id, capability_id } dicts), status (must be one of the
        active_statuses declared in assignment_store), expires_at (ISO-8601 or null).
      Use ctx.persistence.collection(assignment_store_alias) in backend/repo.py.
      Do not hard-code the collection name — read it from the loaded subscriptions
      config at startup or pass it from the service layer.
    hard_constraints:
      - This archetype is for self-hosted apps only. Apps on the mozaiks-app
        hosted platform must not instantiate this module; the hosted entitlement
        service manages grants for hosted apps and is the authoritative source.
      - Do not call Stripe, MozaiksPay, or any payment provider from this module.
        Payment events are provider-specific. This module receives normalized
        domain events only (e.g. subscription.activated, subscription.cancelled)
        and reacts to them via contracts/reactions.yaml. The payment-event adapter
        lives in services/adapters/payments/{provider}.py.
      - The service layer must be idempotent — duplicate activation events for
        the same user/plan must not create duplicate grant records.
      - activate_subscription must snapshot the plan's capability_ids from
        config/subscriptions.yaml at activation time and store the snapshot.
        ConfiguredEntitlementAdapter may use the snapshot rather than re-reading
        the catalog at check time (see plan_snapshot field behavior in entitlements.py).
      - Never emit or handle direct payment provider webhook events (Stripe, etc.).
        Those belong in services/adapters/payments/{provider}.py and are normalized
        before reaching this module.
      - get_entitlement_status is the only action whose result is safe to return
        directly to the UI. activate_subscription and deactivate_subscription are
        internal actions (api_surface=internal) triggered via reactions.yaml.

  file_storage:
    summary: >
      Metadata-only file storage module. Stores file records (filename, mime_type,
      size_bytes, storage_url, is_public, created_by) in MongoDB; actual blobs
      are stored externally via services/adapters/storage/{provider}.py. Use this
      archetype when the app needs user-generated file upload, media storage, or
      document management.
    select_when:
      - App needs file upload, media storage, or document management.
      - Users upload images, documents, or attachments.
      - App stores user-generated files, photos, or media assets.
    canonical_yaml_family:
      always:
        - module.yaml
        - contracts/events.yaml
      optional:
        - contracts/notifications.yaml
        - admin.yaml
    backend_stub_defaults:
      - backend/handler.py
      - backend/service.py
      - backend/repo.py
      - backend/policy.py
      - backend/schemas.py
      - backend/account_data_handler.py
    key_actions:
      - upload_file: >
          Registers a file record AFTER the blob has been stored externally.
          Input: { filename, mime_type, size_bytes, storage_url, is_public?, metadata? }.
          The storage_url is an opaque provider URL returned by the adapter —
          the module does not validate, proxy, or re-upload it.
          Emits domain.files.file_uploaded.
      - get_file: >
          Fetches a single file record by file_id.
          Permission: files.read.
      - list_files: >
          Lists file records for the current user. Supports optional filters
          (is_public, mime_type) and limit. Permission: files.read.
      - delete_file: >
          Soft-deletes a file record by file_id. Emits domain.files.file_deleted.
          The storage adapter must be called separately to delete the blob.
          Permission: files.write.
    storage_adapter_convention: >
      Blob upload/download mechanics live in services/adapters/storage/{provider}.py.
      The module never imports or calls cloud storage SDKs directly.
      The storage_url field is set by the adapter before upload_file is called.
      Common providers: S3, GCS, Azure Blob, local-disk (dev).
    hard_constraints:
      - The module must be named `files`, not `file_storage`, `media`, or `documents`.
      - Do not import cloud storage SDKs (boto3, google-cloud-storage, azure-storage-blob)
        in module backend files. Cloud SDK calls belong in services/adapters/storage/.
      - Set module.user_data_scope=true in module.yaml — file records include user_id
        and are user-owned PII. Generate backend/account_data_handler.py with
        delete_user_data (soft-delete or hard-delete user's file records) and
        export_user_data (return file record list).
      - The storage_url field must be accepted from input — not generated by the module.
        The adapter provides it; the module stores it opaquely.
      - Do not proxy or re-sign storage URLs in the module. URL signing belongs in
        the storage adapter or a dedicated route in services/routes/.
      - Use ctx.persistence.collection("files", "records") in repo.py — not ctx.db
        or raw Motor client imports.

  notification_preferences:
    summary: >
      User notification preference module. Stores per-channel opt-in preferences
      (email_enabled, push_enabled, sms_enabled) per user. Does NOT own external
      delivery — external delivery adapters live in services/adapters/notifications/
      and are triggered via contracts/reactions.yaml. Use this archetype only when
      the app also selects the notifications operator_pack.
    select_when:
      - notifications operator_pack is selected.
      - App needs to let users opt in or out of email, push, or SMS notifications.
      - App must track per-user delivery channel preferences for external notifications.
    canonical_yaml_family:
      always:
        - module.yaml
        - contracts/reactions.yaml
      optional:
        - admin.yaml
    backend_stub_defaults:
      - backend/handler.py
      - backend/service.py
      - backend/repo.py
      - backend/schemas.py
      - backend/account_data_handler.py
    key_actions:
      - get_notification_preferences: >
          Fetches the current user's opt-in preferences. Returns defaults
          (email_enabled=true, push_enabled=true, sms_enabled=false) if no
          record has been saved. No permissions required — users always
          have access to their own preferences. No entitlement_gate.
      - update_notification_preferences: >
          Upserts the user's channel opt-ins. Accepts partial updates —
          fields not included retain their current value.
          No entitlement_gate — all users may control their own preferences.
    reactions_convention: >
      contracts/reactions.yaml observes domain events from other modules and
      routes to channel-appropriate delivery adapters. One reaction per
      domain event that should trigger external notification delivery.
      Reactions call adapter methods (send_email, send_push) — service.py
      must NOT call adapter methods directly from action handlers.
    hard_constraints:
      - The module must be named `notification_settings`, not `notifications`
        (the runtime owns the notifications namespace for in-app delivery).
      - Do not embed provider SDK calls in service.py or repo.py.
        External delivery belongs in services/adapters/notifications/{channel}.py.
      - Set module.user_data_scope=true in module.yaml — opt-in preferences
        are user-owned PII. Generate backend/account_data_handler.py with
        delete_user_data (remove preference records) and export_user_data
        (return opt-in state).
      - Do not add an entitlement_gate to get_notification_preferences or
        update_notification_preferences — all users may manage their own channels.
      - Do not re-implement in-app notification storage or websocket delivery.
        In-app alerts are declared in contracts/notifications.yaml on the
        event-producing module; the runtime handles delivery.
      - Use ctx.persistence.collection("notification_settings", "preferences") in
        repo.py — not ctx.db or raw Motor client imports.
      - Adapter stubs must raise NotImplementedError in their stub body so
        operators know to fill in their chosen provider SDK.
      - Generated adapter stubs must not include credential values —
        credentials come from env vars (EMAIL_API_KEY, FCM_SERVER_KEY, etc.).
