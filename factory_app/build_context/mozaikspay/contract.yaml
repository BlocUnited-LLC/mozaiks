contract_id: mozaikspay
contract_type: build_pack_instructions

# Declares capabilities this pack provides to the OSS planning system.
# subscription_write_path: this managed pack owns the subscription assignment
# write path. AppPlanAgent must not also include entitlement_dispatch when
# this pack is selected as managed_capability.
provides_capabilities:
  - subscription_write_path

selection_rules:
  - id: select_for_saas_billing
    when:
      intent_any:
        - saas billing
        - subscriptions
        - billing portal
        - runtime usage display
    action: select_pack
  - id: do_not_select_for_generic_payments
    when:
      intent_any:
        - checkout
        - marketplace payments
        - wallet connection
        - creator payouts
    action: require_explicit_user_confirmation

recommended_domains:
  - billing
  - subscriptions
  - usage
  - saas

required_integrations:
  - service: mozaikspay
    provider: mozaikspay
    display_name: MozaiksPay
    kind: api_key
    purpose: Connect this generated SaaS app to the managed MozaiksPay subscription provider.
    required_at: runtime
    required_fields:
      - name: api_base
        label: MozaiksPay API Base URL
        type: url
        required: true
        frontend_safe: true
      - name: api_key
        label: MozaiksPay API Key
        type: secret
        required: true
        frontend_safe: false
    optional_fields:
      - name: client_id
        label: Client ID
        type: text
        required: false
        frontend_safe: true
      - name: client_secret
        label: Client Secret
        type: secret
        required: false
        frontend_safe: false

required_outputs:
  - path: services/integrations/mozaikspay_client.py
    owner: templates
  - path: modules/billing_portal/module.yaml
    owner: templates
  - path: modules/billing_portal/backend/base_handler.py
    owner: templates
  - path: modules/billing_portal/backend/handler.py
    owner: workspace  # preserved across regeneration; subclasses base_handler.py
  - path: modules/billing_portal/backend/service.py
    owner: templates
  - path: modules/billing_portal/backend/schemas.py
    owner: templates
  - path: modules/billing_portal/contracts/reactions.yaml
    owner: templates
  - path: modules/billing_portal/contracts/profile.yaml
    owner: templates
  - path: modules/billing_portal/contracts/admin.yaml
    owner: templates
  - path: ui/pages/billing.yaml
    owner: templates
  - path: ui/pages/usage.yaml
    owner: templates

forbidden_outputs:
  - path_prefix: modules/mozaikspay/
  - path_prefix: modules/wallet/
  - path_prefix: app/capability_packs/
  - path_prefix: services/managed_billing/
  - path_prefix: services/wallet/

runtime_boundaries:
  - id: entitlements_runtime
    rule: Keep entitlement enforcement on the OSS runtime/module contract path.
  - id: usage_runtime
    rule: Read runtime token usage through /api/me/usage or /api/admin/usage; use the OSS token wallet ledger for balances instead of app-local duplicate ledgers.
  - id: plan_limits
    rule: Use app/config/subscriptions.yaml usage_limits, token_wallets, token_allowances, depleted_balance, and top_up_products for generated SaaS plan limits, token allowances, and recovery paths only when the app sells AI usage, credits, quotas, or token packs; access-only plans omit token wallet fields.
  - id: token_top_ups
    rule: Token top-up products are provider-neutral app contract entries; MozaiksPay only creates checkout sessions and must confirm payment before OSS billing fulfillment credits tokens.
  - id: managed_internals
    rule: Do not generate managed service internals, checkout, wallet, settlement logic, private APIs, or provider credentials.
  - id: connector_boundary
    rule: Generated apps must configure MozaiksPay through the app-scoped connector named mozaikspay or the MOZAIKSPAY_* env fallback; never commit provider credentials.
  - id: page_bindings
    rule: Generated pages must call app-owned billing_portal actions, not managed backing modules directly.

facades:
  - module_id: billing_portal
    provider_module: mozaikspay
    provider_actions:
      - billing_portal
      - create_billing_portal_session
      - subscription_status
      - get_subscription_status
      - subscription_checkout
      - create_subscription_checkout_session
      - start_subscription_checkout
      - usage_status
      - get_usage_status
      - token_status
      - get_token_status
      - token_top_up
      - create_token_top_up_session
      - start_token_top_up
    pages:
      - name: Billing
        route: /billing
        primary_entities:
          - subscription
        primary_actions:
          - get_subscription_status
          - list_plans
          - start_subscription_checkout
          - open_billing_portal
      - name: Usage
        route: /usage
        primary_entities:
          - runtime_usage
          - token_wallet
        primary_actions:
          - get_usage_status
          - get_token_status
          - start_token_top_up

provider_api_response_contract:
  spec_file: provider_api_contract.yaml
  description: >
    The MozaiksPay hosted platform serves provider API endpoints consumed by generated apps.
    Response shapes are pinned in provider_api_contract.yaml. Any change to field
    names or types on either side is a breaking change requiring coordinated release.
  subscription_status_required_fields:
    - success
    - found
    - plan_id
    - plan_name
    - status
    - starts_at
    - expires_at
    - on_free_plan
  billing_portal_session_required_fields:
    - success
    - portal_url
    - return_url
  subscription_checkout_session_required_fields:
    - success
    - checkout_url
    - success_url
    - cancel_url
    - plan_id
  token_top_up_session_required_fields:
    - success
    - checkout_url
    - success_url
    - cancel_url
    - product_id
    - wallet_id
    - token_amount
  globally_forbidden_response_fields:
    - provider_customer_id
    - provider_subscription_id
    - payment_provider_customer_id
    - payment_provider_subscription_id
    - client_secret
    - secret_salt
    - client_secret_hash
    - session_id

inactive_surfaces:
  - checkout
  - creator_earnings
  - wallet_connection

# ---------------------------------------------------------------------------
# Platform hooks — lifecycle responsibilities owned by the hosted platform,
# not by the generated app.  Generated apps never implement these; the
# platform reacts to well-known events and performs the corresponding work.
# ---------------------------------------------------------------------------
platform_hooks:
  # When a hosted app is deployed the platform reads the app bundle's
  # app/config/subscriptions.yaml, provisions Stripe products and prices
  # for each paid plan (amount > 0), and persists the resulting price_ids in
  # hosted_billing.app_billing_plans keyed by app_id.
  # The checkout flow looks up these price_ids at runtime.
  # Plans without a price.amount field are treated as contact-sales and
  # skipped — no Stripe price is created.
  - id: billing_plan_provisioning
    trigger_event: hosted.hosting.app.deployed
    responsible_module: hosted_billing
    responsible_action: provision_app_billing_plans
    description: >
      On deployment the platform provisions Stripe billing products and prices
      for paid plans declared in the app bundle's app/config/subscriptions.yaml.
      This is idempotent — existing Stripe prices are reused via lookup_key.
      Emits hosted.billing.app_billing_plans.provisioned on success.
      Skips silently when MozaiksPay billing is not configured or when the
      app bundle contains no paid plans.
    app_requirements:
      # The app bundle's subscriptions.yaml plan entries may carry an optional
      # price block.  When present, the platform provisions Stripe billing for
      # that plan automatically.  When absent, the plan is free or requires
      # manual pricing configuration through the platform admin UI.
      subscriptions_yaml_price_block:
        description: >
          Optional price metadata on each plan entry in app/config/subscriptions.yaml.
          When present on a plan, the platform will provision a Stripe product
          and price for that plan on app deployment.
        example: |
          plans:
            - plan_id: pro
              label: Pro
              price:
                amount: 29        # dollars
                currency: usd
                interval: month   # month | year
              billing:
                lookup_key: my_app_pro_monthly   # optional; defaults to {app_id}_{plan_id}_{interval}
                allow_promotion_codes: true
              capabilities: [...]
