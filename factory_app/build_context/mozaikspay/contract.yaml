contract_id: mozaikspay
contract_type: build_pack_instructions
canonical_provider:
  provider_id: mozaiks_pay
  provider_pack_id: mozaikspay
  display_name: MozaiksPay
  api_contract_version: mozaiks.provider_api_contract.v1
  provider_api_contract_id: mozaikspay_provider_api
  connector_file: services/integrations/mozaikspay_client.py
  callback_event_namespace: mozaikspay.billing
  fulfillment_boundary: BillingFulfillmentCommand
  entitlement_boundary: EntitlementPort
  secret_references:
    - MOZAIKSPAY_API_BASE
    - MOZAIKSPAY_API_KEY
    - MOZAIKSPAY_CLIENT_ID
    - MOZAIKSPAY_CLIENT_SECRET
  activation_requires_explicit_selection: false
  activation_requires_credentials: true
  self_managed_replacement_provider_id: entitlement_dispatch

# Declares capabilities this pack provides to the OSS planning system.
# subscription_write_path: this managed pack owns the subscription assignment
# write path. AppPlanAgent must not also include entitlement_dispatch when
# this pack is selected as managed_capability.
provides_capabilities:
  - subscription_write_path

selection_rules:
  - id: select_for_token_wallets
    when:
      app_declares:
        - token_wallets
        - top_up_products
    action: select_pack
  - id: select_for_saas_billing
    when:
      intent_any:
        - saas billing
        - subscriptions
        - billing portal
        - runtime usage display
    action: select_pack
  - id: do_not_select_for_generic_payments
    when:
      intent_any:
        - checkout
        - marketplace payments
        - wallet connection
        - creator payouts
    action: require_explicit_user_confirmation

recommended_domains:
  - billing
  - subscriptions
  - usage
  - saas

required_integrations:
  - service: mozaikspay
    provider: mozaiks_pay
    display_name: MozaiksPay
    kind: api_key
    purpose: Connect this generated SaaS app to the managed MozaiksPay subscription provider.
    required_at: runtime
    required_fields:
      - name: api_base
        label: MozaiksPay API Base URL
        type: url
        required: true
        frontend_safe: true
      - name: api_key
        label: MozaiksPay API Key
        type: secret
        required: true
        frontend_safe: false
    optional_fields:
      - name: client_id
        label: Client ID
        type: text
        required: false
        frontend_safe: true
      - name: client_secret
        label: Client Secret
        type: secret
        required: false
        frontend_safe: false

required_outputs:
  - path: services/integrations/mozaikspay_client.py
    owner: templates
  - path: modules/billing_portal/module.yaml
    owner: templates
  - path: modules/billing_portal/backend/base_handler.py
    owner: templates
  - path: modules/billing_portal/backend/handler.py
    owner: workspace  # preserved across regeneration; subclasses base_handler.py
  - path: modules/billing_portal/backend/service.py
    owner: templates
  - path: modules/billing_portal/backend/schemas.py
    owner: templates
  - path: modules/billing_portal/contracts/reactions.yaml
    owner: templates
  - path: modules/billing_portal/contracts/profile.yaml
    owner: templates
  - path: modules/billing_portal/contracts/admin.yaml
    owner: templates
  - path: ui/pages/billing.yaml
    owner: templates
  - path: ui/pages/usage.yaml
    owner: templates

forbidden_outputs:
  - path_prefix: modules/mozaikspay/
  - path_prefix: modules/wallet/
  - path_prefix: app/capability_packs/
  - path_prefix: services/managed_billing/
  - path_prefix: services/wallet/

runtime_boundaries:
  - id: entitlements_runtime
    rule: Keep entitlement enforcement on the OSS runtime/module contract path.
  - id: usage_runtime
    rule: Read runtime token usage through /api/me/usage or /api/admin/usage; use the OSS token wallet ledger for balances instead of app-local duplicate ledgers.
  - id: plan_limits
    rule: Use app/config/subscriptions.yaml usage_limits, token_wallets, token_allowances, depleted_balance, and top_up_products for generated SaaS plan limits, token allowances, and recovery paths only when the app sells AI usage, credits, quotas, or token packs; access-only plans omit token wallet fields.
  - id: token_top_ups
    rule: Token top-up products are provider-neutral app contract entries; MozaiksPay only creates checkout sessions and must confirm payment before OSS billing fulfillment credits tokens.
  - id: managed_internals
    rule: Do not generate managed service internals, checkout, wallet, settlement logic, private APIs, or provider credentials.
  - id: connector_boundary
    rule: Generated apps must configure MozaiksPay through the app-scoped connector named mozaikspay or the MOZAIKSPAY_* env fallback; never commit provider credentials.
  - id: page_bindings
    rule: Generated pages must call app-owned billing_portal actions, not managed backing modules directly.

facades:
  - module_id: billing_portal
    provider_module: mozaikspay
    provider_actions:
      - billing_portal
      - create_billing_portal_session
      - subscription_status
      - get_subscription_status
      - subscription_checkout
      - create_subscription_checkout_session
      - start_subscription_checkout
      - usage_status
      - get_usage_status
      - token_status
      - get_token_status
      - token_top_up
      - create_token_top_up_session
      - start_token_top_up
    pages:
      - name: Billing
        route: /billing
        page_type_hint: analytics_dashboard
        primary_entities:
          - subscription
        primary_actions:
          - get_subscription_status
          - list_plans
          - start_subscription_checkout
          - open_billing_portal
      - name: Usage
        route: /usage
        page_type_hint: analytics_dashboard
        primary_entities:
          - runtime_usage
          - token_wallet
        primary_actions:
          - get_usage_status
          - get_token_status
          - start_token_top_up

provider_api_response_contract:
  spec_file: provider_api_contract.yaml
  description: >
    A MozaiksPay-compatible provider serves the provider API endpoints consumed
    by generated apps. Response shapes are pinned in provider_api_contract.yaml.
    Any change to field names or types on either side is a breaking change
    requiring coordinated release.
  subscription_status_required_fields:
    - success
    - found
    - plan_id
    - plan_name
    - status
    - starts_at
    - expires_at
    - on_free_plan
  billing_portal_session_required_fields:
    - success
    - portal_url
    - return_url
  subscription_checkout_session_required_fields:
    - success
    - checkout_url
    - success_url
    - cancel_url
    - plan_id
  token_top_up_session_required_fields:
    - success
    - checkout_url
    - success_url
    - cancel_url
    - product_id
    - wallet_id
    - token_amount
  globally_forbidden_response_fields:
    - provider_customer_id
    - provider_subscription_id
    - payment_provider_customer_id
    - payment_provider_subscription_id
    - client_secret
    - secret_salt
    - client_secret_hash
    - session_id

runtime_connector_contract:
  connector_id: mozaikspay
  canonical_provider_id: mozaiks_pay
  selection_field: AppBuildPlan.monetization_provider
  selection_value: mozaiks_pay
  required_selected_pack_id: mozaikspay
  mutually_exclusive_with:
    - entitlement_dispatch
  operations:
    - subscription_status
    - billing_portal_session
    - subscription_checkout_session
    - token_top_up_session
  auth_secret_refs:
    primary:
      - MOZAIKSPAY_API_KEY
    compatibility:
      - MOZAIKSPAY_CLIENT_ID
      - MOZAIKSPAY_CLIENT_SECRET
    public:
      - MOZAIKSPAY_API_BASE
      - MOZAIKS_APP_URL
  idempotency:
    required_for_provider_fulfillment: true
    command_id_source: provider_event_id
    replay_boundary: BillingFulfillmentService
  callback_verification:
    required: true
    fail_closed: true
    unsigned_callbacks: reject
    malformed_callbacks: reject
    accepted_event_shapes:
      - subscription_activated
      - subscription_updated
      - subscription_cancelled
      - token_top_up_paid
  retry_policy:
    retryable_errors:
      - timeout
      - rate_limited
      - service_unavailable
    terminal_errors:
      - invalid_credentials
      - invalid_scope
      - contract_version_mismatch
      - malformed_callback
      - unsigned_callback
  readiness:
    health_operation: provider_readiness
    required_config:
      - api_base
      - api_key
    offline_behavior: not_ready
  entitlement_sync:
    source: verified_provider_fulfillment
    normalized_command: BillingFulfillmentCommand
    assignment_store_authority: config/subscriptions.yaml
    enforcement_adapter: ConfiguredEntitlementAdapter

inactive_surfaces:
  - checkout
  - creator_earnings
  - wallet_connection

# ---------------------------------------------------------------------------
# Provider lifecycle boundary — responsibilities owned by the selected
# MozaiksPay-compatible provider, not by the generated app. Generated apps never
# implement payment-provider provisioning, hosted billing modules, wallet
# engines, payout engines, settlement logic, or provider credential handling.
# ---------------------------------------------------------------------------
provider_lifecycle_boundary:
  - id: plan_catalog_mapping
    provider_role: mozaikspay_compatible_provider
    description: >
      The selected provider may read the app bundle's app/config/subscriptions.yaml
      catalog to map paid plans and top-up products to provider-owned billing
      objects. Mapping, provisioning, idempotency, provider IDs, payment
      processor objects, and hosted operational records remain provider-owned and
      are not generated into the canonical app bundle.
    app_requirements:
      subscriptions_yaml_price_block:
        description: >
          Optional price metadata on each plan entry in app/config/subscriptions.yaml.
          When present on a plan, a compatible provider may use this metadata to
          map or provision provider-owned billing objects. When absent, the plan
          is free or requires provider/operator-side pricing configuration.
        example: |
          plans:
            - plan_id: pro
              label: Pro
              price:
                amount: 29        # dollars
                currency: usd
                interval: month   # month | year
              billing:
                lookup_key: my_app_pro_monthly   # optional stable provider mapping key
                allow_promotion_codes: true
              capabilities: [...]
