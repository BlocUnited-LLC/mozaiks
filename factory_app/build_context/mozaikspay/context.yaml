context_id: mozaikspay
applies_to_workflows:
  - AppGenerator
assets:
  - path: contract.yaml
    kind: contract
  - path: provider_api_contract.yaml
    kind: contract
  - path: templates/
    kind: templates
pack:
  id: mozaikspay
  version: "0.1.11"
  status: active
  capability_source: managed_capability
  required_integrations:
    - service: mozaikspay
      provider: mozaiks_pay
      display_name: MozaiksPay
      kind: api_key
      purpose: Connect this generated SaaS app to the managed MozaiksPay subscription provider.
      required_at: runtime
      required_fields:
        - name: api_base
          label: MozaiksPay API Base URL
          type: url
          required: true
          frontend_safe: true
        - name: api_key
          label: MozaiksPay API Key
          type: secret
          required: true
          frontend_safe: false
      optional_fields:
        - name: client_id
          label: Client ID
          type: text
          required: false
          frontend_safe: true
        - name: client_secret
          label: Client Secret
          type: secret
          required: false
          frontend_safe: false
  deployment_env:
    optional:
      - MOZAIKS_APP_URL
      - MOZAIKSPAY_API_BASE
      - MOZAIKSPAY_CLIENT_ID
      - MOZAIKSPAY_CLIENT_SECRET
      - MOZAIKSPAY_API_KEY
    secret:
      - MOZAIKSPAY_CLIENT_SECRET
      - MOZAIKSPAY_API_KEY
capabilities:
  - capability_id: mozaikspay.billing_portal
    facade_recommended: billing_portal
  - capability_id: mozaikspay.subscription_status
    facade_recommended: billing_portal
  - capability_id: mozaikspay.subscription_checkout
    facade_recommended: billing_portal
  - capability_id: mozaikspay.usage_status
    facade_recommended: billing_portal
  - capability_id: mozaikspay.token_status
    facade_recommended: billing_portal
  - capability_id: mozaikspay.token_top_up
    facade_recommended: billing_portal
facades:
  - module_id: billing_portal
    provider_module: mozaikspay
    provider_actions:
      - billing_portal
      - create_billing_portal_session
      - subscription_status
      - get_subscription_status
      - subscription_checkout
      - create_subscription_checkout_session
      - start_subscription_checkout
      - usage_status
      - get_usage_status
      - token_status
      - get_token_status
      - token_top_up
      - create_token_top_up_session
      - start_token_top_up
    pages:
      - name: Billing
        route: /billing
        page_type_hint: analytics_dashboard
      - name: Usage
        route: /usage
        page_type_hint: analytics_dashboard
projections:
  context_variables:
    capability_packs:
      from: capability_packs
    operator_contracts:
      from: operator_contracts
