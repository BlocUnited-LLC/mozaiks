schema_version: mozaiks.app_page.v1
name: Usage
route: /usage
title: Usage
page_type: analytics_dashboard
layout: full-width
shell_mode: workspace
navigation:
  id: usage
  label: Usage
  icon: Gauge
  scope: global
  order: 75
  visible: true
sections:
  - id: usage-status
    primitive: SummaryStrip
    title: Usage
    config:
      api_endpoint: /api/modules/billing_portal/get_usage_status
      items:
        - label: Total Tokens
          value_key: runtime_ai_usage.totals.total_tokens
          format: number
        - label: Prompt Tokens
          value_key: runtime_ai_usage.totals.prompt_tokens
          format: number
        - label: Completion Tokens
          value_key: runtime_ai_usage.totals.completion_tokens
          format: number
        - label: LLM Calls
          value_key: runtime_ai_usage.totals.llm_calls
          format: number
roles: null
