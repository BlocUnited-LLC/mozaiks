schema_version: mozaiks.page.v1
name: Billing
route: /billing
title: Billing
page_type: dashboard
layout: stack
shell_mode: workspace
navigation:
  id: billing
  label: Billing
  icon: CreditCard
  scope: global
  order: 70
  visible: true
sections:
  - id: billing-status
    primitive: SummaryStrip
    title: Current Plan
    config:
      api_endpoint: /api/modules/billing_portal/get_subscription_status
      method: POST
      fields:
        - plan_name
        - status
        - starts_at
        - expires_at
  - id: billing-catalog
    primitive: DataPanel
    title: Plans and Token Packs
    config:
      api_endpoint: /api/modules/billing_portal/list_plans
      method: POST
      fields:
        - plans
        - top_up_products
  - id: manage-billing
    primitive: ActionButton
    title: Manage Billing
    config:
      label: Manage Billing
      api_endpoint: /api/modules/billing_portal/open_billing_portal
      method: POST
      response_url_field: portal_url
roles: null
extensions: null
