schema_version: mozaiks.reactions.v1
reactions:
  - id: commerce_checkout_requested_payment_facade
    event_type: app.commerce.checkout.requested
    target:
      kind: capability
      capability_id: mozaikspay.checkout.create_session
    description: >
      Optional managed-payment bridge. When the mozaikspay pack is selected,
      this reaction lets the payment facade create a provider checkout session
      and call commerce.record_checkout_result after completion.

  - id: commerce_paid_order_receipt
    event_type: app.commerce.order.paid
    target:
      kind: notification
      notification_id: commerce_order_receipt
    description: Notify the buyer and operators after payment succeeds.

  - id: commerce_checkout_failed_notification
    event_type: app.commerce.checkout.failed
    target:
      kind: notification
      notification_id: commerce_checkout_failed
    description: Notify the buyer when checkout fails, expires, or is cancelled.
