schema_version: mozaiks.events.v1
events:
  - type: domain.messages.thread_created
    version: 1
    description: Emitted after an internal message thread is created.
    producer: messages
    payload_schema:
      type: object
      required: [thread_id, thread_type, created_by]
      properties:
        thread_id: { type: string }
        thread_type: { type: string }
        scope_type: { type: string }
        scope_id: { type: string }
        # The service emits null when a thread has no subject app or related record.
        subject_app_id: { type: string, nullable: true }
        created_by: { type: string }
        related_type: { type: string, nullable: true }
        related_id: { type: string, nullable: true }

  - type: domain.messages.message_sent
    version: 1
    description: Emitted after a message is persisted and ready for recipient notification.
    producer: messages
    payload_schema:
      type: object
      required: [thread_id, message_id, sender_id, sender_role, body_preview, sent_at, recipient_ids]
      properties:
        thread_id: { type: string }
        message_id: { type: string }
        sender_id: { type: string }
        sender_role: { type: string }
        body_preview: { type: string }
        sent_at: { type: string }
        scope_type: { type: string }
        scope_id: { type: string }
        subject_app_id: { type: string, nullable: true }
        related_type: { type: string, nullable: true }
        related_id: { type: string, nullable: true }
        recipient_ids:
          type: array
          items: { type: string }
        participant_ids:
          type: array
          items: { type: string }

  - type: domain.messages.thread_read
    version: 1
    description: Emitted when a user marks a message thread as read.
    producer: messages
    payload_schema:
      type: object
      required: [thread_id, user_id]
      properties:
        thread_id: { type: string }
        user_id: { type: string }
