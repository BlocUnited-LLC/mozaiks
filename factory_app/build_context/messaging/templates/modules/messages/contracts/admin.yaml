schema_version: mozaiks.admin.v1
panels:
  - id: messages_threads_panel
    title: Message Threads
    description: >
      View all active message threads across the app. Supports filtering by
      thread type and status. Useful for moderation and abuse review.
    module: messages
    actions:
      - id: list_threads
        label: List Threads
        input_overrides:
          limit: 50
      - id: get_thread
        label: View Thread
      - id: update_thread_status
        label: Update Thread Status
    filters:
      - field: thread_type
        label: Type
        options: [All, DMs, Groups]
        map: { All: null, DMs: dm, Groups: group }
      - field: status
        label: Status
        options: [Open, Closed, Archived]
        map: { Open: open, Closed: closed, Archived: archived }
    permissions: [community_membership.admin, ops.admin]

  - id: messages_moderation_panel
    title: Message Moderation
    description: >
      Delete or review individual messages flagged for abuse. The soft-delete
      operation clears message body and preserves the audit record.
    module: messages
    actions:
      - id: delete_message
        label: Delete Message
        confirm: true
        confirm_message: "This permanently clears the message body. Continue?"
    permissions: [community_membership.admin, ops.admin]

  - id: messages_notifications_panel
    title: Notification Queue
    description: >
      Review message notification records. Useful for debugging delivery
      failures or auditing notification volume.
    module: messages
    actions:
      - id: list_notifications
        label: List Notifications
        input_overrides:
          limit: 100
    permissions: [ops.admin]
