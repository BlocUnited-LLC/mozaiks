schema_version: mozaiks.module.v1
module:
  id: messages
  display_name: Messages
  version: 1.0.0
  description: Internal app messaging for user conversations, support threads, read state, and notification fan-out.
  owner: app
  visibility: private
  handler: backend.handler:MessagesHandler
  user_data_scope: true

permissions:
  - id: messages.read
    description: Read message threads and messages.
  - id: messages.write
    description: Create threads, send messages, and update read state.

actions:
  - id: create_thread
    description: Create a message thread for an app conversation or support request.
    handler_method: create_thread
    input_schema:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
        participant_ids:
          type: array
          items:
            type: string
        # thread_type — optional; the service defaults omitted values to group.
        thread_type:
          type: string
          enum: [group, direct, support]
        # scope_type — whether the conversation belongs to one app or to
        # workspace-level social context; the service defaults omissions to app.
        scope_type:
          type: string
          enum: [app, workspace]
        # scope_id — optional explicit scope id. Defaults to ctx.app_id for app
        # scope or ctx.workspace_id for workspace scope.
        scope_id:
          type: string
        # subject_app_id — the app this conversation is about. Support threads
        # should set this to the supported app id.
        subject_app_id:
          type: string
        # related_type — optional owning entity type such as
        # workspace_support.request.
        related_type:
          type: string
        # related_id — optional owning entity id.
        related_id:
          type: string
        # metadata — optional thread annotation entries (for example the
        # support pack's request_id link). Stored on the thread as a
        # {key: value} map built from these typed entries.
        metadata:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [key, value]
            properties:
              key: { type: string }
              value: { type: string }
    output_schema:
      type: object
      required: [success, thread]
      properties:
        success:
          type: boolean
        thread:
          type: object
    permissions:
      - messages.write
    emits:
      - domain.messages.thread_created

  - id: list_threads
    description: List threads for the current user.
    handler_method: list_threads
    input_schema:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [open, resolved, archived]
        thread_type:
          type: string
          enum: [group, direct, support]
        scope_type:
          type: string
          enum: [app, workspace]
        scope_id:
          type: string
        subject_app_id:
          type: string
        related_type:
          type: string
        related_id:
          type: string
        limit:
          type: integer
    output_schema:
      type: object
      required: [threads, total]
      properties:
        threads:
          type: array
        total:
          type: integer
    permissions:
      - messages.read

  - id: get_thread
    description: Fetch a thread and its messages.
    handler_method: get_thread
    input_schema:
      type: object
      additionalProperties: false
      required: [thread_id]
      properties:
        thread_id:
          type: string
        message_limit:
          type: integer
    output_schema:
      type: object
      required: [thread, messages]
      properties:
        thread:
          type: object
        messages:
          type: array
    permissions:
      - messages.read

  - id: send_message
    description: Send a message to a thread.
    handler_method: send_message
    input_schema:
      type: object
      additionalProperties: false
      required: [thread_id, body]
      properties:
        thread_id:
          type: string
        body:
          type: string
        # message_type — optional; the service defaults omitted values to text.
        message_type:
          type: string
          enum: [text, system]
    output_schema:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
        message:
          type: object
    permissions:
      - messages.write
    emits:
      - domain.messages.message_sent

  - id: mark_thread_read
    description: Mark a thread as read for the current user.
    handler_method: mark_thread_read
    input_schema:
      type: object
      additionalProperties: false
      required: [thread_id]
      properties:
        thread_id:
          type: string
    output_schema:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
    permissions:
      - messages.write
    emits:
      - domain.messages.thread_read

capabilities:
  - capability_id: messaging.threads.list
    kind: action
    target: list_threads
    title: List message threads
    permissions:
      - messages.read
  - capability_id: messaging.messages.send
    kind: action
    target: send_message
    title: Send message
    permissions:
      - messages.write
