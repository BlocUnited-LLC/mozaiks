contract_id: messaging
contract_type: build_pack_instructions

selection_rules:
  - id: select_for_messaging_apps
    when:
      intent_any:
        - direct messages
        - dm
        - messaging
        - chat
        - conversations
        - inbox
        - threads
        - support chat
        - support messages
        - conversation threads
    action: select_pack
  - id: confirm_for_light_social
    when:
      intent_any:
        - notifications
        - comments
        - activity feed
    action: require_explicit_user_confirmation

recommended_domains:
  - messaging
  - chat
  - social
  - community
  - marketplace

required_outputs:
  - path: data/migrations/001_messaging_collections.json
    owner: templates
  - path: modules/messages/module.yaml
    owner: templates
  - path: modules/messages/backend/__init__.py
    owner: templates
  - path: modules/messages/backend/base_handler.py
    owner: templates
  - path: modules/messages/backend/handler.py
    owner: workspace  # preserved across regeneration; subclasses base_handler.py
  - path: modules/messages/backend/service.py
    owner: templates
  - path: modules/messages/backend/repo.py
    owner: templates
  - path: modules/messages/backend/policy.py
    owner: templates
  - path: modules/messages/backend/schemas.py
    owner: templates
  - path: modules/messages/contracts/events.yaml
    owner: templates
  - path: modules/messages/contracts/notifications.yaml
    owner: templates
  - path: modules/messages/contracts/reactions.yaml
    owner: templates
  - path: modules/messages/contracts/profile.yaml
    owner: templates
  - path: ui/index.js
    owner: templates
  - path: ui/components/MessagingProfileTab.jsx
    owner: templates
  - path: ui/pages/custom/Messages.jsx
    owner: templates
  - path: ui/route_manifest.json
    owner: templates

forbidden_outputs:
  - path_prefix: modules/messaging/
  - path_prefix: modules/chat/
  - path_prefix: modules/contacts/
  - path_prefix: services/messaging/
  - path_prefix: services/chat/

runtime_boundaries:
  - id: persistence_layer
    rule: Generated repo.py must use ctx.persistence.collection("messages", entity_name). No direct Motor clients and no app_data_from_context aliases.
  - id: event_emission
    rule: Events must be emitted via ctx.emit(), not direct dispatcher calls from service/handler.
  - id: notification_delivery
    rule: Message recipient notifications are declared in messages/contracts/notifications.yaml from domain.messages.message_sent. Do not create a notification repo or delivery worker inside the app module.
  - id: no_announcement_leakage
    rule: The create_announcement action is hosted-platform only. Do not add it to generated app templates.
  - id: contacts_belong_to_social
    rule: Friends, follows, contacts, invitations, and social graph state belong to the social pack or an app-specific module, not the messaging substrate.
  - id: no_messaging_contacts_facade
    rule: Do not emit messaging.contacts.* capabilities or a contacts module as a DM roster. Select the social pack for friend/relationship rosters, or use an app-specific relationship provider with non-messaging capability ids when the product truly needs a private address book.
  - id: hosted_extension_boundary
    rule: Hosted products may add announcements, operator routing, realtime fan-out, or product-specific moderation, but they must keep core thread/message persistence on the messages module and preserve domain.messages.* lifecycle events for create_thread, send_message, and mark_thread_read.
  - id: profile_tab_composition
    rule: >
      The default DM inbox entrypoint is a profile tab declared in
      modules/messages/contracts/profile.yaml and registered through ui/index.js.
      Keep /messages as a focused conversation route, but do not add it to global
      shell navigation or profile shortcut pills by default.

facades: []

cross_pack_integrations:
  - pack_id: support
    description: >
      Support modules use messages for persisted conversations. The support
      module stores ticket metadata and references messages.thread_id through
      message_thread_id.
  - pack_id: social
    description: >
      Social apps may use messages for DMs after the social pack creates
      friends, follows, or invitations. Social graph ownership remains in the
      social pack.
  - pack_id: governance
    description: >
      Governance apps may use messages for deliberation threads, but proposals,
      votes, quorum, moderation, and role policy are app-specific or a separate
      governance pack.
