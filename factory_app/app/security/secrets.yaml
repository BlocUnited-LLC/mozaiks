version: 1
kind: app_secret_contract
description: >-
  Names-only Factory runtime secret policy. Values are supplied by the operator
  through the environment. Required documents deployment needs; selected runtime
  consumers enforce availability, rather than requiring every model provider.
provider:
  type: env
secrets:
  - env: MONGO_URI
    required: true
    purpose: MongoDB connection for runtime sessions and app persistence.
  - env: GEMINI_API_KEY
    purpose: Google model credential when a Google model is selected.
  - env: GOOGLE_API_KEY
    purpose: Alternative Google model credential handle supported by the AG2 adapter.
  - env: OPENAI_API_KEY
    purpose: OpenAI model credential when an OpenAI model is selected.
  - env: ANTHROPIC_API_KEY
    purpose: Anthropic model credential when an Anthropic model is selected.
  - env: LLM_PRIMARY_API_KEY
    purpose: Provider-independent credential handle supported by the AG2 adapter.
  - env: LLM_FALLBACK_API_KEYS
    purpose: Optional comma-separated credentials for the configured fallback models.
