name: Messages
route: /messages
title: Messages
layout: split
roles: []
sections:
  - id: threads-inbox
    primitive: DataTable
    title: Inbox
    config:
      columns:
        - key: title
          label: Thread
        - key: participants_summary
          label: Participants
        - key: unread_count
          label: Unread
        - key: updated_at
          label: Updated
      api_endpoint: /api/modules/communications/list_threads
      search: true
      pagination: true
      page_size: 25
      empty:
        title: No threads yet
        message: Start a new conversation to begin collaborating.
  - id: announcements-feed
    primitive: DataTable
    title: Announcements
    config:
      columns:
        - key: title
          label: Title
        - key: audience_scope
          label: Audience
        - key: sent_at
          label: Sent at
      api_endpoint: /api/modules/communications/list_announcements
      empty:
        title: No announcements yet
        message: Posted announcements appear here for all members.
  - id: messages-guidance
    primitive: AlertBanner
    title: null
    config:
      title: Real-time messaging surface
      message: Promote a custom route or shipped chat surface when the app needs a full composer and thread view.
      variant: info