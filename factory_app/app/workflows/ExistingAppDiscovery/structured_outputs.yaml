# ExistingAppDiscovery Structured Outputs
#
# Only DiscoveryArtifactAssemblerAgent produces structured output.
# The conversational agents remain free-form.

registry:
  DiscoveryHostAgent: null
  CapabilityMapperAgent: null
  IntegrationPlannerAgent: null
  DiscoveryArtifactAssemblerAgent: ExistingAppAugmentationArtifact

models:
  UnresolvedQuestion:
    type: model
    description: Something discovery could not fully confirm yet.
    fields:
      question:
        type: str
        description: The unresolved question.
      context:
        type: str
        description: Why the question matters and what would resolve it.
      priority:
        type: str
        description: Priority level - "high", "medium", or "low".

  EntitySpec:
    type: model
    description: A meaningful business entity already present in the host app.
    fields:
      name:
        type: str
        description: Entity name such as "User", "Conversation", or "Campaign".
      description:
        type: str
        description: What the entity represents.
      evidence_source:
        type: str
        description: Where this entity came from - repo scan, api spec, runtime probe, or user confirmation.

  ServiceSurface:
    type: model
    description: A backend-facing surface the host app already exposes.
    fields:
      name:
        type: str
        description: Human-readable name such as "Messaging API" or "Notification Hub".
      kind:
        type: str
        description: Surface type such as "rest_api", "signalr_hub", "event_bus", or "worker".
      location:
        type: str
        description: Endpoint path, hub path, service name, or repo/service location.
      description:
        type: str
        description: What this surface is used for.

  RouteSurface:
    type: model
    description: A meaningful frontend route or route module already present in the host experience.
    fields:
      path:
        type: str
        description: Current route path or route group.
      module:
        type: str
        description: Owning UI module, route file, or feature area.
      description:
        type: str
        description: What users do on this route or surface.

  BrandThemeEvidence:
    type: model
    description: Structured host-brand evidence captured for Mozaiks-owned surfaces.
    fields:
      source_summary:
        type: str
        description: Short summary of the strongest available theme evidence.
      appearance:
        type: optional_str
        description: dark, light, or null when not yet clear.
      colors:
        type: list
        items: str
        description: Most relevant detected brand colors or tokens.
      fonts:
        type: list
        items: str
        description: Most relevant detected font families.
      layout_hints:
        type: list
        items: str
        description: Host shell/layout cues such as sidebar, top-bar, footer, or glass.

  CapabilitySpec:
    type: model
    description: A product capability already present in the existing app.
    fields:
      capability_id:
        type: str
        description: Snake_case identifier for the capability.
      label:
        type: str
        description: Human-readable capability label.
      description:
        type: str
        description: What the capability does for users.
      evidence_source:
        type: str
        description: Strongest source of evidence for the capability.
      confidence:
        type: str
        description: Confidence level - "confirmed", "inferred", or "unverified".
      delivery_surface:
        type: str
        description: Primary delivery surface such as "rest_api", "signalr_hub", "route_module", or "mixed".
      entrypoints:
        type: list
        items: str
        description: Key endpoints, hubs, routes, or modules that implement the capability today.
      entity_refs:
        type: list
        items: str
        description: Related entity names already present in the host app.
      agent_ready:
        type: bool
        description: Whether the capability is technically ready for agent access without a deeper migration.

  ExistingProductSpec:
    type: model
    description: The canonical product artifact discovered from the existing application.
    fields:
      app_name:
        type: str
        description: Application name.
      app_description:
        type: str
        description: What the application does in 1-2 sentences.
      app_url:
        type: optional_str
        description: Primary production, staging, or local URL.
      tech_stack:
        type: str
        description: Main languages, frameworks, and runtime technologies.
      hosting_environment:
        type: str
        description: Where the app is hosted.
      team_context:
        type: str
        description: Who built and maintains the app.
      auth_model:
        type: str
        description: How users authenticate today.
      api_surface:
        type: str
        description: Summary of the app's current backend/API surface.
      existing_experience_summary:
        type: str
        description: Short summary of the current frontend experience and user-facing modules.
      brand_theme_summary:
        type: str
        description: Summary of the host brand/theme cues Mozaiks should preserve on owned surfaces.
      brand_theme_evidence:
        type: BrandThemeEvidence
        description: Structured host-brand evidence useful for downstream theme adaptation.
      service_surfaces:
        type: list
        items: ServiceSurface
        description: Existing backend-facing surfaces available for augmentation or bridge access.
      route_surfaces:
        type: list
        items: RouteSurface
        description: Existing frontend route surfaces already present in the host experience.
      key_entities:
        type: list
        items: EntitySpec
        description: Main data entities already owned by the host product.
      has_existing_integrations:
        type: bool
        description: Whether the app already integrates with external services.
      integration_constraints:
        type: list
        items: str
        description: Known constraints that shape the adoption path.

  AgentAugmentationPlan:
    type: model
    description: How the existing app should adopt Mozaiks incrementally.
    fields:
      adoption_level:
        type: str
        description: Recommended starting level - "embed", "bridge", "ecosystem", or "native_migration".
      adoption_rationale:
        type: str
        description: Why this level is the right first move for the app.
      ui_surface_preference:
        type: str
        description: Where the Mozaiks surface should live in the current app.
      auth_delegation_model:
        type: str
        description: How Mozaiks should authenticate against the host backend.
      ai_accessible_capabilities:
        type: list
        items: str
        description: Capability ids approved for AI access in the initial rollout.
      initial_workflows:
        type: list
        items: str
        description: The first Mozaiks workflows or agentic experiences to attach.
      ecosystem_bindings:
        type: list
        items: str
        description: Optional Mozaiks ecosystem modules to bind next such as discovery, campaigns, hosting, or payments.
      repo_access_willingness:
        type: str
        description: Whether repo access is available now, later, or not at all.
      theme_adaptation_strategy:
        type: str
        description: How Mozaiks-owned surfaces should inherit or apply the host brand system.
      embed_theme_ready:
        type: bool
        description: Whether the current evidence is strong enough to theme an embed surface immediately.

  ExistingAppAugmentationArtifact:
    type: model
    description: >
      Canonical discovery output for an existing application entering the
      Mozaiks augmentation path.
    fields:
      request_intent:
        type: str
        description: Always "existing_app" for this workflow.
      existing_product_spec:
        type: ExistingProductSpec
        description: Canonical product artifact for the host app.
      capability_specs:
        type: list
        items: CapabilitySpec
        description: Product capabilities currently present in the host app.
      agent_augmentation_plan:
        type: AgentAugmentationPlan
        description: Recommended Mozaiks adoption and augmentation plan.
      discovery_brief:
        type: str
        description: Human-readable discovery summary for operator review.
      unresolved_questions:
        type: optional_list
        items: UnresolvedQuestion
        description: Open questions that still need confirmation or verification.
      artifact_version:
        type: str
        description: Schema version of this artifact.
