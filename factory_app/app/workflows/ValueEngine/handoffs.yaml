# ValueEngine Handoffs
# Follows AgentGenerator pattern: handoff_rules[]

handoff_rules:
# User → ValueInterviewAgent (initial, interview not complete)
- source_agent: user
  target_agent: ValueInterviewAgent
  handoff_type: condition
  condition_type: expression
  condition_scope: null
  condition: ${interview_complete} == False
  transition_target: AgentTarget

# ValueInterviewAgent → user (after_work, wait for user response)
- source_agent: ValueInterviewAgent
  target_agent: user
  handoff_type: after_work
  condition_type: null
  condition_scope: null
  condition: null
  transition_target: RevertToUserTarget

# ValueInterviewAgent → ResearchAgent (when NEXT emitted)
- source_agent: ValueInterviewAgent
  target_agent: ResearchAgent
  handoff_type: condition
  condition_type: expression
  condition_scope: null
  condition: ${interview_complete} == True
  transition_target: AgentTarget

# ResearchAgent → GapAnalysisAgent (pipeline handoff)
- source_agent: ResearchAgent
  target_agent: GapAnalysisAgent
  handoff_type: after_work
  condition_type: null
  condition_scope: null
  condition: null
  transition_target: AgentTarget

# GapAnalysisAgent → user (present concept, wait for approval)
- source_agent: GapAnalysisAgent
  target_agent: user
  handoff_type: after_work
  condition_type: null
  condition_scope: null
  condition: null
  transition_target: RevertToUserTarget

# User → GapAnalysisAgent (when concept presented, user gives feedback)
- source_agent: user
  target_agent: GapAnalysisAgent
  handoff_type: condition
  condition_type: expression
  condition_scope: null
  condition: ${concept_presented} == True
  transition_target: AgentTarget

# User → terminate (when user approves and generation completes)
- source_agent: user
  target_agent: terminate
  handoff_type: condition
  condition_type: string_llm
  condition_scope: null
  condition: When the user confirms completion and is ready to proceed to the next workflow (AgentGenerator or AppGenerator).
  transition_target: TerminateTarget
