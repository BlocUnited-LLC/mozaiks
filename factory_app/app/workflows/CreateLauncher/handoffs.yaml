handoff_rules:

- source_agent: user
  target_agent: CreateLaunchAgent
  handoff_type: condition
  condition_type: expression
  condition: ${create_launch_result} == None
  transition_target: AgentTarget

- source_agent: CreateLaunchAgent
  target_agent: user
  handoff_type: after_work
  transition_target: RevertToUserTarget

- source_agent: user
  target_agent: CreateLaunchAgent
  handoff_type: condition
  condition_type: string_llm
  condition: >
    When the user wants to relaunch the create flow, switch between new and
    existing app modes, or start another app creation flow.
  transition_target: AgentTarget

- source_agent: user
  target_agent: terminate
  handoff_type: condition
  condition_type: string_llm
  condition: >
    When the user says they are done, no longer wants to launch create, or
    thanks the assistant without requesting another launch.
  transition_target: TerminateTarget