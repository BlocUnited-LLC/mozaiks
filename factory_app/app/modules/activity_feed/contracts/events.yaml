schema_version: mozaiks.events.v1
events:
  - type: domain.social.activity.recorded
    version: 1
    producer: activity_feed
    description: An activity event was recorded in the social feed.
    payload_schema:
      type: object
      required: [event_id, activity_type, actor_id]
      properties:
        event_id:      { type: string }
        activity_type: { type: string }
        actor_id:      { type: string }
        created_at:    { type: string }
