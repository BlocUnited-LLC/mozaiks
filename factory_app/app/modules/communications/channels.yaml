schema_version: mozaiks.channels.v1
channels:
  - name: thread_updates
    event: domain.communications.message_sent
    transport: websocket
    payload_fields:
      - thread_id
      - message_id
      - sender_id
      - body_preview
      - sent_at
  - name: announcement_notifications
    event: domain.communications.announcement_posted
    transport: push
    payload_fields:
      - announcement_id
      - title
      - audience_scope
      - sent_at
    when: recipient_is_offline