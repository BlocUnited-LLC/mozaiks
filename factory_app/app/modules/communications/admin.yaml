schema_version: mozaiks.admin.v2
panels:
  - id: communications.overview
    label: Communications
    description: Monitor thread volume, unread state, and recent announcements.
    section: operations
    order: 250
    renderer: schema
    layout: grid
    sections:
      - id: communications-active-threads
        primitive: Stat
        title: Active threads
        config:
          label: Active threads
          value_key: metrics.active_threads
      - id: communications-unread-messages
        primitive: Stat
        title: Unread messages
        config:
          label: Unread messages
          value_key: metrics.unread_messages
      - id: communications-announcements
        primitive: DataTable
        title: Recent announcements
        config:
          columns:
            - key: title
              label: Title
            - key: audience_scope
              label: Audience
            - key: sent_at
              label: Sent at
          api_endpoint: /api/modules/communications/admin/announcements
          empty:
            title: No announcements
            message: Recent announcements appear here after they are posted.
        roles:
          - admin
component: null
permissions:
  - communications.moderate
hooks: []