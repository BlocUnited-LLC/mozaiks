schema_version: mozaiks.admin.v2
panels:
  - id: communications.overview
    label: Communications
    description: Monitor thread volume, unread state, and recent announcements.
    section: operations
    order: 250
    renderer: schema
    layout: grid
    sections:
      - id: communications-summary
        primitive: SummaryStrip
        title: Communications summary
        config:
          items:
            - label: Active threads
              value: 0
              detail: Threads with recent activity
            - label: Unread messages
              value: 0
              detail: Messages awaiting review
      - id: communications-announcements
        primitive: DataTable
        title: Recent announcements
        config:
          columns:
            - key: title
              label: Title
            - key: audience_scope
              label: Audience
            - key: sent_at
              label: Sent at
          api_endpoint: /api/modules/communications/admin/announcements
          empty:
            title: No announcements
            message: Recent announcements appear here after they are posted.
        roles:
          - admin
    component: null
    permissions:
      - communications.moderate
hooks: []
