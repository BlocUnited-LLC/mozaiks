schema_version: mozaiks.notifications
notifications:
  - id: communications.message_sent.in_app
    event_type: domain.communications.message_sent
    title: New message
    body: '{{ sender_id }} sent a new message in this thread.'
    channels:
      - in_app
    audience:
      roles: []
      permissions: []
      resolver: backend.notifications:resolve_thread_recipients
    preference_key: communications.direct_messages
    default_enabled: true
    renderer: null
  - id: communications.announcement_posted.broadcast
    event_type: domain.communications.announcement_posted
    title: New announcement
    body: '{{ title }}'
    channels:
      - in_app
      - email
    audience:
      roles:
        - member
      permissions: []
      resolver: null
    preference_key: communications.announcements
    default_enabled: true
    renderer: null
