schema_version: mozaiks.events
events:
  - type: domain.communications.thread_created
    version: 1
    description: A new standalone communication thread was created.
    producer: communications
    payload_schema:
      type: object
      required:
        - thread_id
        - title
        - participant_ids
        - created_by
        - created_at
      properties:
        thread_id:
          type: string
        title:
          type: string
        participant_ids:
          type: array
          items:
            type: string
        thread_type:
          type: string
        created_by:
          type: string
        created_at:
          type: string
  - type: domain.communications.message_sent
    version: 1
    description: A message was added to a communication thread.
    producer: communications
    payload_schema:
      type: object
      required:
        - message_id
        - thread_id
        - sender_id
        - body_preview
        - sent_at
      properties:
        message_id:
          type: string
        thread_id:
          type: string
        sender_id:
          type: string
        recipient_ids:
          type: array
          items:
            type: string
        body_preview:
          type: string
        sent_at:
          type: string
  - type: domain.communications.thread_read
    version: 1
    description: A participant updated read state for a communication thread.
    producer: communications
    payload_schema:
      type: object
      required:
        - thread_id
        - actor_id
        - message_id
        - read_at
      properties:
        thread_id:
          type: string
        actor_id:
          type: string
        message_id:
          type: string
        read_at:
          type: string
  - type: domain.communications.announcement_posted
    version: 1
    description: An announcement was posted to an organization, role, or thread audience.
    producer: communications
    payload_schema:
      type: object
      required:
        - announcement_id
        - title
        - audience_scope
        - sent_by
        - sent_at
      properties:
        announcement_id:
          type: string
        title:
          type: string
        audience_scope:
          type: string
        sent_by:
          type: string
        sent_at:
          type: string
