schema_version: mozaiks.notifications.v1
notifications:
  - id: friend_request_received
    description: Notify a user when they receive a new friend request.
    "on": domain.social.friend_request.sent
    template:
      title: "{{requester_name}} sent you a friend request"
      body: "{{requester_name}} wants to connect with you."
    channels:
      - in_app
    audience:
      user_id_field: recipient_id
    context_fields:
      - request_id
      - requester_id
      - requester_name

  - id: friend_request_accepted
    description: Notify a user when their friend request is accepted.
    "on": domain.social.friendship.created
    template:
      title: "You and another user are now friends"
      body: "Your friend request was accepted."
    channels:
      - in_app
    audience:
      user_id_field: requester_id
    context_fields:
      - friendship_id
      - user_a_id
      - user_b_id
