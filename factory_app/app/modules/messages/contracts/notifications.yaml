schema_version: mozaiks.notifications.v1

notifications:
  - id: message_sent
    description: Notify message recipients when a new internal message is sent.
    event_type: domain.messages.message_sent
    channels:
      - in_app
    audience:
      user_id_field: recipient_ids
    template:
      title: "New message"
      body: "{{body_preview}}"
    context_fields:
      - thread_id
      - message_id
      - related_type
      - related_id
