schema_version: mozaiks.module.v1
module:
  id: messages
  display_name: Messages
  version: 1.0.0
  description: Stub messaging module for Studio. Returns demo data for profile panel testing.
  handler: backend.handler:MessagesHandler

permissions:
  - id: messages.read
    description: Read messages.

actions:
  - id: get_unread_summary
    api_surface: public_readonly
    description: Return unread thread count summary for the current user.
    handler_method: get_unread_summary
    output_schema:
      type: object
      properties:
        unread_thread_count: { type: integer }
        total_thread_count:  { type: integer }
    permissions: []

  - id: list_threads
    api_surface: public_readonly
    description: Return paginated list of message threads for the current user.
    handler_method: list_threads
    output_schema:
      type: object
      properties:
        threads:     { type: array }
        next_cursor: { type: string, nullable: true }
    permissions: []
