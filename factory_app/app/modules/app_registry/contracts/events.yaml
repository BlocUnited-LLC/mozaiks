schema_version: mozaiks.events.v1
events:
  - type: domain.app_registry.app_created
    version: 1
    description: Emitted when an app lifecycle record is created.
    producer: app_registry
    payload_schema:
      type: object
      required:
        - build_registry_id
        - app_id
        - lifecycle_state
  - type: domain.app_registry.status_changed
    version: 1
    description: Emitted when an app lifecycle record changes state.
    producer: app_registry
    payload_schema:
      type: object
      required:
        - build_registry_id
        - app_id
        - lifecycle_state
  - type: domain.app_registry.app_promoted
    version: 1
    description: Emitted when a reviewed app bundle is promoted to active status.
    producer: app_registry
    payload_schema:
      type: object
      required:
        - build_registry_id
        - app_id
        - lifecycle_state
      properties:
        bundle_path:
          type: string
