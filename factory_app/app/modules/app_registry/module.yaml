schema_version: mozaiks.module.v1
module:
  id: app_registry
  display_name: App Registry
  version: 1.0.0
  description: Durable app records and lifecycle state for Mozaiks Studio.
  owner: app
  visibility: private
  handler: backend.handler:AppRegistryModule
permissions:
  - id: app_registry.read
    description: View app records and lifecycle state.
  - id: app_registry.write
    description: Create app records and update lifecycle state.
actions:
  - id: create_app_record
    description: Create or reopen an app lifecycle record.
    handler_method: create_app_record
    input_schema:
      type: object
      properties:
        name:
          type: string
          description: Optional real app name. Omit while the app is still provisional.
        name_source:
          type: string
          enum:
            - provisional
            - value_engine_concept
            - imported_app
            - manual
        description:
          type: string
        status:
          type: string
          enum:
            - draft
            - building
            - review
            - configuring
            - deploying
            - active
            - needs_revision
            - archived
        app_id:
          type: string
        chat_app_id:
          type: string
          description: Factory session app id used to resume the build chat.
        active_chat_id:
          type: string
          description: Current chat session that owns the active build.
        active_workflow_id:
          type: string
          description: Current workflow that should be resumed while the build is active.
        build_context_profile:
          type: object
          description: Compact summary of selected build contexts, packs, and catalog inputs for this app build.
        current_build_run:
          type: object
          description: Active build run pointer used by Studio continue-build and control-plane re-entry.
        governance_mode:
          type: string
          enum:
            - founder_led
            - community_dao
          description: >
            Governance mode for the app. founder_led means the creator and their
            invited team control all proposals, voting weight, and revenue decisions.
            community_dao means the community earns governance rights through
            participation — voting weight is distributed by the app's participation
            policy and any member above threshold can create proposals.
            Defaults to founder_led. Hosted products may extend this with a
            set_governance_mode action and react to the domain.app_registry.governance_mode_changed event.
    output_schema:
      type: object
      properties:
        success:
          type: boolean
        app:
          type: object
    permissions:
      - app_registry.write
    emits:
      - domain.app_registry.app_created
  - id: update_build_status
    description: Update the lifecycle state for an existing app record.
    handler_method: update_build_status
    input_schema:
      type: object
      required:
        - build_registry_id
        - status
      properties:
        build_registry_id:
          type: string
        status:
          type: string
          enum:
            - draft
            - building
            - review
            - configuring
            - deploying
            - active
            - needs_revision
            - archived
        bundle_path:
          type: string
        artifact_version_id:
          type: string
        workflow_sequence:
          type: string
        active_chat_id:
          type: string
        active_workflow_id:
          type: string
        current_build_run:
          type: object
    output_schema:
      type: object
      properties:
        success:
          type: boolean
        app:
          type: object
    permissions:
      - app_registry.write
    emits:
      - domain.app_registry.status_changed
  - id: list_apps
    description: List app records for the current user scope.
    handler_method: list_apps
    input_schema:
      type: object
    output_schema:
      type: object
      properties:
        apps:
          type: array
          items:
            type: object
    permissions:
      - app_registry.read
  - id: get_app_record
    description: Fetch one app lifecycle record by app id or build registry id.
    handler_method: get_app_record
    input_schema:
      type: object
      properties:
        app_id:
          type: string
        build_registry_id:
          type: string
    output_schema:
      type: object
      properties:
        app:
          type: object
    permissions:
      - app_registry.read
  - id: promote_build
    description: Promote a reviewed app bundle from 'review' to 'active'. Only valid when lifecycle state is 'review'.
    handler_method: promote_build
    input_schema:
      type: object
      required:
        - build_registry_id
      properties:
        build_registry_id:
          type: string
    output_schema:
      type: object
      properties:
        success:
          type: boolean
        app:
          type: object
    permissions:
      - app_registry.write
    emits:
      - domain.app_registry.app_promoted
  - id: set_governance_mode
    description: >
      Transition the app's governance mode between founder_led and community_dao.
      founder_led means the creator controls all governance and economics.
      community_dao means the community earns governance rights through participation.
      Hosted products should react to domain.app_registry.governance_mode_changed
      to apply product-specific policy transitions (e.g. MozaiksScore redistribution,
      community join-flow activation, participation policy migration).
      Only the app owner or a platform admin may call this action.
    handler_method: set_governance_mode
    input_schema:
      type: object
      required: [build_registry_id, governance_mode]
      properties:
        build_registry_id: { type: string }
        governance_mode:
          type: string
          enum: [founder_led, community_dao]
    output_schema:
      type: object
      properties:
        success: { type: boolean }
        governance_mode: { type: string }
    permissions:
      - app_registry.write
    emits:
      - domain.app_registry.governance_mode_changed
capabilities:
  - capability_id: app_registry.list
    kind: action
    target: list_apps
    title: List Apps
    permissions:
      - app_registry.read
    input_schema:
      type: object
  - capability_id: app_registry.create
    kind: action
    target: create_app_record
    title: Create App Record
    permissions:
      - app_registry.write
    input_schema:
      type: object
      required:
        - name
      properties:
        name:
          type: string
