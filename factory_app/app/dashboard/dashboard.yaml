schema_version: mozaiks.dashboard.v1
extends: default

# Factory app intentionally uses the canonical Workspace Dashboard + App
# Dashboard lanes. App Zero and customer app workspaces can overlay individual
# portals by id without replacing the whole default contract.
#
# Every enabled portal here has a mounted route in ui/route_manifest.json, and
# every route shown in Studio navigation has an enabled portal here.
# tests/test_dashboard_manifest.py runs validate_dashboard_manifest_routes on
# this file and that manifest together.

workspace:
  portals:
    - id: portfolio
      label: My Apps
      route: /apps
      icon: apps
      order: 0

    - id: performance
      label: Performance
      route: /performance
      icon: pulse
      order: 10
      description: Portfolio revenue and user performance with attention insights.
      panels:
        - id: performance
          type: workspace_usage_summary
          title: Performance

    - id: revenue
      label: Revenue
      route: /portfolio/revenue
      icon: billing
      order: 15
      description: Customer revenue by app in the authorized portfolio.

    - id: usage
      label: Usage
      route: /usage
      icon: chart
      order: 20

    - id: integrations
      label: Integrations
      route: /integrations
      icon: plug
      order: 30

    - id: support
      label: Support
      route: /support
      icon: support
      order: 40
      description: Apps with support chats, each linking to that app's support inbox.

    - id: ai-models
      label: AI models
      route: /settings/ai-models
      icon: settings
      order: 50
      description: Default and allowed AI models for Factory builds and refinements.

app:
  portals:
    - id: overview
      label: Overview
      route: /apps/:appId/overview
      icon: dashboard
      order: 0

    - id: revenue
      label: Revenue
      route: /apps/:appId/revenue
      icon: billing
      order: 4
      description: Recurring-revenue metrics, trend, and MRR movement drivers.
      panels:
        - id: revenue
          type: kpi_grid
          title: Revenue

    - id: audience
      label: Users
      route: /apps/:appId/audience
      icon: users
      order: 6
      description: Acquisition, engagement, conversion, and the app lifecycle funnel.
      panels:
        - id: audience
          type: kpi_grid
          title: Users

    - id: building
      label: Project
      route: /apps/:appId/building
      icon: hammer
      order: 10

    - id: integrations
      label: Integrations
      route: /apps/:appId/integrations
      icon: plug
      order: 26

    - id: launch
      description: Download the validated app bundle to run on your own infrastructure.
      capabilities: []

    - id: billing
      label: Billing
      route: /apps/:appId/billing
      icon: billing
      order: 40
      description: Plans and prices declared by the selected app's validated build.

    - id: usage
      label: Usage
      route: /apps/:appId/usage
      icon: chart
      order: 60

    - id: health
      label: Health
      route: /apps/:appId/health
      icon: pulse
      order: 65
      description: What needs attention - build validation, failed runs, and integration credentials.

    - id: support
      label: Support
      route: /apps/:appId/support
      icon: support
      order: 70

    # Default portals this Studio has no page for. They stay in the default
    # contract for hosts that mount them; a portal without a route is disabled
    # here rather than left pointing nowhere.
    - id: branding
      enabled: false
    - id: growth
      enabled: false
    - id: users
      enabled: false
    - id: settings
      enabled: false
