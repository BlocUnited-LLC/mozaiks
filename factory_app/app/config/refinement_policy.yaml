schema_version: mozaiks.refinement.policy.v1
enabled: true

# ---------------------------------------------------------------------------
# LLM Profiles
#
# These profiles configure AG2 structured-output checkpoint calls. They do not
# select the ACP coding adapter or its model. Each profile maps to an AG2
# ModelConfig via the api_type + model fields.
# Supported api_type values: openai | google | anthropic | ollama
#
# Operators can replace these provider/model pairs with their own supported
# models. The shipped profiles use the OSS Gemini default; free API access is
# subject to Google's project quotas and data terms.
# Every enabled capability below must reference one of these profiles with a
# non-empty model. Inline capability llm_config is not accepted.
# ---------------------------------------------------------------------------
llm_profiles:
  classifier:
    purpose: Classify refinement requests into the stable refinement change classes.
    expected_behavior: deterministic structured classification
    llm_config:
      api_type: google
      model: gemini-3.8-flash
  impact_analyzer:
    purpose: Assess source dependencies and select scoped files and contract surfaces for a refinement.
    expected_behavior: deterministic structured planning
    llm_config:
      api_type: google
      model: gemini-3.8-flash
  # Advisory workflow-context name; the workflow runner does not yet resolve
  # its model from this refinement policy.
  architecture:
    purpose: Concept-level planning for conceptual_replan and full_rebuild sequences.
    expected_behavior: deep structured architecture reasoning without code generation
    llm_config:
      api_type: google
      model: gemini-3.8-flash
  codegen:
    purpose: Generate structured-output patches and regenerate selected contract surfaces.
    expected_behavior: deterministic structured file generation
    llm_config:
      api_type: google
      model: gemini-3.8-flash
classifier:
  enabled: true
  llm_profile: classifier
dependency_graph:
  enabled: true
  llm_profile: impact_analyzer
coding:
  enabled: true
  # Used by structured-output coding. ACP runs a separate coding agent and
  # does not consume this model profile.
  llm_profile: codegen
  # ACP execution is disabled until an isolated worker is connected to this
  # route. The structured-output provider uses the codegen profile above.
  # Budgets are hard ceilings enforced outside the model. No credentials or
  # adapter connection details belong in this file.
  providers:
    acp:
      enabled: false
      adapter: claude_code
contract_surface:
  enabled: true
  # Planning selects surfaces; regeneration writes files with its own
  # explicit profile. Both may point at shared profiles above.
  llm_profile: impact_analyzer
  regeneration_llm_profile: codegen
scope:
  enabled: true
  llm_profile: impact_analyzer
