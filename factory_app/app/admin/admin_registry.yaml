schema_version: mozaiks.admin.registry.v1

# Factory app admin portal — declares all admin pages for Mozaiks Studio.
#
# scope: workspace  — platform-operator nav (visible from the top-level Studio)
# scope: app        — per-app nav (visible when browsing a specific app's admin)
# show_in_navigation: false keeps a route available as a deep detail page
# while omitting it from the sidebar.
#
# Modules declare which page their panels attach to via the `page` field in
# modules/{module}/contracts/admin.yaml.

pages:
  # ── Workspace-level (Studio) ──────────────────────────────────────────────
  - id: apps
    label: Apps
    path: /apps
    icon: apps
    scope: workspace
    surfaces: [studio]
    order: 0
    enabled: true

  - id: workspace-usage
    label: Usage
    path: /usage
    icon: chart
    scope: workspace
    surfaces: [studio]
    order: 10
    enabled: true

  - id: workspace-integrations
    label: Integrations
    path: /integrations
    icon: plug
    scope: workspace
    surfaces: [studio]
    order: 20
    enabled: true

  # ── App-level (per-app admin portal) ──────────────────────────────────────
  - id: overview
    label: Overview
    path: /apps/:appId/overview
    icon: dashboard
    scope: app
    surfaces: [studio]
    order: 0
    enabled: true

  - id: users
    label: Users
    path: /apps/:appId/users
    icon: users
    scope: app
    surfaces: [studio]
    order: 10
    enabled: true

  - id: usage
    label: Usage
    path: /apps/:appId/usage
    icon: chart
    scope: app
    surfaces: [studio]
    order: 20
    enabled: true

  - id: health
    label: Health
    path: /apps/:appId/health
    icon: pulse
    scope: app
    surfaces: [studio]
    order: 30
    enabled: true

  - id: activity
    label: Activity
    path: /apps/:appId/activity
    icon: history
    scope: app
    surfaces: [studio]
    order: 40
    enabled: true

  - id: operations
    label: Operations
    path: /apps/:appId/operations
    icon: server
    scope: app
    surfaces: [studio]
    order: 50
    enabled: true

  - id: settings
    label: Settings
    path: /apps/:appId/settings
    icon: settings
    scope: app
    surfaces: [studio]
    order: 60
    enabled: true

  - id: integrations
    label: Integrations
    path: /apps/:appId/integrations
    icon: plug
    scope: app
    surfaces: [studio]
    order: 70
    enabled: true
    show_in_navigation: false

  - id: support
    label: Support
    path: /apps/:appId/support
    icon: support
    scope: app
    surfaces: [studio]
    order: 80
    enabled: true
