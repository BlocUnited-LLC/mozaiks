name: GettingStarted
route: /getting-started
title: Getting Started
layout: full-width

sections:
  # Welcome banner
  - id: welcome-banner
    primitive: AlertBanner
    config:
      title: Welcome to Mozaiks
      message: Follow the steps below to set up your workspace and build your first AI-powered application.
      variant: info

  # Setup checklist as a timeline
  - id: setup-steps
    primitive: Timeline
    title: Setup Steps
    config:
      items:
        - label: Install and configure
          description: Set up your environment variables — OPENAI_API_KEY and MONGO_URI are required to run workflows.
          status: pending
        - label: Start the runtime
          description: Run `mozaiks serve .` to start the platform host, or `mozaiks serve . --host studio` for the Studio management interface.
          status: pending
        - label: Create your first workflow
          description: Use the AgentGenerator workflow to scaffold a custom AI workflow with agents, tools, and UI components.
          status: pending
        - label: Generate your first app
          description: Use the AppGenerator workflow to produce a full-stack application bundle with modules, pages, and a backend.
          status: pending
        - label: Promote to production
          description: Review the generated artifacts in the Studio, then promote the build to an active app workspace.
          status: pending

  # Quick links as a grid of cards
  - id: quick-links
    primitive: Grid
    title: Resources
    config:
      columns: 3
      gap: md
      children:
        - primitive: Card
          config:
            title: Documentation
            subtitle: Architecture, contracts, and developer guides.
            actions:
              - id: open-docs
                label: Open Docs
                variant: outline
                action_type: navigate
                href: /docs
        - primitive: Card
          config:
            title: Studio
            subtitle: Manage workspaces, build runs, and artifacts.
            actions:
              - id: open-studio
                label: Open Studio
                variant: outline
                action_type: navigate
                href: /studio
        - primitive: Card
          config:
            title: Chat
            subtitle: Start a conversation with the AI runtime.
            actions:
              - id: open-chat
                label: Open Chat
                variant: primary
                action_type: navigate
                href: /chat

  # Primary actions
  - id: primary-actions
    primitive: ActionButton
    config:
      layout: row
      actions:
        - id: go-chat
          label: Start in Chat
          variant: primary
          action:
            action_type: navigate
            href: /chat
        - id: go-dashboard
          label: Back to Dashboard
          variant: outline
          action:
            action_type: navigate
            href: /dashboard
