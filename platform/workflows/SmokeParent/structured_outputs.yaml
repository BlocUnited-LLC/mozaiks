registry:
  PlannerAgent: SmokePlan
  PresenterAgent: SmokePresentation

models:
  SmokeChildSpec:
    type: model
    fields:
      name:
        type: literal
        values:
          - SmokeChild
        description: Fixed child workflow name for the live smoke run.
      description:
        type: str
        description: Short description of the child task.
      initial_message:
        type: str
        description: Seed message passed to the child workflow.

  SmokePlan:
    type: model
    fields:
      agent_message:
        type: str
        description: Short status message shown to the user.
      workflows:
        type: list
        items: SmokeChildSpec
        description: Child workflows to spawn.

  SmokePresentation:
    type: model
    fields:
      agent_message:
        type: str
        description: Final user-facing message after fan-in resume.
      summary:
        type: str
        description: Summary of the child workflow result.
      worker_name:
        type: str
        description: Worker identifier echoed from the child output.
