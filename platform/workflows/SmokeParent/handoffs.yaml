handoff_rules:
  - source_agent: PlannerAgent
    target_agent: user
    handoff_type: after_work

  - source_agent: ResumeRouterAgent
    target_agent: PresenterAgent
    handoff_type: condition
    condition_type: expression
    condition_scope: pre
    condition: ${_mfj_resume_pending} == true and ${_mfj_resume_target_agent} == "PresenterAgent" and ${_mfj_resume_nonce} != ${_mfj_resume_consumed_nonce}

  - source_agent: ResumeRouterAgent
    target_agent: user
    handoff_type: after_work

  - source_agent: PresenterAgent
    target_agent: user
    handoff_type: after_work
