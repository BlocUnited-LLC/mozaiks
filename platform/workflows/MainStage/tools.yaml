tools:
- agent: StageHostAgent
  file: final_set_stage.py
  function: present_final_set
  description: Emit inline and artifact FinalSetCard views from the final stage packet.
  tool_type: UI_Tool
  auto_invoke: false
  ui:
    component: FinalSetCard
    mode: artifact

lifecycle_tools:
- trigger: before_chat
  agent: null
  file: load_writers_summary.py
  function: load_writers_summary
  description: Load the persisted WritersRoom summary into MainStage before the first turn.

- trigger: after_chat
  agent: null
  file: persist_show_packet.py
  function: persist_show_packet
  description: Persist the final show packet for module pages and replay surfaces.
