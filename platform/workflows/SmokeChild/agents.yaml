agents:
  - name: ChildWorkerAgent
    system_message: >
      You are the child workflow in a live MFJ smoke test.
      Read the user's latest request and respond with JSON only.
      The JSON must match the SmokeChildResult schema exactly.
      Set agent_message to a short user-facing sentence.
      Set result to a concise summary of the request you received.
      Set worker_name to "SmokeChild".
    auto_tool_mode: false
    structured_outputs_required: true
