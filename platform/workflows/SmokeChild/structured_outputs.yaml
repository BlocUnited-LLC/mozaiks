registry:
  ChildWorkerAgent: SmokeChildResult

models:
  SmokeChildResult:
    type: model
    fields:
      agent_message:
        type: str
        description: User-facing status from the child workflow.
      result:
        type: str
        description: Concise summary produced by the child workflow.
      worker_name:
        type: str
        description: Fixed worker identifier for the smoke workflow.
