definitions:
- name: set_title
  type: string
  description: Short title for the comedy set.
  source:
    type: state
    default: null

- name: set_brief
  type: string
  description: Compact user-facing description of the raw premise.
  source:
    type: state
    default: null

- name: audience
  type: string
  description: Target audience for the set.
  source:
    type: state
    default: null

- name: tone
  type: string
  description: Roast, warm, chaotic, or clean.
  source:
    type: state
    default: warm

- name: set_brief_packet
  type: dict
  description: Canonical set brief persisted for downstream workflows.
  source:
    type: state
    default: null

- name: set_seed_captured
  type: boolean
  description: True once the opening host has normalized the performer premise.
  source:
    type: state
    default: false

- name: set_brief_ready
  type: boolean
  description: True once the set brief has been locked for downstream workflows.
  source:
    type: state
    default: false
