handoff_rules:
- source_agent: user
  target_agent: ClubHostAgent
  handoff_type: condition
  condition_type: expression
  condition_scope: pre
  condition: ${set_seed_captured} != True
  transition_target: AgentTarget

- source_agent: ClubHostAgent
  target_agent: PremiseCanonAgent
  handoff_type: condition
  condition_type: expression
  condition_scope: after
  condition: ${set_seed_captured} == True
  transition_target: AgentTarget

- source_agent: ClubHostAgent
  target_agent: user
  handoff_type: after_work
  condition_type: null
  condition_scope: null
  condition: null
  transition_target: RevertToUserTarget

- source_agent: PremiseCanonAgent
  target_agent: terminate
  handoff_type: condition
  condition_type: expression
  condition_scope: after
  condition: ${set_brief_ready} == True
  transition_target: TerminateTarget

- source_agent: PremiseCanonAgent
  target_agent: user
  handoff_type: after_work
  condition_type: null
  condition_scope: null
  condition: null
  transition_target: RevertToUserTarget
