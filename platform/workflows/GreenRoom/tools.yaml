tools:
- agent: ClubHostAgent
  file: green_room_seed.py
  function: capture_set_seed
  description: Normalize the performer's raw premise into compact green room fields.
  tool_type: Agent_Tool
  auto_invoke: false

- agent: PremiseCanonAgent
  file: green_room_seed.py
  function: capture_set_brief
  description: Write the canonical set brief into workflow context.
  tool_type: Agent_Tool
  auto_invoke: false

- agent: PremiseCanonAgent
  file: premise_pulse.py
  function: present_premise_pulse
  description: Emit an inline premise pulse card after canon capture.
  tool_type: UI_Tool
  auto_invoke: false
  ui:
    component: PremisePulseCard
    mode: inline

lifecycle_tools:
- trigger: after_chat
  agent: null
  file: persist_set_brief.py
  function: persist_set_brief
  description: Persist the canonical set brief for WritersRoom.
