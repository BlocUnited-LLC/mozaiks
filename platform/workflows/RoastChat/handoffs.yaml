handoff_rules:
- source_agent: user
  target_agent: InterviewAgent
  handoff_type: condition
  condition_type: expression
  condition_scope: pre
  condition: ${is_child_workflow} != true and ${roast_seed_collected} == false
  transition_target: AgentTarget

- source_agent: InterviewAgent
  target_agent: DecompositionAgent
  handoff_type: condition
  condition_type: expression
  condition_scope: after
  condition: ${is_child_workflow} != true and ${roast_seed_collected} == true
  transition_target: AgentTarget

- source_agent: InterviewAgent
  target_agent: user
  handoff_type: after_work
  condition_type: null
  condition_scope: null
  condition: null
  transition_target: RevertToUserTarget

- source_agent: ResumeRouterAgent
  target_agent: HostAgent
  handoff_type: condition
  condition_type: expression
  condition_scope: pre
  condition: ${_mfj_resume_pending} == true and ${_mfj_resume_target_agent} == "HostAgent" and ${_mfj_resume_nonce} != ${_mfj_resume_consumed_nonce}
  transition_target: AgentTarget

- source_agent: ResumeRouterAgent
  target_agent: user
  handoff_type: after_work
  condition_type: null
  condition_scope: null
  condition: null
  transition_target: RevertToUserTarget

- source_agent: HostAgent
  target_agent: user
  handoff_type: after_work
  condition_type: null
  condition_scope: null
  condition: null
  transition_target: RevertToUserTarget

- source_agent: ContrarianJudgeAgent
  target_agent: terminate
  handoff_type: condition
  condition_type: expression
  condition_scope: after
  condition: ${is_child_workflow} == true
  transition_target: TerminateTarget

- source_agent: RageTesterJudgeAgent
  target_agent: terminate
  handoff_type: condition
  condition_type: expression
  condition_scope: after
  condition: ${is_child_workflow} == true
  transition_target: TerminateTarget

- source_agent: MoonshotJudgeAgent
  target_agent: terminate
  handoff_type: condition
  condition_type: expression
  condition_scope: after
  condition: ${is_child_workflow} == true
  transition_target: TerminateTarget
