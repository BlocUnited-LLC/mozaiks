definitions:
- name: profile_line
  type: string
  description: Two-line user profile used for roast decomposition.
  source:
    type: runtime
    default: null

- name: roast_style
  type: string
  description: Requested roast intensity (gentle, medium, savage).
  source:
    type: runtime
    default: medium

- name: roast_seed_collected
  type: boolean
  description: True once InterviewAgent has captured seed context.
  source:
    type: runtime
    default: false

- name: mfj_roast_results
  type: dict
  description: Fan-in payload from the parallel roast judges.
  source:
    type: runtime
    default: null

- name: host_summary
  type: dict
  description: Final host-computed summary for UI tool rendering.
  source:
    type: runtime
    default: null

- name: roast_verdict
  type: string
  description: Host verdict after fan-in.
  source:
    type: runtime
    default: null
