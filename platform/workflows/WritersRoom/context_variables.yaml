definitions:
- name: set_title
  type: string
  description: Short title for the set under development.
  source:
    type: state
    default: null

- name: set_brief
  type: string
  description: Compact description of the raw premise.
  source:
    type: state
    default: null

- name: audience
  type: string
  description: Target audience for the set.
  source:
    type: state
    default: null

- name: tone
  type: string
  description: Roast, warm, chaotic, or clean.
  source:
    type: state
    default: warm

- name: set_brief_packet
  type: dict
  description: Canonical set brief loaded from GreenRoom or created in-place.
  source:
    type: state
    default: null

- name: set_source_chat_id
  type: string
  description: Source GreenRoom chat that supplied the brief.
  source:
    type: state
    default: null

- name: room_seed_ready
  type: boolean
  description: True when the workflow has enough brief context to decompose and fan out.
  source:
    type: state
    default: false

- name: mfj_writers_room_results
  type: dict
  description: Fan-in payload from the four parallel WritersRoom lanes.
  source:
    type: state
    default: null

- name: writers_summary
  type: dict
  description: Final head-writer summary for module pages and MainStage.
  source:
    type: state
    default: null

- name: set_direction
  type: string
  description: Recommended direction after fan-in.
  source:
    type: state
    default: null
