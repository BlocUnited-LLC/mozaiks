# JokeFactory Handoff Rules
# Host gathers prefs → Decomposer fans out 3 parallel children
# Children finish → ResumeRouter wakes → Presenter shows all jokes

handoff_rules:
# Initial entry
- source_agent: user
  target_agent: JokeHostAgent
  handoff_type: condition
  condition_type: expression
  condition: ${host_complete} == False
  transition_target: AgentTarget

# JokeHostAgent waits for user input between turns
- source_agent: JokeHostAgent
  target_agent: user
  handoff_type: after_work
  transition_target: RevertToUserTarget

# Once preferences confirmed, decompose into parallel jokes
- source_agent: JokeHostAgent
  target_agent: JokeDecomposerAgent
  handoff_type: condition
  condition_type: expression
  condition: ${host_complete} == True
  transition_target: AgentTarget

# Decomposer hands back to user while MFJ children run in background
- source_agent: JokeDecomposerAgent
  target_agent: user
  handoff_type: after_work
  transition_target: RevertToUserTarget

# Fan-in resume: router wakes up and routes to presenter
- source_agent: ResumeRouterAgent
  target_agent: JokePresenterAgent
  handoff_type: after_work
  transition_target: AgentTarget

# Presenter hands back to user with final joke presentation
- source_agent: JokePresenterAgent
  target_agent: user
  handoff_type: after_work
  transition_target: RevertToUserTarget

# User wants another round → reset and go again
- source_agent: user
  target_agent: JokeHostAgent
  handoff_type: condition
  condition_type: string_llm
  condition: >
    When the user asks for more jokes, a different topic, a different style,
    or another round of joke generation.
  transition_target: AgentTarget

# User is satisfied → end
- source_agent: user
  target_agent: terminate
  handoff_type: condition
  condition_type: string_llm
  condition: >
    When the user says they are satisfied, done, happy, or thanks the team
    without requesting more jokes.
  transition_target: TerminateTarget


# JokeHostAgent -> user (waiting for preferences)
- source_agent: JokeHostAgent
  target_agent: user
  handoff_type: after_work
  transition_target: RevertToUserTarget

# JokeHostAgent -> JokeWriterAgent (when preferences confirmed)
- source_agent: JokeHostAgent
  target_agent: JokeWriterAgent
  handoff_type: condition
  condition_type: expression
  condition: ${host_complete} == True
  transition_target: AgentTarget

# JokeWriterAgent -> JokeCriticAgent (after writing jokes)
- source_agent: JokeWriterAgent
  target_agent: JokeCriticAgent
  handoff_type: after_work
  transition_target: AgentTarget

# JokeCriticAgent -> user (for feedback)
- source_agent: JokeCriticAgent
  target_agent: user
  handoff_type: after_work
  transition_target: RevertToUserTarget

# User wants more jokes -> loop back to JokeHostAgent
- source_agent: user
  target_agent: JokeHostAgent
  handoff_type: condition
  condition_type: string_llm
  condition: >
    When the user requests more jokes, different jokes, a new topic,
    or wants to try a different style of humor.
  transition_target: AgentTarget

# User is satisfied -> terminate
- source_agent: user
  target_agent: terminate
  handoff_type: condition
  condition_type: string_llm
  condition: >
    When the user indicates they are satisfied, done, or thanks the agents
    without requesting more jokes.
  transition_target: TerminateTarget
