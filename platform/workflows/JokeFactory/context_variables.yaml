# JokeFactory Context Variables
# Tracks workflow state and user preferences.
# MFJ inject keys (mfj_joke_results) and the five _mfj_resume_* handshake
# fields are auto-synthesized by the runtime from workflow_graph.json.

definitions:
  joke_style:
    type: string
    description: >
      The style of jokes requested by the user (puns, dad jokes, one-liners,
      knock-knock, observational, etc.)
    source:
      type: state
      default: null

  joke_topic:
    type: string
    description: >
      The topic or theme for the jokes (technology, animals, food, work, etc.)
    source:
      type: state
      default: null

  host_complete:
    type: boolean
    description: >
      True once JokeHostAgent has gathered all preferences from the user.
      Triggers handoff to JokeDecomposerAgent.
    source:
      type: state
      default: false
      triggers:
        - type: agent_text
          agent: JokeHostAgent
          ui_hidden: true
          match:
            equals: NEXT

  jokes_presentation_count:
    type: integer
    description: Running count of joke rounds presented to the user.
    source:
      type: state
      default: 0

agents:
  JokeHostAgent:
    variables:
      - joke_style
      - joke_topic
      - host_complete

  JokeDecomposerAgent:
    variables:
      - joke_style
      - joke_topic

  ResumeRouterAgent:
    variables: []

  JokePresenterAgent:
    variables:
      - jokes_presentation_count
