# JokeFactory Structured Outputs
# Decomposer fans out 3 angles; each JokeWorker emits a JokeResult;
# Presenter collects fan-in and renders the full show.

registry:
  JokeDecomposerAgent: JokeDecomposition
  JokePresenterAgent: JokePresentation

models:
  JokeAngleSpec:
    type: model
    fields:
      name:
        type: literal
        values:
          - JokeWorker
        description: Fixed child workflow name — always "JokeWorker".
      description:
        type: str
        description: The angle label in 3-5 words (e.g. "morning coffee addiction").
      initial_message:
        type: str
        description: Full prompt for the JokeWorker writer — angle, style, and one-joke constraint.

  JokeDecomposition:
    type: model
    fields:
      agent_message:
        type: str
        description: Status message shown to the user while the 3 workers run in parallel.
      workflows:
        type: list
        items: JokeAngleSpec
        description: Exactly 3 joke angles to spawn as parallel JokeWorker chats.

  JokePresentation:
    type: model
    fields:
      agent_message:
        type: str
        description: The full formatted presentation of all 3 jokes with ratings and closing line.
      jokes_presented:
        type: int
        description: Number of jokes shown (should be 3, or fewer on partial failure).
  JokeItem:
    type: model
    fields:
      text:
        type: str
        description: The full joke text.
      style:
        type: str
        description: The requested joke style.
      topic:
        type: str
        description: The requested joke topic.

  JokeCollection:
    type: model
    fields:
      jokes:
        type: list
        items: JokeItem
        description: Ordered list of generated jokes.
      count:
        type: int
        description: Number of jokes returned.

  JokeRating:
    type: model
    fields:
      joke_index:
        type: int
        description: Index of the joke being rated.
      rating:
        type: int
        description: Rating from 1 to 5.
      emoji_rating:
        type: str
        description: Emoji representation of the rating.
      feedback:
        type: str
        description: Brief feedback comment for the joke.
