schema_version: mozaiks.events.v1
events:
  - type: domain.social.post.published
    version: 1
    producer: user_posts
    description: A user published a new post.
    payload_schema:
      type: object
      required: [post_id, author_id]
      properties:
        post_id:      { type: string }
        author_id:    { type: string }
        body_preview: { type: string }
        visibility:   { type: string }
        created_at:   { type: string }

  - type: domain.social.post.deleted
    version: 1
    producer: user_posts
    description: A post was soft-deleted.
    payload_schema:
      type: object
      required: [post_id, author_id]
      properties:
        post_id:    { type: string }
        author_id:  { type: string }
        deleted_by: { type: string }
        deleted_at: { type: string }

  - type: domain.social.post.reacted
    version: 1
    producer: user_posts
    description: A user added or removed a reaction on a post.
    payload_schema:
      type: object
      required: [post_id, post_author_id, user_id, reaction_type, action]
      properties:
        post_id:        { type: string }
        post_author_id: { type: string }
        user_id:        { type: string }
        reaction_type:  { type: string }
        action:         { type: string }
        reacted_at:     { type: string }

  - type: domain.social.post.commented
    version: 1
    producer: user_posts
    description: A user added a comment to a post.
    payload_schema:
      type: object
      required: [post_id, post_author_id, comment_id, author_id]
      properties:
        post_id:        { type: string }
        post_author_id: { type: string }
        comment_id:     { type: string }
        author_id:      { type: string }
        body_preview:   { type: string }
        created_at:     { type: string }

  - type: domain.social.post.comment_deleted
    version: 1
    producer: user_posts
    description: A comment was deleted.
    payload_schema:
      type: object
      required: [post_id, comment_id, deleted_by]
      properties:
        post_id:    { type: string }
        comment_id: { type: string }
        deleted_by: { type: string }
        deleted_at: { type: string }
