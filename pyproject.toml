[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mozaiks"
version = "1.0.0"
description = "Mozaiks AG2 Runtime — production-ready multi-tenant workflow execution backend"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "BlocUnited LLC", email = "mike@blocunited.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
keywords = ["mozaiks", "ag2", "autogen", "ai", "agents", "workflows", "multi-tenant", "runtime"]

dependencies = [
    "ag2[openai,lmm]",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "websockets>=11.0",
    "motor>=3.3.0",
    "pymongo>=4.5.0",
    "dnspython>=2.4.0",
    "python-multipart>=0.0.6",
    "pydantic>=2.5.0",
    "PyJWT[crypto]>=2.8.0",
    "jinja2",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "httpx",
    "aiohttp>=3.8.0",
]

[project.optional-dependencies]
azure = [
    "azure-identity>=1.15.0",
    "azure-keyvault-secrets>=4.7.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "watchdog",
]
tracing = [
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp>=1.27.0",
]
tree-sitter = [
    "tree-sitter>=0.20.0",
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-css",
]
e2b = [
    "e2b-code-interpreter>=0.0.10",
]

[project.scripts]
mozaiks = "mozaiksai.cli.__main__:main"

[project.urls]
Homepage = "https://github.com/BlocUnited-LLC/mozaiks"
Repository = "https://github.com/BlocUnited-LLC/mozaiks"
Documentation = "https://github.com/BlocUnited-LLC/mozaiks#readme"

[tool.ruff]
line-length = 100
target-version = "py311"

# ---------------------------------------------------------------------------
# Package mapping
# ---------------------------------------------------------------------------
# On disk the code lives under mozaiksai/.  The package-dir mapping lets
# external consumers import via the public "mozaiks" namespace:
#
#   from mozaiks.engine import run_workflow_orchestration
#   from mozaiks.contracts import DomainEvent
#
# The "mozaiksai" packages are ALSO listed so that internal imports
# (from mozaiksai.engine.…) work as-is alongside the public namespace.
# ---------------------------------------------------------------------------
[tool.setuptools.package-dir]
"mozaiks" = "mozaiksai"

[tool.setuptools]
packages = [
    # ── public API namespace (for external consumers) ──
    "mozaiks",
    "mozaiks.contracts",
    "mozaiks.ports",
    "mozaiks.engine",
    "mozaiks.engine.agents",
    "mozaiks.engine.context",
    "mozaiks.engine.events",
    "mozaiks.engine.execution",
    "mozaiks.engine.messages",
    "mozaiks.engine.observability",
    "mozaiks.engine.outputs",
    "mozaiks.engine.validation",
    "mozaiks.kernel",
    "mozaiks.kernel.events",
    "mozaiks.kernel.pack",
    "mozaiks.runtime",
    "mozaiks.runtime.artifacts",
    "mozaiks.runtime.auth",
    "mozaiks.runtime.capabilities",
    "mozaiks.runtime.data",
    "mozaiks.runtime.data.persistence",
    "mozaiks.runtime.data.themes",
    "mozaiks.runtime.extensions",
    "mozaiks.runtime.multitenant",
    "mozaiks.runtime.observability",
    "mozaiks.runtime.sessions",
    "mozaiks.runtime.tokens",
    "mozaiks.transport",
    "mozaiks.transport.middleware",
    "mozaiks.transport.routes",
    "mozaiks.transport.websocket",
    "mozaiks.platform",
    "mozaiks.cli",
    "mozaiks.cli.generators",
    # ── internal namespace (maps to same files on disk) ──
    "mozaiksai",
    "mozaiksai.contracts",
    "mozaiksai.ports",
    "mozaiksai.engine",
    "mozaiksai.engine.agents",
    "mozaiksai.engine.context",
    "mozaiksai.engine.events",
    "mozaiksai.engine.execution",
    "mozaiksai.engine.messages",
    "mozaiksai.engine.observability",
    "mozaiksai.engine.outputs",
    "mozaiksai.engine.validation",
    "mozaiksai.kernel",
    "mozaiksai.kernel.events",
    "mozaiksai.kernel.pack",
    "mozaiksai.runtime",
    "mozaiksai.runtime.artifacts",
    "mozaiksai.runtime.auth",
    "mozaiksai.runtime.capabilities",
    "mozaiksai.runtime.data",
    "mozaiksai.runtime.data.persistence",
    "mozaiksai.runtime.data.themes",
    "mozaiksai.runtime.extensions",
    "mozaiksai.runtime.multitenant",
    "mozaiksai.runtime.observability",
    "mozaiksai.runtime.sessions",
    "mozaiksai.runtime.tokens",
    "mozaiksai.transport",
    "mozaiksai.transport.middleware",
    "mozaiksai.transport.routes",
    "mozaiksai.transport.websocket",
    "mozaiksai.platform",
    "mozaiksai.cli",
    "mozaiksai.cli.generators",
    # ── support packages (repo-root modules used by mozaiksai) ──
    "logs",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
