[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mozaiks"
dynamic = ["version"]
description = "Mozaiks AG2 runtime and Studio-driven app framework"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    {name = "BlocUnited LLC", email = "info@blocunited.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
keywords = ["mozaiks", "ag2", "ai", "agents", "workflows", "multi-tenant", "runtime"]

dependencies = [
    "ag2[a2a,openai,tracing]==1.0.0b0",
    "a2a-sdk[grpc]>=1.1.0,<2",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "websockets>=11.0",
    "motor>=3.3.0",
    "pymongo>=4.5.0",
    "dnspython>=2.4.0",
    "python-multipart>=0.0.6",
    "pydantic>=2.5.0",
    "PyJWT[crypto]>=2.8.0",
    "jinja2",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "httpx",
    "aiohttp>=3.8.0",
    "python-dateutil>=2.8.0",
    "limits>=3.6.0",
    "jsonschema>=4.0.0",
]

[project.optional-dependencies]
azure = [
    "azure-identity>=1.15.0",
    "azure-keyvault-secrets>=4.7.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.14.0",
    "pytest-rerunfailures>=12.0",
    "ruff>=0.1.0",
    "watchdog",
    "types-PyYAML>=6.0",
    "mypy>=1.5.0",
]
monitoring = [
    "redis[asyncio]>=5.0.0",
    "boto3>=1.28.0",
]
tracing = [
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp>=1.27.0",
]
tree-sitter = [
    "tree-sitter>=0.20.0",
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-css",
]
e2b = [
    "e2b-code-interpreter>=0.0.10",
]

[project.scripts]
mozaiks = "mozaiks_cli.main:main"

[project.urls]
Homepage = "https://github.com/BlocUnited-LLC/mozaiks"
Repository = "https://github.com/BlocUnited-LLC/mozaiks"
Documentation = "https://github.com/BlocUnited-LLC/mozaiks#readme"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "mozaiksai.version.__version__"}

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "E501",   # line too long — handled by formatter
  "B008",   # function call in default argument — required by FastAPI Depends()
  "E402",   # module import not at top of file — intentional lazy imports
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "--cov=mozaiksai",
    "--cov-report=term-missing",
    "--cov-fail-under=30",
    "--reruns=2",
    "--reruns-delay=1",
    "--only-rerun=AssertionError",
    "--only-rerun=TimeoutError",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
# Suppress noise that comes from untyped third-party stubs and unannotated
# function bodies — these are not actionable without touching upstream libs.
disable_error_code = ["import-untyped", "annotation-unchecked"]

# High-complexity files that use AG2/pydantic dynamic patterns extensively.
# Suppressed as a baseline; re-enable per-file as typing coverage improves.

[[tool.mypy.overrides]]
module = "mozaiksai.hosts.platform"
ignore_errors = true

[[tool.mypy.overrides]]
module = "mozaiksai.hosts.studio"
ignore_errors = true

[[tool.mypy.overrides]]
