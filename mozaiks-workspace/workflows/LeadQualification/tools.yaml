tools:
  - agent: LeadQualifierAgent
    file: lead_qualification_tools.py
    function: save_qualification_result
    description: Persist the structured lead qualification result and emit a sales summary artifact.
    tool_type: Agent_Tool
    auto_tool_call: true
    ui:
      component: LeadQualificationSummary
      mode: artifact
      workflow_primitive: document_preview
      realization: generated_component

lifecycle_tools:
  - trigger: on_start
    agent: null
    file: ../_shared/platform/build_lifecycle.py
    function: emit_build_started
    description: Notify platform build tracking when the workflow starts.
    tool_type: Agent_Tool
  - trigger: on_complete
    agent: null
    file: ../_shared/platform/build_lifecycle.py
    function: emit_build_completed
    description: Notify platform build tracking when the workflow completes.
    tool_type: Agent_Tool
  - trigger: on_fail
    agent: null
    file: ../_shared/platform/build_lifecycle.py
    function: emit_build_failed
    description: Notify platform build tracking when the workflow fails.
    tool_type: Agent_Tool
