# Default values for the Mozaiks Helm chart.
# Override these in a values override file (e.g. values-prod.yaml) or via --set.

# ──────────────────────────────────────────────────────────────────────────────
# Image
# ──────────────────────────────────────────────────────────────────────────────
image:
  repository: ghcr.io/blocunited-llc/mozaiks
  tag: "latest"
  pullPolicy: IfNotPresent

imagePullSecrets: []

# ──────────────────────────────────────────────────────────────────────────────
# Runtime config
# ──────────────────────────────────────────────────────────────────────────────
replicaCount: 2

host:
  # Options: studio | platform | runtime
  # studio   — Studio management host (default, includes platform + admin UI)
  # platform — Platform host only (no Studio UI)
  # runtime  — Bare runtime (no HTTP API, headless workflow execution)
  name: studio

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

# ──────────────────────────────────────────────────────────────────────────────
# Ingress
# ──────────────────────────────────────────────────────────────────────────────
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: mozaiks.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: mozaiks-tls
  #    hosts:
  #      - mozaiks.example.com

# ──────────────────────────────────────────────────────────────────────────────
# Resources
# ──────────────────────────────────────────────────────────────────────────────
resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "2Gi"

# ──────────────────────────────────────────────────────────────────────────────
# Autoscaling (HPA)
# ──────────────────────────────────────────────────────────────────────────────
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# ──────────────────────────────────────────────────────────────────────────────
# Pod disruption budget
# ──────────────────────────────────────────────────────────────────────────────
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# ──────────────────────────────────────────────────────────────────────────────
# Health probes
# ──────────────────────────────────────────────────────────────────────────────
# Paths match the routes registered in mozaiksai/hosts/runtime.py:
#   GET /api/health/live       (liveness)
#   GET /api/health/readiness  (readiness, alias: /api/health/ready)
livenessProbe:
  httpGet:
    path: /api/health/live
    port: http
  initialDelaySeconds: 20
  periodSeconds: 15
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /api/health/readiness
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  failureThreshold: 3

# ──────────────────────────────────────────────────────────────────────────────
# Environment — non-secret values
# ──────────────────────────────────────────────────────────────────────────────
env:
  LOG_LEVEL: "INFO"
  LOGS_AS_JSON: "true"
  MOZAIKS_MAX_PARALLEL_WORKFLOWS: "10"
  EVENT_BUS_BACKEND: "redis"
  WORKFLOW_QUEUE_BACKEND: "mongo"
  ARTIFACT_STORE_BACKEND: "local"
  REDIS_CACHE_ENABLED: "true"
  PROMETHEUS_METRICS_ENABLED: "true"
  LLM_FALLBACK_ENABLED: "true"

# ──────────────────────────────────────────────────────────────────────────────
# Secret references — values are loaded from Kubernetes Secrets, not stored here
# ──────────────────────────────────────────────────────────────────────────────
# Set secretName to a pre-existing Kubernetes Secret holding these keys.
# Create the secret before deploying:
#   kubectl create secret generic mozaiks-secrets \
#     --from-literal=OPENAI_API_KEY=sk-... \
#     --from-literal=MONGO_URI=mongodb+srv://... \
#     --from-literal=JWT_SECRET_KEY=... \
#     --from-literal=INTERNAL_API_KEY=...
secretRef:
  name: mozaiks-secrets
  keys:
    - OPENAI_API_KEY
    - MONGO_URI
    - JWT_SECRET_KEY
    - INTERNAL_API_KEY
    - REDIS_URL
    - KEYCLOAK_URL
    - KEYCLOAK_REALM
    - KEYCLOAK_CLIENT_ID

# ──────────────────────────────────────────────────────────────────────────────
# Persistent storage for generated artifacts (local store backend)
# ──────────────────────────────────────────────────────────────────────────────
persistence:
  enabled: false
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 10Gi
  mountPath: /app/generated

# ──────────────────────────────────────────────────────────────────────────────
# Service account
# ──────────────────────────────────────────────────────────────────────────────
serviceAccount:
  create: true
  annotations: {}
  name: ""

# ──────────────────────────────────────────────────────────────────────────────
# Pod-level settings
# ──────────────────────────────────────────────────────────────────────────────
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8000"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false  # app writes logs/artifacts
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - mozaiks
          topologyKey: kubernetes.io/hostname
