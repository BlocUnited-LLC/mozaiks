schema: mozaiks.module.v1
module_id: greetings
display_name: Greetings
description: A simple greeting module generated by the community greetings pack.

actions:
  - id: say_hello
    handler_method: say_hello
    permissions: [greetings.read]
    description: Return a greeting message for the current user.

  - id: list_greetings
    handler_method: list_greetings
    permissions: [greetings.read]
    description: Return the list of available greeting styles.
